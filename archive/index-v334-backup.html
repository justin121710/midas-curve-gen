// 位移複製 = 內容與型別原封不動,只換 id / 名字,再加一段平移 / 旋轉 / 鏡射
/* ---- 一組所參照的上游組(含自己)----
   連接族的內容是由來源組算出來的,所以「複製一個垂落組」只複製它自己時,
   複本仍然掛在原來那條線上 —— 看起來就像「跟著原組走,改自己的數值也沒用」。
   要真的獨立,必須連同上游一起複製,再把複本的參照改指到複本。                */
function depChain(g, groups){
  const list = groups || state.groups;
  const byId = new Map(list.map(x => [x.id, x]));
  const seen = new Set(), stack = [g && g.id];
  while (stack.length){
    const id = stack.pop();
    if (!id || seen.has(id) || !byId.has(id)) continue;
    seen.add(id);
    depIds(byId.get(id)).forEach(v => stack.push(v));
  }
  return list.filter(x => seen.has(x.id));
}
const hasUpstream = g => depChain(g).length > 1;

// mkName(原名) → 複本的名字。deep = true 時連上游一起複製並改指參照。
const dupGroup = (g, mkName, xfDelta, deep, quiet, afterG) =>
  dupGroups([g], mkName, xfDelta, deep, quiet, afterG);
// 一次複製好幾個群組:被選到的群組之間互相的參照也會改指到複本(整套一起搬)
function dupGroups(seeds, mkName, xfDelta, deep, quiet, afterG){
  const nameOf = typeof mkName === "function" ? mkName : (() => mkName);
  const want = new Set();
  seeds.forEach(g => (deep ? depChain(g) : [g]).forEach(o => want.add(o.id)));
  const src = state.groups.filter(x => want.has(x.id));
  if (!src.length) return null;
  const g = seeds[0];
  const map = new Map();
  const copies = src.map(o => {
    const c = clone(o);
    c.id = newId(); c.name = nameOf(o.name);
    map.set(o.id, c.id);
    return c;
  });
  // 參照改指到一起複製出來的那一份;沒被複製到的(deep = false)維持指向原組
  copies.forEach(c => (DEPS[c.type] || []).forEach(k => {
    if (c[k] && map.has(c[k])) c[k] = map.get(c[k]);
  }));
  if (xfDelta) copies.forEach(c => {
    const xf = { ...XF_DEF(), ...(c.xf || {}) };
    // 疊在原本的變換之上(原組本來就偏過的話,複本要再偏一次而不是取代)
    xf.dx = (num(xf.dx) || 0) + (num(xfDelta.dx) || 0);
    xf.dy = (num(xf.dy) || 0) + (num(xfDelta.dy) || 0);
    xf.dz = (num(xf.dz) || 0) + (num(xfDelta.dz) || 0);
    if (Math.abs(num(xfDelta.rot) || 0) > 1e-12){
      xf.rot = (num(xf.rot) || 0) + (num(xfDelta.rot) || 0);
      xf.axis = xfDelta.axis || "Z";
      // 沿線陣列要繞「基準點」轉,不是繞群組自己的中心
      if (xfDelta.pivot){ xf.cmode = "custom";
        xf.cx = xfDelta.pivot.x; xf.cy = xfDelta.pivot.y; xf.cz = xfDelta.pivot.z; }
    }
    if (xfDelta.mir){ xf.mir = xfDelta.mir; xf.mirAt = num(xfDelta.mirAt) || 0; }  // 鏡射是設定,不疊加
    c.xf = xf;
  });
  // 一般插在原群組後面;連續複製多份時由呼叫端指定插入點,順序才不會反過來
  const anchor = afterG && state.groups.includes(afterG) ? afterG : g;
  state.groups.splice(state.groups.indexOf(anchor) + 1, 0, ...copies);
  const main = map.get(g.id);
  SEL = main; SELSET = new Set(copies.map(c => c.id));
  if (!quiet) recompute(true);              // 一次做很多份時交給呼叫端最後統一重算
  return copies.find(c => c.id === main);
}

/* ---- 沿線陣列 ----
   把一個群組(可連同上游)沿另一條線複製 N 份。位置三種給法:
     node    路徑上每個節點放一份(可每 n 個)
     count   沿弧長等分 N 份(含頭尾)
     spacing 每隔固定距離一份
   每一站同時給切線方位角,「跟著線轉向」時繞基準點轉 —— 第一份維持原朝向。      */
function pathStations(nodes, mode, opt){
  const N = nodes.length;
  if (N < 2) return [];
  const cum = [0];
  for (let i = 1; i < N; i++) cum.push(cum[i-1] + dist3(nodes[i-1], nodes[i]));
  const L = cum[N-1];
  if (!(L > 1e-9)) return [];
  const azAt = i => {                        // 用相鄰兩點決定切線方位角
    const a = nodes[Math.max(0, i-1)], b = nodes[Math.min(N-1, i+1)];
    return azOf(b.x - a.x, b.y - a.y);
  };
  const at = t => {
    const q = clamp(t, 0, L);
    let i = 1; while (i < N-1 && cum[i] < q) i++;
    const d = cum[i] - cum[i-1], u = d > 1e-12 ? (q - cum[i-1])/d : 0;
    const a = nodes[i-1], b = nodes[i];
    return { x:a.x + (b.x-a.x)*u, y:a.y + (b.y-a.y)*u, z:a.z + (b.z-a.z)*u,
             az:azOf(b.x-a.x, b.y-a.y) };
  };
  const CAP = 200;
  if (mode === "node"){
    const ev = Math.max(1, Math.round(num(opt.every)) || 1);
    const out = [];
    for (let i = 0; i < N && out.length < CAP; i += ev)
      out.push({ x:nodes[i].x, y:nodes[i].y, z:nodes[i].z, az:azAt(i) });
    return out;
  }
  if (mode === "spacing"){
    const d = Math.abs(num(opt.spacing)) || 0;
    if (!(d > 1e-9)) return [];
    const out = [];
    for (let t = 0; t <= L + 1e-9 && out.length < CAP; t += d) out.push(at(t));
    return out;
  }
  const n = clamp(Math.round(num(opt.count)) || 2, 1, CAP);
  if (n === 1) return [at(0)];
  const out = [];
  for (let i = 0; i < n; i++) out.push(at(L*i/(n-1)));
  return out;
}

    const pn = pr ? chainOf(pr) : null;
    if (!pn || pn.length < 2){ alert("這條線的節點不夠(至少要兩個)。"); return; }
    const mode = m.querySelector("#ar-mode").value;
    const stations = pathStations(pn, mode,
      { every:gv("ar-every"), count:gv("ar-count"), spacing:gv("ar-sp") });
    if (!stations.length){ alert("算不出任何放置位置,請檢查份數或間距。"); return; }
    const src = MODEL.byId.get(g.id);
    const own = src ? src.nodes.filter(n => n.gid === g.id) : [];

      return;
    }
    close();
    snapshot("array:" + Date.now());
    const az0 = stations[0].az;
    let anchor = g;
    stations.forEach((st, i) => {
      // 方位角自 +Y 順時針,xf 的 rot 是逆時針 —— 所以要取負號
      const dA = ((st.az - az0 + 540) % 360) - 180;
      anchor = dupGroup(g, n => `${n} 陣列${i+1}`,
        { dx:st.x - B.x, dy:st.y - B.y, dz:st.z - B.z,
          rot:turn ? -dA : 0, axis:"Z", pivot:turn ? B : null }, deep, true, anchor) || anchor;
    });
    recompute(true);
  };
}

        F("起始群組:起算節點", "lf-af", st0.aFrom, 1) + F("起始群組:每次前進", "lf-ae", st0.aEvery, 1) +
        F("目標群組:起算節點", "lf-bf", st0.bFrom, 1) + F("目標群組:每次前進", "lf-be", st0.bEvery, 1)}</div>
      <div class="fields g4" style="margin-top:8px">${F("重複幾次(0 = 到節點用完)", "lf-n", st0.count, 0)}</div>
      <div class="note" id="lf-sum"></div>
      <div class="btns">
        <button class="btn" id="lf-cancel">取消</button>
        <button class="btn p" id="lf-ok">套用</button></div>
    </div>`;
  document.body.appendChild(m);

  const q = id => m.querySelector("#" + id);
  const gv = (id, d) => { const n = Math.round(num(q(id).value)); return Number.isFinite(n) ? n : d; };
  const colX = i => 62 + i*96;
  const YA = 56, YB = 122;
  const has = (a, b) => pat.findIndex(p => p[0] === a && p[1] === b);

  function paint(){
    const af = Math.max(1, gv("lf-af", 1)), bf = Math.max(1, gv("lf-bf", 1));
    const lines = pat.map(([a,b]) =>
      `<line x1="${colX(a)}" y1="${YA}" x2="${colX(b)}" y2="${YB}"
         stroke="${colorOfGroup(g)}" stroke-width="2.2" stroke-linecap="round"/>`).join("");
    const dots = (row, y, base) => Array.from({ length:COLS }, (_, i) => {
      const on = sel && sel.row === row && sel.i === i;
      const used = pat.some(p => p[row === "a" ? 0 : 1] === i);
      return `<g class="lfdot" data-row="${row}" data-i="${i}" style="cursor:pointer">
        <circle cx="${colX(i)}" cy="${y}" r="16" fill="transparent"/>
        <circle cx="${colX(i)}" cy="${y}" r="${on ? 7.5 : 5.5}"
          fill="${on ? "var(--accent)" : (used ? "#fff" : "var(--line)")}"
          stroke="${on ? "var(--accent)" : (used ? colorOfGroup(g) : "var(--line)")}" stroke-width="2"/>
        <text x="${colX(i)}" y="${row === "a" ? y - 15 : y + 24}" text-anchor="middle"
          font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${base + i}</text></g>`;
    }).join("");
    q("lf-grid").innerHTML =
      `<svg viewBox="0 0 560 172" width="100%" style="display:block; user-select:none">
        <text x="8" y="26" font-size="11" fill="var(--ink-3)">起始群組 · ${esc(nameOf(g.a))}</text>
        <text x="8" y="164" font-size="11" fill="var(--ink-3)">目標群組 · ${esc(nameOf(g.b))}</text>
        <line x1="46" y1="${YA}" x2="${colX(COLS-1)+16}" y2="${YA}" stroke="var(--line)" stroke-width="1"/>
        <line x1="46" y1="${YB}" x2="${colX(COLS-1)+16}" y2="${YB}" stroke="var(--line)" stroke-width="1"/>
        ${lines}${dots("a", YA, af)}${dots("b", YB, bf)}
      </svg>`;
    const tmp = { aFrom:gv("lf-af",1), aEvery:gv("lf-ae",1), bFrom:gv("lf-bf",1),
                  bEvery:gv("lf-be",1), count:gv("lf-n",0), pattern:pat };
    q("lf-sum").textContent = patSummary(tmp);
  }
  paint();

  q("lf-grid").addEventListener("click", e => {
    const d = e.target.closest(".lfdot"); if (!d) return;
    const row = d.dataset.row, i = +d.dataset.i;
    if (!sel || sel.row === row){ sel = { row, i }; paint(); return; }
    const a = row === "a" ? i : sel.i, b = row === "a" ? sel.i : i;
    const k = has(a, b);
    if (k >= 0) pat.splice(k, 1); else pat.push([a, b]);
    sel = null; paint();
  });
  m.querySelectorAll("[data-pre]").forEach(btn => btn.onclick = () => {
    pat = PAT_PRESETS[+btn.dataset.pre][1].map(p => p.slice()); sel = null; paint();
  });
  q("lf-clr").onclick = () => { pat = []; sel = null; paint(); };
  ["lf-af","lf-ae","lf-bf","lf-be","lf-n"].forEach(id => q(id).addEventListener("input", paint));

  const close = () => { m.remove(); window.removeEventListener("keydown", esckey); };
  const esckey = e => { if (e.key === "Escape") close(); };
  window.addEventListener("keydown", esckey);
  m.addEventListener("click", e => { if (e.target === m) close(); });
  q("lf-cancel").onclick = close;
  q("lf-pick").onclick = () => {
    close();
    PICK = { gid:g.id, i:0, mode:"link2" }; SELNODE = null; SELELEM = null;
    recompute(true);
  };
  q("lf-ok").onclick = () => {
    if (!pat.length){ alert("樣式單元裡一條連線都沒有,請先點兩顆節點連起來。"); return; }
    snapshot("lkfree:" + Date.now());
    g.pair = "free";
    g.pattern = pat.map(p => p.slice());
    g.aFrom = Math.max(1, gv("lf-af", 1)); g.aEvery = Math.max(1, gv("lf-ae", 1));
    g.bFrom = Math.max(1, gv("lf-bf", 1)); g.bEvery = Math.max(1, gv("lf-be", 1));
    g.count = Math.max(0, gv("lf-n", 0));
    close();
    recompute(true);
  };
}

/* ==========================================================================
   8b. UI — 屬性面板
   ========================================================================== */
function fld(label, key, val, opt){
  opt = opt || {};
  const id = "f_" + key.replace(/\W/g, "_");
  let inner;
  if (opt.select){
    // 項目可以是 [值,文字],也可以是 { group:"分類標題", items:[[值,文字],…] }(渲染成 optgroup)
    const opts = arr => arr.map(([v,t]) =>
      `<option value="${esc(v)}"${String(v) === String(val) ? " selected" : ""}>${esc(t)}</option>`).join("");
    inner = `<select data-k="${key}"${opt.disabled ? " disabled" : ""}>` +
      opt.select.map(o => Array.isArray(o) ? opts([o])
        : `<optgroup label="${esc(o.group)}">${opts(o.items)}</optgroup>`).join("") + `</select>`;
  } else if (opt.text){
    inner = `<input type="text" data-k="${key}" value="${esc(val == null ? "" : val)}"${opt.ph ? ` placeholder="${esc(opt.ph)}"` : ""}${opt.disabled ? " disabled" : ""}>`;
  } else if (opt.area){
    inner = `<textarea data-k="${key}" rows="${opt.rows || 2}"${opt.ph ? ` placeholder="${esc(opt.ph)}"` : ""}>${esc(val == null ? "" : val)}</textarea>`;
  } else if (opt.colorPick){
    inner = `<span class="cpick"><input type="color" data-k="${key}" value="${esc(val)}">` +
      `<button class="btn${opt.auto ? " on" : ""}" data-op="colauto" title="改回依清單順序自動配色">自動</button></span>`;
  } else if (opt.check){
    return `<label class="chk" style="margin-top:14px"><input type="checkbox" data-k="${key}"${val ? " checked" : ""}> ${esc(label)}</label>`;
  } else {
    // opt.idxMax:序號欄位(第幾個節點),離開欄位時自動收斂到 1..max。
    // opt.stepMax:步進欄位,同樣收在 1..max,但 0 / 負值一律當 1(每個節點都連)。
    const rg = opt.idxMax !== undefined ? ` data-idx="${Math.max(0, Math.round(opt.idxMax) || 0)}"`
             : opt.stepMax !== undefined ? ` data-step="${Math.max(0, Math.round(opt.stepMax) || 0)}"` : "";
    inner = `<input type="number" step="any"${opt.min !== undefined ? ` min="${opt.min}"` : ""}${rg} data-k="${key}" value="${Number.isFinite(+val) ? val : ""}"${opt.disabled ? " disabled" : ""}>`;
  }
  return `<label class="f"${opt.span ? ` style="grid-column:span ${opt.span}"` : ""}>` +
    `<span>${esc(label)}</span>${inner}</label>`;
}
/* ---- 座標一律排成 X / Y / Z 三欄 ----
   舊版把「起點 X/Y/Z」「終點 X/Y/Z」直接丟進四欄網格,前面還有下拉佔格子,
   結果終點 Z 常被擠到下一行、而且跟起點的 X / Y / Z 對不齊。這個小表就是為了修這件事:
   欄位固定是 X、Y、Z,列是起點 / 終點 / 圓心,上下一定對齊。缺某一軸就留一格「—」。 */
function xyzTable(rows, style){
  const cell = (k, v) => k
    ? `<input type="number" step="any" data-k="${k}" value="${Number.isFinite(+v) ? v : ""}">`
    : `<span class="na">—</span>`;
  const t5 = rows.some(r => r.tail);                 // 需要一個尾欄(例如刪除鈕)
  return `<div class="xyz${t5 ? " t5" : ""}" style="${style || "margin-top:8px"}"><span></span>` +
    `<span class="h">X</span><span class="h">Y</span><span class="h">Z</span>${t5 ? "<span></span>" : ""}` +
    rows.map(r => `<span class="rl">${esc(r.label)}</span>` +
      cell(r.kx, r.vx) + cell(r.ky, r.vy) + cell(r.kz, r.vz) +
      (t5 ? (r.tail || "<span></span>") : "")).join("") + `</div>`;
}
const SEC = (h, tail, body, cls) => `<div class="sec${cls ? " " + cls : ""}"><div class="h">${esc(h)}<span class="tail" data-ro>${tail || ""}</span></div><div class="b">${body}</div></div>`;
const OUT = rows => `<div class="out" data-ro>${rows.map(([k,v]) => `<div><span class="k">${esc(k)}</span> <b>${v}</b></div>`).join("")}</div>`;
const P3 = (px, py, pz, lx, ly, lz) => fld(lx, px, undefined) ; // placeholder(未使用)

/* ---- 連接族欄位的共用小工具 ---- */
// 某個群組在指定側取得到的節點數 —— 序號欄位的上限就是這個
const chainCount = (id, side) => {
  const r = id && MODEL.byId ? MODEL.byId.get(id) : null;
  return r ? nodeSetOf(r, side).length : 0;
};
// 「取哪些節點」的下拉:只有自有節點與元素端點不一致的群組才需要問
const sideField = (gid, key, val) => {
  const r = gid && MODEL.byId ? MODEL.byId.get(gid) : null;
  return sideful(r) ? fld("取哪些節點", key, sideOf(val), { select:SIDE_OPTS }) : "";
};
/* 序號欄位顯示的值:一律是「實際生效」的那個數字。
   舊檔案裡的 0(意思是「到底」)與超出範圍的殘值都在這裡換算成看得懂的序號,
   state 本身不動 —— 使用者沒去改它,節點數變了它還是會自己跟著跑。 */
const idxShow = (v, max, whenZero) => {
  const n = Math.round(num(v)) || 0;
  if (!max) return n || "";
  return n ? wrapIndex(n, max) : whenZero;
};
// 群組下拉最上面固定放一個「在畫布上點選」—— 選了它就進入點選模式,不會真的存進 state
const PICK_OPT = ["@pick", "▸ 在畫布上點選…"];
const pickingKey = (g, key) => PICK && PICK.mode === "group" && PICK.gid === g.id && PICK.key === key;
const pickNote = (g, key, label) => pickingKey(g, key)
  ? `<div class="hint keep" style="margin-top:7px; color:var(--accent)">
       請在 3D 視圖上<b>點一根元素</b>,<b>${esc(label)}</b>就會設成畫出它的那個群組
       —— 點元素比點節點準,重合節點也不會選錯。按 <b>Esc</b> 或下面的取消鈕結束。</div>`
  : "";

/* ---- 自訂連接方式(對接的 free 模式)----
   pattern = [[起始群組偏移, 目標群組偏移], …],0 起算,描述「一個樣式單元」怎麼連;
   單元沿兩排節點各自以 aEvery / bEvery 的步進重複下去。
   舊檔案沒有 pattern 就當成 [[0,0]],和以前的「一根對一根」完全相同。 */
const patOf = g => {
  const p = (g && Array.isArray(g.pattern) ? g.pattern : [])
    .map(q => Array.isArray(q) ? [Math.max(0, Math.round(num(q[0])) || 0), Math.max(0, Math.round(num(q[1])) || 0)] : null)
    .filter(Boolean);
  return p.length ? p : [[0, 0]];
};
const patSummary = g => {
  const p = patOf(g), ae = Math.max(1, Math.round(num(g.aEvery)) || 1), be = Math.max(1, Math.round(num(g.bEvery)) || 1);
  const cnt = Math.max(0, Math.round(num(g.count)) || 0);
  return `樣式 ${p.length} 條連線 · 起始群組第 ${Math.max(1, Math.round(num(g.aFrom)) || 1)} 個節點起、` +
    `每次前進 ${ae} 個 · 目標群組第 ${Math.max(1, Math.round(num(g.bFrom)) || 1)} 個節點起、每次前進 ${be} 個 · ` +
    (cnt ? `重複 ${cnt} 次` : "重複到節點用完");
};

// 可以被引用的組。連接族(垂落、扇出)自己也會產生節點,常常正是想再連接的對象,
// 所以預設「全部組都列出來」;要限制族別才傳 famFilter。分族用 optgroup,組多時才找得到。
const refOptions = (self, famFilter) => {
  const pool = state.groups.filter(g =>
    g.id !== self && (!famFilter || TYPES[g.type].fam === famFilter));
  return [["geo","幾何族(產生節點)"], ["con","連接族(連接既有群組)"]].map(([fam, lab]) => ({
    group: lab,
    items: pool.filter(g => TYPES[g.type].fam === fam).map(g => {
      return [g.id, g.name];        // 只寫名字:型別看圖示、節點數在自己的面板裡
    })
  })).filter(o => o.items.length);
};

/* ---- 平移與旋轉的共用欄位 ---- */
const XF_SCOPE_AUTO = { group:"自動(範圍中心)", piece:"自動(本段起點)",
                        node:"自動(節點自身)", elem:"自動(元素中點)" };
function xfFields(k, xf, scope){
  xf = { ...XF_DEF(), ...(xf || {}) };
  const cm = xf.cmode || "auto";
  return `<div class="fields g4">${
      fld(`平移 dX (${UL()})`, k + "dx", xf.dx) +
      fld(`平移 dY (${UL()})`, k + "dy", xf.dy) +
      fld(`平移 dZ (${UL()})`, k + "dz", xf.dz) +
      fld("旋轉角 (°)", k + "rot", xf.rot)}</div>
    <div class="fields g4" style="margin-top:8px">${
      fld("旋轉軸", k + "axis", xf.axis, { select:[["Z","Z(俯視轉)"],["X","X"],["Y","Y"]] }) +
      fld("旋轉中心", k + "cmode", cm, { select:[["auto", XF_SCOPE_AUTO[scope] || "自動"],
        ["start","起點"],["center","範圍中心"],["custom","自訂座標"]] }) +
      (cm === "custom"
        ? fld("中心 X", k + "cx", xf.cx) + fld("中心 Y", k + "cy", xf.cy) + fld("中心 Z", k + "cz", xf.cz)
        : "")}</div>
    <div class="fields g4" style="margin-top:8px">${
      fld("鏡射", k + "mir", mirOf(xf), { select:[["","不鏡射"],
        ["X","對 X = 某值 的平面(左右翻)"],["Y","對 Y = 某值 的平面(前後翻)"],
        ["Z","對 Z = 某值 的平面(上下翻)"]], span:2 }) +
      (mirOf(xf) ? fld(`平面位置 ${mirOf(xf)} = (${UL()})`, k + "mirAt", xf.mirAt) : "")}</div>
    ${mirOf(xf) ? `<div class="hint">鏡射<b>先做</b>,再旋轉、平移;鏡射平面用<b>絕對座標</b>。
      節點順序不變,元素的 i–j 方向會跟著翻面。</div>` : ""}`;
}
// 整個群組平移旋轉:改成小視窗(和偏置複製一致),不再佔屬性面板的版面。
// 視窗裡直接改 g.xf 以保留即時預覽;「取消」把開啟前的值放回去。
function openXfDlg(g){
  const before = clone({ ...XF_DEF(), ...(g.xf || {}) });
  const m = document.createElement("div");
  m.className = "mask";
  m.innerHTML = `<div class="dlg" style="width:min(560px, calc(100vw - 32px))">
      <h3>平移與旋轉「${esc(g.name)}」(整個群組)</h3>
      <div class="sub">只動<b>這個群組自己的節點</b>(含手動新增的),做<b>剛體變換</b>,編號不受影響。
        旋轉角<b>逆時針為正</b>(俯視)。依附這個群組的連接群組會<b>跟著移動</b>。
        ${TYPES[g.type].fam === "con"
          ? "這是連接族,元素另一端在別的群組不會跟著動,所以<b>元素長度會改變</b>。"
          : "節點全是自己的,元素長度與弦線偏差都不變。"}</div>
      <div id="xfd-body"></div>
      <div class="hint" style="margin-top:9px">邊改邊看 —— 畫面會即時更新。</div>
      <div class="btns">
        <button class="btn d" id="xfd-rst">歸零</button>
        <span style="flex:1"></span>
        <button class="btn" id="xfd-cancel">取消</button>
        <button class="btn p" id="xfd-ok">完成</button></div>
    </div>`;
  document.body.appendChild(m);
  const paint = () => { m.querySelector("#xfd-body").innerHTML =
    xfFields("xf.", { ...XF_DEF(), ...(g.xf || {}) }, "group"); };
  paint();
  const live = () => { recompute(true); paint(); };
  // 視窗內的欄位走和屬性面板同一套 data-k 寫入(root = 這一組)
  m.addEventListener("input", e => {
    const el = e.target, k = el.dataset.k; if (!k) return;
    if (el.tagName === "SELECT") return;
    snapshot("xfdlg:" + g.id + ":" + k);
    applyField(g, k, el);
    recompute(true);                                   // 不重畫視窗,免得游標被丟掉
  });
  m.addEventListener("change", e => {
    const el = e.target, k = el.dataset.k; if (!k) return;
    snapshot("xfdlgc:" + g.id + ":" + k + ":" + Date.now());
    applyField(g, k, el);
    live();
  });
  const close = () => { m.remove(); window.removeEventListener("keydown", esckey); };
  const esckey = e => { if (e.key === "Escape") close(); };
  window.addEventListener("keydown", esckey);
  m.addEventListener("click", e => { if (e.target === m) close(); });
  m.querySelector("#xfd-rst").onclick = () => { snapshot("xfrst:" + Date.now()); g.xf = XF_DEF(); live(); };
  m.querySelector("#xfd-cancel").onclick = () => { g.xf = clone(before); recompute(true); close(); };
  m.querySelector("#xfd-ok").onclick = close;
}

/* 「這個模式量的到底是什麼」—— 弧長 / 弦線 / 座標差,依段型別給一句話,不要讓使用者用猜的 */
function splitMeasure(type, mode){
  if (type === "POINT") return "節點段只有一個節點,不做分割。";
  if (mode === "count"){
    const per = {
      LINE: "沿直線<b>等長</b>切,每根元素長度相同(弧長 = 弦長)。",
      ARC:  "<b>等圓心角</b>切;圓弧上弧長與弦長都會相等。",
      SAG:  "等分的是<b>弦線的水平投影</b>(x、y 隨參數線性變化),<b>不是等弧長</b> —— 靠近支承、坡度大的地方弧長較長。",
      HELIX:"<b>等圓心角</b>切;等半徑時同時等弧長,起訖半徑不同時弧長不相等。",
      CHAIN:"<b>每一個子段各自</b>切成 N 根(不是整條線切成 N 根),子段內沿弧長等分。"
    };
    return "元素數:" + (per[type] || "等分曲線參數。");
  }
  if (mode === "spacing")
    return "間距量的是<b>沿曲線的 3D 弧長</b>(以 400 段折線累積)。節點之間的元素是<b>弦線</b>,所以" +
      (type === "LINE" ? "直線段兩者相同,元素長度就等於間距。"
                       : "每根元素的<b>直線長度會略短於</b>設定的間距,曲率越大差越多。") +
      (type === "CHAIN" ? "線形鏈是<b>逐子段</b>各自從子段起點起算。" : "");
  if (mode === "list")
    return "間距表用 midas 的寫法:<b>n@d</b> = 「n 段、每段 d」,單獨的數字就是一段。" +
      "例如 <code>3 36@4 3</code> = 3 + 36×4 + 3 = <b>150</b>,切成 38 根元素。" +
      "「量測方向」決定表裡每一個數字量的是<b>沿弧長</b>還是<b>某一軸的座標增量</b>" +
      "(選軸時斜的段元素長度 = d ÷ 方向餘弦 > d)。" +
      (type === "CHAIN" ? "線形鏈是<b>每個子段各自</b>套用整張表。" : "");
  if (mode === "axis")
    return "軸向間距量的是<b>該軸的座標差</b>,既不是弧長也不是弦長 —— 用一組垂直於該軸、間隔 d 的" +
      "平面去截曲線,交點放節點。因此斜的段元素長度 = <b>d ÷ 方向餘弦 &gt; d</b>;" +
      "與該軸<b>垂直</b>的段(座標不變)切不出節點。曲線在該軸上來回時,<b>每一次穿越都會放一個節點</b>。" +
      (type === "CHAIN" ? "線形鏈是<b>逐子段</b>各自截切。" : "");
  return "容差量的是<b>曲線離弦線的最大垂距</b>(3D 垂距),在容差內把每一步放到最長;" +
    "步長本身量的仍是<b>弧長</b>,曲率大的地方元素短。";
}

function splitSec(pc, k, extraNote){
  const sp = pc.split || SPLIT_DEF;
  const modes = [["count","指定元素數"],["spacing","指定間距(沿弧長)"],
                 ["axis","軸向間距(X / Y / Z)"],["list","間距表(3 36@4 3)"],
                 ["tol","弦線偏差容差"]];
  let f = fld("分割方式", k + "split.mode", sp.mode, { select:modes });
  if (sp.mode === "count")   f += fld("元素數 N", k + "split.count", sp.count);
  if (sp.mode === "spacing") f += fld(`間距 d (${UL()},沿弧長)`, k + "split.spacing", sp.spacing);
  if (sp.mode === "axis")
    f += fld("軸", k + "split.axis", axisOf(sp), { select:AXIS_KEYS }) +
      fld(`間距 d (${UL()},沿 ${axisOf(sp).toUpperCase()} 軸)`, k + "split.axisSpacing", sp.axisSpacing) +
      fld("格線基準", k + "split.axisBase", sp.axisBase === "value" ? "value" : "start",
        { select:[["start","本段起點"],["value","指定座標"]] }) +
      (sp.axisBase === "value"
        ? fld(`基準座標 ${axisOf(sp).toUpperCase()} (${UL()})`, k + "split.axisAt", sp.axisAt) : "");
  if (sp.mode === "list")
    f += fld(`間距表 (${UL()})`, k + "split.list", sp.list, { text:true, span:2, ph:"3 36@4 3" }) +
      fld("量測方向", k + "split.listAlong", listAlongOf(sp), { select:LIST_ALONG });
  if (sp.mode === "tol") f += fld(`容差 (${UL()})`, k + "split.tol", sp.tol) +
    fld(`最大間距 (${UL()})`, k + "split.maxSpacing", sp.maxSpacing);
  if (sp.mode === "list")
    // 表長與段長不會剛好一樣,這裡決定差額怎麼吸收
    f += fld("表長與段長不符時", k + "split.rem",
      (sp.rem === "merge" || sp.rem === "even") ? sp.rem : "keep",
      { select:[["keep","尾端獨立留一段"],["merge","併入最後一根"],["even","整表按比例縮放到剛好"]] });
  else if (sp.mode === "axis")
    // 均分 / 頭尾各半會把整組格線挪開,軸向間距就失去「對齊平面」的意義,所以只給這兩種
    f += fld("餘數處理", k + "split.rem", sp.rem === "merge" ? "merge" : "keep",
      { select:[["keep","獨立留一段"],["merge","併入相鄰元素"]] });
  else if (sp.mode !== "count")
    f += fld("餘數處理", k + "split.rem", sp.rem,
      { select:[["even","均分吸收"],["half","頭尾各分一半"],["keep","獨立留一段"],
                ["merge","併入前一元素"],["trim","截短"]] });
  // 打字時就要看得到表算出來多長 —— data-ro 會被 syncRO() 逐鍵更新,不會重建輸入框
  let listRO = "";
  if (sp.mode === "list"){
    const p = parseSpacingList(sp.list);
    listRO = p.ok
      ? `<div class="hint" data-ro>解析:${esc(listExpr(p))} = <b>${rnd3(p.total)} ${UL()}</b> · 切成 <b>${p.count}</b> 根元素</div>`
      : `<div class="hint" data-ro><b style="color:var(--warn)">間距表${esc(p.err)}</b></div>`;
  }
  const note = splitMeasure(pc.type, sp.mode) +
    (sp.mode === "axis" && sp.axisBase !== "value"
      ? "<br>格線基準<b>本段起點</b>:第一個節點一定在起點上;想讓不同段的節點<b>對齊同一組平面</b>,請改成「指定座標」。"
      : "") +
    (sp.mode === "axis" && sp.axisBase === "value"
      ? `<br>格線通過 ${axisOf(sp).toUpperCase()} = 基準座標,並以 d 為間隔往兩側延伸;` +
        "段起點不一定落在格線上,頭尾會各留一段零頭。" : "");
  // 實際結果必須自己一個 data-ro 的 div:包在說明句裡的話打字時不會更新(syncRO 只換 data-ro)
  return `<div class="fields g4">${f}</div>` + listRO +
    `<div class="hint">${note}</div><div class="hint" data-ro>${extraNote || ""}</div>`;
}
/* ---- 線形鏈段的子表 ---- */
function chainTables(pc, k, info){
  const segRows = (pc.segments || []).map((s, i) => {
    let p = "";
    const kk = `${k}segments.${i}.`;
    if (s.type === "LINE") p = fld("", kk + "L", s.L);
    if (s.type === "ARC") p = fld("", kk + "R", s.R) +
      fld("", kk + "dir", s.dir, { select:[["1","右偏"],["-1","左偏"]] }) +
      (s.defBy === "length" ? fld("", kk + "L", s.L) : fld("", kk + "delta", s.delta));
    if (s.type === "SPIRAL") p = fld("", kk + "R0", s.R0inf ? "" : s.R0, { disabled:!!s.R0inf }) +
      fld("", kk + "R1", s.R1inf ? "" : s.R1, { disabled:!!s.R1inf }) +
      fld("", kk + "dir", s.dir, { select:[["1","右偏"],["-1","左偏"]] }) +
      fld("", kk + "Ls", s.Ls);
    const bs = info && info.chain ? info.chain.segs.find(x => x.i === i) : null;
    return `<tr><td class="n">${i+1}</td>
      <td class="n" style="width:100px">${fld("", kk + "type", s.type,
        { select:[["LINE","直線"],["ARC","圓弧"],["SPIRAL","緩和曲線"]] })}</td>
      <td><div class="fields" style="grid-template-columns:repeat(${s.type==="LINE"?1:s.type==="ARC"?3:4},1fr)">${p}</div></td>
      <td class="n" style="white-space:nowrap" data-ro>${bs ? fmtSta(bs.s0) + " → " + fmtSta(bs.s1) : "—"}</td>
      <td style="width:22px"><button class="iconbtn danger" data-op="delseg" data-p="${pc._i}" data-i="${i}">✕</button></td></tr>`;
  }).join("");
  const P = pc.profile || [];
  const vpiRows = P.map((v, i) => {
    const isEnd = (i === 0 || i === P.length - 1);
    return `<tr><td class="n">${i === 0 ? "起" : (isEnd ? "終" : i)}</td>
      <td style="width:118px">${fld("", `${k}profile.${i}.sta`, fmtSta(num(v.sta) || 0), { text:true })}</td>
      <td style="width:92px">${fld("", `${k}profile.${i}.z`, v.z)}</td>
      <td style="width:92px">${fld("", `${k}profile.${i}.L`, isEnd ? 0 : v.L, { disabled:isEnd })}</td>
      <td style="width:22px"><button class="iconbtn danger" data-op="delvpi" data-p="${pc._i}" data-i="${i}">✕</button></td></tr>`;
  }).join("");
  return `<div class="lbl" style="margin:4px 0 5px">子段(切線連續)</div>
    <table class="t"><thead><tr><th>#</th><th>型別</th>
      <th>參數<span style="font-weight:400;color:var(--ink-3)">(直線 L / 圓弧 R·偏向·Δ / 緩和 R0·R1·偏向·Ls)</span></th>
      <th>起訖樁號</th><th></th></tr></thead><tbody>${segRows}</tbody></table>
    <div class="btns" style="margin-top:7px">
      <button class="btn" data-op="addseg" data-p="${pc._i}" data-t="LINE">+ 直線</button>
      <button class="btn" data-op="addseg" data-p="${pc._i}" data-t="ARC">+ 圓弧</button>
      <button class="btn" data-op="addseg" data-p="${pc._i}" data-t="SPIRAL">+ 緩和曲線</button></div>
    <div class="lbl" style="margin:12px 0 5px">縱斷面(選用)${P.length ? "" : " — 無,整段維持起點高程"}</div>
    ${P.length ? `<table class="t"><thead><tr><th></th><th>樁號</th><th>高程 Z</th><th>豎曲線長 L</th><th></th></tr></thead><tbody>${vpiRows}</tbody></table>` : ""}
    <div class="btns" style="margin-top:7px">
      <button class="btn" data-op="addvpi" data-p="${pc._i}">+ VPI</button>
      ${P.length ? `<button class="btn d" data-op="clearvpi" data-p="${pc._i}">清除縱斷面</button>` : ""}</div>
    <div class="fields g4" style="margin-top:10px">${
      fld("起始樁號", k + "sta", fmtSta(num(pc.sta) || 0), { text:true }) +
      fld("起始方位角 (°)", k + "az", pc.az) +
      fld("強制節點樁號", k + "forced", pc.forced, { text:true, ph:"0k+120.000, 180.5" }) +
      fld(`吸收容差 (${UL()})`, k + "absorbTol", pc.absorbTol)}</div>`;
}

/* ---- 單一段的卡片 ---- */
function pieceCard(g, pc, pi, info, r){
  const k = `pieces.${pi}.`;
  const first = pi === 0;
  const cont = contOn(pc, pi);
  /* 段的參照分兩層下拉:先挑「哪一段」,挑完才出現「起點 / 中點 / 終點」。
     一次把所有段 × 三個位置攤平成一列會爆炸(10 段就 30 個選項)。 */
  const segOpts = (g.pieces || []).map((q, j) => j === pi ? null
      : [String(j), `段 ${j+1}(${PIECES[q.type].name})`]).filter(Boolean);
  const atOpts = [["s","起點"],["m","中點"],["e","終點"]];
  // 別的群組的節點也可以當起點 / 終點 —— 跨群組對齊不用再自己抄座標
  const grpOpts = state.groups.filter(x => x.id !== g.id)
    .map(x => ["@" + x.id, `${x.name} 的節點`]);
  const refName = v => {
    const gr = parseGRef(v);
    if (gr){
      const og = state.groups.find(x => x.id === gr.gid);
      return `${og ? og.name : "別的群組"}的第 ${gr.idx} 個節點`;
    }
    const r = parseRef(v); if (!r) return "";
    const q = (g.pieces || [])[r.pi];
    return `段 ${r.pi+1}${q ? "(" + PIECES[q.type].name + ")" : ""}的${REF_AT[r.at]}`;
  };
  // 回傳「來源」下拉 +(挑到段 → 位置下拉;挑到別的群組 → 第幾個節點)+ 視圖點選鈕
  const refPair = (label, key, val, opts0, noGrp) => {
    const gr = parseGRef(val), r = parseRef(val);
    const gv = gr ? "@" + gr.gid : (r ? String(r.pi) : String(val || ""));
    const picking = PICK && PICK.mode === "ref" && PICK.key === k + key;
    if (noGrp)
      return fld(label, k + key + "G", gv, { select:[...opts0, ...segOpts] }) +
        (r ? fld("位置", k + key + "A", r.at, { select:atOpts }) : "");
    return fld(label, k + key + "G", gv, { select:[...opts0, ...segOpts, ...grpOpts] }) +
      (gr ? fld("第幾個節點", k + key + "I", gr.idx, { min:1 })
          : r ? fld("位置", k + key + "A", r.at, { select:atOpts }) : "") +
      `<div class="f"><span>&nbsp;</span><button class="btn${picking ? " d" : ""}" data-op="${
        picking ? "mecancel" : "refpick"}" data-k="${k + key}" title="${picking
          ? "點畫面上的節點或線,按這裡(或 Esc)取消"
          : `在 3D 視圖上點一個節點(點線也可以,會取比較近的那一端),當作這一段的${esc(label)}`}">${
        picking ? `點選中… 按此取消` : `圖上點${esc(label)}`}</button></div>` +
      (picking ? `<div class="hint keep" style="grid-column:1/-1; margin-top:0; color:var(--accent)">
        在 3D 視圖上點<b>別的群組</b>的節點就設定完成;<b>點線也可以</b>,會取離游標比較近的那一端。
        點空了不會取消 —— 要結束請按 <b>Esc</b> 或上面那顆鈕。</div>` : "");
  };
  const ec = endRefOn(pc);
  const endSel = END_CONT_T[pc.type]
    ? refPair("終點", "eRef", eRefOf(pc), [["","自訂座標"]])
    : "";
  const endHint = ec
    ? `<div class="hint">終點 = <b>${esc(refName(eRefOf(pc)) || "另一段")}</b>;
        對方一改,這一段就跟著拉過去。<b>接到「下一段的起點」時接縫節點共用不重複</b>,
        接到其他段則座標重合,再由「合併重合節點」併成同一個。</div>`
    : "";
  const rowS = () => ({ label:"起點", kx:k+"x1", vx:pc.x1, ky:k+"y1", vy:pc.y1, kz:k+"z1", vz:pc.z1 });
  const rowE = (l) => ({ label:l || "終點", kx:k+"x2", vx:pc.x2, ky:k+"y2", vy:pc.y2, kz:k+"z2", vz:pc.z2 });
  let body = "";

  // 第一段就算殘留 "prev" 也要當成自訂座標,否則下拉選不到值、座標欄位會被藏起來
  const sv = (first && sRefOf(pc) === "prev") ? "" : sRefOf(pc);
  const sHead = [["","自訂座標"], ...(first ? [] : [["prev","接續前段終點"]])];
  const svName = sv === "prev" ? "前一段的終點" : refName(sv);
  const startSel = refPair("起點", "sRef", sv, sHead);
  const startHint = sv
    ? `<div class="hint" style="margin-top:7px">起點 = <b>${esc(svName)}</b>。${
        cont ? "與前段<b>共用接縫節點</b>。" : "座標重合,再由「合併重合節點」併成同一個。"}</div>`
    : "";
  // 起點是自訂座標時才進座標表;由別的段決定時只留一行說明
  const startRow = `<div class="fields g4">${startSel}</div>` +
    (sv ? "" : xyzTable([rowS()])) + startHint;

  if (pc.type === "LINE"){
    const sFixed = !!sv;                               // 起點由別的段決定
    const info0 = info;
    const polar = !ec && pc.endMode === "polar";
    const rows = [];
    if (!sv) rows.push(rowS());
    if (!ec && !polar) rows.push(rowE());
    body = `<div class="fields g4">${startSel}</div>` +
      `<div class="fields g4 rowsep">${endSel +
        (ec ? "" : fld("終點定義", k + "endMode", pc.endMode,
          { select:[["point","終點座標"],["polar","長度 + 方位角 + 仰角"]] }))}</div>` +
      (rows.length ? xyzTable(rows) : "") + startHint +
      (polar ? `<div class="fields g4" style="margin-top:8px">${
        fld(`長度 L (${UL()})`, k + "len", pc.len) + fld("方位角 (°)", k + "az", pc.az) +
        fld("仰角 (°)", k + "el", pc.el)}</div>` : "") + endHint +
      `<div class="fields g4" style="margin-top:8px">${
        fld(`起點端延長 (${UL()})`, k + "extS", pc.extS, { disabled:sFixed, min:0 }) +
        fld(`終點端延長 (${UL()})`, k + "extE", pc.extE, { disabled:ec, min:0 })}
        <div class="f"><span>&nbsp;</span><button class="btn" data-op="extclr" data-p="${pi}"${
          (num(pc.extS) || num(pc.extE)) ? "" : " disabled"}>清除延長</button></div></div>
      <div class="hint">沿<b>這條線自己的方向</b>往外<b>多接一段元素</b>,方向與角度都不變。
        <b>原本那段的節點與元素完全不動</b> —— 延長段自己再依上面「分割與元素覆寫」的規則切,
        切不滿一格的零頭照你選的<b>餘數處理</b>決定。只能填 <b>0 或正值</b>(要縮短請改終點座標)。
        ${sFixed ? "<b>起點由別的段決定,不能延長</b>(要動請改那一段)。" : ""}
        ${ec ? "<b>終點接到別的段,不能延長</b>。" : ""}
        ${info0 && info0.len ? `含延長後的總長 <b>${info0.len.toFixed(3)} ${UL()}</b>。` : ""}</div>`;
  }
  else if (pc.type === "ARC"){
    const modeF = fld("定義方式", k + "arcMode", pc.arcMode,
      { select:[["endpoints","端點 + 半徑"],["center","圓心 + 轉角"],["three","三點(任意平面)"]] });
    if (pc.arcMode === "center"){
      body = `<div class="fields g4">${startSel + modeF}</div>` +
        xyzTable([...(sv ? [] : [rowS()]),
          { label:"圓心", kx:k+"cx", vx:pc.cx, ky:k+"cy", vy:pc.cy, kz:"", vz:"" },
          { label:"終點", kx:"", vx:"", ky:"", vy:"", kz:k+"z2", vz:pc.z2 }]) + startHint +
        `<div class="fields g4" style="margin-top:8px">${
        fld("轉角 Δ (°)", k + "delta", pc.delta) +
        fld("偏向", k + "dir", pc.dir, { select:[["1","右轉"],["-1","左轉"]] })}</div>
        <div class="hint">半徑由起點到圓心的距離決定;<b>僅水平面</b>,高程沿弧線線性內插。</div>`;
    } else if (pc.arcMode === "three"){
      body = `<div class="fields g4">${startSel + modeF}</div>` +
        `<div class="fields g4 rowsep">${endSel}</div>` +
        xyzTable([...(sv ? [] : [rowS()]),
          { label:"通過點", kx:k+"mx", vx:pc.mx, ky:k+"my", vy:pc.my, kz:k+"mz", vz:pc.mz },
          ...(ec ? [] : [rowE()])]) + startHint +
        `${endHint}
        <div class="hint">圓弧落在<b>這三點自己的平面</b>上,所以傾斜的拱肋、斜置的環都畫得出來 ——
          不必先想是水平還是鉛直。三點<b>共線或重合</b>時定不出圓弧,會報錯。
          ${info && info.meta && Number.isFinite(info.meta.R)
            ? `目前半徑 <b>${info.meta.R.toFixed(3)} ${UL()}</b>,轉角 <b>${(info.meta.delta || 0).toFixed(2)}°</b>。` : ""}</div>`;
    } else {
      body = `<div class="fields g4">${startSel + modeF}</div>` +
        `<div class="fields g4 rowsep">${endSel}</div>` +
        xyzTable([...(sv ? [] : [rowS()]), ...(ec ? [] : [rowE()])]) + startHint +
        `${endHint}
        <div class="fields g4" style="margin-top:8px">${
        fld("半徑 R", k + "R", pc.R) +
        fld("平面", k + "plane", pc.plane, { select:[["H","水平"],["V","鉛直(拱肋)"]] }) +
        fld(pc.plane === "V" ? "凸向" : "偏向", k + "dir", pc.dir,
          { select:pc.plane === "V" ? [["1","上凸(拱)"],["-1","下凹"]] : [["1","右轉"],["-1","左轉"]] }) +
        fld("弧段", k + "major", pc.major ? "1" : "0", { select:[["0","劣弧(短)"],["1","優弧(長)"]] })}</div>
        <div class="hint">兩點加半徑有<b>兩組解</b>:偏向決定圓心在哪一側,弧段決定走短的還是長的。半徑須 ≥ 弦長一半。</div>`;
    }
  }
  else if (pc.type === "SAG"){
    const fb = pc.fBase || "chord";
    const selNode = (SELNODE && MODEL.byId.get(SELNODE.gid))
      ? MODEL.byId.get(SELNODE.gid).nodes.find(n => n.num === SELNODE.num) : null;
    body = `<div class="fields g4">${startSel}</div>` +
      `<div class="fields g4 rowsep">${endSel}</div>` +
      xyzTable([...(sv ? [] : [rowS()]), ...(ec ? [] : [rowE()])]) + startHint +
      `${endHint}
      <div class="fields g3" style="margin-top:8px">${
        fld("曲線", k + "curve", pc.curve, { select:[["parabola","拋物線"],["catenary","懸鏈線"]] }) +
        fld("垂度定義", k + "fMode", pc.fMode, { select:[["ratio","垂跨比 f/L"],["abs",`絕對值 (${UL()})`]] }) +
        fld(pc.fMode === "ratio" ? "垂跨比" : `垂度 f (${UL()})`, k + "f", pc.f)}</div>
      <div class="fields g3" style="margin-top:8px">${
        fld("垂度基準", k + "fBase", fb, { select:SAG_BASE }) +
        (fb === "z" ? fld(`基準高程 Z (${UL()})`, k + "fz", pc.fz) : "")}</div>
      ${fb === "z" ? `<div class="btns" style="margin-top:8px">
         <button class="btn" data-op="sagz" data-p="${pi}"${selNode ? "" : " disabled"}>${
           selNode ? `用選取節點 #${selNode.num} 的高程(${selNode.z.toFixed(3)} ${UL()})`
                   : "先在 3D 視圖點一個節點(工具列的「選取」要打開),再按這裡帶入它的高程"}</button></div>` : ""}
      <div class="hint">跨距取兩端點的<b>平面</b>距離。垂度基準決定 f 從哪裡往下量:
        <b>弦線</b>= 自兩端連線量垂距(傳統作法);<b>高側 / 低側端點</b>與<b>指定高程</b>
        = 自那個<b>水平面</b>往下量到<b>曲線最低點</b>。兩端不等高時這幾種差很多,
        鞍座高度不同的主索通常要用「高側端點」或直接指定高程。</div>`;
  }
  else if (pc.type === "HELIX"){
    body = `<div class="fields g4">${startSel}</div>` +
      xyzTable([...(sv ? [] : [rowS()]),
        ...(cont ? [] : [{ label:"圓心", kx:k+"cx", vx:pc.cx, ky:k+"cy", vy:pc.cy, kz:"", vz:"" }])]) +
      startHint +
      `<div class="fields g4" style="margin-top:8px">${
        fld("半徑 R", k + "R", pc.R) + fld("終止半徑(留白 = 等半徑)", k + "R2", pc.R2, { text:true }) +
        fld("起始方位角 (°)", k + "az0", pc.az0) + fld("圈數", k + "turns", pc.turns)}</div>
      <div class="fields g4" style="margin-top:8px">${
        fld(`螺距(每圈升高 ${UL()})`, k + "pitch", pc.pitch) +
        fld("旋向(俯視)", k + "dir", pc.dir, { select:[["1","順時針"],["-1","逆時針"]] })}</div>
      <div class="hint">${cont ? "接續前段時,<b>圓心由起點與起始方位角反推</b>。" : ""}
        midas 的 Rotate Copy 只能做<b>平面</b>圓弧;給終止半徑可做錐形螺旋。</div>`;
  }
  else if (pc.type === "CHAIN"){
    body = startRow + `<div style="margin-top:10px">${chainTables(pc, k, info)}</div>`;
  }
  else if (pc.type === "POLY"){
    const pts = parseXYZTable(pc.table, pc.skip);
    const p0 = pts[0], pN = pts[pts.length-1];
    body = `<div class="fields g4">${
        fld("忽略每行前 n 個數字", k + "skip", pc.skip, { min:0 })}</div>
      <div style="margin-top:8px">${fld("座標表(可直接從 Excel 貼上)", k + "table", pc.table,
        { area:true, rows:7, ph:"每行三個數字:X  Y  Z" })}</div>
      <div class="hint" data-ro>解析出 <b>${pts.length}</b> 個節點${
        pts.length ? ` · 第一點 (${p0.x}, ${p0.y}, ${p0.z}) · 最後一點 (${pN.x}, ${pN.y}, ${pN.z})` : ""}</div>
      <div class="hint">每行取<b>前三個數字</b>當 X / Y / Z;數字不足三個的行(標題列、空行)自動跳過,
        所以整塊貼過來不用先清乾淨。分隔符 tab / 空白 / 逗號 / 分號都可以。
        <b>座標是絕對值,不接續前一段</b>,而且<b>不再分割</b> —— 貼幾個點就是幾個節點。</div>`;
  }
  else if (pc.type === "POINT"){
    body = `<div class="fields g4">${refPair("連接", "sRef", sv, sHead, true)}</div>` +
      xyzTable([rowE("座標")]) +
      `<div class="hint">${cont ? "會從前段終點拉一根直線元素到這個座標。" : "只加一個節點,不產生元素——適合錨碇點、支承點。"}</div>`;
  }

  const stat = info ? `${(info.n1 - info.n0)} 節點 · ${(info.e1 - info.e0)} 元素` +
    (info.len ? ` · ${info.len.toFixed(3)} ${UL()}` : (info.total ? ` · ${info.total.toFixed(3)} ${UL()}` : "")) : "—";
  // 「弧長還是弦長」最直接的答案:把兩個數字同時擺出來
  const elens = (r && info && info.e1 > info.e0)
    ? r.elems.slice(info.e0, info.e1).map(e => e.len3d).filter(Number.isFinite) : [];
  const arcLen = info ? (info.len || info.total || 0) : 0;
  // 量測方向是某一軸時,再補上那個軸的跨距 —— 間距表的總長要跟這個數字對
  const sp0 = pc.split || SPLIT_DEF;
  const spanAx = sp0.mode === "axis" ? axisOf(sp0)
    : (sp0.mode === "list" && listAlongOf(sp0) !== "s") ? listAlongOf(sp0) : null;
  const cvp = info && info.curve;
  const spanTxt = (spanAx && cvp)
    ? ` · 沿 <b>${spanAx.toUpperCase()}</b> 的跨距 <b>${Math.abs(cvp.pt(1)[spanAx] - cvp.pt(0)[spanAx]).toFixed(3)} ${UL()}</b>`
    : "";
  const resNote = elens.length
    ? `實際結果:曲線長(<b>弧長</b>)<b>${arcLen.toFixed(3)} ${UL()}</b> ·
       元素<b>弦長</b> <b>${Math.min(...elens).toFixed(3)}</b> – <b>${Math.max(...elens).toFixed(3)} ${UL()}</b> ·
       共 <b>${elens.length}</b> 根(弦長總和 ${elens.reduce((a,b) => a+b, 0).toFixed(3)} ${UL()})${spanTxt}`
    : "";
  const adv = `<details class="adv" data-dk="adv:${pi}"><summary>分割與元素覆寫</summary><div>
      ${splitSec(pc, k, resNote)}
      <div class="fields g4" style="margin-top:9px">${
        fld("覆寫元素屬性", k + "ovr", !!pc.ovr, { check:true }) +
        fld("類型", k + "etype", pc.etype, { select:ELEM_TYPES, disabled:!pc.ovr }) +
        matFieldK(k, "mat", "材料", pc.mat, !pc.ovr) +
        matFieldK(k, "sect", "斷面", pc.sect, !pc.ovr)}</div></div></details>`;
  const xfp = `<details class="adv" data-dk="xfp:${pi}"${xfActive(pc.xf) ? " open" : ""}><summary>平移與旋轉${
      xfActive(pc.xf) ? "(已套用)" : ""}</summary><div>
      ${xfFields(k + "xf.", pc.xf, "piece")}
      <div class="btns" style="margin-top:9px"><button class="btn d" data-op="pxfrst" data-p="${pi}">本段歸零</button></div>
      <div class="hint">只動<b>這一段</b>的節點;<b>接續本段的後面幾段會跟著走</b>,起點設成自訂座標的段不受影響。
        旋轉中心預設是<b>本段起點</b>,所以單純轉方向不會把接縫扯開。</div></div></details>`;

  return `<details class="pc" data-pi="${pi}">
    <summary><span class="idx" style="background:${pieceColor(colorOfGroup(g), pi, (g.pieces || []).length)}">${pi+1}</span>
      <select data-k="${k}type" onclick="event.stopPropagation()">${
        Object.entries(PIECES).map(([v,t]) => `<option value="${v}"${v===pc.type?" selected":""}>${t.name}</option>`).join("")}</select>
      <span class="st" data-ro>${stat}</span>
      <span class="grip" title="拖曳排序">⠿</span>
      <button class="iconbtn danger" data-op="pdel" data-p="${pi}" title="刪除">✕</button>
    </summary><div class="pcb">${body}${pc.type === "POINT" ? "" : adv}${xfp}</div></details>`;
}

function nodeSec(g, r){
  if (!r) return "";
  const nEdit = (r.stat && r.stat.nEdit) || 0, nDel = (r.stat && r.stat.nDel) || 0;
  const sel = (SELNODE && SELNODE.gid === g.id) ? r.nodes.find(n => n.num === SELNODE.num) : null;
  const canEdit = nodeEditable(g, SELNODE);
  const manual = sel && sel.manual;                    // 手動新增的節點:直接改它自己的座標
  // 沒點到節點就整區不顯示 —— 只有還留著覆寫 / 刪除紀錄時才要露出來讓人清得掉
  if (!sel && !nEdit && !nDel) return "";
  const tail = sel ? `<span style="color:var(--accent)">已選取 #${sel.num}</span>`
    : (nEdit || nDel) ? `<span style="color:var(--warn)">覆寫 ${nEdit} · 刪除 ${nDel}</span>`
    : "點畫面上的節點即可編輯";
  let body = "";
  if (sel && manual){
    const mi = sel.mi;
    body = `<div class="fields g4">${
      fld("節點編號", "@num", sel.num, { text:true, disabled:true }) +
      fld("X", `addN.${mi}.x`, sel.x) + fld("Y", `addN.${mi}.y`, sel.y) + fld("Z", `addN.${mi}.z`, sel.z)}</div>
      <div class="btns" style="margin-top:9px">
        <button class="btn d" data-op="mndel" data-i="${mi}">刪除此節點</button>
        <button class="btn" data-op="nclr">取消選取</button></div>
      <div class="hint" data-ro>這是<b>舊版手動節點</b>(第 ${mi + 1} 個),座標可直接改。
        現在要補一個算不出來的點,用<b>「線」群組的節點段</b>即可;
        刪除它時,凡是用到它的舊版手動元素會一起被清掉。</div>`;
  } else if (sel && canEdit){
    body = `<div class="fields g4">${
      fld("節點編號", "@num", sel.num, { text:true, disabled:true }) +
      fld("X", "@x", sel.x) + fld("Y", "@y", sel.y) + fld("Z", "@z", sel.z)}</div>
      <div class="btns" style="margin-top:9px">
        <button class="btn d" data-op="ndel">刪除此節點</button>
        ${sel.edited ? `<button class="btn" data-op="nrst">還原座標</button>` : ""}
        <button class="btn" data-op="nclr">取消選取</button></div>
      <details class="adv" open><summary>平移與旋轉(此節點)</summary><div>
        ${xfFields("$", XFT, "node")}
        <div class="btns" style="margin-top:9px"><button class="btn p" data-op="xfnode">套用到此節點</button></div>
        <div class="hint">套用後寫成<b>座標覆寫</b>,按「還原座標」即可取消;單一節點只有平移有效,
          要旋轉請把旋轉中心設成<b>自訂座標</b>。</div></div></details>
      <div class="hint" data-ro>第 ${sel.ri + 1} 個原始節點${sel.edited ? " · <b style=\"color:var(--warn)\">座標已覆寫</b>" : ""}。
        <b>刪除後前後兩個節點會直接相連</b>;覆寫的節點不再計算弦線偏差。</div>`;
  } else if (sel){
    // 選得到、看得到,但這一組的節點不是自己算的,改不了
    body = `<div class="out" data-ro>
        <div><span class="k">節點編號</span> <b>${sel.num}</b></div>
        <div><span class="k">X</span> <b>${sel.x.toFixed(4)} ${UL()}</b></div>
        <div><span class="k">Y</span> <b>${sel.y.toFixed(4)} ${UL()}</b></div>
        <div><span class="k">Z</span> <b>${sel.z.toFixed(4)} ${UL()}</b></div></div>
      <div class="btns" style="margin-top:9px"><button class="btn" data-op="nclr">取消選取</button></div>
      <div class="hint">這個節點屬於<b>${esc(TYPES[g.type].name)}</b>,座標是從來源群組推導出來的,不能直接改
        —— 要移動它請改<b>來源群組</b>,或用整個群組的「平移與旋轉」。
        它仍然可以拿來當<b>手動元素</b>的端點。</div>`;
  } else {
    body = `<div class="hint" style="margin:0">先打開 3D 視圖工具列上的<b>「選取」</b>
      —— 它<b>預設是關的</b>,關著時在圖上點任何東西都只會切換到<b>畫出它的那個群組</b>。
      打開之後用<b>左鍵</b>點任一節點即可編輯座標、刪除或平移旋轉;
      點<b>兩節點之間的線</b>則是選取整根元素。被擋住時用 <b>Ctrl+中鍵</b>轉個角度比較好點。</div>`;
  }
  if (nEdit || nDel)
    body += `<div class="btns" style="margin-top:9px"><button class="btn d" data-op="nclrall">清除這個群組的全部覆寫</button></div>`;
  return SEC("節點", tail, body, sel ? "hot" : "");
}

/* ---- 纜索設定:只有這一組(或它某一段)真的用 Cable 才顯示 ----
   MCT 的 iSUB / EXVAL2 是代碼,對使用者沒有意義,所以介面上只出現 midas 裡看得到的名詞。 */
const CABLE_SUB = [["3","Cable"],["1","Truss(允許有限壓力)"],["2","Hook"]];
function usesCable(g){
  if ((g.etype || "BEAM") === "CABLE") return true;
  return (g.pieces || []).some(pc => pc.ovr && pc.etype === "CABLE");
}
function cableFields(g){
  if (!usesCable(g)) return "";
  const c = { ...CABLE_DEF(), ...(g.cable || {}) };
  const sub = Math.round(num(c.sub)) || 3;
  const kind = Math.round(num(c.kind)) || 3;
  const valLab = sub !== 3
    ? (sub === 1 ? `容許壓力 (${UF()})` : `間隙距離 (${UL()})`)
    : (kind === 3 ? `無應力長度 Lu (${UL()})` : `${kind === 1 ? "預拉力" : "水平分力"} (${UF()})`);
  return `<div class="subh">纜索(Tension-only)</div>
    <div class="fields g3">${
      fld("子類型", "cable.sub", sub, { select:CABLE_SUB }) +
      (sub === 3 ? fld("初始值種類", "cable.kind", kind,
        { select:[["3","Lu(無應力長度)"],["1","Pretension(預拉力)"],["2","Horizontal(水平分力)"]] }) : "") +
      fld(valLab, "cable.val", c.val)}</div>
      <div class="hint">對應 midas 的<b>只受拉元素</b>設定。子類型 <b>Cable</b> 要給初始狀態:
        <b>Lu</b> 是長度(用目前的長度單位 ${esc(UL())}),<b>Pretension / Horizontal</b> 是力(用 ${esc(UF())})。
        程式<b>不會替你換算</b>,請照目前單位填。</div>`;
}

/* ---- 在 3D 視圖上點節點 ---- */
// PICK 不進 state、不進復原堆疊 —— 它只是「現在正在點第幾個端點」的暫時狀態。
let PICK = null;                       // { gid, i, mode } i = 已點到的第一個節點編號
let hoverE = null;                     // 點選群組時滑鼠掃到的那根元素 { num, gid, name }
// 節點編號 → 它屬於哪一組、在該組的節點串裡排第幾個(0 起算)。
// 存的是「第幾個」而不是節點編號:上游的線之後重新分割,對接關係才不會錯位。
function locateNode(numv){
  const rs = (MODEL && MODEL.groups) || [];
  for (const r of rs){
    const ch = chainOf(r);
    const i = ch.findIndex(n => n.num === numv);
    if (i >= 0) return { gid:r.g.id, idx:i };
  }
  return null;
}
/* ---- 被選取的元素 ---- */
// 在圖面上點到任何群組的元素,都會切到那個群組並在這裡顯示它 —— 包含連接族。
// 連接族的節點是從來源推導出來的,不能直接搬,所以只顯示資料、不給移動。
function elemPickSec(g, r){
  if (!r || !SELELEM || SELELEM.gid !== g.id) return "";
  const e = r.elems.find(x => x.num === SELELEM.num);
  if (!e) return "";
  const movable = g.type === "CURVE";
  const ok = movable && Number.isFinite(e.a.ri) && Number.isFinite(e.b.ri);
  const info = `<div class="out" data-ro>
      <div><span class="k">元素編號</span> <b>${e.num}</b></div>
      <div><span class="k">節點 i–j</span> <b>${e.i} – ${e.j}</b></div>
      <div><span class="k">長度</span> <b>${e.len3d.toFixed(4)} ${UL()}</b></div>
      <div><span class="k">類型 / 材料 / 斷面</span> <b>${esc(e.type)} / ${e.mat} / ${e.sect}</b></div></div>`;
  // 舊檔留下來的手動元素:選到它就能刪,不再另外開一張卡片
  if (e.manual)
    return SEC("元素", `<span style="color:var(--accent)">已選取 #${e.num}</span>`,
      info + `<div class="btns" style="margin-top:9px">
         <button class="btn d" data-op="medel" data-i="${e.mi}">刪除此元素</button>
         <button class="btn" data-op="eclr">取消選取</button></div>
       <div class="hint">這是<b>舊版手動元素</b>。現在同樣的事情用<b>「線」群組的直線段</b>做:
         把它的<b>起點與終點各指到一個群組的第 k 個節點</b>、分割數填 1,就是同一根元素,
         而且上游重新分割時會自己跟著走。</div>`, "hot");
  if (!movable)
    return SEC("元素", `<span style="color:var(--accent)">已選取 #${e.num}</span>`,
      info + `<div class="btns" style="margin-top:9px">
         <button class="btn" data-op="eclr">取消選取</button></div>
       <div class="hint">這是<b>${esc(TYPES[g.type].name)}</b>算出來的元素,兩端由來源群組決定,不能直接搬。
         要改就改上面的連接設定,或改來源群組。</div>`, "hot");
  return SEC("元素", `<span style="color:var(--accent)">已選取 #${e.num}</span>`,
    info + `${xfFields("$", XFT, "elem")}
     <div class="btns" style="margin-top:9px">
       <button class="btn p" data-op="xfelem"${ok ? "" : " disabled"}>套用到此元素(兩端節點)</button>
       <button class="btn" data-op="eclr">取消選取</button></div>
     <div class="hint">移動元素 = 同時移動<b>兩端節點</b>,寫成座標覆寫;與它們相連的其他元素會跟著變形。
       ${ok ? "" : "<b>此元素的端點不屬於本群組,無法移動。</b>"}</div>`, "hot");
}

function paneFor(g){
  const T = TYPES[g.type], r = MODEL.byId.get(g.id);
  const st = r ? r.stat : {};
  const head = `<div class="ptitle">
      <span class="nm">${esc(g.name)}</span><span class="fam ${T.fam}">${T.name}</span><span class="sp"></span>
      <button class="btn tog${g.on !== false ? " on" : ""}" data-op="ontog"
        title="${g.on !== false ? "點一下停用這個群組" : "點一下啟用這個群組"}">${
        g.on !== false ? "已啟用" : "已停用"}</button>
      <button class="btn" data-op="offdup">位移複製…</button>
      <button class="btn" data-op="arrdlg">沿線陣列…</button>
      <button class="btn${xfActive(g.xf) ? " p" : ""}" data-op="xfdlg">平移旋轉…${
        xfActive(g.xf) ? " ●" : ""}</button>
      <button class="btn d" data-op="del">刪除</button></div>`;
  // .mct 匯出用的群組名必須是 ASCII;名字全是中文時會退回 G01 這種序號,要讓使用者看得到
  const fellBack = !!r && /_G\d+(_\d+)?$/.test(r.gname) && !/^[A-Za-z0-9_]+$/.test(String(g.name || ""));
  const nameSec = SEC("基本", `匯出群組名 ${r ? esc(r.gname) : ""}`,
    `<div class="fields g3">${fld("名稱", "name", g.name, { text:true, span:2 }) +
       fld("顏色", "color", isHex(g.color) ? g.color : colorOfGroup(g),
           { colorPick:true, auto:!isHex(g.color) })}</div>
     <div class="hint" style="margin-top:8px">匯出的 .mct <b>一律純英數</b>(中文在 midas 匯入會變亂碼),
       所以 <code>*GROUP</code> 用的匯出群組名是 <b>${r ? esc(r.gname) : "—"}</b>。
       ${fellBack ? "目前名稱沒有可用的英數字,只能<b>用序號代替</b>;想在 midas 裡看到有意義的匯出群組名,請在名稱裡加上英數(例如「主曲線 MAIN」)。" : ""}</div>
     ${g.type === "IMPORT" ? "" : `<details class="adv elem"${elemDone(g) ? "" : " open"}>
       <summary>元素(整個群組預設)<span class="tag${elemDone(g) ? " ok" : " todo"}">${
         elemDone(g) ? esc(elemSummary(g)) : "尚未設定"}</span></summary>
       <div>
         <div class="fields g3">${
           fld("類型", "etype", g.etype, { select:[["","(未設定)"], ...ELEM_TYPES] }) +
           matField(g, "mat", "材料", g.mat) + matField(g, "sect", "斷面", g.sect)}</div>
         <div class="hint">個別段可在自己的「分割與元素覆寫」裡蓋掉。<b>留空就照 BEAM / 材料 1 / 斷面 1 匯出</b>。${
           libTotal() ? "" : `<br>想讓材料 / 斷面直接顯示 <b>midas 裡的名稱</b>而不是編號?
             到右上角<b>「匯入 → midas 的材料與斷面名稱」</b>讀一份 midas 匯出的 .mct
             (或直接把那個檔案<b>拖進本頁面</b>)。`}</div>
         ${cableFields(g)}
       </div>
     </details>`}
     <div class="hint" data-ro style="margin-top:12px;padding-top:9px;border-top:1px solid var(--line-2)">
       <b>編號</b>(${g.type === "IMPORT"
         ? "匯入組原樣保留原模型的編號,不吃全域編號規則"
         : "全自動:全域起始 + 這個群組在清單裡的順序 × 號段增量,可在「編號總表」調整"})${
       r ? ` —— 節點 <b>${numRange(r.nodes)}</b> · 元素 <b>${numRange(r.elems)}</b>` : ""}</div>`);

  let body = "";
  if (g.type === "CURVE"){
    const pcs = g.pieces || [];
    pcs.forEach((pc, i) => pc._i = i);
    const cards = pcs.map((pc, i) => pieceCard(g, pc, i, r ? r.pieces.find(p => p.pi === i) : null, r)).join("");
    body = SEC("段", `${pcs.length} 段`, (cards || `<div class="hint" style="margin:0">尚無任何段。</div>`) +
      `<div class="btns" style="margin-top:9px">` +
      Object.entries(PIECES).map(([v,t]) => `<button class="btn" data-op="addpc" data-t="${v}">+ ${t.name}</button>`).join("") +
      `</div><div class="hint">段與段預設<b>接續前段終點</b>並共用接縫節點;把「起點」改成自訂座標即可斷開。<br>
        起點與終點都可以指到<b>別的群組的第 k 個節點</b> —— 想在兩個既有節點之間補一根元素,
        就加一個<b>直線</b>段、兩端各指一個、分割數填 1;想補一個算不出來的點就加<b>節點</b>段。</div>`);
  }
  else if (g.type === "IMPORT"){
    const im = g.imp || { nodes:[], elems:[] };
    const miss = r ? im.elems.length - r.elems.length : 0;
    body = SEC("匯入的內容", `${im.nodes.length} 節點 · ${im.elems.length} 元素`,
      `<div data-ro><table class="t"><tbody>
         <tr><th style="width:96px">來源檔</th><td>${esc(im.src || "—")}</td></tr>
         <tr><th>節點</th><td>${im.nodes.length} 個 · 編號 ${r ? numRange(r.nodes) : "—"}</td></tr>
         <tr><th>元素</th><td>${im.elems.length} 根 · 編號 ${r ? numRange(r.elems) : "—"}</td></tr>
       </tbody></table></div>
       ${miss > 0 ? `<div class="note" style="margin-top:8px">有 <b>${miss}</b> 根元素的端點
         不在任何匯入群組裡,接不起來 —— 通常是原模型的 <code>*GROUP</code> 沒有把那些節點收進去。</div>` : ""}
       <div class="fields g3" style="margin-top:9px">${fld("編號偏移", "renum", g.renum || 0)}</div>
       <div class="hint">節點與元素編號一律加上這個數。<b>位移複製一份匯入組</b>時複本的編號會跟原本
         撞在一起,給個偏移(例如 10000)就各自成立了。偏移不為 0 時元素不再原樣寫回原始資料列,
         改用一般路徑重建。</div>
       <div class="hint" style="margin-top:8px"><b>這一組沒有參數</b>,只有座標與清單,
         所以不能改半徑、不能重新分割。<b>編號原樣保留</b>,不吃「編號總表」的全域編號規則
         —— 它的用處就是對得回原模型。<br>
         能做的事:<b>被別的群組參照</b>(新構件的段起點/終點指到「這一組的第 k 個節點」,
         直接接到舊模型上)、整組<b>平移 / 旋轉 / 鏡射 / 位移複製 / 沿線陣列</b>、設顏色、停用、刪除。<br>
         匯出時元素會<b>原樣寫回原本的資料列</b>,所以纜索那類的 <code>iSUB</code> /
         <code>EXVAL</code> 欄位不會被重新猜過。</div>`);
  }
  else if (g.type === "OFFSET"){
    body = SEC("放置", "依附另一個群組", `<div class="fields g3">${
        fld("基準群組", "ref", g.ref, { select:[["","(未選)"], ...refOptions(g.id, "geo")] }) +
        fld(`橫向 d(右正,${UL()})`, "d", g.d) + fld(`垂直 h(上正,${UL()})`, "h", g.h)}</div>
      <div class="hint">節點沿基準群組的<b>法線投影</b>,一一對應。曲線上當地半徑 = <b>R − 偏向·d</b>;
        右轉曲線的圓心在右,所以<b>右側偏置是內側</b>。</div>`);
  }
  else if (g.type === "LINK2"){
    const pm = pairOf(g);
    const NA = chainCount(g.a, g.aSide), NB = chainCount(g.b, g.bSide);
    // 兩個來源群組各自可能有「取哪一側」的選擇;有得選時改排成兩欄,群組與側別上下對齊
    const aSideF = sideField(g.a, "aSide", g.aSide), bSideF = sideField(g.b, "bSide", g.bSide);
    const aF = fld("起始群組", "a", g.a, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)] });
    const bF = fld("目標群組", "b", g.b, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)] });
    const revF = fld("目標群組反序", "rev", !!g.rev, { check:true });
    const grpRow = (aSideF || bSideF)
      ? `<div class="fields g2">${aF + (aSideF || "<span></span>") + bF + (bSideF || "<span></span>")}</div>
         <div class="fields g3" style="margin-top:8px">${revF}</div>`
      : `<div class="fields g3">${aF + bF + revF}</div>`;
    const rangeRow = `<div class="fields g4" style="margin-top:8px">${
        fld("起始群組:起算節點", "from", idxShow(g.from, NA, 1), { idxMax:NA }) +
        fld("起始群組:到第幾個", "to", idxShow(g.to, NA, NA), { idxMax:NA }) +
        fld("每 n 個節點取一次", "every", g.every, { stepMax:NA }) +
        (pm === "skew" ? fld("錯開幾格", "skew", g.skew) : "")}</div>`;
    // 自訂連接方式的細節全部搬進小視窗,面板上只留一句摘要和入口
    const lkPicking = PICK && PICK.gid === g.id && PICK.mode === "link2";
    const freeRow = lkPicking
      ? `<div class="btns" style="margin-top:8px">
          <button class="btn d" data-op="mecancel">${PICK.i
            ? `已點 #${PICK.i},再點目標群組的節點(按此取消)`
            : "請點起始群組的一個節點(按此取消)"}</button></div>`
      : `<div class="btns" style="margin-top:8px">
          <button class="btn p" data-op="lkfree">編輯連接方式…</button></div>
        <div class="note" data-ro>${esc(patSummary(g))}</div>`;
    body = SEC("連接", st.count ? `${st.count} 根` : "逐節點", `${grpRow}
      ${pickNote(g, "a", "起始群組") + pickNote(g, "b", "目標群組")}
      <div class="lbl2">配對方式</div>
      <div class="pcards">${PAIR_MODES.map(([v,t,h]) =>
        `<button type="button" class="${v === pm ? "on" : ""}" data-op="pair" data-v="${v}">
           <span class="ic" style="color:${v === pm ? "currentColor" : colorOfGroup(g)}">${PAIR_ICON[v]}</span>
           <span class="pn">${esc(t)}</span>${h ? `<span class="ph">${esc(h)}</span>` : ""}</button>`).join("")}</div>
      ${pm === "free" ? freeRow : rangeRow}
      <div class="hint">${PAIR_HINT[pm] || ""}</div>`);
  }
  else if (g.type === "LINKZ"){
    const zm = (g.zMode === "plane" || g.zMode === "ref") ? g.zMode : "abs";
    const zRow = zm === "abs"
      ? `<div class="fields g4" style="margin-top:8px">${fld(`目標高程 Z (${UL()})`, "targetZ", g.targetZ)}</div>`
      : zm === "plane"
      ? xyzTable([{ label:"平面過點", kx:"px", vx:g.px, ky:"py", vy:g.py, kz:"pz", vz:g.pz }]) +
        `<div class="fields g4" style="margin-top:8px">${
          fld("沿 X 的坡度(每單位升高)", "sx", g.sx) +
          fld("沿 Y 的坡度(每單位升高)", "sy", g.sy)}</div>`
      : `<div class="fields g4" style="margin-top:8px">${
          fld("取高程的群組", "zRef", g.zRef, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)], span:2 }) +
          (sideField(g.zRef, "zRefSide", g.zRefSide) || "")}</div>
         ${pickNote(g, "zRef", "取高程的群組")}`;
    const zHint = { abs:"所有下端落在<b>同一個高程</b>。",
      plane:"下端落在一個<b>斜面</b>上:過指定點,沿 X / Y 各給一個坡度(0.02 = 2%)。坡地上的墩柱、傾斜橋面用這個。",
      ref:"下端的高程取自<b>另一個群組對應的那個節點</b>(第 1 個對第 1 個),X、Y 仍照來源節點 —— 也就是垂直落到另一條線的高度。" }[zm];
    const NR = chainCount(g.ref, g.refSide);
    const rSideF = sideField(g.ref, "refSide", g.refSide);
    body = SEC("連接", "垂直投影", `<div class="fields g4">${
        fld("來源群組", "ref", g.ref, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)], span:rSideF ? 1 : 2 }) +
        rSideF +
        fld("目標", "zMode", zm, { select:[["abs","固定高程"],["plane","斜面"],["ref","取自另一個群組"]], span:2 })}</div>
      ${pickNote(g, "ref", "來源群組")}
      ${zRow}
      <div class="fields g4" style="margin-top:8px">${
        fld("起算節點", "from", idxShow(g.from, NR, 1), { idxMax:NR }) +
        fld("到第幾個節點", "to", idxShow(g.to, NR, NR), { idxMax:NR }) +
        fld("每 n 個節點取一次", "every", g.every, { stepMax:NR }) +
        fld("下端節點", "bottom", g.bottom, { select:[["new","新增節點"],["snap","貼附既有節點"]] })}</div>
      ${g.bottom === "snap" ? `<div class="fields g4" style="margin-top:8px">${
        fld(`貼附容差 (${UL()})`, "snapTol", g.snapTol)}</div>` : ""}
      <div class="hint">${zHint}已低於目標高程的節點<b>自動略過</b>。
        來源群組有多段時(例如主索的直線引段),用<b>節點範圍</b>只掛在需要的那一段上。</div>`);
  }
  else if (g.type === "FAN"){
    const NT = chainCount(g.ref, g.refSide);
    const sm = ["node","gnode"].includes(g.srcMode) ? g.srcMode : "coord";
    body = SEC("起點", "", `<div class="fields g4">${
        fld("來源", "srcMode", sm, { select:[["coord","自訂座標"],
          ["gnode","某群組的第 k 個節點"],["node","既有節點編號(舊)"]], span:2 }) +
        (sm === "node" ? fld("節點編號", "srcNode", g.srcNode)
          : sm === "gnode" ? fld("群組", "srcG", g.srcG, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)] }) +
                             sideField(g.srcG, "srcGSide", g.srcGSide) +
                             fld("第幾個節點", "srcI", idxShow(g.srcI, chainCount(g.srcG, g.srcGSide), 1),
                                 { idxMax:chainCount(g.srcG, g.srcGSide) })
          : "")}</div>
      ${sm === "gnode" ? pickNote(g, "srcG", "起點群組") : ""}
      ${sm === "coord" ? xyzTable([{ label:"起點", kx:"sx", vx:g.sx, ky:"sy", vy:g.sy, kz:"sz", vz:g.sz }]) : ""}
      ${sm === "node" ? `<div class="hint">節點編號會隨上游重新分割而改變,建議改用<b>某群組的第 k 個節點</b>。</div>` : ""}`) +
      SEC("目標", st.count ? `${st.count} 根` : "", `<div class="fields g4">${
        fld("目標群組", "ref", g.ref, { select:[["","(未選)"], PICK_OPT, ...refOptions(g.id)] }) +
        sideField(g.ref, "refSide", g.refSide) +
        fld("起算節點", "from", idxShow(g.from, NT, 1), { idxMax:NT }) +
        fld("到第幾個節點", "to", idxShow(g.to, NT, NT), { idxMax:NT }) +
        fld("每 n 個節點取一次", "every", g.every, { stepMax:NT })}</div>
      ${pickNote(g, "ref", "目標群組")}
      <div class="fields g4" style="margin-top:8px">${
        fld("每根分割 N", "div", g.div) +
        fld("垂度定義", "fMode", g.fMode, { select:[["abs",`絕對值 (${UL()})`],["ratio","垂跨比"]], disabled:(num(g.div)||1) <= 1 }) +
        fld("垂度 f", "f", g.f, { disabled:(num(g.div)||1) <= 1 })}</div>
      <div class="hint">目標用<b>「第幾個節點」</b>而不是節點編號。<b>N = 1</b> 適合斜張索;
        <b>N &gt; 1</b> 必須給垂度,否則共線節點在幾何非線性分析中橫向勁度為零。</div>`);
  }

  const rows = [];
  if (r && !r.stat.err){
    rows.push(["節點", st.n], ["元素", st.e]);
    if (r.weldAway && r.weldAway.length){
      const other = r.weldAway.filter(w => w.other).length;
      rows.push(["重合已合併",
        `<span style="color:var(--warn)">${r.weldAway.length} 個${other ? `(${other} 個接到別的群組)` : ""}</span>`]);
    }
    if (st.e){
      rows.push(["元素長", `${st.minL.toFixed(3)} – ${st.maxL.toFixed(3)} ${UL()}`]);
      rows.push(["3D 總長", st.len3d.toFixed(4) + " " + UL()]);
      if (TYPES[g.type].fam === "geo") rows.push(["最大弦線偏差", devTxt(st.maxDev)]);
    }
    if (g.type === "OFFSET") rows.push(["基準群組", esc(st.ref || "")]);
  } else if (r && r.stat.err) rows.push(["狀態", `<span style="color:var(--err)">${esc(r.stat.err)}</span>`]);

  return head + nameSec + body + nodeSec(g, r) + elemPickSec(g, r) +
    SEC("結果", "", OUT(rows));
}

/* ---- 目標模型佔用表(SPEC §16.3)----
   midas 匯入 MCT 遇到已存在的編號是直接覆蓋、不報錯,所以「新構件要編到幾號才安全」
   必須看得到。這裡只顯示號碼範圍與群組名,不碰目標模型的幾何。 */
const tgtRange = str => {
  const a = expandList(str);
  if (!a.length) return "—";
  const lo = Math.min(...a), hi = Math.max(...a);
  return (lo === hi ? String(lo) : lo + "–" + hi) + `(${a.length} 個)`;
};
// 安全號段:推到目標模型已用最大號之上,再向上取整到號段增量的倍數,留一段緩衝不緊貼
function safeBase(){
  const t = state.target;
  if (!t) return null;
  const all = expandList(t.nodes).concat(expandList(t.elems));
  if (!all.length) return null;
  const inc = Math.max(1, Math.round(num(state.numbering.inc)) || 1000);
  return (Math.floor(Math.max(...all) / inc) + 1) * inc + 1;
}
function tgtSection(){
  const t = state.target;
  if (!t) return SEC("目標模型", `<span style="color:var(--ink-3)">未設定</span>`,
    `<div class="hint">要把這份幾何<b>加進一個既有的 midas 模型</b>時,先把那個模型的 .mct
       從「匯入」讀進來 —— 工具會記下它已經用掉哪些節點 / 元素編號,
       匯出前就會警告「這幾號匯進去會蓋掉原本的東西」。<br>
       <b>只記號碼,不讀幾何</b>,也不會動到目前的模型。</div>`);
  const sb = safeBase();
  const bad = MODEL.tclash || 0;
  return SEC("目標模型", bad ? `<span style="color:var(--err)">${bad} 個編號會被覆蓋</span>` : "無衝突 ✓",
    `<div data-ro><table class="t"><tbody>
       <tr><th style="width:96px">來源</th><td>${esc(t.src || "—")}${t.at ? ` <span style="color:var(--ink-3)">· ${esc(t.at)}</span>` : ""}</td></tr>
       <tr><th>已用節點</th><td>${tgtRange(t.nodes)}</td></tr>
       <tr><th>已用元素</th><td>${tgtRange(t.elems)}</td></tr>
       <tr><th>已用群組</th><td>${(t.names || []).length} 個</td></tr>
     </tbody></table></div>
     <div class="btns" style="margin-top:8px">
       ${sb ? `<button class="btn" data-op="tgtsafe">跳到安全號段(${sb})</button>` : ""}
       <button class="btn d" data-op="tgtclr">清除目標模型</button></div>
     <div class="hint">「跳到安全號段」把節點與元素起始號一起推到目標模型已用最大號之上,
       並向上取整到號段增量的倍數 —— 留一段緩衝,不緊貼著最後一號。</div>`);
}

function paneNumbering(){
  const rows = MODEL.groups.map(r => `<tr>
    <td class="n">${esc(r.g.name)}</td><td class="n">${TYPES[r.g.type].name}</td>
    <td>${numRange(r.nodes)}</td>
    <td>${numRange(r.elems)}</td>
    <td>${r.nodes.length} / ${r.elems.length}</td>
    <td class="n">${esc(r.gname)}</td></tr>`).join("");
  return `<div class="ptitle"><span class="nm">編號總表</span><span class="fam geo">全域</span></div>` +
    SEC("配置", MODEL.clash ? `<span style="color:var(--err)">${MODEL.clash} 個群組編號衝突</span>` : "無衝突 ✓",
      `<div class="fields g4">${
        fld("節點起始", "numbering.nodeBase", state.numbering.nodeBase) +
        fld("元素起始", "numbering.elemBase", state.numbering.elemBase) +
        fld("號段增量", "numbering.inc", state.numbering.inc) +
        fld("匯出群組名前綴", "groupPrefix", state.groupPrefix, { text:true })}</div>`) +
    tgtSection() +
    SEC("合併重合節點", state.weld.on !== false ? "開啟" : `<span style="color:var(--warn)">關閉</span>`,
      `<div class="btns" style="margin-bottom:10px">
        <button class="tgl${state.weld.on !== false ? " on" : ""}" data-op="weldtog">
          <span class="dot"></span>合併座標重合的節點</button></div>
       <div class="fields g3">${
        fld(`距離多近算同一點 (${UL()})`, "weld.tol", state.weld.tol,
          { disabled:state.weld.on === false })}</div>
       <div class="note">兩個節點的距離<b>小於等於</b>這個值就併成一個。
         <b>0 = 座標要完全一樣才併</b>(最保守);以公尺為單位時填 <b>0.001</b> 就是「相距 1 mm 以內算同一點」。</div>
       <div class="hint">同一個位置<b>只留節點編號最小的那一個</b>,其餘刪掉,元素端點改指到它
         —— 等同 midas 的 <b>Merge Nodes</b>。段互相參照、連接族接到既有節點時最容易產生重合節點,
         不併的話在 midas 裡看起來相連、其實是兩個獨立的節點。<br>
         合併後<b>節點編號會跳號</b>(這是正常的),兩端併成同一點的元素會退化成零長度,一併刪除並回報。</div>`) +
    SEC("各群組", `${MODEL.groups.length} 群組 · 節點 ${MODEL.tot.n} · 元素 ${MODEL.tot.e}`,

/* ---------- 展開狀態(details)在整塊重畫後保留 ----------
   #pane 幾乎每次 change/click 都會整塊 innerHTML 重寫,原生 <details> 的 open 屬性因此會被
   重設回 HTML 字串裡寫的樣子。這裡在重寫前後對照 DOM,把使用者手動展開的卡片(段卡片本身、
   段內的「分割與元素覆寫」「平移與旋轉」)照樣復原,除非明確用 FORCE_OPEN 指定要強制展開/收合
   (例如新增段時只展開新段、拖曳排序後展開放下的那一段)。*/
let FORCE_OPEN = null;
const detailsKey = d => d.dataset.dk || (d.dataset.pi !== undefined ? "pc:" + d.dataset.pi : null);
const captureOpen = root => new Set([...root.querySelectorAll("details[open]")].map(detailsKey).filter(Boolean));
const restoreOpen = (root, keys) => root.querySelectorAll("details").forEach(d => {
  const k = detailsKey(d); if (k && keys.has(k)) d.open = true;
});

/* ---- 提示收合 ----
   提示原本一路攤在面板上,佔掉大半版面。改成每個區塊(或每張段卡)只留一顆 i:
   預設收起,點了才展開。開合狀態記在 HINT_OPEN,重繪之後還原,免得打一個字就收回去。 */
const HINT_OPEN = new Set();
function foldHints(root, keyBase){
  if (!root) return;
  const claimed = new Set();
  const attach = (box, head, key) => {
    if (!head) return;
    const hints = [...box.querySelectorAll(".hint")]
      .filter(h => !claimed.has(h) && !h.classList.contains("keep") && h.textContent.trim());
    if (!hints.length) return;
    hints.forEach(h => claimed.add(h));
    const k = keyBase + "|" + key;
    // 內容只有提示的區塊,收起來時連 .b 一起藏掉,不然會留一塊莫名其妙的白
    const bodyEl = box.classList && box.classList.contains("sec") ? box.querySelector(":scope > .b") : null;
    const onlyHints = bodyEl && ![...bodyEl.children].some(c => !c.classList.contains("hint"));
    const set = on => {
      btn.classList.toggle("on", on);
      hints.forEach(h => { h.hidden = !on; });
      if (onlyHints) bodyEl.hidden = !on;
    };
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "ibtn"; btn.textContent = "i";
    btn.title = "說明";
    btn.addEventListener("click", ev => {
      ev.preventDefault(); ev.stopPropagation();
      const on = !HINT_OPEN.has(k);
      if (on) HINT_OPEN.add(k); else HINT_OPEN.delete(k);
      set(on);
    });
    head.appendChild(btn);
    set(HINT_OPEN.has(k));
  };
  const nameOf = (el, i) => (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 20) + "#" + i;
  [...root.querySelectorAll("details.pc")].forEach((el, i) => {
    const sm = el.querySelector("summary");
    attach(el, sm, "pc" + i + ":" + (sm ? nameOf(sm, i) : i));
  });
  [...root.querySelectorAll(".sec")].forEach((el, i) => {
    const h = el.querySelector(".h");
    attach(el, h, "sec" + (h ? nameOf(h, i) : i));
  });
  // 不在任何區塊裡的提示(對話框那種):配一顆 i。
  // 連續相鄰的幾段提示算同一處,合成一顆 i —— 兩顆 i 並排在一起沒有任何意義。
  const free = [...root.querySelectorAll(".hint")]
    .filter(h => !claimed.has(h) && !h.classList.contains("keep") && h.textContent.trim());
  const runs = [];
  free.forEach(h => {
    const last = runs[runs.length - 1], prev = last && last[last.length - 1];
    if (prev && prev.parentNode === h.parentNode && prev.nextElementSibling === h) last.push(h);
    else runs.push([h]);
  });
  runs.forEach((run, i) => {
    const head = run[0];
    const wrap = document.createElement("div");
    wrap.className = "hintbar";
    head.parentNode.insertBefore(wrap, head);
    run.forEach(h => wrap.appendChild(h));
    attach(wrap, wrap, "free" + i);
    wrap.insertBefore(wrap.lastElementChild, head);
  });
}

function renderPane(){
  const el = $("#pane");
  // 沒選任何群組 → 收起整個編輯區,把空間讓給畫布(全域頁面 _num / _out / _imp 不算)
  const app = $("#app"); if (app) app.classList.toggle("nosel", !SEL);
  /* 整塊 innerHTML 重寫時捲動位置會跑掉:新內容一貼上去,所有 <details> 都是 HTML 裡寫的
     「收合」狀態 → 內容瞬間變矮 → 瀏覽器把 scrollTop 夾到新的上限;等 restoreOpen() 再把卡片
     展開回來,scrollTop 已經被夾小了,畫面就往上跳一截。所以要自己存回去。 */
  const st0 = el.scrollTop;
  const keepScroll = () => { if (el.scrollTop !== st0) el.scrollTop = st0; };
  if (SEL === "_num"){ el.innerHTML = paneNumbering(); foldHints(el, "_num"); keepScroll(); return; }
  if (SEL === "_out"){ el.innerHTML = paneOutput(); renderMctPrev(); foldHints(el, "_out"); keepScroll(); return; }
  if (SEL === "_imp"){ el.innerHTML = paneImport(); foldHints(el, "_imp"); keepScroll(); return; }
  if (SELSET.size > 1){ el.innerHTML = paneMulti(); foldHints(el, "_multi"); keepScroll(); return; }
  const g = state.groups.find(x => x.id === SEL);
  if (!g){
    // 這一頁通常是看不到的(沒選群組時整個編輯區會收起來),留一份給極窄版面用
    el.innerHTML = `<div class="ptitle"><span class="nm">線形建模器</span></div>` +
      SEC("目前沒有選取任何群組", "", `<div class="hint keep" style="margin:0;font-size:12.5px;line-height:1.7">
        圖面上<b>每個群組都顯示自己的顏色</b>。點左邊的清單、或直接在圖上點任一根線,就會切到那個群組。
        要點到<b>單一節點 / 元素</b>(改座標、看單根資訊)請先打開視圖工具列上的<b>「選取」</b>。</div>`);
    return;
  }
  const openKeys = FORCE_OPEN || captureOpen(el);
  const forced = !!FORCE_OPEN;
  FORCE_OPEN = null;
  el.innerHTML = paneFor(g);
  foldHints(el, g.type);          // key 用型別而不是 id:換到同型別的群組時,展開的提示會留著
  restoreOpen(el, openKeys);
  if (!forced) keepScroll();      // 明確要展開某張卡片時就讓它自己捲過去,不要硬拉回原位
}

/* ==========================================================================
   8c. UI — 事件
   ========================================================================== */
function setPath(root, key, v){
  const ps = key.split(".");
  let o = root;
  for (let i = 0; i < ps.length - 1; i++){
    const k = /^\d+$/.test(ps[i]) ? +ps[i] : ps[i];
    if (o[k] == null) o[k] = /^\d+$/.test(ps[i+1]) ? [] : {};
    o = o[k];
  }
  const last = /^\d+$/.test(ps[ps.length-1]) ? +ps[ps.length-1] : ps[ps.length-1];
  o[last] = v;
}
function getPath(root, key){
  return key.split(".").reduce((o, k) => (o == null ? o : o[/^\d+$/.test(k) ? +k : k]), root);
}
function assignFromEl(root, key, el){
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (el.tagName === "SELECT"){
    v = el.value;
    if (key === "major") v = v === "1";
    else if (/(^|\.)dir$/.test(key)) v = Number(v);
    else if (/(^|\.)cable\.(sub|kind)$/.test(key)) v = Number(v);
    else if (/(^|\.)(mat|sect)$/.test(key)) v = Number(v);   // 有名稱庫時這兩個是下拉
  }
  else if (el.type === "number") v = el.value === "" ? NaN : Number(el.value);
  else if (/(^|\.)sta$/.test(key)) v = parseSta(el.value);
  else v = el.value;
  setPath(root, key, v);
}

/* ---------- 復原 / 重做 ---------- */
const HIST = { past:[], future:[], key:"", t:0 };
function snapshot(key){
  const now = Date.now();
  // 同一個欄位連續輸入視為一次操作(700 ms 內)
  if (key && key === HIST.key && now - HIST.t < 700){ HIST.t = now; return; }
  HIST.past.push(JSON.stringify(state));
  if (HIST.past.length > 80) HIST.past.shift();
  HIST.future.length = 0;
  HIST.key = key || ""; HIST.t = now;
  syncHistBtns();
}
function applySnap(json){
  state = normState(JSON.parse(json));
  camFromState();
  if (SEL && SEL[0] !== "_" && !state.groups.some(g => g.id === SEL))
    SEL = state.groups.length ? state.groups[0].id : null;
  SELSET = new Set([...SELSET].filter(id => state.groups.some(g => g.id === id)));
  if (SEL && SEL[0] !== "_" && !state.groups.some(g => g.id === SEL)) SEL = [...SELSET][0] || null;
  if (SEL && SEL[0] !== "_" && !SELSET.has(SEL)) SELSET.add(SEL);
  if (SELNODE && !state.groups.some(g => g.id === SELNODE.gid)) SELNODE = null;
  if (SELELEM && !state.groups.some(g => g.id === SELELEM.gid)) SELELEM = null;
  HIST.key = ""; HIST.t = 0;
  recompute(true); syncHistBtns();
}
function undo(){ if (!HIST.past.length) return;
  HIST.future.push(JSON.stringify(state)); applySnap(HIST.past.pop()); }
function redo(){ if (!HIST.future.length) return;
  HIST.past.push(JSON.stringify(state)); applySnap(HIST.future.pop()); }
function syncHistBtns(){
  const u = $("#btn-undo"), r = $("#btn-redo");
  if (u){ u.disabled = !HIST.past.length; u.title = `復原(Ctrl+Z)  ${HIST.past.length} 步`; }
  if (r){ r.disabled = !HIST.future.length; r.title = `重做(Ctrl+Y)  ${HIST.future.length} 步`; }
}
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); }
});

/* ---------- 欄位寫入 ---------- */
// 節點座標覆寫 / 刪除是靠「原始節點索引 ri」定位的,只有自己算出整串原始節點的曲線組有 ri;
// 其他組(連接族、偏置)的節點是別組推導來的,選得到、看得到,但不能就地改座標。
const nodeEditable = (g, sn) => !!g && g.type === "CURVE" && !!sn && Number.isFinite(sn.ri);

function applyField(root, k, el){
  // 群組下拉選到「▸ 在畫布上點選…」:不寫進 state,改成進入點選模式,
  // 下一次在 3D 視圖點到的節點屬於哪個群組,這個欄位就填哪個群組。
  if (el.tagName === "SELECT" && el.value === PICK_OPT[0]){
    el.value = String(getPath(root, k) == null ? "" : getPath(root, k));
    PICK = { gid:root.id, i:0, mode:"group", key:k };
    SELNODE = null; SELELEM = null;
    return;
  }
  if (k[0] === "@"){                                   // 選取節點的座標覆寫
    if (!SELNODE || SELNODE.gid !== root.id) return;
    if (!nodeEditable(root, SELNODE)) return;
    const r0 = MODEL.byId.get(root.id);
    const nd = r0 && r0.nodes.find(n => n.num === SELNODE.num);
    if (!nd) return;
    root.edits = root.edits || {};
    const cur = root.edits[SELNODE.ri] || { x:nd.x, y:nd.y, z:nd.z };
    cur[k.slice(1)] = el.value === "" ? NaN : Number(el.value);
    root.edits[SELNODE.ri] = cur;
    return;
  }
  // 切到「三點圓弧」時,把通過點帶成目前這段圓弧的中點 —— 不然預設值會離這段十萬八千里
  const ma = k.match(/^pieces\.(\d+)\.arcMode$/);
  if (ma && el.value === "three"){
    const pi = +ma[1];
    const r0 = MODEL.byId.get(root.id);
    const cv = r0 && r0.pieces && (r0.pieces.find(x => x.pi === pi) || {}).curve;
    if (cv){
      const q = cv.pt(0.5), pc0 = (root.pieces || [])[pi];
      if (pc0 && q && Number.isFinite(q.x)){
        pc0.mx = +q.x.toFixed(6); pc0.my = +q.y.toFixed(6); pc0.mz = +q.z.toFixed(6);
      }
    }
  }
  // 段的參照拆成兩個下拉:先選段(…RefG),再選那一段的哪一點(…RefA)。
  // 存進 state 的仍然是單一個字串 "<段索引>:<s|m|e>",這裡只負責把兩半拼回去。
  const mr = k.match(/^(pieces\.\d+\.)(sRef|eRef)(G|A|I)$/);
  if (mr){
    const base = mr[1] + mr[2];
    const raw = String(getPath(root, base) || "");
    const cur = parseRef(raw), gcur = parseGRef(raw);
    if (mr[3] === "I"){                                // 跨群組:改「第幾個節點」
      if (gcur) setPath(root, base, "@" + gcur.gid + ":" + Math.max(1, Math.round(num(el.value)) || 1));
      return;
    }
    if (mr[3] === "G"){
      const v = el.value;                              // "" | "prev" | "<段索引>" | "@<群組 id>"
      setPath(root, base, (v === "" || v === "prev") ? v
        : v[0] === "@" ? v + ":" + (gcur ? gcur.idx : 1)
        : v + ":" + (cur ? cur.at : "s"));
    } else if (cur){
      setPath(root, base, cur.pi + ":" + el.value);    // 只換 起點/中點/終點
    }
    return;
  }
  assignFromEl(root, k, el);
  if (k.indexOf("view.") === 0){ camFromState(); view.locked = false; }   // 換視角 → 重新框選
  // 切換段型別 → 補上新型別缺少的預設參數(保留起點、分割、元素覆寫)
  const mt = k.match(/^pieces\.(\d+)\.type$/);
  if (mt && root.pieces){
    const i = +mt[1], old = root.pieces[i];
    const keep = { sRef:old.sRef, eRef:old.eRef, split:old.split, ovr:old.ovr,
                   etype:old.etype, mat:old.mat, sect:old.sect,
                   x1:old.x1, y1:old.y1, z1:old.z1, _i:old._i };
    root.pieces[i] = { ...defaultPiece(old.type), ...keep, type:old.type };
  }
}
const rootOf = () => (SEL === "_num" || SEL === "_out") ? state : state.groups.find(g => g.id === SEL);

/* 節點 / 元素的平移旋轉:一次算完寫成座標覆寫(edits),這樣拓樸與編號完全不受影響 */
function applyXfToNodes(g, ris){
  const r = MODEL.byId.get(g.id);
  if (!r || !ris.length) return;
  const nds = ris.map(ri => r.nodes.find(n => n.ri === ri)).filter(Boolean);
  if (!nds.length) return;
  const f = xfMake(XFT, nds);
  if (!f){ alert("平移量與旋轉角都是 0,沒有東西可以套用。"); return; }
  g.edits = g.edits || {};
  nds.forEach(n => {
    const q = f(n);
    g.edits[n.ri] = { x:+q.x.toFixed(9), y:+q.y.toFixed(9), z:+q.z.toFixed(9) };
  });
  recompute(true);
}

/* 打字時「只更新唯讀顯示」,絕不重建輸入框 —— 重建會讓 <input type=number> 的游標跳到最前面 */
function syncRO(){
  const g = state.groups.find(x => x.id === SEL);
  const html = (SEL === "_num") ? paneNumbering() : (SEL === "_out") ? paneOutput() : (g ? paneFor(g) : null);
  if (html == null) return;

  const b = [...tmp.querySelectorAll("[data-ro]")];
  if (a.length !== b.length){ renderPane(); return; }   // 結構變了才整塊重畫
  a.forEach((x, i) => { if (x.innerHTML !== b[i].innerHTML) x.innerHTML = b[i].innerHTML; });
  const mp = $("#mctprev"); if (mp) renderMctPrev();
}

  const root = rootOf(); if (!root) return;
  snapshot("f:" + SEL + ":" + k);
  applyField(root, k, el);

  MODEL = buildModel(state, ERRS, WARNS);
