});
/* 序號 / 步進欄位:離開欄位時把值收斂回合法範圍,並寫回輸入框 —— 畫面上不會再留著
   一個做不到的數字(例如只有 6 個節點卻寫著「到第 99 個」或「第 −3 個」)。 */
function normIndexEl(el){
  if (!el || el.type !== "number") return false;
  const hasI = el.dataset.idx !== undefined, hasS = el.dataset.step !== undefined;
  if (!hasI && !hasS) return false;
  if (el.value === "") return false;
  const max = +(hasI ? el.dataset.idx : el.dataset.step);
  const v0 = num(el.value);
  const n0 = Math.round(Number.isFinite(v0) ? v0 : 1) || 1;
  const v = hasI ? wrapIndex(v0, max)
                 : (max >= 1 ? clamp(n0, 1, max) : Math.max(1, n0));
  if (String(v) === String(el.value)) return false;
  el.value = v; return true;
}
$("#pane").addEventListener("change", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  normIndexEl(el);
  if (k[0] === "$"){ assignFromEl(XFT, k.slice(1), el);
    if (el.tagName === "SELECT") renderPane(); return; }
  const root = rootOf(); if (!root) return;
  const isSel = el.tagName === "SELECT" || el.type === "checkbox";
  if (isSel) snapshot("c:" + SEL + ":" + k + ":" + Date.now());
  applyField(root, k, el);
  recompute(true);                                      // 離開欄位或改下拉時才整塊重畫
});

$("#pane").addEventListener("click", e => {
  const b = e.target.closest("[data-op]"); if (!b) return;
  const op = b.dataset.op;
  if (!["mct","mctcopy","csvn","csve","json","load","nclr","eclr"].includes(op)) snapshot("op:" + op + ":" + Date.now());
  const gi = state.groups.findIndex(g => g.id === SEL);
  const g = state.groups[gi];
  if (op === "demo"){ loadState(demoState()); return; }
  if (op === "mct")     { download(`model_${stamp()}.mct`, mctText(), "text/plain;charset=utf-8"); return; }
  if (op === "mctcopy") { copyText(mctText(), b); return; }
  if (op === "csvn")    { download(`nodes_${stamp()}.csv`, nodeCSV(), "text/csv;charset=utf-8"); return; }
  if (op === "csve")    { download(`elements_${stamp()}.csv`, elemCSV(), "text/csv;charset=utf-8"); return; }
  if (op === "json")    { download(`model_${stamp()}.json`, paramsJSON(), "application/json;charset=utf-8"); return; }
  if (op === "load")    { $("#file-in").click(); return; }
  if (op === "pastein") { openPasteDlg(); return; }
  if (op === "clearlib"){ snapshot("clearlib:" + Date.now()); state.lib = { mat:{}, sect:{} };
    recompute(true); return; }
  // 全域操作:在「編號總表」頁按的,沒有選到組,要放在下面 `if (!g) return` 之前
  if (op === "weldtog"){ state.weld.on = (state.weld.on === false); recompute(true); return; }
  if (op === "tgtsafe"){
    const sb = safeBase();
    if (!sb){ alert("目標模型裡沒有可用的編號。"); return; }
    state.numbering.nodeBase = sb; state.numbering.elemBase = sb;
    recompute(true); return;
  }
  if (op === "tgtclr"){ state.target = null; recompute(true); return; }
  // ---- 多選的批次動作 ----
  if (op === "mclr"){ selOnly(SEL); render(); return; }
  if (op === "mon" || op === "moff"){
    snapshot(op + ":" + Date.now());
    selGroups().forEach(x => { x.on = (op === "mon"); });
    recompute(true); return;
  }
  if (op === "mdel"){
    const gs = selGroups();
    if (!confirm(`刪除這 ${gs.length} 個群組?`)) return;
    snapshot("mdel:" + Date.now());
    const first = state.groups.indexOf(gs[0]);
    state.groups = state.groups.filter(x => !SELSET.has(x.id));
    SELSET = new Set();
    SEL = state.groups.length ? state.groups[clamp(first - 1, 0, state.groups.length - 1)].id : null;
    if (SEL) SELSET.add(SEL);
    recompute(true); return;
  }
  if (op === "moffdup"){ openOffsetDlg(selGroups()); return; }
  if (op === "xfdlg" && g){ openXfDlg(g); return; }
  if (!g) return;
  if (op === "del"){ state.groups.splice(gi, 1); SEL = state.groups.length ? state.groups[Math.max(0, gi-1)].id : null; }
  if (op === "colauto" && g){ delete g.color; recompute(true); return; }
  if (op === "ontog" && g){ g.on = (g.on === false); recompute(true); return; }
  if (op === "pair" && g){
    g.pair = b.dataset.v; recompute(true);
    // 選「自訂」等同於「我要自己決定怎麼連」—— 直接把連接方式的小視窗開起來
    if (g.pair === "free") openLinkFreeDlg(g);
    return;
  }
  if (op === "lkfree" && g){ openLinkFreeDlg(g); return; }
  if (op === "offdup"){ openOffsetDlg(g); return; }
  if (op === "arrdlg" && g){ openArrayDlg(g); return; }
  if (op === "ndel" && g && SELNODE && SELNODE.gid === g.id && nodeEditable(g, SELNODE)){
    g.dels = g.dels || []; if (!g.dels.includes(SELNODE.ri)) g.dels.push(SELNODE.ri);
    if (g.edits) delete g.edits[SELNODE.ri];
    SELNODE = null; recompute(true); return; }
  if (op === "nrst" && g && SELNODE && g.edits && nodeEditable(g, SELNODE)){
    delete g.edits[SELNODE.ri]; recompute(true); return; }
  if (op === "nclr"){ SELNODE = null; recompute(true); return; }
  // ---- 舊檔留下來的手動節點 / 元素:只留刪除,新增一律改用「線」群組的 節點 / 直線 段 ----
  if (op === "mndel" && g){
    const i = +b.dataset.i;
    const r0 = MODEL.byId.get(g.id);
    const gone = r0 && r0.nodes.find(n => n.manual && n.mi === i);
    g.addN.splice(i, 1);
    // 用到這個節點的手動元素會變成懸空,一併清掉(其餘元素的編號不受影響)
    if (gone && Array.isArray(g.addE))
      g.addE = g.addE.filter(q => q.i !== gone.num && q.j !== gone.num);
    if (SELNODE && SELNODE.gid === g.id) SELNODE = null;
    recompute(true); return;
  }
  if (op === "lkpick" && g){ PICK = { gid:g.id, i:0, mode:"link2" }; SELNODE = null; SELELEM = null; recompute(true); return; }
  if (op === "refpick" && g){ PICK = { gid:g.id, i:0, mode:"ref", key:b.dataset.k };
    SELNODE = null; SELELEM = null; recompute(true); return; }
  if (op === "mecancel"){ PICK = null; recompute(true); return; }
  if (op === "medel" && g){ g.addE.splice(+b.dataset.i, 1); recompute(true); return; }
  if (op === "nclrall" && g){ g.edits = {}; g.dels = []; SELNODE = null; recompute(true); return; }
  if (op === "xfrst"){ g.xf = XF_DEF(); recompute(true); return; }
  if (op === "extclr" && g){
    const pc0 = (g.pieces || [])[+b.dataset.p];
    if (pc0){ pc0.extS = 0; pc0.extE = 0; }
    recompute(true); return;
  }
  if (op === "sagz" && g){
    const pc0 = (g.pieces || [])[+b.dataset.p];
    const rr = SELNODE && MODEL.byId.get(SELNODE.gid);
    const nd = rr && rr.nodes.find(n => n.num === SELNODE.num);
    if (pc0 && nd){ pc0.fBase = "z"; pc0.fz = +nd.z.toFixed(6); }
    recompute(true); return;
  }
  if (op === "pxfrst"){ const p0 = (g.pieces || [])[+b.dataset.p]; if (p0) p0.xf = XF_DEF(); recompute(true); return; }
  if (op === "eclr"){ SELELEM = null; recompute(true); return; }
  if (op === "xfnode"){
    if (SELNODE && SELNODE.gid === g.id && nodeEditable(g, SELNODE)) applyXfToNodes(g, [SELNODE.ri]);
    return;
  }
  if (op === "xfelem"){
    const r0 = MODEL.byId.get(g.id);
    const e0 = (r0 && SELELEM && SELELEM.gid === g.id) ? r0.elems.find(x => x.num === SELELEM.num) : null;
    if (e0 && Number.isFinite(e0.a.ri) && Number.isFinite(e0.b.ri)) applyXfToNodes(g, [e0.a.ri, e0.b.ri]);
    return;
  }
  const pcOf = () => (g.pieces || [])[+b.dataset.p];
  if (op === "addpc"){
    g.pieces = g.pieces || [];
    const pc = defaultPiece(b.dataset.t);
    g.pieces.push(pc); fixFirstPiece(g);
    FORCE_OPEN = new Set(["pc:" + (g.pieces.length - 1)]);
  }
  if (op === "pdel"){ g.pieces.splice(+b.dataset.p, 1); fixFirstPiece(g); FORCE_OPEN = new Set(); }
  const pc = pcOf();
  if (op === "addseg" && pc){ pc.segments = pc.segments || [];
    const t = b.dataset.t;
    pc.segments.push(t === "LINE" ? { type:"LINE", L:50 }
      : t === "ARC" ? { type:"ARC", R:100, dir:1, defBy:"delta", delta:45 }
      : { type:"SPIRAL", R0inf:true, R1inf:false, R1:100, dir:1, defBy:"Ls", Ls:50 }); }
  if (op === "delseg" && pc) pc.segments.splice(+b.dataset.i, 1);
  if (op === "addvpi" && pc){
    pc.profile = pc.profile || [];
    if (pc.profile.length < 2){
      const r = MODEL.byId.get(g.id);
      const info = r && r.pieces.find(x => x.pi === pc._i);
      const s0 = num(pc.sta) || 0, s1 = s0 + (info && info.chain ? info.chain.total : 100);
      const z0 = (info && info.chain) ? info.chain.z0 : (num(pc.z1) || 0);
      pc.profile = [{ sta:s0, z:z0, L:0 }, { sta:s1, z:z0, L:0 }];
    } else {
      const P = pc.profile, a = P[P.length-2], b2 = P[P.length-1];
      P.splice(P.length-1, 0, { sta:(a.sta + b2.sta)/2, z:(a.z + b2.z)/2, L:0 });
    }
  }
  if (op === "delvpi" && pc){ pc.profile.splice(+b.dataset.i, 1); if (pc.profile.length < 2) pc.profile = []; }
  if (op === "clearvpi" && pc) pc.profile = [];
  recompute(true);
});

function syncUnitUI(){
  const a = $("#u-len"), b = $("#u-force");
  if (a && a.value !== state.units.length) a.value = state.units.length;
  if (b && b.value !== state.units.force) b.value = state.units.force;
}
function changeLenUnit(nu){
  const old = state.units.length;
  if (!LEN_FACTOR[nu] || nu === old){ syncUnitUI(); return; }
  const k = LEN_FACTOR[nu]/LEN_FACTOR[old];
  let scale = false;
  if ((state.groups || []).length)
    scale = confirm(`長度單位 ${old} → ${nu}\n\n` +
      `要把現有的長度數值一起換算(×${+k.toPrecision(10)})嗎?\n\n` +
      `【確定】幾何大小不變,只是改用新單位表示\n` +
      `【取消】數值原封不動,直接當成新單位讀(等於重新定義尺寸)`);
  snapshot("unit:" + Date.now());
  state.units.length = nu;
  if (scale) scaleModel(state, k);
  view.locked = false;
  recompute(true);
}
(function initUnitUI(){
  const fill = (el, opts) => { el.innerHTML =
    opts.map(([v,t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join(""); };
  fill($("#u-len"), UNIT_LENGTH); fill($("#u-force"), UNIT_FORCE);
  $("#u-len").addEventListener("change", e => changeLenUnit(e.target.value));
  $("#u-force").addEventListener("change", e => {
    snapshot("unitF:" + Date.now()); state.units.force = e.target.value; recompute(true); });
  syncUnitUI();
})();

const stamp = () => localStampFile();
async function copyText(txt, btn){
  try { await navigator.clipboard.writeText(txt); }
  catch (e){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2){}
    ta.remove();
  }
  if (btn){ const o = btn.textContent; btn.textContent = "已複製 ✓"; setTimeout(() => { btn.textContent = o; }, 1400); }

/* ---------- 掃描 midas 匯出的 .mct ----------
   一趟掃完,三個功能共用同一段程式碼:
     *MATERIAL / *SECTION 的編號與名稱 → 名稱庫(v3.8)
     *NODE / *ELEMENT 的編號           → 目標模型佔用表,匯出前檢查會不會覆蓋(SPEC §16.3)
     *NODE / *ELEMENT / *GROUP 的內容  → 反向匯入成「匯入」群組(SPEC §16.4)
   欄位定義見 SPEC §9.1.3(官方 MCT File Quick Reference):
     *MATERIAL  iMAT, TYPE, MNAME, ...          → 第 1 欄編號、第 3 欄名稱
     *SECTION   iSEC, TYPE, SNAME, ...          → 同上
     *NODE      iNO, X, Y, Z
     *ELEMENT   iEL, TYPE, iMAT, iPRO, iN1, iN2, ...
     *GROUP     NAME, NODE_LIST, ELEM_LIST[, PLANE_TYPE]
   MCT 的長資料列用「行末反斜線」續行(*GROUP 的清單很容易長到要換行),先接回來再拆欄位。 */

// midas 的編號清單語法:"1001to1011"、"1001to1051by2"、單獨的號碼,以空白或逗號分隔
function expandList(str){
  const out = [];
  String(str == null ? "" : str).split(/[\s,]+/).forEach(t => {
    if (!t) return;
    const m = t.match(/^(\d+)to(\d+)(?:by(\d+))?$/i);
    if (m){
      const a = +m[1], b = +m[2], by = Math.max(1, Math.round(+(m[3] || 1)) || 1);
      if (b - a > 1e6) return;                         // 防呆:壞掉的清單不要吃光記憶體
      for (let v = a; v <= b; v += by) out.push(v);
      return;
    }
    const v = Math.round(Number(t));
    if (Number.isFinite(v) && v > 0) out.push(v);
  });
  return out;
}
// 本工具只讀得懂兩節點元素;Planar / Solid 仍會記下編號(佔用表要準),但沒有 i / j
const MCT_2NODE = new Set(["BEAM","TRUSS","TENSTR","COMPTR"]);
function parseMct(txt){
  const out = { mat:{}, sect:{}, nodes:[], elems:[], groups:[] };
  const raw = String(txt == null ? "" : txt).split(/\r?\n/);
  const lines = [];
  for (let i = 0; i < raw.length; i++){
    let ln = raw[i];
    while (/\\s*$/.test(ln) && i + 1 < raw.length) ln = ln.replace(/\\s*$/, "") + raw[++i];
    lines.push(ln);
  }
  let cur = null;
  lines.forEach(rawLine => {
    if (!rawLine.trim()) return;
    const head = rawLine.trim().match(/^\*([A-Z0-9-]+)/i);
    if (head){ cur = head[1].toUpperCase(); return; }
    const line = rawLine.replace(/;.*$/, "").trim();   // 去掉註解
    if (!line || !cur) return;
    const f = line.split(",").map(t => t.trim());
    const id = Math.round(num(f[0]));
    if (cur === "MATERIAL" || cur === "SECTION"){
      if (!Number.isFinite(id) || id <= 0) return;
      const nm = (f[2] || "").trim();
      if (nm) (cur === "MATERIAL" ? out.mat : out.sect)[id] = nm;
      return;
    }
    if (cur === "NODE"){
      if (!Number.isFinite(id) || id <= 0) return;
      const x = num(f[1]), y = num(f[2]), z = num(f[3]);
      if ([x, y, z].every(Number.isFinite)) out.nodes.push({ num:id, x, y, z });
      return;
    }
    if (cur === "ELEMENT"){
      if (!Number.isFinite(id) || id <= 0) return;
      const ty = (f[1] || "").toUpperCase();
      const e = { num:id, type:ty, raw:line,          // raw:原始資料列,匯出時原樣寫回
        mat:Math.round(num(f[2])) || 1, sect:Math.round(num(f[3])) || 1 };
      if (MCT_2NODE.has(ty)){
        const i = Math.round(num(f[4])), j = Math.round(num(f[5]));
        if (i > 0 && j > 0 && i !== j){ e.i = i; e.j = j; }
      }
      out.elems.push(e);
      return;
    }
    if (cur === "GROUP"){
      const nm = (f[0] || "").trim();
      if (!nm) return;
      out.groups.push({ name:nm, nodes:expandList(f[1]), elems:expandList(f[2]) });
    }
  });
  return out;
}
// 舊介面留著:只要名稱庫的地方不必連帶拿到幾何
function parseMctLib(txt){ const r = parseMct(txt); return { mat:r.mat, sect:r.sect }; }
const libCount = L => Object.keys(L || {}).length;
// 有名稱庫就給下拉(顯示「3 — C24」),沒有就維持純數字輸入
function matField(g, key, label, val){
  const lib = (state.lib && state.lib[key === "mat" ? "mat" : "sect"]) || {};
  const ids = Object.keys(lib).map(Number).sort((a,b) => a-b);
  const unit = key === "mat" ? "材料" : "斷面";
  if (!ids.length) return fld(`${label} ID`, key, val);
  const cur = Math.round(num(val)) || 0;
  const opts = ids.map(i => [String(i), `${i} — ${lib[i]}`]);
  if (cur && !lib[cur]) opts.unshift([String(cur), `${cur}(不在匯入的清單裡)`]);
  return fld(`${unit}`, key, cur, { select:opts });
}
// 合併重合節點之後編號會跳號,所以範圍要看實際的 min–max,不能用 base + 數量 - 1
const numRange = arr => {
  if (!arr || !arr.length) return "—";
  let lo = Infinity, hi = -Infinity;
  arr.forEach(o => { if (o.num < lo) lo = o.num; if (o.num > hi) hi = o.num; });
  return lo === hi ? String(lo) : lo + "–" + hi;
};
const libTotal = () => libCount(state.lib && state.lib.mat) + libCount(state.lib && state.lib.sect);
const libTail = () => libTotal()
  ? `材料 ${libCount(state.lib.mat)} · 斷面 ${libCount(state.lib.sect)}`
  : "尚未匯入";
function libTable(){
  if (!libTotal()) return "";
  const rows = k => Object.keys(state.lib[k]).map(Number).sort((a,b) => a-b)
    .map(i => `<tr><td class="n">${i}</td><td>${esc(state.lib[k][i])}</td></tr>`).join("");
  const tbl = (k, t) => libCount(state.lib[k])
    ? `<div style="margin-top:9px"><div class="hint" style="margin:0 0 4px"><b>${t}</b></div>
       <table class="t"><thead><tr><th style="width:64px">ID</th><th>名稱</th></tr></thead>
       <tbody>${rows(k)}</tbody></table></div>` : "";
  return `<div data-ro>${tbl("mat","材料")}${tbl("sect","斷面")}</div>`;
}

// 段的覆寫欄位也要吃同一份名稱庫
function matFieldK(k, key, label, val, disabled){
  const lib = (state.lib && state.lib[key === "mat" ? "mat" : "sect"]) || {};
  const ids = Object.keys(lib).map(Number).sort((a,b) => a-b);

  const cur = Math.round(num(val)) || 0;

function loadText(txt, name){
  // 一趟掃完:材料 / 斷面名稱、已用編號、幾何(和參數還原互不衝突,可同時存在)
  const M = parseMct(txt);
  const nMat = libCount(M.mat), nSec = libCount(M.sect);
  if (nMat || nSec){
    snapshot("lib:" + Date.now());
    state.lib = { mat:{ ...(state.lib && state.lib.mat), ...M.mat },
                  sect:{ ...(state.lib && state.lib.sect), ...M.sect } };
  }
  let obj = extractParams(txt);
  if (!obj){ try { obj = JSON.parse(txt); } catch (e){ obj = null; } }
  if (obj){                                            // 本工具的參數檔:整份還原
    const s = obj.state || obj;
    if (!Array.isArray(s.groups)){ alert(`「${name}」不是本工具 v3 的參數檔(找不到 groups)`); return; }
    if (obj.formatVersion && obj.formatVersion > FORMAT_VERSION)
      alert(`檔案格式版本 ${obj.formatVersion} 比本工具(${FORMAT_VERSION})新,可能無法完整載入`);
    loadState(s);
    return;
  }
  // 不是本工具的檔 → 當成 midas 匯出的模型檔
  if (M.nodes.length || M.elems.length){ openImportDlg(M, name, nMat, nSec); return; }
  if (nMat || nSec){                                   // 只有材料 / 斷面,沒有幾何
    recompute(true);
    alert(`已從「${name}」讀入 ${nMat} 個材料、${nSec} 個斷面名稱。\n` +
          `材料 / 斷面欄位現在會顯示名稱。`);
    return;
  }
  alert(`「${name}」中找不到參數`);
}

/* ---- midas 模型檔進來時要做什麼(SPEC §16.3 / §16.4)----
   同一份 .mct 有兩種用法,而且可以同時要:
     設為目標模型 —— 只記編號,匯出前檢查會不會覆蓋既有模型
     反向匯入幾何 —— 把節點 / 元素 / 群組讀成「匯入」群組,可以被新構件參照
   所以不自作主張,問一次。                                                        */
function setTarget(M, name){
  state.target = { src:name, at:localStampText(),
    nodes:compressList(M.nodes.map(n => n.num)),
    elems:compressList(M.elems.map(e => e.num)),
    names:M.groups.map(g => g.name) };
}
/* 把掃到的幾何變成一批「匯入」群組(SPEC §16.4)。
   *GROUP 的清單決定歸屬:節點看 NODE_LIST、元素看 ELEM_LIST,先被列到的那一組先拿。
   兩張清單都沒收到的東西丟進 _UNGROUPED —— 不然畫面上會憑空少一堆看不見的東西。 */
function importGeom(M, name){
  const gs = M.groups.map(g => ({ name:g.name, nodes:[], elems:[] }));
  const owner = new Map(), eOwner = new Map();
  M.groups.forEach((g, gi) => {
    g.nodes.forEach(nu => { if (!owner.has(nu)) owner.set(nu, gi); });
    g.elems.forEach(nu => { if (!eOwner.has(nu)) eOwner.set(nu, gi); });
  });
  let un = -1;
  const unGroup = () => {
    if (un < 0){ un = gs.length; gs.push({ name:"_UNGROUPED", nodes:[], elems:[] }); }
    return un;
  };
  M.nodes.forEach(n => gs[owner.has(n.num) ? owner.get(n.num) : unGroup()].nodes.push(n));
  let skipped = 0;
  M.elems.forEach(e => {
    if (!(e.i && e.j)){ skipped++; return; }          // Planar / Solid:本工具畫不出來
    gs[eOwner.has(e.num) ? eOwner.get(e.num) : unGroup()].elems.push(e);
  });
  const made = gs.filter(x => x.nodes.length || x.elems.length).map(x => {
    const g = defaultGroup("IMPORT");
    g.name = x.name;
    g.imp = { src:name,
      nodes:x.nodes.map(n => ({ num:n.num, x:n.x, y:n.y, z:n.z })),
      elems:x.elems.map(e => ({ num:e.num, type:e.type, mat:e.mat, sect:e.sect,
                                i:e.i, j:e.j, raw:e.raw })) };
    return g;
  });
  state.groups = state.groups.concat(made);
  if (skipped) setTimeout(() => alert(
    `匯入時略過 ${skipped} 個非兩節點的元素(Planar / Solid)——\n` +
    `本工具只處理梁 / 桁架 / 只受拉這一類的兩節點元素。`), 0);
  return made.length;
}

function openImportDlg(M, name, nMat, nSec){
  const lib = (nMat || nSec) ? `<div class="hint" style="margin-top:8px">
      順便讀到 <b>${nMat}</b> 個材料、<b>${nSec}</b> 個斷面名稱,已經收進名稱庫。</div>` : "";
  const m = document.createElement("div");
  m.className = "mask";
  m.innerHTML = `<div class="dlg" style="width:min(560px, calc(100vw - 32px))">
      <h3>讀到一個 midas 模型</h3>
      <div class="sub">「${esc(name)}」裡有 <b>${M.nodes.length}</b> 個節點、
        <b>${M.elems.length}</b> 根元素、<b>${M.groups.length}</b> 個群組。要拿它做什麼?</div>
      <div class="btns" style="flex-direction:column;align-items:stretch;gap:7px">
        <button class="btn" data-x="tgt" style="text-align:left"><b>設為目標模型</b>
          —— 只記編號,匯出前檢查新構件會不會蓋掉它</button>
        <button class="btn" data-x="imp" style="text-align:left"><b>反向匯入幾何</b>
          —— 讀成「匯入」群組,新構件可以直接接上去</button>
        <button class="btn p" data-x="both" style="text-align:left"><b>兩個都要</b></button>
        <button class="btn d" data-x="no" style="text-align:left">都不要</button>
      </div>${lib}</div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener("click", ev => {
    if (ev.target === m){ close(); return; }
    const b = ev.target.closest("button[data-x]");
    if (!b) return;
    const x = b.dataset.x;
    close();
    if (x === "no"){ if (nMat || nSec) recompute(true); return; }
    snapshot("mctin:" + Date.now());
    if (x === "tgt" || x === "both") setTarget(M, name);
    if (x === "imp" || x === "both") importGeom(M, name);
    recompute(true);
  });
  const esckey = ev => { if (ev.key === "Escape"){ close(); window.removeEventListener("keydown", esckey); } };
  window.addEventListener("keydown", esckey);
}
document.addEventListener("change", e => {
  if (e.target.id !== "file-in") return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { loadText(String(rd.result), f.name); e.target.value = ""; };
  rd.readAsText(f);
});

document.addEventListener("drop", e => {

  const rd = new FileReader();
  rd.onload = () => loadText(String(rd.result), f.name);

});

/* ==========================================================================
   8e. UI — 3D 視圖(單一畫布,正射投影,可自由旋轉)
   相機 = 方位角 az + 仰角 el:
     螢幕右 r = ( sin az,           cos az,          0      )
     螢幕上 u = (−cos az·sin el,    sin az·sin el,   cos el  )
     視線   f = (−cos az·cos el,    sin az·cos el,  −sin el  )  ← 指向螢幕內
   el = 90° 是俯視(北上、東右,與舊版平面圖完全相同),el = 0° 是立面。
   相機所在的方位(站在哪一側往模型看)= az + 90°,右上角九宮格就是照這個對應。
   ========================================================================== */
const cv = $("#cv"), ctx = cv.getContext("2d");
const view = { az:90, el:90, zEx:1, cx:0, cy:0, cz:0, scale:1, locked:false };
const CAM = { r:{ x:1, y:0, z:0 }, u:{ x:0, y:1, z:0 }, f:{ x:0, y:0, z:-1 } };
let showNodes = true, hover = null, hoverG = null, curW = null;
// v3.31:游標掃到的元素 { gid, num, r, e } —— 節點沒掃到時才找元素(節點優先)
let hoverEl = null;
let hoverTree = null;                  // 左邊清單上滑到的群組 id(整組打亮用)
let selPick = false;                   // 3D 視圖上點得到節點 / 元素嗎(預設只選群組)

const allPts = () => MODEL.groups.flatMap(r => r.nodes);
// 由「實際元素」串出折線 —— 這才是會匯出到 midas 的東西
function elemPolys(r){
  const out = [];
  let cur = null, prevJ = null;
  r.elems.forEach(e => {
    if (cur && e.i === prevJ) cur.push(e.b);
    else { cur = [e.a, e.b]; out.push(cur); }
    prevJ = e.j;
  });
  return out;
}
// 依段切開的元素折線(要分色畫的時候用):{ pi, pts }
function elemPolysBy(r){
  const out = [];
  let cur = null, prevJ = null, prevPi = null;
  r.elems.forEach(e => {
    if (cur && e.i === prevJ && e.pi === prevPi) cur.pts.push(e.b);
    else { cur = { pi:e.pi, pts:[e.a, e.b] }; out.push(cur); }
    prevJ = e.j; prevPi = e.pi;
  });
  return out;
}
/* 參數曲線的取樣(只作為淡色參考底線)。
   節點被手動移動或刪除之後,這條線還停在原本的位置 —— 留著會看到「舊的那一條」的殘影,
   所以動過的段就整段不畫,畫面上只剩實際元素串出來的折線。 */
/* 「原始參數曲線」= 段的數學曲線本身,畫成淡線讓人看得出節點串(弦線)差多少。
   v3.31:整組套過平移 / 旋轉 / 鏡射的群組**不畫** —— 那條曲線是變換**之前**的位置,
   節點早就轉走了,留在圖上就是一條對不上任何元素的鬼影(抗風索繞橋軸轉 45° 就會這樣)。
   段層級的變換不受影響:那是在建曲線的當下就套進去的,曲線本來就在對的位置。      */
function curvePolys(r){
  if (r.xfOn) return [];
  if (!r.pieces || !r.pieces.length) return r.nodes.length ? [{ pi:-1, pts:r.nodes }] : [];
  const out = [];
  r.pieces.forEach(info => {
    if (info.touched) return;
    let pts = [];
    if (info.curve){ for (let i = 0; i <= 160; i++) pts.push(info.curve.pt(i/160)); }
    else if (info.chain && info.evalAt){
      const s0 = info.chain.segs[0].s0, s1 = info.chain.segs[info.chain.segs.length-1].s1;
      for (let i = 0; i <= 240; i++){ const q = info.evalAt(s0 + (s1-s0)*i/240); if (q) pts.push(q); }
    } else pts = r.nodes.slice(info.n0, info.n1);
    if (pts.length > 1) out.push({ pi:info.pi, pts });
  });
  return out;
}
/* v3.11:段不再各自分色。
   分色會跟別組的主題色撞在一起(尤其被選到的組第一段是藍色,跟其他藍色組分不出來),
   而且顏色本來就有限。改成:**整組一個顏色**,段別靠「畫在段中間的編號徽章」分辨;
   正在編輯的組用**加粗**表示,不換色。                                            */
const pcOn = r => SEL === r.g.id && r.g.type === "CURVE" && (r.g.pieces || []).length > 1;
const colOf = r => r.color;
const IDLE_COL = "#161a20";                 // 沒在編輯的群組:黑
// 節點半徑:編輯中的群組畫大一點(線也同時收細),節點才不會被線蓋掉
const nodeRad = (n, on) => on ? (n > 400 ? 2.4 : n > 150 ? 3.2 : 4.2)
                              : (n > 400 ? 1.0 : n > 150 ? 1.4 : 1.9);

/* ---------- 相機 ---------- */
function camUpdate(){
  const A = norm360(num(view.az) || 0)*D2R, E = norm180(num(view.el) || 0)*D2R;
  const sa = Math.sin(A), ca = Math.cos(A), se = Math.sin(E), ce = Math.cos(E);
  CAM.r = { x:sa,      y:ca,      z:0  };
  CAM.u = { x:-ca*se,  y:sa*se,   z:ce };
  CAM.f = { x:-ca*ce,  y:sa*ce,   z:-se };
}
function camFromState(){
  const v = state.view || {};
  if (Number.isFinite(num(v.az))) view.az = norm360(num(v.az));
  if (Number.isFinite(num(v.el))) view.el = norm180(num(v.el));
  if (num(v.zEx) > 0) view.zEx = num(v.zEx);
  camUpdate();
}
const camPush = () => { state.view.az = +view.az.toFixed(2);
                        state.view.el = +view.el.toFixed(2);
                        state.view.zEx = +(+view.zEx).toFixed(4); };

// 世界座標 → 螢幕
const toS = p => {
  const dx = p.x - view.cx, dy = p.y - view.cy, dz = (p.z - view.cz)*view.zEx;
  return { x: cv.clientWidth/2  + (dx*CAM.r.x + dy*CAM.r.y) * view.scale,
           y: cv.clientHeight/2 - (dx*CAM.u.x + dy*CAM.u.y + dz*CAM.u.z) * view.scale };
};
// 螢幕 → 指定高程的水平面上的世界座標(純立面時無解,回 null)
function toW(sx, sy, z0){
  const zt = (z0 === undefined) ? view.cz : z0;
  const a = (sx - cv.clientWidth/2)/view.scale;
  const b = (cv.clientHeight/2 - sy)/view.scale - (zt - view.cz)*view.zEx*CAM.u.z;
  const det = CAM.r.x*CAM.u.y - CAM.r.y*CAM.u.x;      // = sin(el)
  if (Math.abs(det) < 1e-6) return null;
  return { x: view.cx + (a*CAM.u.y - b*CAM.r.y)/det,
           y: view.cy + (CAM.r.x*b - CAM.u.x*a)/det, z: zt };
}
// 沿螢幕右/上方向平移視點
function panBy(dxPx, dyPx){
  const du = -dxPx/view.scale, dv = dyPx/view.scale;
  view.cx += du*CAM.r.x + dv*CAM.u.x;
  view.cy += du*CAM.r.y + dv*CAM.u.y;
  view.cz += dv*CAM.u.z/view.zEx;
}

function fitView(){
  camUpdate();
  const P = allPts();
  if (!P.length){ view.cx = view.cy = view.cz = 0; view.scale = 1; return; }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,z0=Infinity,z1=-Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
                   if(p.z<z0)z0=p.z; if(p.z>z1)z1=p.z; });
  view.cx = (x0+x1)/2; view.cy = (y0+y1)/2; view.cz = (z0+z1)/2;
  let u0=Infinity,u1=-Infinity,v0=Infinity,v1=-Infinity;
  P.forEach(p => {
    const dx = p.x-view.cx, dy = p.y-view.cy, dz = (p.z-view.cz)*view.zEx;
    const u = dx*CAM.r.x + dy*CAM.r.y, v = dx*CAM.u.x + dy*CAM.u.y + dz*CAM.u.z;
    if(u<u0)u0=u; if(u>u1)u1=u; if(v<v0)v0=v; if(v>v1)v1=v;
  });
  const W = cv.clientWidth || 600, H = cv.clientHeight || 400;
  view.scale = Math.min(W/Math.max(u1-u0, 1e-6), H/Math.max(v1-v0, 1e-6)) * 0.86;
  const uc = (u0+u1)/2, vc = (v0+v1)/2;                // 投影後的中心不一定是包絡盒中心
  view.cx += uc*CAM.r.x + vc*CAM.u.x;
  view.cy += uc*CAM.r.y + vc*CAM.u.y;
  view.cz += vc*CAM.u.z/view.zEx;
}

function niceStep(px, scale){
  const raw = px/Math.max(1e-12, scale), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
const fmtN = v => Math.abs(v) < 1e-9 ? "0" : (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(Math.abs(v)%1 ? 1 : 0));

/* ---------- 格線:斜看時畫地面格網,接近立面時退回高程格線 ---------- */
function drawGrid(W, H){
  const P = allPts(); if (!P.length) return;
  const se = Math.abs(Math.sin(norm180(num(view.el) || 0)*D2R));
  ctx.lineWidth = 1; ctx.fillStyle = "#b8c0cb";
  if (se > 0.12){
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,z0=Infinity;
    P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
                     if(p.z<z0)z0=p.z; });
    const step = niceStep(80, view.scale);
    const zg = Math.floor(z0/step)*step;               // 地面高程,讓模型「站」在格網上
    const pad = Math.max(x1-x0, y1-y0)*0.12 + step;
    let gx0 = x0-pad, gx1 = x1+pad, gy0 = y0-pad, gy1 = y1+pad;
    const cs = [[0,0],[W,0],[0,H],[W,H]].map(c => toW(c[0], c[1], zg)).filter(Boolean);
    if (cs.length === 4){                              // 只畫看得到的範圍,不然大模型會畫上萬條
      gx0 = Math.max(gx0, Math.min(...cs.map(c => c.x)));
      gx1 = Math.min(gx1, Math.max(...cs.map(c => c.x)));
      gy0 = Math.max(gy0, Math.min(...cs.map(c => c.y)));
      gy1 = Math.min(gy1, Math.max(...cs.map(c => c.y)));
    }
    if (!(gx1 > gx0) || !(gy1 > gy0)) return;
    const nx = Math.ceil((gx1-gx0)/step), ny = Math.ceil((gy1-gy0)/step);
    if (nx > 400 || ny > 400) return;
    const inBox = s => s.x > -60 && s.x < W+60 && s.y > -60 && s.y < H+60;
    for (let x = Math.ceil(gx0/step)*step; x <= gx1+1e-9; x += step){
      const a = toS({ x, y:gy0, z:zg }), b = toS({ x, y:gy1, z:zg });
      ctx.strokeStyle = Math.abs(x) < 1e-9 ? "#dfe4ea" : "#f2f4f6";
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      if (inBox(a)) ctx.fillText("X " + fmtN(x), a.x+3, a.y-3);
    }
    for (let y = Math.ceil(gy0/step)*step; y <= gy1+1e-9; y += step){
      const a = toS({ x:gx0, y, z:zg }), b = toS({ x:gx1, y, z:zg });
      ctx.strokeStyle = Math.abs(y) < 1e-9 ? "#dfe4ea" : "#f2f4f6";
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      if (inBox(a)) ctx.fillText("Y " + fmtN(y), a.x+3, a.y-3);
    }
  } else {
    // 幾乎是立面:等高線在螢幕上就是水平線,標高程比地面格網有用
    const kz = Math.abs(CAM.u.z)*view.zEx*view.scale;   // 每單位高程幾個 px
    if (!(kz > 1e-9)) return;
    const dz = niceStep(44, kz);
    const zc = view.cz, half = (H/2)/kz;
    if ((2*half)/dz > 400) return;
    for (let z = Math.ceil((zc-half)/dz)*dz; z <= zc+half; z += dz){
      const y = toS({ x:view.cx, y:view.cy, z }).y;
      ctx.strokeStyle = "#f2f4f6";
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.fillText("Z " + fmtN(z), 3, y-3);
    }
    const du = niceStep(90, view.scale);
    const nu = Math.ceil((W/view.scale)/du);
    if (nu <= 400) for (let i = -nu; i <= nu; i++){
      const x = W/2 + i*du*view.scale;
      if (x < 0 || x > W) continue;
      ctx.strokeStyle = "#f5f6f8";
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
  }
}

/* ---------- 座標軸指示 ---------- */
function drawTriad(W, H){
  const ox = W - 42, oy = H - 34, L = 24;
  const axes = [["X", { x:1, y:0, z:0 }, "#b3261e"],
                ["Y北", { x:0, y:1, z:0 }, "#1a7f4b"],
                ["Z", { x:0, y:0, z:1 }, "#1c5d99"]];
  ctx.font = "9px sans-serif"; ctx.lineWidth = 1.5;
  axes.forEach(a => {
    const v = a[1];
    const sx = v.x*CAM.r.x + v.y*CAM.r.y + v.z*CAM.r.z;
    const sy = -(v.x*CAM.u.x + v.y*CAM.u.y + v.z*CAM.u.z);
    const d = Math.hypot(sx, sy);
    ctx.strokeStyle = a[2]; ctx.fillStyle = a[2];
    if (d < 0.08){ ctx.beginPath(); ctx.arc(ox, oy, 2.2, 0, 7); ctx.fill(); return; }
    const ex = ox + sx*L, ey = oy + sy*L;
    ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillText(a[0], ex + (sx >= 0 ? 2 : -11), ey + (sy >= 0 ? 8 : -2));
  });
  ctx.fillStyle = "#8b95a3";
  ctx.beginPath(); ctx.arc(ox, oy, 1.6, 0, 7); ctx.fill();
}

/* 段的編號徽章:畫在該段「實際折線」的中點(沿長度取一半,不是取中間那個節點,
   節點被刪過時才不會偏掉)。徽章用組色實心 + 白字,才不會跟線本身混在一起。 */
function drawPieceTags(r){
  const byPi = new Map();
  elemPolysBy(r).forEach(pl => {
    if (pl.pi == null || pl.pi < 0) return;
    if (!byPi.has(pl.pi)) byPi.set(pl.pi, []);
    byPi.get(pl.pi).push(pl.pts);
  });
  const placed = [];
  byPi.forEach((runs, pi) => {
    // 同一段可能被斷點切成好幾串,取最長的那一串
    let best = null, bestL = -1;
    runs.forEach(pts => {
      let L = 0;
      for (let i = 1; i < pts.length; i++) L += dist3(pts[i-1], pts[i]);
      if (L > bestL){ bestL = L; best = pts; }
    });
    if (!best || best.length < 2) return;
    let acc = 0, mid = best[0];
    for (let i = 1; i < best.length; i++){
      const d = dist3(best[i-1], best[i]);
      if (acc + d >= bestL/2){
        const t = d > 1e-12 ? (bestL/2 - acc)/d : 0;
        mid = { x:best[i-1].x + (best[i].x-best[i-1].x)*t,
                y:best[i-1].y + (best[i].y-best[i-1].y)*t,
                z:best[i-1].z + (best[i].z-best[i-1].z)*t };
        break;
      }
      acc += d;
    }
    const sc = toS(mid);
    // 幾段擠在一起時稍微錯開,免得徽章互相蓋住
    let sy = sc.y;
    while (placed.some(q => Math.abs(q.x - sc.x) < 15 && Math.abs(q.y - sy) < 15)) sy -= 15;
    placed.push({ x:sc.x, y:sy });
    const txt = String(pi + 1), rad = txt.length > 1 ? 9.5 : 8;
    ctx.save();
    ctx.fillStyle = pieceColor(r.color, pi, (r.g.pieces || []).length);
    ctx.beginPath(); ctx.arc(sc.x, sy, rad, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 10.5px " + getComputedStyle(document.body).getPropertyValue("--mono");
    ctx.fillText(txt, sc.x, sy + 0.5);
    ctx.restore();
  });
}

/* ---------- 主繪圖 ---------- */
function draw(){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  camUpdate();
  syncReadout();
  if (!allPts().length) return;
  ctx.font = "9.5px " + getComputedStyle(document.body).getPropertyValue("--mono");
  drawGrid(W, H);

  // 有選到群組時,其他群組一律退成黑色細線 —— 只有正在編輯的那一組保留自己的顏色
  const anySel = !!MODEL.byId.get(SEL);
  MODEL.groups.forEach(r => {
    const on = SEL === r.g.id;
    const col = (anySel && !on) ? IDLE_COL : colOf(r);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = col;
    if (TYPES[r.g.type].fam === "con"){
      ctx.lineWidth = on ? 2.6 : 1; ctx.globalAlpha = on ? 1 : (anySel ? .55 : .6);
      ctx.beginPath();
      r.elems.forEach(e => { const a = toS(e.a), b = toS(e.b); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); });
      ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      // 正在編輯的多段曲線:每一段用群組色的不同深淺,和編號徽章同色
      const np = pcOn(r) ? (r.g.pieces || []).length : 0;
      const pcCol = pi => np ? pieceColor(col, pi, np) : col;
      // 參考:原始參數曲線(淡)
      ctx.globalAlpha = .28; ctx.lineWidth = 1.2;
      curvePolys(r).forEach(pl => {
        ctx.strokeStyle = pcCol(pl.pi);
        ctx.beginPath();
        pl.pts.forEach((p,i) => { const s = toS(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); });
        ctx.stroke();
      });
      ctx.globalAlpha = anySel && !on ? .8 : 1;
      // 實際元素(節點被移動或刪除後,線會跟著走)
      ctx.lineWidth = on ? 2.8 : 1.4;
      elemPolysBy(r).forEach(pl => {
        ctx.strokeStyle = pcCol(pl.pi);
        ctx.beginPath();
        pl.pts.forEach((p,i) => { const s = toS(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); });
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }
    if (showNodes && r.nodes.length){
      // 編輯中的群組:節點畫得比線粗很多,而且加白邊,才不會被自己的線吃掉
      const rad = nodeRad(r.nodes.length, on);
      if (on){
        ctx.fillStyle = "#fff";
        r.nodes.forEach(n => {
          const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,rad+1.4,0,7); ctx.fill(); });
      }
      const npN = pcOn(r) ? (r.g.pieces || []).length : 0;
      ctx.globalAlpha = on ? 1 : (anySel ? .75 : 1);
      r.nodes.forEach(n => {
        ctx.fillStyle = (npN && Number.isFinite(n.pi) && n.pi >= 0) ? pieceColor(col, n.pi, npN) : col;
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,rad,0,7); ctx.fill(); });
      ctx.globalAlpha = 1;
      // v3.16:起點 / 終點不再特別標記 —— 同一個群組的節點一律長一樣
      ctx.fillStyle = "#8a6116";
      r.nodes.filter(n => n.edited).forEach(n => {
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,rad+1.4,0,7); ctx.fill(); });
      // 被合併掉的節點:位置還在(只是換成別人的節點),畫一個空心方框標出來
      if (on && r.weldAway && r.weldAway.length){
        ctx.strokeStyle = "#8a6116"; ctx.lineWidth = 1.6;
        const h = rad + 3;
        r.weldAway.forEach(w => { const s = toS(w);
          ctx.strokeRect(s.x - h, s.y - h, h*2, h*2); });
      }
    }
  });

  // 段的編號徽章:畫在整個群組迴圈之後,才不會被後面畫的組蓋住(立面視角很容易重疊)
  MODEL.groups.forEach(r => { if (pcOn(r)) drawPieceTags(r); });

  if (hoverE){                                        // 點選群組模式:整組一起亮
    const rr = MODEL.byId.get(hoverE.gid);
    if (rr){
      ctx.save();
      ctx.strokeStyle = "#0f62fe";
      ctx.lineWidth = 4; ctx.globalAlpha = .38; ctx.lineCap = "round";
      rr.elems.forEach(e2 => { const a2 = toS(e2.a), b2 = toS(e2.b);
        ctx.beginPath(); ctx.moveTo(a2.x,a2.y); ctx.lineTo(b2.x,b2.y); ctx.stroke(); });
      ctx.restore();
    }
  }
  /* v3.31:游標掃到節點或元素時,**它所屬的整個群組**一起打亮(淡),
     掃到的那一根再單獨加一層(濃)。和點選群組模式(hoverE)用同一種視覺語言,
     差別只在那個模式是「按下去會選到誰」,這裡是「現在指著誰」。            */
  const hoverGid = hoverEl ? hoverEl.gid
                 : (hover && hoverG) ? hoverG.g.id
                 : hoverTree;
  if (hoverGid && !hoverE){
    const rr = MODEL.byId.get(hoverGid);
    if (rr){
      ctx.save();
      ctx.strokeStyle = "#0f62fe"; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.lineWidth = 4.5; ctx.globalAlpha = .3;
      ctx.beginPath();
      rr.elems.forEach(e2 => { const a2 = toS(e2.a), b2 = toS(e2.b);
        ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); });
      ctx.stroke();
      // 連接族(對接 / 垂落 / 扇出)自己不產生節點,打亮時就借用兩端的既有節點
      const pts = rr.nodes.length ? rr.nodes
                : rr.elems.flatMap(e2 => [e2.a, e2.b]);
      ctx.fillStyle = "#0f62fe"; ctx.globalAlpha = .32;
      const rr2 = Math.min(4.5, Math.max(2.2, nodeRad(pts.length, true) + 1.6));
      pts.forEach(n => { const s2 = toS(n);
        ctx.beginPath(); ctx.arc(s2.x, s2.y, rr2, 0, 7); ctx.fill(); });
      ctx.restore();
    }
    const he = hoverEl && MODEL.byId.get(hoverEl.gid)
             && MODEL.byId.get(hoverEl.gid).elems.find(e2 => e2.num === hoverEl.num);
    if (he){                                          // 指著的那一根:濃一層
      ctx.save();
      const a2 = toS(he.a), b2 = toS(he.b);
      ctx.strokeStyle = "#0f62fe"; ctx.lineWidth = 5; ctx.globalAlpha = .45;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      ctx.restore();
    }
  }
  if (SELELEM){
    const rr = MODEL.byId.get(SELELEM.gid);
    const ee = rr && rr.elems.find(e => e.num === SELELEM.num);
    if (ee){ const a = toS(ee.a), b = toS(ee.b);
      ctx.strokeStyle = "#b3261e"; ctx.lineWidth = 5; ctx.globalAlpha = .45;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  if (SELNODE){
    const rr = MODEL.byId.get(SELNODE.gid);
    const nd = rr && rr.nodes.find(n => n.num === SELNODE.num);
    if (nd){ const s = toS(nd);
      ctx.strokeStyle = "#b3261e"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x,s.y,7,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x-11,s.y); ctx.lineTo(s.x-7,s.y);
      ctx.moveTo(s.x+7,s.y); ctx.lineTo(s.x+11,s.y);
      ctx.moveTo(s.x,s.y-11); ctx.lineTo(s.x,s.y-7);
      ctx.moveTo(s.x,s.y+7); ctx.lineTo(s.x,s.y+11); ctx.stroke(); }
  }
  if (hover){ const s = toS(hover);
    ctx.strokeStyle = "#1c5d99"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,5.5,0,7); ctx.stroke(); }

  // 比例尺(量的是「與螢幕平行」的長度)
  const step = niceStep(80, view.scale);
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(8, H-30, step*view.scale+62, 22);
  ctx.strokeStyle = "#5a6472"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(14,H-18); ctx.lineTo(14+step*view.scale,H-18); ctx.stroke();
  ctx.fillStyle = "#5a6472"; ctx.font = "10px sans-serif";
  ctx.fillText(fmtN(step) + " " + UL(), 18+step*view.scale, H-15);
  drawTriad(W, H);
}

/* ---------- 視角預設(九宮格) ----------
   相機所在方位 = az + 90°:北側 az=270、東側 az=0、南側 az=90、西側 az=180。
   四個角是相鄰兩側之間、再往下俯 45°。                                   */
/* 四個角的俯角用 20° 而不是 45°:橋梁這種東西長寬比很懸殊,俯 45° 會把整條線壓成一團,
   壓低到 20° 才看得出縱向的起伏與橫向的寬度。                                      */
const CORNER_EL = 20;
const VIEWS = [
  { k:"NW", az:225, el:CORNER_EL, t:`西北 ${CORNER_EL}°` }, { k:"N", az:270, el:0, t:"北側立面(往南看)" }, { k:"NE", az:315, el:CORNER_EL, t:`東北 ${CORNER_EL}°` },
  { k:"W",  az:180, el:0,  t:"西側立面(往東看)" }, { k:"TOP", az:90, el:90, t:"俯視(北上)" }, { k:"E", az:0, el:0, t:"東側立面(往西看)" },
  { k:"SW", az:135, el:CORNER_EL, t:`西南 ${CORNER_EL}°` }, { k:"S", az:90,  el:0, t:"南側立面(往北看)" }, { k:"SE", az:45,  el:CORNER_EL, t:`東南 ${CORNER_EL}°` }
];
const viewHit = () => VIEWS.find(v =>
  Math.abs(((view.az - v.az + 540) % 360) - 180) < 0.5 && Math.abs(view.el - v.el) < 0.5);
function camTo(az, el){
  view.az = norm360(az); view.el = norm180(el);
  camUpdate(); camPush();
  if (!view.locked) fitView();
  syncViewUI(); draw();
}
// Z 已被放大時「1:1」才點得有意義 —— 這時把它點亮,平常保持安靜
function syncZfit(){
  const f = $("#zauto"); if (f) f.classList.toggle("on", Math.abs(+view.zEx - 1) > 1e-9);
}
function syncViewUI(){
  const a = $("#vaz"), b = $("#vel"), z = $("#zsc");
  if (a && document.activeElement !== a) a.value = +view.az.toFixed(1);
  if (b && document.activeElement !== b) b.value = +view.el.toFixed(1);
  if (z && document.activeElement !== z) z.value = +(+view.zEx).toFixed(4);
  syncZfit();
  const hitK = (viewHit() || {}).k;
  $("#vcube").querySelectorAll("button").forEach(btn =>
    btn.classList.toggle("on", btn.dataset.k === hitK));
}
function syncReadout(){
  const hv = viewHit();
  if (PICK && PICK.mode === "group"){
    const el0 = $("#ro");
    if (el0) el0.textContent = hoverE
      ? `會選到:${hoverE.name}(元素 #${hoverE.num})`
      : "點一根元素,就會選到畫出它的那個群組;按 Esc 取消";
    return;
  }
  const l1 = hover
    ? `${hoverG ? hoverG.g.name : ""} #${hover.num}  X ${hover.x.toFixed(3)}  Y ${hover.y.toFixed(3)}  Z ${hover.z.toFixed(3)}` +
      (Number.isFinite(hover.s) ? `  ${fmtSta(hover.s)}` : "")
    : hoverEl
    ? `${hoverEl.r.g.name}  元素 #${hoverEl.num}  ${hoverEl.e.a.num} → ${hoverEl.e.b.num}` +
      `  長 ${fmtN(hoverEl.e.len3d)} ${UL()}`
    : (curW ? `X ${curW.x.toFixed(3)}   Y ${curW.y.toFixed(3)}   (地面 Z ${fmtN(curW.z)} ${UL()})` : "");
  // 方位角 / 仰角 / Z 放大都由左上角工具列那一排欄位顯示,這裡不再重覆寫一次;
  // 只留工具列講不出來的東西 —— 目前落在哪一個九宮格視角。
  const l2 = hv ? hv.t : "";
  const el = $("#ro"); if (el) el.textContent = (l1 && l2) ? l1 + "\n" + l2 : (l1 || l2);
}

/* ---------- 選取 ---------- */
function segDistPx(px, py, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
  let t = L2 > 1e-12 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx*t), py - (ay + dy*t));
}
// 任何組的節點都可以被點選 —— 不論它屬於哪一族、目前正在編輯哪一組。
// (能不能改座標是另一回事,交給 nodeSec 判斷;這裡只負責「選得到」。)
function pickNodeAt(sx, sy, tolPx){
  let best = null, bd = tolPx, bg = null;
  MODEL.groups.forEach(r => {
    r.nodes.forEach(n => { const s = toS(n), d = Math.hypot(s.x-sx, s.y-sy);
      if (d < bd){ bd = d; best = n; bg = r; } }); });
  return best ? { n:best, r:bg } : null;
}
function pickElemAt(sx, sy, tolPx){
  let best = null, bd = tolPx;
  MODEL.groups.forEach(r => {
    r.elems.forEach(e => {
      const a = toS(e.a), b = toS(e.b);
      const d = segDistPx(sx, sy, a.x, a.y, b.x, b.y);
      if (d < bd){ bd = d; best = { r, e }; } }); });
  return best;
}
// 選取後把高亮的區塊捲進視窗,免得使用者不知道要去哪裡編輯
function focusHot(){
  const el = document.querySelector("#pane .sec.hot");
  if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}

/* ---------- 滑鼠 ---------- */
/* midas Civil 的滑鼠慣例:
     中鍵拖曳        = 平移
     Ctrl  + 中鍵拖曳 = 旋轉
     Shift + 中鍵拖曳 = 縮放
     滾輪            = 縮放
     左鍵            = 只做點選(不拖曳、不旋轉)                       */
let drag = null, dragMoved = false;
const CUR = { pan:"move", rot:"grabbing", zoom:"ns-resize" };
cv.addEventListener("mousedown", e => {
  if (e.button !== 1){                                // 左/右鍵不操作視角
    if (e.button === 0) dragMoved = false;            // 左鍵重新開始判定「這是不是點選」
    return;
  }
  e.preventDefault();                                 // 擋掉 Windows 的中鍵自動捲動
  drag = { x:e.offsetX, y:e.offsetY, az:view.az, el:view.el,
           cx:view.cx, cy:view.cy, cz:view.cz, scale:view.scale,
           mode: (e.ctrlKey || e.metaKey) ? "rot" : (e.shiftKey ? "zoom" : "pan") };
  dragMoved = false;
  cv.style.cursor = CUR[drag.mode];
});
window.addEventListener("mouseup", () => { drag = null; cv.style.cursor = ""; });
cv.addEventListener("mousemove", e => {
  if (drag && !(e.buttons & 4)){ drag = null; cv.style.cursor = ""; }   // 中鍵已在畫布外放開
  if (drag){
    const dx = e.offsetX-drag.x, dy = e.offsetY-drag.y;
    if (Math.hypot(dx, dy) > 3) dragMoved = true;
    if (drag.mode === "rot"){                         // 模型跟著手走
      view.az = norm360(drag.az + dx*0.4);
      view.el = norm180(drag.el + dy*0.4);   // 轉過極點會翻到另一邊,不再卡住
      camUpdate(); camPush(); syncViewUI();
    } else if (drag.mode === "zoom"){
      view.scale = Math.max(1e-9, drag.scale*Math.exp(-dy*0.006));
    } else {
      view.cx = drag.cx; view.cy = drag.cy; view.cz = drag.cz;
      panBy(dx, dy);
    }
    view.locked = true; draw(); return;
  }
  // 要選群組時滑鼠掃到的是元素,先把它高亮起來,按下去之前就知道會選到誰
  if (PICK && PICK.mode === "group"){
    const pe = pickElemAt(e.offsetX, e.offsetY, 12);
    hoverE = pe ? { num:pe.e.num, gid:pe.r.g.id, name:pe.r.g.name } : null;
    hover = null; hoverG = null; hoverEl = null; curW = null; draw(); return;
  }
  hoverE = null;
  /* 容差和「點下去」完全一樣(節點 14 px、元素 12 px)—— 舊版滑過時用 24 px 找節點,
     結果是「亮起來的是節點、按下去卻選到元素」。看到什麼就會選到什麼,才不會誤導。 */
  const hit = pickNodeAt(e.offsetX, e.offsetY, 14);
  hover = hit ? hit.n : null; hoverG = hit ? hit.r : null;
  const pe = hit ? null : pickElemAt(e.offsetX, e.offsetY, 12);
  hoverEl = pe ? { gid:pe.r.g.id, num:pe.e.num, r:pe.r, e:pe.e } : null;
  curW = (hover || hoverEl) ? null : toW(e.offsetX, e.offsetY, undefined);
  cv.style.cursor = (hover || hoverEl) ? "pointer" : "";
  draw();
});
cv.addEventListener("mouseleave", () => {
  if (!drag){ hover = null; hoverG = null; hoverE = null; hoverEl = null;
              curW = null; cv.style.cursor = ""; draw(); }
});
// 點選模式一律用 Esc 取消(面板上也有一顆取消鈕)—— 不再用「點空白處」,
// 因為點空了最常見的原因是沒點準,把它當成取消只會讓人以為功能壞了。
window.addEventListener("keydown", e => {
  if (e.key === "Escape" && PICK && !document.querySelector(".mask")){
    PICK = null; hoverE = null; recompute(true);
  }
});
/* ---------- 在圖上點東西 ----------
   點選模式(PICK)進行中時,**畫面上的選取狀態一律不動** —— 以前點不到節點就把
   PICK 清掉、下一下就變成「選到別的群組」,使用者看到的現象是「圖上點起點根本點不成功,
   反而跳去編輯別的群組」。現在:點不到就什麼都不做,取消一律走 Esc 或面板上的取消鈕。

   節點只有幾個像素、又常常被好幾個群組共用(重合節點更是同一顆),所以:
   - 要「一個群組」時只認**元素** —— 元素是誰畫的沒有歧義,點起來也好點得多。
   - 要「一個節點」時先認節點,點不到就退而求其次,取元素上**離游標比較近的那一端**。   */
function pickNodeLoose(sx, sy){
  const hit = pickNodeAt(sx, sy, 14);
  if (hit) return hit;
  const pe = pickElemAt(sx, sy, 12);
  if (!pe) return null;
  const a = toS(pe.e.a), b = toS(pe.e.b);
  const near = Math.hypot(a.x-sx, a.y-sy) <= Math.hypot(b.x-sx, b.y-sy) ? pe.e.a : pe.e.b;
  const own = MODEL.byId.get(near.gid);
  return { n:near, r:own || pe.r };
}
cv.addEventListener("click", e => {
  if (dragMoved) return;
  if (PICK){
    const g0 = state.groups.find(x => x.id === PICK.gid);
    if (!g0){ PICK = null; recompute(true); return; }

    if (PICK.mode === "group"){                        // 點一根元素 = 選到畫出它的那個群組
      const pe = pickElemAt(e.offsetX, e.offsetY, 12);
      if (!pe) return;                                 // 沒點到就當作沒發生,維持點選模式
      if (pe.r.g.id === g0.id){ alert("不能選到這個群組自己 —— 請點另一個群組的元素。"); return; }
      snapshot("gpick:" + Date.now());
      setPath(g0, PICK.key, pe.r.g.id);
      PICK = null; SEL = g0.id;
      recompute(true); focusHot(); return;
    }

    const hit = pickNodeLoose(e.offsetX, e.offsetY);
    if (!hit) return;                                  // 同上:點空了就靜靜等下一次

    if (PICK.mode === "ref"){                          // 只要點一個節點就結束
      const q = locateNode(hit.n.num);
      if (!q){ alert("找不到這個節點屬於哪一個群組,請再點一次。"); return; }
      if (q.gid === g0.id){ alert("要指到「別的」群組的節點;同一個群組裡的段請用「段 N」那幾個選項。"); return; }
      snapshot("refpick:" + Date.now());
      setPath(g0, PICK.key, "@" + q.gid + ":" + (q.idx + 1));
      PICK = null; SEL = g0.id;
      recompute(true); focusHot(); return;
    }
    if (!PICK.i){ PICK.i = hit.n.num; recompute(true); focusHot(); return; }
    if (hit.n.num === PICK.i) return;                  // 同一點按兩下:當作還沒選第二點
    if (PICK.mode === "link2"){
      const p = locateNode(PICK.i), q = locateNode(hit.n.num);
      if (!p || !q){ alert("找不到這個節點屬於哪一組,請再點一次。"); PICK = null; recompute(true); return; }
      if (p.gid === q.gid){ alert("兩點要落在不同的群組上 —— 對接是把兩個群組的節點連起來。"); return; }
      if (p.gid === g0.id || q.gid === g0.id){ alert("不能接到這個對接組自己產生的節點。"); return; }
      snapshot("lkpick:" + Date.now());
      g0.pair = "free";
      g0.a = p.gid; g0.aFrom = p.idx + 1;
      g0.b = q.gid; g0.bFrom = q.idx + 1;
      g0.rev = false;
      g0.pattern = [[0, 0]];              // 點兩個節點 = 最單純的樣式單元:一條直連
      PICK = null; SEL = g0.id;
      recompute(true); focusHot(); return;
    }
    PICK = null; recompute(true); focusHot(); return;   // 沒有其他兩點模式了
  }
  const hit = pickNodeAt(e.offsetX, e.offsetY, 14);
  const pe0 = hit ? null : pickElemAt(e.offsetX, e.offsetY, 12);
  if (!selPick){                        // 只選群組:節點 / 元素都只當成「誰畫的」
    const own = hit ? hit.r : (pe0 ? pe0.r : null);
    SEL = own ? own.g.id : null;        // 點空白處 = 什麼都不選
    SELNODE = null; SELELEM = null;
    recompute(true); focusHot(); return;
  }
  if (hit){
    SEL = hit.r.g.id; SELNODE = { gid:hit.r.g.id, ri:hit.n.ri, num:hit.n.num }; SELELEM = null;
  } else {
    if (pe0){ SEL = pe0.r.g.id; SELELEM = { gid:pe0.r.g.id, num:pe0.e.num }; SELNODE = null; }
    // 點空白處 = 什麼都不選:清單不高亮,圖面上每個群組都回到自己的顏色
    else { SEL = null; SELNODE = null; SELELEM = null; }
  }
  recompute(true); focusHot();
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const s0 = view.scale, s1 = Math.max(1e-9, s0*Math.exp(-e.deltaY*0.0015));
  const du = e.offsetX - cv.clientWidth/2, dv = -(e.offsetY - cv.clientHeight/2);
  const k = 1/s0 - 1/s1;
  view.cx += (du*CAM.r.x + dv*CAM.u.x)*k;
  view.cy += (du*CAM.r.y + dv*CAM.u.y)*k;
  view.cz += dv*CAM.u.z*k/view.zEx;
  view.scale = s1; view.locked = true; draw();
}, { passive:false });
cv.addEventListener("auxclick", e => { if (e.button === 1) e.preventDefault(); });

$("#btn-pick").onclick = () => {
  selPick = !selPick;
  if (!selPick){ SELNODE = null; SELELEM = null; }     // 關掉就順手把選取收乾淨
  syncPickBtn(); recompute(true);
};
syncPickBtn();
/* 方位角 / 仰角:打字時就照循環規則收斂到合法範圍,離開欄位再把收斂後的值寫回去,
   輸入框裡才不會留著 400° 這種畫面上根本不存在的角度。 */
$("#vaz").addEventListener("input", e => {
  const a = num(e.target.value); if (!Number.isFinite(a)) return;
  view.az = norm360(a); camUpdate(); camPush(); syncViewUI(); draw();
});
$("#vel").addEventListener("input", e => {
  const a = num(e.target.value); if (!Number.isFinite(a)) return;
  view.el = norm180(a); camUpdate(); camPush(); syncViewUI(); draw();
});
const viewWriteBack = () => { const a = $("#vaz"), b = $("#vel");
  if (a) a.value = +view.az.toFixed(1);
  if (b) b.value = +view.el.toFixed(1); };
$("#vaz").addEventListener("change", viewWriteBack);
$("#vel").addEventListener("change", viewWriteBack);
$("#vaz").addEventListener("blur", viewWriteBack);
$("#vel").addEventListener("blur", viewWriteBack);
$("#zsc").addEventListener("input", e => {
  const z = num(e.target.value);
  view.zEx = (z > 0) ? z : 1; camPush();
  if (!view.locked) fitView();
  draw(); syncZfit();
});
$("#zsc").addEventListener("change", () => { const z = $("#zsc"); if (z) z.value = +(+view.zEx).toFixed(4); });
$("#zauto").onclick = () => { view.zEx = 1; camPush(); if (!view.locked) fitView(); syncViewUI(); draw(); };
window.addEventListener("resize", () => { if (!view.locked) fitView(); draw(); });

/* ==========================================================================
   主流程
   ========================================================================== */
function recompute(reTree){
  ERRS = []; WARNS = [];
  MODEL = buildModel(state, ERRS, WARNS);
  if (SELELEM){                                        // 選取的元素可能已經不在了
    const rr = MODEL.byId.get(SELELEM.gid);
    if (!rr || !rr.elems.some(e => e.num === SELELEM.num)) SELELEM = null;
  }
  if (reTree !== false) renderTree();
  syncUnitUI(); syncViewUI();
  renderPane();
  renderChecks();
  if (!view.locked) fitView();
  draw();
  syncHistBtns();
}
function render(){ renderTree(); renderPane(); if (!view.locked) fitView(); draw(); }

   ========================================================================== */
function runTests(){
  const rows = [];
  const chk = (id, desc, actual, expect, tol, unit) =>
    rows.push({ id, desc, actual, expect, tol, unit:unit||"", ok:Math.abs(actual-expect) <= tol });
  const yes = (id, desc, cond, actual, expect) =>
    rows.push({ id, desc, actual:String(actual), expect:String(expect), ok:!!cond, str:true });

  const PIECE_T = { LINE:1, ARC:1, SAG:1, HELIX:1, CHAIN:1, POINT:1, POLY:1 };
  // g.type 是段型別時,自動包成「一段的曲線組」;是組型別時照舊
  const build = groups => {
    const gs = groups.map(g => {
      if (PIECE_T[g.type]){
        // addN / addE / xf 是「組」的欄位,不能跟著段參數一起被塞進 pieces[0]
        const { id, name, etype, mat, sect, on,
                addN, addE, xf, cable, ...rest } = g;
        const pc = { ...defaultPiece(g.type), ...rest, cont:false };
        return { ...defaultGroup("CURVE"), ...(id ? { id } : {}), name:name || "組",
          pieces:[pc], etype:etype || "BEAM", mat:mat || 1, sect:sect || 1,
          ...(on !== undefined ? { on } : {}),
          ...(addN ? { addN } : {}), ...(addE ? { addE } : {}), ...(xf ? { xf } : {}),
          ...(cable ? { cable } : {}) };
      }
      return { ...defaultGroup(g.type), ...g };
    });
    const s = normState({ ...DEF_STATE(), groups:gs });
    const E = [], W = [];
    return { md:buildModel(s, E, W), errs:E, warns:W, st:s };
  };
  // 多段的曲線組
  const buildPieces = (pieces, extra) => {
    const s = normState({ ...DEF_STATE(), groups:[{ ...defaultGroup("CURVE"), name:"組",
      // 舊測試用 cont / endCont 描述接續,這裡照 UI 的規則翻成 sRef / eRef
      pieces:pieces.map((pc, i) => ({ ...defaultPiece(pc.type), ...pc,
        sRef:pc.sRef !== undefined ? pc.sRef : (i === 0 ? "" : (pc.cont === false ? "" : "prev")),
        eRef:pc.eRef !== undefined ? pc.eRef
          : ((pc.endCont === true || pc.endCont === "1") ? (i+1) + ":s" : "") })),
      ...(extra || {}) }] });

    const md = buildModel(s, E, W);

  /* ---- 樁號格式 ---- */
  chk("F1","parseSta('0k+125.500')", parseSta("0k+125.500"), 125.5, 1e-12, "m");
  chk("F1","parseSta('1K+025')", parseSta("1K+025"), 1025, 1e-12, "m");

    const mdT = buildModel(B.st, ET, WT);
    yes("V3","撞到目標模型的編號會報錯",
      mdT.tclash === 5 && ET.some(e => e.indexOf("目標模型") >= 0),
      mdT.tclash + " 個 · " + ET.length + " 則錯誤", "5 個 · 有錯誤");
    const svT = state; state = B.st;
    const sb = safeBase();
    state = svT;
    yes("V3","安全號段推到已用最大號之上並取整", sb === 2001, sb, 2001);

    // 匯入組本身不算撞到目標模型(它就是那個模型)
    const IM2 = build([{ type:"IMPORT", name:"舊", imp:{ src:"t.mct", nodes:P.nodes, elems:P.elems } }]);
    IM2.st.target = { src:"t.mct", at:"", nodes:"11to13", elems:"21to22", names:["DECK"] };
    const E2 = [], W2 = [];
    const md2 = buildModel(IM2.st, E2, W2);
    yes("V3","匯入組不會被當成撞到目標模型", md2.tclash === 0 && !E2.length,
      md2.tclash + " 個 · " + E2.length + " 則錯誤", "0 個 · 無錯誤");

    // 編號偏移:位移複製一份匯入組時才不會撞號
    const IM3 = build([{ type:"IMPORT", name:"複本", renum:10000,
      imp:{ src:"t.mct", nodes:P.nodes, elems:P.elems } }]).md.groups[0];
    yes("V4","編號偏移套到節點與元素",
      IM3.nodes.map(n => n.num).join(",") === "10011,10012,10013" &&
      IM3.elems.map(e => e.num).join(",") === "10021,10022",
      IM3.nodes.map(n => n.num).join(",") + " / " + IM3.elems.map(e => e.num).join(","),
      "10011,10012,10013 / 10021,10022");
    yes("V4","偏移後不再原樣寫回舊資料列",
      elemLine(IM3.elems[0]).indexOf("10021,") === 0, elemLine(IM3.elems[0]), "10021, …");
  }

  yes("P4",".mct 全檔純 ASCII(中文在 midas 匯入會變亂碼)",
    ![...mctText()].some(c => c.charCodeAt(0) > 126), "無非 ASCII", "無非 ASCII");
  yes("P4","*GROUP 群組名為 ASCII",
    OUTF.md.names.every(n => /^[A-Za-z0-9_]+$/.test(n)), OUTF.md.names.join(" "), "全為英數底線");
  MODEL = sv.MODEL; state = sv.state;

  renderTests(rows);
  return rows;
}
function renderTests(rows){
  const nOk = rows.filter(r => r.ok).length, all = nOk === rows.length;
  const fmtV = v => typeof v === "number" ? (Math.abs(v) >= 1e6 ? v.toExponential(6) : v.toFixed(6)) : String(v);
  $("#tests").innerHTML =
    `<div style="font-size:12px;margin:6px 0"><span class="${all?"pass":"fail"}">${all?"✓ 全部通過":"✕ 有失敗項目"}</span>
       <span style="color:var(--ink-3)"> — ${nOk}/${rows.length}</span></div>
     <table class="tt"><thead><tr><th style="width:26px"></th><th style="width:32px">組</th><th>項目</th>
       <th style="width:96px">實際</th><th style="width:96px">預期</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✕"}</td>
      <td style="color:var(--ink-3)">${r.id}</td><td style="font-family:'Noto Sans TC',sans-serif">${esc(r.desc)}</td>
      <td>${esc(r.str ? r.actual : fmtV(r.actual))}</td><td>${esc(r.str ? r.expect : fmtV(r.expect))}</td></tr>`).join("") +
    `</tbody></table>`;
}

/* ==========================================================================
   啟動
   ========================================================================== */
normState(state);
recompute(true);
runTests();
// 驗收測試會借用真正的 state / MODEL 跑一堆模型,途中的 renderTree() / renderPane()
// 會把最後一個測試模型留在畫面上(state 本身有還原,只是畫面沒跟著回來)。
// 測完再畫一次,開檔看到的就一定是真正的狀態。
recompute(true);

</script>
</body>
</html>
