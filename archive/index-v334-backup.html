<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線形建模器 — 線形表轉 midas Civil 幾何</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%20-7%2044%2044'%3E%3Cpath%20d='M4%205C11%205%2013%2025%2022%2025s11%20-20%2018%20-20'%20fill='none'%20stroke='%230f62fe'%20stroke-width='4.5'%20stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f4f5f7; --ink:#161a20; --ink-2:#525a66; --ink-3:#868e9a;
    --line:#d5d9e0; --line-2:#e6e9ee; --panel:#fff;
    --accent:#0f62fe; --accent-soft:#e7f0ff;
    --ok:#198038; --warn:#8a6116; --err:#da1e28;
    --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  /* 整頁固定滿版:視窗不捲,只有清單 / 面板 / 訊息這些自己捲 */
  html,body{margin:0; height:100%; overflow:hidden}
  body{display:flex; flex-direction:column}
  header{flex:0 0 auto}
  body{background:var(--paper); color:var(--ink);
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:13px; line-height:1.55}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}

  header{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap;
    padding:9px 16px; border-bottom:1px solid var(--line); background:var(--panel)}
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.02em}
  /* 標誌就是「線」的圖示上下顛倒 —— 一條垂下來的線,三個節點 */
  /* 標誌:只有那條線,排在標題文字裡當一個字,對齊就交給行內排版 */
  header h1 .logo{color:var(--accent); vertical-align:-3px; margin-right:5px}
  header .stage{font-size:11px; padding:2px 8px; border-radius:6px;
    background:var(--accent-soft); color:var(--accent); font-weight:600}
  header .note{font-size:11px; color:var(--ink-3)}
  header .sp{flex:1}
  header button{font:inherit; font-size:11.5px; padding:4px 10px; border-radius:2px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer}
  header button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  header button:disabled{opacity:.4; cursor:default}
  header .hgap{width:18px; display:inline-block}
  /* 全域設定:和「復原 / 重做」隔開,而且看得出來是另一類的東西 */
  header button.gset{border-color:var(--accent); color:var(--accent); font-weight:650}
  header button.gset:hover{background:var(--accent-soft)}
  header button.gset.on{background:var(--accent); border-color:var(--accent); color:#fff}
  header button.warn{border-color:#f5c2c0; color:var(--err); font-weight:600}
  header button.warn:hover:not(:disabled){border-color:var(--err); background:#fff1f1; color:var(--err)}
  header .units{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-3);
    padding:2px 8px 2px 9px; border:1px solid var(--line); border-radius:3px; background:#f9fafb}
  header .units select{font:inherit; font-size:11.5px; font-weight:650; width:auto; padding:1px 4px;
    border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--accent); cursor:pointer}

  #app{display:grid; grid-template-columns:var(--tw,150px) 7px minmax(0,1fr) 7px var(--rw,330px);
    flex:1 1 auto; min-height:0}
  #tree, #tresizer, #pane, #resizer, #right{grid-row:1}   /* 釘在同一列,否則對調後會被擠到下一列 */
  #tree{grid-column:1} #tresizer{grid-column:2} #pane{grid-column:3}
  #resizer{grid-column:4} #right{grid-column:5}
  #app.swap #right{grid-column:3; border-left:0} #app.swap #pane{grid-column:5}
  /* 沒選任何群組時,編輯區沒東西可編,整塊收掉把空間讓給畫布 */
  #app.nosel{grid-template-columns:var(--tw,150px) 7px 0 0 minmax(0,1fr)}
  #app.nosel #pane, #app.nosel #resizer{display:none}
  #app.nosel #right, #app.nosel.swap #right{grid-column:5; border-left:1px solid var(--line)}
  #resizer, #tresizer{position:relative; background:#eef0f3; border-left:1px solid var(--line);
    border-right:1px solid var(--line); cursor:col-resize; user-select:none}
  #resizer:hover, #resizer.on, #tresizer:hover, #tresizer.on{background:var(--accent-soft)}
  #resizer::after, #tresizer::after{content:"⋮"; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); color:var(--ink-3); font-size:12px; line-height:1}
  @media(max-width:1180px){
    /* 窄版本來是上下堆疊;沒選群組時讓畫布直接補到第一列,不留空白 */
    #app.nosel{grid-template-columns:var(--tw,150px) 7px minmax(0,1fr)}
    #app.nosel #right, #app.nosel.swap #right{grid-column:3; grid-row:1;
      border-top:0; border-left:1px solid var(--line)}
    #app{grid-template-columns:var(--tw,150px) 7px minmax(0,1fr)}
    #resizer{display:none}
    #tree{grid-column:1; grid-row:1} #tresizer{grid-column:2; grid-row:1}
    #pane, #app.swap #pane{grid-column:3; grid-row:1}
    #right, #app.swap #right{grid-column:1/-1; grid-row:2; border-left:0; border-top:1px solid var(--line)} }
  @media(max-width:740px){
    html,body{height:auto; overflow:visible}
    body{display:block}
    #right{overflow:visible}
    #right > #tests-wrap{max-height:none}
    #right > .cvwrap{min-height:300px}
    #app, #app.nosel{grid-template-columns:minmax(0,1fr); height:auto}
    #app.nosel #right, #app.nosel.swap #right{grid-column:1; grid-row:2; border-left:0}
    #tresizer{display:none}
    #tree{grid-column:1; grid-row:1}
    #pane, #app.swap #pane{grid-column:1; grid-row:2}
    #right, #app.swap #right{grid-column:1; grid-row:3}
    #tree{border-right:0; border-bottom:1px solid var(--line); max-height:230px} }

  /* ---- 樹 ---- */
  #tree{background:#fafbfc; border-right:1px solid var(--line); overflow:hidden; font-size:12px;
    display:flex; flex-direction:column; min-height:0}
  #treelist{flex:1 1 auto; overflow:auto; padding:6px 0; min-height:0}
  /* 統計數字釘在左欄底下:只是「大概看一下」的東西,不值得佔畫布上方一整條 */
  #tree .kpi{flex:0 0 auto; border:0; border-top:1px solid var(--line); border-radius:0;
    background:#f4f5f7; padding:5px 10px 7px; font-size:10px; gap:0;
    grid-template-columns:minmax(0,1fr)}
  #tree .kpi > div{display:flex; align-items:baseline; gap:6px; justify-content:space-between;
    min-width:0; line-height:1.5}
  #tree .kpi .k{display:inline; font-size:9.5px; flex:0 1 auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #tree .kpi b{font-size:10.5px; white-space:nowrap; flex:0 0 auto}
  #tree .grp{font-size:10px; letter-spacing:.06em; color:var(--ink-3); font-weight:700;
    padding:9px 10px 4px; text-transform:uppercase}
  #tree .it{display:flex; align-items:center; gap:6px; padding:5px 8px 5px 11px; cursor:pointer; color:var(--ink-2)}
  #tree .it:hover{background:#eef1f5}
  #tree .it.on{background:var(--accent-soft); color:var(--accent); font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
  /* 多選:一起被選到、但不是「主要」那一個 */
  #tree .it.msel{background:#eef4ff; color:var(--accent); box-shadow:inset 2px 0 0 #8ab0ff}
  #tree .it.err{color:var(--err)}
  #tree .it .sw{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
  #tree .it .sw.off{background:#c9cfd8 !important}
  /* 型別欄改成圖示:產品線用組的主題色(currentColor),背景線固定淺灰 */
  #tree .it .ic{display:flex; flex:0 0 auto; line-height:0}
  #tree .it .ic.off{color:#aeb6c2 !important; opacity:.6}
  #tree .it .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #tree .it .meta{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--ink-3);
    flex:0 0 auto; display:none; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  #tree .it:hover .meta, #tree .it.on .meta{display:inline}
  #tree .it.on .meta{color:var(--accent)}
  #tree .addwrap{padding:7px 8px 7px 11px; position:relative}
  #tree .addbtn{font:inherit; font-size:11.5px; color:var(--accent); background:none; border:0;
    cursor:pointer; padding:0; font-weight:600}
  /* 新增群組的選單掛在 body 上(和右鍵選單一樣),左欄再窄也不會被裁掉 */
  .addmenu{width:min(336px, calc(100vw - 16px)); padding:5px}
  .addmenu .mh{font-size:9.5px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; padding:5px 8px 3px}
  .addmenu .mcards{display:grid; gap:6px; padding:2px 3px 4px}
  .addmenu .mcards button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 5px;
    border:1px solid var(--line); border-radius:3px; background:#fff; text-align:center; color:var(--ink-2)}
  .addmenu .mcards button:hover{border-color:var(--accent); background:#fff; color:var(--accent)}
  .addmenu .mcards .mn{font-size:12.5px; font-weight:600}
  .addmenu .mcards .mh2{font-size:10px; color:var(--ink-3); line-height:1.35}
  .addmenu .mcards button:hover .mh2{color:var(--accent)}

  /* ---- 面板 ---- */
  #pane{padding:13px 15px 40px; overflow:auto; min-width:0}
  .ptitle{display:flex; align-items:center; gap:8px; margin-bottom:11px; flex-wrap:wrap}
  .ptitle .nm{font-size:15px; font-weight:650}
  .fam{font-size:9.5px; padding:1px 7px; border-radius:3px; font-weight:600}
  .fam.geo{background:var(--accent-soft); color:var(--accent)}
  .fam.con{background:#eee9f7; color:#6f4a9b}
  .ptitle .sp{flex:1}
  .sec{border:1px solid var(--line); border-radius:3px; margin-bottom:9px; background:var(--panel)}
  .sec > .h{padding:6px 12px; background:#fafbfc; border-bottom:1px solid var(--line-2);
    font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:700;
    display:flex; align-items:center; gap:8px}
  .sec > .h .tail{margin-left:auto; font-family:var(--mono); font-size:10.5px; letter-spacing:0; text-transform:none}
  .sec > .b{padding:10px 12px}
  .fields{display:grid; gap:8px 10px}
  /* 起點欄位與終點欄位之間畫一條淡線,兩顆「圖上點」才不會分不出來 */
  .fields.rowsep{border-top:1px dashed var(--line-2); margin-top:9px; padding-top:9px}
  /* 座標一律排成 X / Y / Z 三欄,起點與終點上下對齊 —— 不讓 Z 被擠到下一行 */
  .xyz{display:grid; grid-template-columns:56px repeat(3,minmax(0,1fr)); gap:4px 8px; align-items:center}
  .xyz > .h{font-size:10px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; text-align:center}
  .xyz > .rl{font-size:11px; color:var(--ink-2); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .xyz > .na{font-size:11px; color:var(--ink-3); text-align:center}
  .xyz.t5{grid-template-columns:56px repeat(3,minmax(0,1fr)) auto}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  /* 欄位排版對 <label>(有標籤的輸入)與 <div>(只有按鈕的那一格)一視同仁 ——
     只寫 label.f 的話,「圖上點起點」那種按鈕格會掉出網格的對齊基準 */
  .f{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-2); min-width:0}
  .f > span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:14px}
  /* 按鈕格:上緣和旁邊的輸入框切齊,不要被網格拉長 */
  div.f > .btn{align-self:stretch}
  input[type=text], input[type=number], select, textarea{
    font:inherit; font-family:var(--mono); font-size:12.5px; padding:4px 6px;
    border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); width:100%; min-width:0}
  select{font-family:inherit}
  textarea{resize:vertical}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  input.bad{border-color:var(--err); background:#fff1f1}
  /* 用不到的欄位要看得出來是用不到的(例如放置方式沒選到的那兩個) */
  input:disabled, select:disabled, textarea:disabled{background:#eef0f3; color:var(--ink-3); cursor:not-allowed}
  .chk{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); cursor:pointer}
  .cpick{display:flex; gap:5px; align-items:stretch; min-width:0}
  .cpick input[type=color]{flex:1 1 auto; min-width:0; height:27px; padding:1px 2px;
    border:1px solid var(--line); border-radius:2px; background:#fff; cursor:pointer}
  .cpick button{flex:0 0 auto; font:inherit; font-size:11px; padding:0 8px; border-radius:2px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer}
  .cpick button:hover{border-color:var(--accent); color:var(--accent)}
  .cpick button.on{color:var(--ink-3)}
  .lbl2{font-size:11px; color:var(--ink-2); margin:9px 0 4px}
  .pcards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
  .pcards button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 4px;
    border:1px solid var(--line); border-radius:3px; background:#fff; cursor:pointer;
    font:inherit; color:var(--ink-2); text-align:center; line-height:1.3}
  .pcards button:hover{border-color:var(--accent)}
  .pcards button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .pcards .ic{display:flex; line-height:0}
  .pcards .pn{font-size:11.5px; font-weight:600}
  .pcards .ph{font-size:9.5px; color:var(--ink-3)}
  .pcards button.on .ph{color:var(--accent)}
  .out{font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
    display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:3px 14px}
  .out b{color:var(--ink); font-weight:650}
  .out .k{color:var(--ink-3); font-family:inherit}
  .hint{font-size:11px; color:var(--ink-3); margin-top:7px}
  /* 一定要看到的說明(不進 i 收合) */
  .note{font-size:10.5px; color:var(--ink-2); margin-top:6px; background:#f9fafb;
    border:1px solid var(--line-2); border-radius:2px; padding:5px 8px}
  .note b{color:var(--ink)}
  /* 提示預設收起,每個區塊只留一顆 i */
  .ibtn{flex:0 0 auto; width:17px; height:17px; border-radius:50%; border:1px solid var(--line);
    background:#fff; color:var(--ink-3); font-size:10.5px; font-weight:700; line-height:1;
    font-family:Georgia,"Times New Roman",serif; cursor:pointer; padding:0; margin-left:7px;
    letter-spacing:0; text-transform:none}
  .ibtn:hover{border-color:var(--accent); color:var(--accent)}
  .ibtn.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .hintbar{display:flex; flex-direction:column; align-items:flex-start; gap:0}
  .hintbar > .ibtn{margin:7px 0 0}
  .hint:empty{display:none}   /* 唯讀的即時結果行沒內容時不佔位(syncRO 只換 innerHTML,不能靠 style 切換) */
  .hint b{color:var(--ink-2)}

  .btn{font:inherit; font-size:12px; padding:5px 11px; border-radius:2px; border:1px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.p{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.p:hover{background:#0043ce; color:#fff}
  .btn.d:hover{border-color:var(--err); color:var(--err)}
  /* 啟用 / 停用:狀態直接寫在按鈕上,不用再去看小方框 */
  .btn.tog{padding-left:22px; position:relative}
  .btn.tog::before{content:""; position:absolute; left:9px; top:50%; width:7px; height:7px;
    border-radius:50%; transform:translateY(-50%); background:var(--ink-3)}
  .btn.tog.on{border-color:var(--ok); color:var(--ok)}
  .btn.tog.on::before{background:var(--ok)}
  .btn.tog:not(.on){color:var(--ink-3); background:#f4f5f7}
  .btns{display:flex; gap:6px; flex-wrap:wrap}
  /* 切換鈕:按下顯示主題色,未按下維持系統色 */
  .tgl{font:inherit; font-size:13px; font-weight:650; padding:8px 16px; border-radius:3px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; line-height:1.2}
  .tgl:hover{border-color:var(--accent); color:var(--accent)}
  .tgl .dot{width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; flex:0 0 auto}
  .tgl.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .tgl.on:hover{background:#0043ce; color:#fff}
  .tgl.on .dot{background:#fff; border-color:#fff}
  /* 目前選取的節點/元素:整個區塊高亮,才看得出要在哪裡編輯 */
  .sec.hot{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .sec.hot > .h{background:var(--accent-soft); color:var(--accent)}

  table.t{width:100%; border-collapse:collapse; font-size:11.5px}
  table.t th{text-align:left; font-size:10px; color:var(--ink-3); font-weight:600;
    padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
  table.t td{padding:3px 6px; border-bottom:1px solid var(--line-2); font-family:var(--mono); vertical-align:middle}
  table.t td.n{font-family:inherit}
  table.t tr:last-child td{border-bottom:none}
  table.t td.hot{color:var(--warn); font-weight:600}
  table.t select, table.t input{padding:2px 4px; font-size:11.5px}
  .iconbtn{border:1px solid var(--line); background:#fff; border-radius:2px; cursor:pointer;
    width:21px; height:21px; padding:0; color:var(--ink-2); font-size:11px; line-height:1}
  .iconbtn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
  .iconbtn.danger:hover{background:#fff1f1; color:var(--err); border-color:var(--err)}

  /* ---- 右欄 ---- */
  #right{background:#f9fafb; border-left:1px solid var(--line); display:flex; flex-direction:column;
    overflow:hidden; min-height:0; padding:10px 12px 11px; gap:8px}
  #right > #msgs{flex:0 0 auto; max-height:24%; overflow:auto}
  #right > .lbl, #right > .legend, #right > .kpi{flex:0 0 auto}
  #right > .cvwrap{flex:1 1 auto; min-height:170px}
  /* 驗收測試展開時自己捲,不要把畫布擠掉 */
  #right > #tests-wrap{flex:0 0 auto; max-height:46%; overflow:auto}
  .lbl{font-size:10.5px; letter-spacing:.09em; color:var(--ink-3); font-weight:700}
  .cvwrap{position:relative}
  canvas{width:100%; height:100%; display:block; background:#fff; border:1px solid var(--line);
    border-radius:3px; cursor:crosshair}
  .cvwrap{min-height:0}
  #cv{height:100%; cursor:crosshair}
  /* midas 風格的九宮格視角鈕:中間俯視、四邊立面、四角 45° 斜視 */
  .viewcube{position:absolute; top:6px; right:6px; display:grid; gap:3px; padding:4px;
    grid-template-columns:repeat(3,29px); grid-template-rows:repeat(3,29px);
    background:rgba(255,255,255,.78); border:1px solid var(--line); border-radius:4px}
  .viewcube button{font:inherit; font-size:11.5px; line-height:1; padding:0; cursor:pointer;
    border:1px solid var(--line-2); background:rgba(255,255,255,.92); color:var(--ink-2);
    border-radius:2px; display:flex; align-items:center; justify-content:center}
  .viewcube button:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .viewcube button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .viewcube button.cor{font-size:14px; color:var(--ink-3)}
  .viewcube button.cor:hover{color:var(--accent)}
  /* .cor 寫在 .on 後面,同權重會蓋掉選取色 —— 補一條讓箭頭跟著文字一起變白 */
  .viewcube button.cor.on{color:#fff}
  .viewcube button.top{font-size:9.5px; font-weight:700; letter-spacing:.06em}
  .cvtools{position:absolute; top:6px; left:6px; display:flex; gap:4px; flex-wrap:wrap;
    align-items:center; max-width:calc(100% - 122px)}
  /* 每一顆都同高、同框:按鈕和「方位 / 仰角」那種輸入框看起來才是一排 */
  .cvtools > button, .cvtools > .tag, .cvtools > select{font:inherit; font-size:10.5px;
    height:23px; padding:0 7px; border-radius:2px; width:auto; display:inline-flex;
    align-items:center; gap:5px; box-sizing:border-box;
    border:1px solid var(--line); background:rgba(255,255,255,.93); color:var(--ink-2); cursor:pointer}
  .cvtools > button:hover{border-color:var(--accent); color:var(--accent)}
  /* 輸入框長在 .tag 裡面,自己不要再畫一層框 */
  .cvtools .tag{font-family:var(--mono); cursor:default; color:var(--ink-3)}
  .cvtools .tag input{font:inherit; font-size:10.5px; font-family:var(--mono); width:46px;
    height:19px; padding:0 2px; text-align:right; cursor:text;
    border:0; background:transparent; color:var(--ink-2)}
  .cvtools .tag input:focus{outline:1px solid var(--accent-soft); border-radius:2px}
  .cvtools button svg{flex:0 0 auto}
  .cvtools button.off{color:var(--ink-3)}
  .cvtools > button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .cvtools > button.on:hover{color:#fff}
  .readout{position:absolute; left:6px; bottom:6px; background:rgba(255,255,255,.94);
    border:1px solid var(--line); border-radius:2px; padding:3px 7px; font-family:var(--mono);
    font-size:10.5px; color:var(--ink-2); pointer-events:none; white-space:pre}
  .readout:empty{display:none}
  .kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:4px 12px;
    font-family:var(--mono); font-size:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:3px; padding:8px 10px}
  .kpi .k{font-family:inherit; font-size:9.5px; color:var(--ink-3); display:block}
  .kpi b{font-size:12.5px; font-weight:650}
  .kpi b.hot{color:var(--warn)}
  .msg{display:flex; gap:6px; padding:5px 9px; border-radius:2px; margin-bottom:4px; font-size:11.5px; align-items:flex-start}
  .msg.err{background:#fff1f1; color:var(--err); border:1px solid #f5c2c0}
  .msg.warn{background:#fdf6e3; color:var(--warn); border:1px solid #ecdcaf}
  #msgs:empty{display:none}
  .legend{display:flex; gap:9px; flex-wrap:wrap; font-size:10.5px; color:var(--ink-2)}
  .legend i{display:inline-block; width:11px; height:3px; border-radius:2px; margin-right:4px; vertical-align:middle}

  details.adv{border-top:1px dashed var(--line-2); margin-top:9px; padding-top:7px}
  details.adv > summary{cursor:pointer; font-size:11px; color:var(--ink-3); font-weight:600; list-style:none}
  details.adv > summary::-webkit-details-marker{display:none}
  details.adv > summary::before{content:"▸ "; font-size:9px}
  details.adv.elem > summary{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-2)}
  details.adv.elem > summary .tag{font-size:10px; font-weight:600; padding:1px 7px; border-radius:3px}
  details.adv.elem > summary .tag.ok{background:#e6f4ea; color:var(--ok); font-family:var(--mono)}
  details.adv.elem > summary .tag.todo{background:#fdf6e3; color:var(--warn)}
  details.adv[open] > summary::before{content:"▾ "}
  details.adv > div{margin-top:8px}

  details.pc{border:1px solid var(--line); border-radius:3px; margin-bottom:7px; background:#ffffff; overflow:hidden}
  details.pc > summary{list-style:none; cursor:pointer; padding:6px 9px; display:flex; align-items:center; gap:7px;
    background:#fafbfc; font-size:12px}
  details.pc > summary::-webkit-details-marker{display:none}
  details.pc > summary::before{content:"▸"; color:var(--ink-3); font-size:9px}
  details.pc[open] > summary::before{content:"▾"}
  details.pc[open] > summary{border-bottom:1px solid var(--line-2); background:#fff}
  details.pc .idx{width:18px; height:18px; border-radius:2px; background:var(--accent); color:#fff;

  details.pc > summary select{width:auto; padding:2px 5px; font-size:11.5px}
  details.pc .st{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
  details.pc .pcb{padding:10px 11px}
  details.pc .grip{cursor:grab; color:var(--ink-3); font-size:13px; line-height:1; padding:0 3px; user-select:none}
  details.pc .grip:hover{color:var(--accent)}

  details.pc.over{box-shadow:0 -2px 0 var(--accent)}

  #tree .it.over{box-shadow:inset 0 2px 0 var(--accent)}
  .zbox{display:flex; align-items:center; gap:4px}
  .zbox input{width:52px; font-family:var(--mono); font-size:10.5px; padding:1px 4px;
    border:1px solid var(--line); border-radius:2px; text-align:right}
  /* 「1:1」= 把 Z 放大倍率歸位。做成和工具列同一套字體的小膠囊,不再是一段裸露的藍字。 */
  .cvtools .zbox{padding-right:3px}
  .cvtools .zbox .zfit{font:inherit; font-family:var(--mono); font-size:9.5px; letter-spacing:.02em;

  .cvtools .zbox .zfit.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .nodepick{position:absolute; pointer-events:none}

  #tests table.tt{width:100%; border-collapse:collapse; font-size:11px; font-family:var(--mono)}
  #tests th{text-align:left; font-family:inherit; font-size:10px; color:var(--ink-3);
    font-weight:600; padding:3px 6px; border-bottom:1px solid var(--line)}

  /* 組的右鍵 / ⋯ 選單 */
  .subh{font-size:10.5px; font-weight:700; color:var(--ink-3); letter-spacing:.04em;
    margin:14px 0 7px; padding-top:9px; border-top:1px solid var(--line-2)}
  .ctx{position:fixed; z-index:60; background:#fff; border:1px solid var(--line); border-radius:4px;

  .mask{position:fixed; inset:0; z-index:70; background:rgba(20,22,26,.34);
    display:flex; align-items:center; justify-content:center}

</style>
</head>

        <span class="tag zbox">Z ×<input type="number" step="any" id="zsc" title="Z 軸放大倍率"><button type="button" id="zauto" class="zfit" title="回到 Z 不放大(1:1)">1:1</button></span>

        <button data-k="E" data-az="0" data-el="0" title="東側立面(往西看)">東</button>
        <button class="cor" data-k="SW" data-az="135" data-el="20" title="西南 20°">↗</button>
        <button data-k="S" data-az="90" data-el="0" title="南側立面(往北看)">南</button>
        <button class="cor" data-k="SE" data-az="45" data-el="20" title="東南 20°">↖</button>

<script>
"use strict";
/* ==========================================================================
   線形建模器 v3 — 群組架構
   一組 = 一串節點 + 連接它們的元素。組與組預設互不相干,起終點在全域座標直接給。
   ========================================================================== */

/* ==========================================================================
   1. 基礎工具
   ========================================================================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const norm360 = a => { a %= 360; return a < 0 ? a + 360 : a; };
// 仰角用 (-180, 180]:轉過 ±90 的極點時 cos 變號,上方向自然翻面,不會卡住
const norm180 = a => { const v = ((a + 180) % 360 + 360) % 360 - 180; return v === -180 ? 180 : v; };
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
/* 「第幾個節點」這類序號欄位的合法範圍永遠是 1..max:
   超過上限就停在上限(不繞回頭,免得「連到最後一個」被打成「連到第一個」),
   0 或負值則從上限往回扣(0 → max、−1 → max−1),跟方位角一樣不出現負值。 */
const wrapIndex = (v, max) => {
  if (!Number.isFinite(v)) return 1;
  v = Math.round(v);
  if (!Number.isFinite(max) || max < 1) return Math.max(1, v);
  if (v > max) return max;
  if (v >= 1) return v;
  return ((v - 1) % max + max) % max + 1;
};
const num = v => Number.isFinite(+v) ? +v : NaN;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- 時間一律用本機時區 ----------
   toISOString() 是 UTC,台灣會少 8 小時;檔名與檔頭都要看得懂,所以自己組本機時間。 */
const p2 = n => String(n).padStart(2, "0");
const localParts = (d = new Date()) => ({ Y:d.getFullYear(), M:p2(d.getMonth()+1), D:p2(d.getDate()),
  h:p2(d.getHours()), m:p2(d.getMinutes()), s:p2(d.getSeconds()) });
// 時區偏移字串(+08:00),讓存下來的時間戳自帶時區、日後不會誤讀
const tzOffset = (d = new Date()) => {
  const o = -d.getTimezoneOffset(), sg = o >= 0 ? "+" : "-", a = Math.abs(o);
  return `${sg}${p2(Math.floor(a/60))}:${p2(a%60)}`;
};
const localStampText = d => { const t = localParts(d); return `${t.Y}-${t.M}-${t.D} ${t.h}:${t.m}`; };
const localStampFile = d => { const t = localParts(d); return `${t.Y}${t.M}${t.D}${t.h}${t.m}`; };
const localStampISO = d => { const t = localParts(d);
  return `${t.Y}-${t.M}-${t.D}T${t.h}:${t.m}:${t.s}${tzOffset(d)}`; };

function fmtSta(s){
  // k+ 是「公里 + 公尺」的路線慣例,單位不是公尺時退回純數字才不會誤導
  if (typeof state !== "undefined" && state && state.units && state.units.length !== "M")
    return (+s).toFixed(3);
  const neg = s < 0, v = Math.abs(s);
  const km = Math.floor(v / 1000), m = v - km * 1000;
  return (neg ? "-" : "") + km + "k+" + m.toFixed(3).padStart(7, "0");
}
function parseSta(txt){
  if (txt == null) return NaN;
  const t = String(txt).trim().toLowerCase().replace(/\s+/g, "");
  if (t === "") return NaN;
  const m = t.match(/^(-?)(\d+)k\+(\d+(?:\.\d+)?)$/);
  if (m) return (m[1] ? -1 : 1) * (parseInt(m[2], 10) * 1000 + parseFloat(m[3]));
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}

const V = {
  sub:(a,b) => ({ x:a.x-b.x, y:a.y-b.y, z:a.z-b.z }),
  add:(a,b) => ({ x:a.x+b.x, y:a.y+b.y, z:a.z+b.z }),
  mul:(a,k) => ({ x:a.x*k, y:a.y*k, z:a.z*k }),
  dot:(a,b) => a.x*b.x + a.y*b.y + a.z*b.z,
  cross:(a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x }),
  len:a => Math.hypot(a.x, a.y, a.z),
  unit:a => { const L = V.len(a) || 1; return { x:a.x/L, y:a.y/L, z:a.z/L }; }
};
const dist3 = (a,b) => Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z);
const distXY = (a,b) => Math.hypot(b.x-a.x, b.y-a.y);
// 方位角:自 +Y(北)順時針
const azOf = (dx,dy) => norm360(Math.atan2(dx, dy) * R2D);

/* ==========================================================================
   2. 縱斷面(VPI + 對稱拋物線豎曲線)— 線形鏈專用
   ========================================================================== */
function buildProfile(rows, warns, errs, tag){
  const P = (rows || []).map(r => ({ sta:num(r.sta), z:num(r.z), L:Math.max(0, num(r.L) || 0) }))
    .filter(r => Number.isFinite(r.sta) && Number.isFinite(r.z))
    .sort((a,b) => a.sta - b.sta);
  if (P.length < 2) return null;                       // 無縱斷面 → 用起點高程
  P[0].L = 0; P[P.length-1].L = 0;

  const g = [];
  for (let i = 0; i < P.length - 1; i++){
    const dS = P[i+1].sta - P[i].sta;
    if (dS <= 1e-9){ errs.push(`${tag}縱斷面:VPI ${i+1} 與 ${i+2} 樁號重複`); return null; }
    g.push((P[i+1].z - P[i].z) / dS);
  }
  const curves = [];
  for (let i = 1; i < P.length - 1; i++){
    const gin = g[i-1], gout = g[i], L = P[i].L, dg = gout - gin;
    if (L <= 1e-9){
      if (Math.abs(dg) > 1e-9)
        warns.push(`${tag}VPI ${i+1}(${fmtSta(P[i].sta)})豎曲線長 = 0,坡度直接折角`);
      continue;
    }
    curves.push({ i, sta:P[i].sta, z:P[i].z, L, gin, gout,
      BVC:P[i].sta - L/2, EVC:P[i].sta + L/2, E:dg*L/8,
      K:Math.abs(dg) > 1e-12 ? L / Math.abs(dg*100) : Infinity });
  }
  for (let j = 0; j < curves.length; j++){
    const c = curves[j];
    if (c.BVC < P[0].sta - 1e-9 || c.EVC > P[P.length-1].sta + 1e-9)
      errs.push(`${tag}VPI ${c.i+1} 的豎曲線 ${fmtSta(c.BVC)}–${fmtSta(c.EVC)} 超出縱斷面範圍`);
    if (j > 0 && curves[j-1].EVC > c.BVC + 1e-9)
      errs.push(`${tag}VPI ${curves[j-1].i+1} 與 ${c.i+1} 的豎曲線重疊`);
  }
  return { P, g, curves };
}
function zAt(pr, s){
  if (!pr) return 0;
  const { P, g, curves } = pr, n = P.length;
  if (s <= P[0].sta)   return P[0].z + g[0] * (s - P[0].sta);
  if (s >= P[n-1].sta) return P[n-1].z + g[n-2] * (s - P[n-1].sta);
  for (const c of curves)
    if (s >= c.BVC - 1e-9 && s <= c.EVC + 1e-9){
      const x = s - c.BVC;
      return c.z - c.gin*(c.L/2) + c.gin*x + (c.gout - c.gin)*x*x/(2*c.L);
    }
  for (let i = 0; i < n - 1; i++)
    if (s >= P[i].sta - 1e-9 && s <= P[i+1].sta + 1e-9) return P[i].z + g[i]*(s - P[i].sta);
  return P[n-1].z;
}
function gradeAt(pr, s){
  if (!pr) return 0;
  const { P, g, curves } = pr, n = P.length;
  if (s <= P[0].sta)   return g[0];
  if (s >= P[n-1].sta) return g[n-2];
  for (const c of curves)
    if (s >= c.BVC - 1e-9 && s <= c.EVC + 1e-9)
      return c.gin + (c.gout - c.gin)*(s - c.BVC)/c.L;
  for (let i = 0; i < n - 1; i++)
    if (s >= P[i].sta - 1e-9 && s <= P[i+1].sta + 1e-9) return g[i];
  return 0;
}

/* ==========================================================================
   3. 線形鏈:直線 / 圓弧 / 緩和曲線 段落(平面里程 = 樁號)
   ========================================================================== */
function buildSegment(seg, st, i, errs){
  const bad = t => { errs.push(`段 ${i+1}:${t}`); return null; };
  const az0R = st.az * D2R;
  const fin = (length, evalLocal, extra) => {
    const e = evalLocal(length);
    return { i, type:seg.type, src:seg, s0:st.s, s1:st.s + length, length,
      start:{ x:st.x, y:st.y, az:st.az }, end:{ x:e.x, y:e.y, az:e.az }, evalLocal, extra };
  };

  if (seg.type === "LINE"){
    const L = num(seg.L);
    if (!(L > 0)) return bad("直線長度必須 > 0");
    return fin(L, t => ({ x:st.x + t*Math.sin(az0R), y:st.y + t*Math.cos(az0R), az:st.az, k:0 }), { R:Infinity });
  }

  if (seg.type === "ARC"){
    const R = num(seg.R), dir = num(seg.dir);
    if (!(R > 0)) return bad("圓弧半徑必須 > 0");
    let L;
    if (seg.defBy === "delta"){
      const d = num(seg.delta);
      if (!(d > 0)) return bad("圓弧偏角必須 > 0");
      if (d >= 360) return bad("圓弧偏角必須 < 360°");
      L = R * d * D2R;
    } else {
      L = num(seg.L);
      if (!(L > 0)) return bad("圓弧弧長必須 > 0");
      if (L / R >= 2*Math.PI) return bad("圓弧弧長超過一整圈");
    }
    const Cx = st.x + R*Math.sin((st.az + dir*90)*D2R);
    const Cy = st.y + R*Math.cos((st.az + dir*90)*D2R);
    const b0 = (st.az - dir*90)*D2R;
    return fin(L, t => {
      const b = b0 + dir*(t/R);
      return { x:Cx + R*Math.sin(b), y:Cy + R*Math.cos(b),
               az:norm360(st.az + dir*(t/R)*R2D), k:dir/R };
    }, { R, dir, center:{ x:Cx, y:Cy }, delta:L/R*R2D });
  }

  if (seg.type === "SPIRAL"){
    const dir = num(seg.dir);
    const R0 = seg.R0inf ? null : num(seg.R0);
    const R1 = seg.R1inf ? null : num(seg.R1);
    if (R0 === null && R1 === null) return bad("緩和曲線 R0、R1 不可同時為 ∞");
    if (R0 !== null && !(R0 > 0)) return bad("緩和曲線起始半徑必須 > 0");
    if (R1 !== null && !(R1 > 0)) return bad("緩和曲線終止半徑必須 > 0");
    let Ls;
    if (seg.defBy === "A"){
      const A = num(seg.A);
      if (!(A > 0)) return bad("緩和曲線 A 值必須 > 0");
      if (R0 !== null && R1 !== null) return bad("R0、R1 皆有限時 A 值無定義,請改用 Ls");
      Ls = A*A / (R0 === null ? R1 : R0);
    } else {
      Ls = num(seg.Ls);
      if (!(Ls > 0)) return bad("緩和曲線長度必須 > 0");
    }
    const k0 = R0 === null ? 0 : 1/R0, k1 = R1 === null ? 0 : 1/R1;
    const azAt = t => az0R + dir*(k0*t + (k1-k0)*t*t/(2*Ls));
    const n = 4000, hh = Ls/n;                      // 固定分割數 → 與長度單位無關
    const cx = new Float64Array(n+1), cy = new Float64Array(n+1);
    cx[0] = st.x; cy[0] = st.y;
    for (let j = 0; j < n; j++){
      const a = j*hh, m = a + hh/2, b = a + hh;
      cx[j+1] = cx[j] + (hh/6)*(Math.sin(azAt(a)) + 4*Math.sin(azAt(m)) + Math.sin(azAt(b)));
      cy[j+1] = cy[j] + (hh/6)*(Math.cos(azAt(a)) + 4*Math.cos(azAt(m)) + Math.cos(azAt(b)));
    }
    return fin(Ls, t => {
      if (t <= 0)  return { x:cx[0], y:cy[0], az:st.az, k:dir*k0 };
      if (t >= Ls) return { x:cx[n], y:cy[n], az:norm360(azAt(Ls)*R2D), k:dir*k1 };
      const j = Math.min(n-1, Math.floor(t/hh)), a = j*hh, r = t - a;
      return {
        x: cx[j] + (r/6)*(Math.sin(azAt(a)) + 4*Math.sin(azAt(a+r/2)) + Math.sin(azAt(a+r))),
        y: cy[j] + (r/6)*(Math.cos(azAt(a)) + 4*Math.cos(azAt(a+r/2)) + Math.cos(azAt(a+r))),
        az: norm360(azAt(t)*R2D), k: dir*(k0 + (k1-k0)*t/Ls)
      };
    }, { R0, R1, dir, Ls, A:(R0 === null || R1 === null) ? Math.sqrt(Ls*(R0 === null ? R1 : R0)) : null });
  }
  return bad("未知段落型別 " + seg.type);
}

// 建立整條線形鏈:回傳 { segs, total, prof, errs, warns }
function buildChain(g, errs, warns){
  const tag = `「${g.name}」`;
  let cur = { x:num(g.x), y:num(g.y), az:norm360(num(g.az)), s:num(g.sta) };
  if (![cur.x, cur.y, cur.az, cur.s].every(Number.isFinite)){
    errs.push(tag + "起始設定含無效數值"); return null;
  }
  const segs = [];
  (g.segments || []).forEach((seg, i) => {
    const b = buildSegment(seg, cur, i, errs.map ? { push:t => errs.push(tag + t) } : errs);
    if (!b) return;
    segs.push(b);
    cur = { x:b.end.x, y:b.end.y, az:b.end.az, s:b.s1 };
  });
  const total = segs.reduce((a,b) => a + b.length, 0);
  const prof = buildProfile(g.profile, warns, errs, tag);
  const z0 = num(g.z) || 0;
  if (prof && segs.length){
    const s0 = segs[0].s0, s1 = segs[segs.length-1].s1;
    if (s0 < prof.P[0].sta - 1e-3 || s1 > prof.P[prof.P.length-1].sta + 1e-3)
      warns.push(tag + `縱斷面範圍未涵蓋線形,超出部分以端點坡度外插`);
  }
  return { segs, total, prof, z0,
    zAtS: s => prof ? zAt(prof, s) : z0,
    gradeAtS: s => prof ? gradeAt(prof, s) : 0 };
}

/* ==========================================================================
   4. 簡單曲線:直線 / 圓弧 / 懸垂 / 螺旋
   共同介面 { ok, pt(u) → {x,y,z}, meta, err }
   u ∈ [0,1] 為型別自然參數;弧長由取樣表求得
   ========================================================================== */
const SAMPLES_N = 400;

function makeCurve(pt, meta){
  // 取樣建立累積 3D 弧長表
  const us = new Float64Array(SAMPLES_N + 1), cum = new Float64Array(SAMPLES_N + 1);
  let prev = pt(0);
  us[0] = 0; cum[0] = 0;
  for (let i = 1; i <= SAMPLES_N; i++){
    const u = i / SAMPLES_N, p = pt(u);
    cum[i] = cum[i-1] + dist3(prev, p);
    us[i] = u; prev = p;
  }
  const len = cum[SAMPLES_N];
  // 由弧長反求 u
  const uAtS = s => {
    if (s <= 0) return 0;
    if (s >= len) return 1;
    let lo = 0, hi = SAMPLES_N;
    while (hi - lo > 1){ const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const d = cum[hi] - cum[lo];
    return us[lo] + (d > 1e-12 ? (s - cum[lo]) / d : 0) / SAMPLES_N;
  };
  return { ok:true, pt, len, uAtS, meta:meta || {} };
}
const curveErr = m => ({ ok:false, err:m });

/* ---- 直線 ---- */
function curveLINE(g){
  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z].every(Number.isFinite)) return curveErr("端點座標無效");
  const L = dist3(p1, p2);
  if (L < 1e-9) return curveErr("起點與終點重合");
  return makeCurve(u => ({ x:p1.x + (p2.x-p1.x)*u, y:p1.y + (p2.y-p1.y)*u, z:p1.z + (p2.z-p1.z)*u }),
    { p1, p2, chord:L });
}

/* ---- 圓弧 ----
   端點模式:起點→終點 + 半徑 + 偏向(左/右) + 優弧/劣弧 + 平面(水平/鉛直)
     圓心側 = 偏向 XOR 優弧   (右轉劣弧 → 圓心在右;右轉優弧 → 圓心在左)
   圓心模式:起點 + 圓心(水平) + 轉角 + 偏向 + 終點高程                       */
function curveARC(g){
  const dir = num(g.dir) >= 0 ? 1 : -1;              // +1 右轉,-1 左轉
  /* 三點模式:起點 → 通過點 → 終點,圓弧落在這三點自己的平面上。
     水平 / 鉛直兩種平面解不了傾斜的拱、斜置的環,三點是最省事的通解:
     把三點投影到自己的平面(e1、e2)算外心,再用夾角掃過去。                       */
  if (g.arcMode === "three"){
    const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
    const pm = { x:num(g.mx), y:num(g.my), z:num(g.mz) };
    const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
    if (![p1,pm,p2].every(q => [q.x,q.y,q.z].every(Number.isFinite))) return curveErr("三點座標無效");
    const sub = (a,b) => ({ x:a.x-b.x, y:a.y-b.y, z:a.z-b.z });
    const cross = (a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x });
    const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
    const vlen = a => Math.hypot(a.x, a.y, a.z);
    const mul = (a,k) => ({ x:a.x*k, y:a.y*k, z:a.z*k });
    const v1 = sub(pm, p1), v2 = sub(p2, p1);
    const nv = cross(v1, v2), nl = vlen(nv), l1 = vlen(v1);
    if (nl < 1e-9 || l1 < 1e-9) return curveErr("三點共線或重合,定不出圓弧");
    const e1 = mul(v1, 1/l1), e3 = mul(nv, 1/nl), e2 = cross(e3, e1);
    const proj = q => { const d = sub(q, p1); return { X:dot(d, e1), Y:dot(d, e2) }; };
    const A = proj(pm), B = proj(p2);                  // p1 投影後就是 (0,0)
    const den = 2*(A.X*B.Y - A.Y*B.X);
    if (Math.abs(den) < 1e-12) return curveErr("三點共線或重合,定不出圓弧");
    const a2 = A.X*A.X + A.Y*A.Y, b2 = B.X*B.X + B.Y*B.Y;
    const cX = (a2*B.Y - b2*A.Y)/den, cY = (b2*A.X - a2*B.X)/den;
    const R3 = Math.hypot(cX, cY);
    if (!(R3 > 1e-9)) return curveErr("三點定出的半徑無效");
    const ang = (X,Y) => Math.atan2(Y - cY, X - cX);
    const nrm = a => { let v = a; while (v <= -Math.PI) v += 2*Math.PI; while (v > Math.PI) v -= 2*Math.PI; return v; };
    const aS = ang(0, 0), dm = nrm(ang(A.X, A.Y) - aS);
    let sweep = nrm(ang(B.X, B.Y) - aS);
    // 掃過去的那一段一定要「經過中間那個點」,否則走另一邊(補角)
    const inSide = sweep >= 0 ? (dm >= 0 && dm <= sweep) : (dm <= 0 && dm >= sweep);
    if (!inSide) sweep += sweep >= 0 ? -2*Math.PI : 2*Math.PI;
    const inPlane = (X, Y) => ({ x:p1.x + X*e1.x + Y*e2.x, y:p1.y + X*e1.y + Y*e2.y, z:p1.z + X*e1.z + Y*e2.z });
    return makeCurve(u => { const a = aS + sweep*u;
        return inPlane(cX + R3*Math.cos(a), cY + R3*Math.sin(a)); },
      { R:R3, plane:"3P", arcLen:R3*Math.abs(sweep), delta:Math.abs(sweep)/D2R,
        center:inPlane(cX, cY) });
  }
  if (g.arcMode === "center"){
    const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
    const cx = num(g.cx), cy = num(g.cy), delta = num(g.delta), z2 = num(g.z2);
    if (![p1.x,p1.y,p1.z,cx,cy,delta,z2].every(Number.isFinite)) return curveErr("參數無效");
    const R = Math.hypot(p1.x-cx, p1.y-cy);
    if (R < 1e-9) return curveErr("起點與圓心重合");
    if (!(delta > 0)) return curveErr("轉角必須 > 0");
    const a1 = Math.atan2(p1.y-cy, p1.x-cx);
    const sweep = -dir * delta * D2R;                 // 右轉 = 順時針 = 數學角減少
    return makeCurve(u => {
      const a = a1 + sweep*u;
      return { x:cx + R*Math.cos(a), y:cy + R*Math.sin(a), z:p1.z + (z2-p1.z)*u };
    }, { R, dir, center:{ x:cx, y:cy }, delta, arcLen:R*Math.abs(sweep), plane:"H" });
  }

  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  const R  = num(g.R), major = !!g.major;
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z,R].every(Number.isFinite)) return curveErr("參數無效");
  if (!(R > 0)) return curveErr("半徑必須 > 0");

  if (g.plane === "V"){
    // 鉛直平面:以 (沿平面弦方向 t, z) 為 2D 座標
    const dxy = distXY(p1, p2);
    if (dxy < 1e-9) return curveErr("鉛直平面圓弧的兩端點平面位置重合");
    const ux = (p2.x-p1.x)/dxy, uy = (p2.y-p1.y)/dxy;
    const q1 = { x:0, y:p1.z }, q2 = { x:dxy, y:p2.z };
    const a = arc2D(q1, q2, R, dir, major);
    if (!a.ok) return curveErr(a.err);
    return makeCurve(u => { const q = a.at(u);
      return { x:p1.x + ux*q.x, y:p1.y + uy*q.x, z:q.y }; },
      { R, dir, major, plane:"V", arcLen:a.arcLen, center:{ x:p1.x + ux*a.c.x, y:p1.y + uy*a.c.x, z:a.c.y } });
  }

  // 水平平面:平面投影為圓弧,高程沿弧線線性內插
  const a = arc2D({ x:p1.x, y:p1.y }, { x:p2.x, y:p2.y }, R, dir, major);
  if (!a.ok) return curveErr(a.err);
  return makeCurve(u => { const q = a.at(u);
    return { x:q.x, y:q.y, z:p1.z + (p2.z-p1.z)*u }; },
    { R, dir, major, plane:"H", arcLen:a.arcLen, center:{ x:a.c.x, y:a.c.y } });
}

// 2D 圓弧:q1 → q2,半徑 R,dir(+1 順時針 / −1 逆時針),major 取另一段
function arc2D(q1, q2, R, dir, major){
  const dx = q2.x-q1.x, dy = q2.y-q1.y, d = Math.hypot(dx, dy);
  if (d < 1e-9) return { ok:false, err:"起點與終點重合" };
  if (R < d/2 - 1e-9) return { ok:false, err:`半徑 ${R} 小於弦長一半 ${(d/2).toFixed(4)},無解` };
  const h = Math.sqrt(Math.max(0, R*R - (d/2)*(d/2)));
  const mx = (q1.x+q2.x)/2, my = (q1.y+q2.y)/2;
  const ux = dx/d, uy = dy/d;
  const nx = uy, ny = -ux;                            // 行進方向的右側
  const useRight = (dir > 0) !== major;
  const cx = mx + (useRight ? h : -h)*nx, cy = my + (useRight ? h : -h)*ny;
  const a1 = Math.atan2(q1.y-cy, q1.x-cx), a2 = Math.atan2(q2.y-cy, q2.x-cx);
  let sw = a2 - a1;
  if (dir > 0){ while (sw >= 0) sw -= 2*Math.PI; while (sw < -2*Math.PI) sw += 2*Math.PI; }
  else        { while (sw <= 0) sw += 2*Math.PI; while (sw >  2*Math.PI) sw -= 2*Math.PI; }
  return { ok:true, c:{ x:cx, y:cy }, sweep:sw, arcLen:R*Math.abs(sw),
    at:u => { const a = a1 + sw*u; return { x:cx + R*Math.cos(a), y:cy + R*Math.sin(a) }; } };
}

/* ---- 懸垂曲線:起點 → 終點 + 垂度(拋物線 / 懸鏈線)---- */
function solveCatenaryA(Lx, f){
  if (!(Lx > 0) || !(f > 0)) return null;
  const target = f/Lx, gfn = b => (Math.cosh(b) - 1)/(2*b) - target;
  let lo = 1e-8, hi = 40;
  if (gfn(hi) < 0) return null;
  for (let k = 0; k < 200; k++){ const m = (lo+hi)/2; if (gfn(m) < 0) lo = m; else hi = m; }
  return Lx / (2*((lo+hi)/2));
}
/* 垂度的量測基準(v3.10)。
   弦線 = 傳統作法(垂距自兩端連線量);高/低側端點與指定高程則是
   「自某個水平面往下量到曲線最低點」—— 不等高鞍座時這三者差很多。 */
const SAG_BASE = [["chord","弦線(兩端連線)"], ["high","高側端點"], ["low","低側端點"],
                  ["z","指定高程"]];
function curveSAG(g, warns){
  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z].every(Number.isFinite)) return curveErr("端點座標無效");
  const Lx = distXY(p1, p2);                          // 垂度以平面跨距為基準
  const chord = dist3(p1, p2);
  if (chord < 1e-9) return curveErr("起點與終點重合");
  const f = g.fMode === "ratio" ? (num(g.f) || 0) * Lx : (num(g.f) || 0);
  if (Lx < 1e-9 && Math.abs(f) > 1e-9)
    return curveErr("兩端點平面位置重合(鉛直索),無法定義垂度");

  // 給定「自弦線量的垂度 fc」時的下垂函式
  const dipOf = fc => {
    if (g.curve === "catenary"){
      const a = solveCatenaryA(Lx, fc);
      if (a) return u => { const x = u*Lx;
        return a*Math.cosh((x - Lx/2)/a) - a*Math.cosh(Lx/(2*a)); };
      return null;                                    // 超出懸鏈線可解範圍
    }
    return u => -4*fc*u*(1-u);
  };
  let fellBack = false;
  const dipSafe = fc => { const d = dipOf(fc); if (d) return d; fellBack = true; return u => -4*fc*u*(1-u); };
  const zAt = (d, u) => p1.z + (p2.z-p1.z)*u + d(u);
  const minZ = fc => { const d = dipSafe(fc); let m = Infinity;
    for (let i = 0; i <= 200; i++) m = Math.min(m, zAt(d, i/200)); return m; };

  const base = g.fBase || "chord";
  let fc = f;                                          // 實際要用的「自弦線」垂度
  if (base !== "chord"){
    const datum = base === "high" ? Math.max(p1.z, p2.z)
                : base === "low"  ? Math.min(p1.z, p2.z)
                : num(g.fz);
    if (!Number.isFinite(datum)) return curveErr("垂度基準高程無效");
    // 目標:datum − 曲線最低點 = f。垂度越大最低點越低,單調 → 二分找 fc
    if (datum - minZ(0) > f + 1e-9)
      return curveErr(`基準高程 ${datum.toFixed(3)} 距曲線最低點已超過 ${f.toFixed(3)},垂度無法再小`);
    let lo = 0, hi = Math.max(1, Math.abs(f) + Math.abs(datum - p1.z) + Math.abs(datum - p2.z) + Lx);
    let guard = 0;
    while (datum - minZ(hi) < f && guard++ < 60) hi *= 2;
    for (let k = 0; k < 80; k++){ const m = (lo+hi)/2; if (datum - minZ(m) < f) lo = m; else hi = m; }
    fc = (lo+hi)/2;
  }
  const dip = dipSafe(fc);
  if (fellBack && warns && f > 0)
    warns.push(`「${g.name}」垂度超出懸鏈線可解範圍,已改用拋物線`);
  return makeCurve(u => ({
    x: p1.x + (p2.x-p1.x)*u,
    y: p1.y + (p2.y-p1.y)*u,
    z: zAt(dip, u)
  }), { p1, p2, f, fc, fBase:base, Lx, chord, curve:g.curve });
}

/* ---- 螺旋線:圓心 + 半徑 + 起始方位角 + 圈數 + 螺距 ---- */
function curveHELIX(g){
  const cx = num(g.cx), cy = num(g.cy), z0 = num(g.z1);
  const R0 = num(g.R), turns = num(g.turns), pitch = num(g.pitch), az0 = num(g.az0);
  const dir = num(g.dir) >= 0 ? 1 : -1;               // +1 順時針(俯視)
  const R1 = (g.R2 === "" || g.R2 == null || !Number.isFinite(num(g.R2))) ? R0 : num(g.R2);
  if (![cx,cy,z0,R0,turns,pitch,az0].every(Number.isFinite)) return curveErr("參數無效");
  if (!(R0 > 0) || !(R1 > 0)) return curveErr("半徑必須 > 0");
  if (!(turns > 0)) return curveErr("圈數必須 > 0");
  return makeCurve(u => {
    const az = az0 + dir*u*turns*360, R = R0 + (R1-R0)*u;
    return { x:cx + R*Math.sin(az*D2R), y:cy + R*Math.cos(az*D2R), z:z0 + pitch*turns*u };
  }, { R0, R1, turns, pitch, dir, rise:pitch*turns, center:{ x:cx, y:cy } });
}


/* ==========================================================================
   5. 分割
   ========================================================================== */
/* 四種分割方式「量的是什麼」——弧長 / 弦線 / 座標差,不是同一件事,一定要寫清楚:
     count   等分「曲線參數 u」。u 的意義由段型別決定:
               直線 = 等長;圓弧 = 等圓心角(弧長與弦長都相等);
               懸垂 = 等「弦線的水平投影」(x、y 隨 u 線性),**不是**等弧長;
               螺旋 = 等圓心角(起訖半徑不同時弧長不等);
               線形鏈 = **每個子段各自**切 N 根,子段內等弧長。
     spacing 沿曲線量 **3D 弧長**(makeCurve 以 400 段折線累積)。節點之間的元素是**弦線**,
               所以實際元素長度會**略短於**設定的間距(直線例外,兩者相同)。
     axis    量的是 **X / Y / Z 軸的座標差**,既不是弧長也不是弦長:用一組垂直於該軸、
               間隔 d 的平面去截曲線,交點放節點。斜的段元素長 = d / 方向餘弦 > d。
     tol     量的是「曲線離弦線的最大垂距 ≤ 容差」,在容差內盡量放長;步長本身仍是弧長。 */
const SPLIT_DEF = { mode:"count", count:20, spacing:5, tol:0.02, maxSpacing:20, rem:"even",
                    axis:"x", axisSpacing:5, axisBase:"start", axisAt:0,
                    list:"10@5", listAlong:"s" };
const AXIS_KEYS = [["x","X"],["y","Y"],["z","Z"]];
const LIST_ALONG = [["s","沿弧長"],["x","X 軸"],["y","Y 軸"],["z","Z 軸"]];
const axisOf = sp => (sp && (sp.axis === "y" || sp.axis === "z")) ? sp.axis : "x";
const listAlongOf = sp => { const v = sp && sp.listAlong;
  return (v === "x" || v === "y" || v === "z") ? v : "s"; };

/* ---- midas 寫法的間距表:"3 36@4 3" = 3 + 36 段 × 4 + 3 = 150 ----
   `n@d` 是「n 段、每段 d」(midas Civil 的慣例),單獨一個數字就是一段。
   分隔符接受空白 / 逗號 / 分號(含全形),@ 前後可以有空白。                        */
const LIST_MAX_SEG = 20000;
function parseSpacingList(str){
  const src = String(str == null ? "" : str).replace(/[,;、\uFF0C\uFF1B]/g, " ")
    .replace(/\s*@\s*/g, "@").trim();
  const bad = e => ({ ok:false, err:e, items:[], dists:[], total:0, count:0 });
  if (!src) return bad("是空的");
  const items = [], dists = [];
  let total = 0;
  for (const tk of src.split(/\s+/)){
    const m = tk.match(/^(?:(\d+)@)?(\d*\.?\d+(?:[eE][+-]?\d+)?)$/);
    if (!m) return bad(`看不懂「${tk}」—— 格式是「間距」或「段數@間距」,例如 3 36@4 3`);
    const n = m[1] ? parseInt(m[1], 10) : 1, d = parseFloat(m[2]);
    if (!(n >= 1)) return bad(`「${tk}」的段數必須 ≥ 1`);
    if (!(d > 0)) return bad(`「${tk}」的間距必須 > 0`);
    if (dists.length + n > LIST_MAX_SEG) return bad(`總段數超過 ${LIST_MAX_SEG}`);
    items.push({ n, d });
    for (let i = 0; i < n; i++){ dists.push(d); total += d; }
  }
  return { ok:true, items, dists, total, count:dists.length };
}
// "3 + 36×4 + 3" —— 給介面即時顯示用
const listExpr = p => p.items.map(it => it.n > 1 ? `${it.n}×${rnd12(it.d)}` : String(rnd12(it.d))).join(" + ");
// 換單位時整張表跟著換算,寫回同樣的 n@d 形式
const scaleSpacingList = (str, k) => {
  const p = parseSpacingList(str);
  if (!p.ok) return str;
  return p.items.map(it => (it.n > 1 ? it.n + "@" : "") + rnd12(it.d*k)).join(" ");
};

// 弦線偏差:曲線在 [u0,u1] 之間離弦線最遠的垂距
function maxDevOn(cv, u0, u1){
  const A = cv.pt(u0), B = cv.pt(u1);
  const dx = B.x-A.x, dy = B.y-A.y, dz = B.z-A.z, L = Math.hypot(dx,dy,dz);
  if (L < 1e-12) return 0;
  const u = { x:dx/L, y:dy/L, z:dz/L };
  let mx = 0;
  for (let j = 1; j < 20; j++){
    const P = cv.pt(u0 + (u1-u0)*j/20);
    const w = { x:P.x-A.x, y:P.y-A.y, z:P.z-A.z };
    const t = V.dot(w, u);
    const d = Math.hypot(w.x - u.x*t, w.y - u.y*t, w.z - u.z*t);
    if (d > mx) mx = d;
  }
  return mx;
}

// 回傳 u 陣列(含 0 與 1)
function splitCurve(cv, sp, tag, warns){
  sp = sp || SPLIT_DEF;
  if (sp.mode === "count"){
    const N = Math.max(1, Math.round(num(sp.count)) || 1);
    const us = [];
    for (let i = 0; i <= N; i++) us.push(i/N);
    return us;
  }
  if (sp.mode === "spacing"){
    const d = num(sp.spacing);
    if (!(d > 0)){ warns.push(tag + "間距必須 > 0,已改為整段一個元素"); return [0,1]; }
    const n = Math.floor(cv.len/d + 1e-9);
    if (n < 1){ warns.push(tag + `長度 ${cv.len.toFixed(3)} ${UL()} 小於間距 ${d} ${UL()},僅產生 1 個元素`); return [0,1]; }
    const rem = cv.len - n*d;
    const us = [];
    for (let i = 0; i <= n; i++) us.push(cv.uAtS(d*i));
    return finishRem(us, cv, rem, d, sp.rem, tag, warns);
  }
  if (sp.mode === "axis") return splitAxis(cv, sp, tag, warns);
  if (sp.mode === "list") return splitList(cv, sp, tag, warns);
  // 弦線偏差容差:逐步推進,二分找最大可用步長
  const tol = Math.max(cv.len*1e-9, num(sp.tol) || 0);   // 容差與座標同單位
  const dmax = (num(sp.maxSpacing) > 0) ? num(sp.maxSpacing) : cv.len;
  const us = [0];
  let s = 0, guard = 0, last = dmax;
  while (s < cv.len - 1e-9 && guard++ < 20000){
    let lo = 0, hi = Math.min(dmax, cv.len - s);
    if (maxDevOn(cv, cv.uAtS(s), cv.uAtS(s + hi)) <= tol){ lo = hi; }
    else {
      for (let k = 0; k < 24; k++){
        const m = (lo + hi)/2;
        if (maxDevOn(cv, cv.uAtS(s), cv.uAtS(s + m)) <= tol) lo = m; else hi = m;
      }
    }
    const step = Math.max(lo, cv.len/20000);
    last = step; s += step;
    if (s >= cv.len - 1e-9) break;
    us.push(cv.uAtS(s));
  }
  const rem = cv.len - cv_sOf(cv, us[us.length-1]);
  return finishRem(us, cv, rem, last, sp.rem, tag, warns);
}
/* ---- 軸向間距分割 ----
   用一組垂直於 X / Y / Z 軸、間隔 d 的平面去截曲線,每個交點放一個節點。
   **量的是該軸的座標差**,不是弧長也不是弦長:斜的段元素長度 = d / |方向餘弦| > d。
   格線基準可選「本段起點」(起點一定落在格線上)或「指定座標」(對齊全域格網,
   同一個基準值可讓不同段的節點對齊在同一組平面上)。
   曲線在該軸上來回(非單調)時,**每一次穿越都會放節點**,折返點附近會出現短元素,另外警告。 */
const AXIS_MAX_EL = 20000;                             // 保險上限,免得間距打太小把頁面卡死
function splitAxis(cv, sp, tag, warns){
  const ax = axisOf(sp), AX = ax.toUpperCase();
  const d = num(sp.axisSpacing);
  if (!(d > 0)){ warns.push(tag + `沿 ${AX} 的間距必須 > 0,已改為整段一個元素`); return [0,1]; }
  const aOf = u => cv.pt(u)[ax];
  // 沿弧長等距取樣(u 不一定與長度成正比),再逐格找出跨過的平面
  let N = 400, uu, aa;
  const scan = n => {
    uu = new Float64Array(n+1); aa = new Float64Array(n+1);
    for (let i = 0; i <= n; i++){ const u = cv.uAtS(cv.len*i/n); uu[i] = u; aa[i] = cv.pt(u)[ax]; }
  };
  scan(N);
  let mn = aa[0], mx = aa[0];
  for (let i = 1; i <= N; i++){ if (aa[i] < mn) mn = aa[i]; if (aa[i] > mx) mx = aa[i]; }
  const span = mx - mn;
  if (!Number.isFinite(span)){ warns.push(tag + `沿 ${AX} 的座標無效,已改為整段一個元素`); return [0,1]; }
  if (span/d > AXIS_MAX_EL){
    warns.push(tag + `沿 ${AX} 的間距 ${d} ${UL()} 會切出超過 ${AXIS_MAX_EL} 個元素,已改為整段一個元素`);
    return [0,1];
  }
  const need = Math.ceil(span/d)*6;                    // 每一格至少 6 個取樣,才抓得到折返
  if (need > N){ N = Math.min(120000, need); scan(N); }
  // 格線基準:本段起點 / 指定座標(留白視為 0,即對齊全域格網)
  const base = sp.axisBase === "value" ? (Number.isFinite(num(sp.axisAt)) ? num(sp.axisAt) : 0) : aa[0];
  const gOf = u => (aOf(u) - base)/d;
  const hit = [];
  for (let i = 0; i < N; i++){
    const ga = (aa[i] - base)/d, gb = (aa[i+1] - base)/d;
    let lo, hi;
    if (gb > ga){ lo = Math.floor(ga) + 1; hi = Math.floor(gb); }      // 半開區間 (ga, gb]
    else if (gb < ga){ lo = Math.ceil(gb); hi = Math.ceil(ga) - 1; }   // 半開區間 [gb, ga)
    else continue;
    for (let k = lo; k <= hi; k++){
      let p = uu[i], q = uu[i+1], fp = ga - k;
      if (fp === 0){ hit.push(p); continue; }
      for (let it = 0; it < 34; it++){                 // 區間內二分求交點
        const m = (p + q)/2, fm = gOf(m) - k;
        if (fm === 0){ p = q = m; break; }
        if ((fm < 0) === (fp < 0)){ p = m; fp = fm; } else q = m;
      }
      hit.push((p + q)/2);
    }
  }
  /* 只用 u 的間距去重不夠:端點剛好落在格線上、而且曲線在那裡與格線相切時
     (例如 1/4 圓弧的終點沿 Y 分割),交點會收斂到 u 略小於 1 的地方,
     座標卻與終點相同 → 產生零長度元素。改用**幾何距離**去重才擋得住。 */
  hit.sort((p, q) => p - q);
  const pEnd = cv.pt(1), tol3 = Math.max(cv.len*1e-6, 1e-12);
  const us = [0];
  let lastP = cv.pt(0);
  hit.forEach(u => {
    if (!(u > 0) || !(u < 1)) return;
    const p = cv.pt(u);
    if (dist3(p, lastP) <= tol3 || dist3(p, pEnd) <= tol3) return;   // 與前一個交點或終點重合
    us.push(u); lastP = p;
  });
  if (us.length === 1)
    warns.push(tag + `沿 ${AX} 的變化量 ${span.toFixed(3)} ${UL()} 內沒有間距 ${d} ${UL()} 的格線,僅產生 1 個元素`);
  // 餘數:端點的零頭「獨立留一段」(預設)或「併入相鄰元素」(拿掉最靠端點的那個交點)。
  // 均分 / 頭尾各半會把格線整組挪走,失去對齊的意義,所以軸向間距不提供。
  if (sp.rem === "merge" && us.length > 1){
    if (Math.abs(aOf(us[1]) - aa[0]) < d - 1e-9) us.splice(1, 1);
    if (us.length > 1 && Math.abs(aOf(1) - aOf(us[us.length-1])) < d - 1e-9) us.pop();
  }
  us.push(1);
  // 折返:同一個平面會被穿越兩次以上,折返點附近必然有短元素
  const eps = Math.max(span*1e-9, 1e-12);
  let turns = 0;
  for (let i = 1; i < N; i++){
    const p = aa[i] - aa[i-1], q = aa[i+1] - aa[i];
    if (Math.abs(p) > eps && Math.abs(q) > eps && p*q < 0) turns++;
  }
  if (turns) warns.push(tag + `曲線沿 ${AX} 有 ${turns} 處折返,同一個平面會被穿越多次,折返點附近會出現極短元素`);
  return us;
}

/* ---- 間距表分割(midas 寫法 "3 36@4 3")----
   逐段累加,每一個累加點放一個節點。**量測方向**可選「沿弧長」或 X / Y / Z 軸:
   選軸時,表裡的每一個數字是**該軸的座標增量**,方向取本段起點 → 終點在該軸上的走向。
   表的總長與本段長度不一定相同,差額由「餘數處理」決定(留一段 / 併入最後一根 / 整表縮放)。 */
function splitList(cv, sp, tag, warns){
  const p = parseSpacingList(sp.list);
  if (!p.ok){ warns.push(tag + "間距表" + p.err + ",已改為整段一個元素"); return [0,1]; }
  const al = listAlongOf(sp);
  return al === "s" ? listAlongArc(cv, p, sp, tag, warns)
                    : listAlongAxis(cv, p, sp, al, tag, warns);
}
const rnd3 = v => Number.isFinite(v) ? (+v).toFixed(3) : String(v);

// 表的總長 vs 實際可用長度不一致時,統一在這裡報告
function listFit(us, total, avail, used, dropped, rem, sp, unitTag, tag, warns){
  if (dropped > 0)
    warns.push(tag + `間距表總長 ${rnd3(total)} ${UL()} 超過本段${unitTag} ${rnd3(avail)} ${UL()},` +
      `最後 ${dropped} 段放不下已略過`);
  else if (rem > Math.max(avail*1e-9, 1e-12)){
    if (sp.rem === "merge"){
      if (us.length > 1) us.pop();                     // 零頭併入最後一根元素
      warns.push(tag + `間距表總長 ${rnd3(total)} ${UL()} 比本段${unitTag} ${rnd3(avail)} ${UL()} 少 ` +
        `${rnd3(rem)} ${UL()},零頭已併入最後一根元素`);
    } else
      warns.push(tag + `間距表總長 ${rnd3(total)} ${UL()} 比本段${unitTag} ${rnd3(avail)} ${UL()} 少 ` +
        `${rnd3(rem)} ${UL()},尾端多留一根 ${rnd3(rem)} ${UL()} 的元素`);
  }
  us.push(1);
  return us;
}

function listAlongArc(cv, p, sp, tag, warns){
  const L = cv.len, eps = Math.max(L*1e-9, 1e-12);
  let ds = p.dists, total = p.total;
  if (sp.rem === "even" && total > 1e-12){             // 整張表按比例縮放到剛好等於全長
    const k = L/total; ds = ds.map(d => d*k); total = L;
  }
  const us = [0];
  let s = 0, i = 0;
  for (; i < ds.length; i++){
    const s2 = s + ds[i];
    if (s2 > L + eps) break;                           // 放不下了
    s = s2;
    if (Math.abs(L - s) <= eps){ s = L; i++; break; }  // 剛好到底
    us.push(cv.uAtS(s));
  }
  return listFit(us, total, L, s, ds.length - i, L - s, sp, "長度", tag, warns);
}

function listAlongAxis(cv, p, sp, ax, tag, warns){
  const AX = ax.toUpperCase();
  const a0 = cv.pt(0)[ax], a1 = cv.pt(1)[ax], span = a1 - a0;
  const dir = span >= 0 ? 1 : -1, A = Math.abs(span);
  if (!(A > 1e-12)){
    warns.push(tag + `本段沿 ${AX} 的跨距是 0,間距表無法定位,已改為整段一個元素`);
    return [0,1];
  }
  let ds = p.dists, total = p.total;
  if (sp.rem === "even" && total > 1e-12){ const k = A/total; ds = ds.map(d => d*k); total = A; }
  // 沿弧長取樣,再逐一往前找「第一個到達目標座標」的位置(非單調時取最先到達的那一次)
  const N = Math.max(400, Math.min(120000, ds.length*8));
  const uu = new Float64Array(N+1), aa = new Float64Array(N+1);
  for (let i = 0; i <= N; i++){ const u = cv.uAtS(cv.len*i/N); uu[i] = u; aa[i] = cv.pt(u)[ax]; }
  const eps = Math.max(A*1e-9, 1e-12), tol3 = Math.max(cv.len*1e-6, 1e-12);
  const pEnd = cv.pt(1);
  const us = [0];
  let lastP = cv.pt(0), t = a0, at = 0, seg = 0, j0 = 0;
  for (; seg < ds.length; seg++){
    const tgt = t + dir*ds[seg];
    if (dir*(tgt - a1) > eps) break;                   // 超出本段,這一段以後都放不下
    if (Math.abs(tgt - a1) <= eps){ at += ds[seg]; seg++; break; }   // 剛好鋪到終點
    let f = -1;
    for (let j = j0; j < N; j++){
      const va = aa[j], vb = aa[j+1];
      if (va !== vb && (va - tgt)*(vb - tgt) <= 0){ f = j; break; }
    }
    if (f < 0) break;                                  // 這一段的目標到不了
    let lo = uu[f], hi = uu[f+1], fl = aa[f] - tgt;
    if (fl !== 0){
      for (let k = 0; k < 34; k++){
        const m = (lo+hi)/2, fm = cv.pt(m)[ax] - tgt;
        if (fm === 0){ lo = hi = m; break; }
        if ((fm < 0) === (fl < 0)){ lo = m; fl = fm; } else hi = m;
      }
    }
    const u = (lo+hi)/2, q = cv.pt(u);
    // 與前一個站點或終點重合的就不放(會變成零長度元素)
    if (dist3(q, lastP) > tol3 && dist3(q, pEnd) > tol3){ us.push(u); lastP = q; }
    j0 = f; t = tgt; at += ds[seg];
  }
  return listFit(us, total, A, at, ds.length - seg, A - at, sp, `沿 ${AX} 的跨距`, tag, warns);
}

// 軸向間距換算成「沿弧長的標稱間距」:直線的方向餘弦固定,元素長度就是 d / |cos|
function axisNominal(cv, sp, fallback){
  const ax = axisOf(sp), d = num(sp.axisSpacing);
  if (!(d > 0) || !(cv.len > 0)) return fallback;
  const c = Math.abs(cv.pt(1)[ax] - cv.pt(0)[ax]) / cv.len;
  return c > 1e-9 ? d/c : fallback;
}

const cv_sOf = (cv, u) => {                            // u → 弧長(以取樣表反查)
  let lo = 0, hi = 1;
  for (let k = 0; k < 40; k++){ const m = (lo+hi)/2; if (cv.uAtS(m*cv.len) < u) lo = m; else hi = m; }
  return ((lo+hi)/2)*cv.len;
};

function finishRem(us, cv, rem, nominal, policy, tag, warns){
  if (rem <= 1e-9){ us[us.length-1] = 1; return us; }
  const ratio = nominal > 1e-9 ? rem/nominal : 1;
  if (ratio < 0.30)
    warns.push(tag + `餘數 ${rem.toFixed(3)} ${UL()} 僅為間距的 ${(ratio*100).toFixed(1)}%,將產生極短元素`);
  if (policy === "keep"){ us.push(1); return us; }
  if (policy === "merge"){ if (us.length >= 2) us.pop(); us.push(1); return us; }
  if (policy === "trim"){ return us; }                 // 尾端丟棄
  if (policy === "half"){
    // 餘數除以二,頭尾各留一半:rem/2 + n×nominal + rem/2 = 全長,中間維持標稱間距。
    // 最後要「補」一個終點,不能拿它蓋掉最後一個整距站點,否則尾段會變成 nominal + rem/2。
    const n = us.length - 1, h = rem/2;
    const out = [0];
    for (let i = 0; i <= n; i++) out.push(cv.uAtS(h + nominal*i));
    out.push(1);
    return out;
  }
  const n = us.length - 1;                             // even:維持區間數,間距略放大
  const out = [];
  for (let i = 0; i <= n; i++) out.push(cv.uAtS(cv.len*i/n));
  out[n] = 1;
  return out;
}

/* 直線延長的分割:**基準段照原本的規則切,結果與沒延長時一模一樣**(節點座標、元素都不動),
   延長段自己另外切,零頭照使用者選的「餘數處理」決定。
   —— 延長的定義是「往外多接元素」,不是把整條線重新分割。                          */
function splitLineExt(cv, sp, ex, tag, warns){
  const { eS, eE, L, total } = ex;
  const gu = s => clamp(s/total, 0, 1);                // 直線:弧長與 u 成正比
  const sub = (s0, len, dir) => ({ len, uAtS:t => clamp(t/len, 0, 1),
                                   pt:t => cv.pt(gu(s0 + dir*t*len)) });
  // 基準段:同樣的長度、同樣的 split 參數 → 切出來的站點與沒延長時相同
  const baseU = splitCurve(sub(eS, L, 1), sp, tag, warns);
  const nEl = Math.max(1, baseU.length - 1);
  // 延長段用的標稱間距:間距模式就用那個間距,其餘沿用基準段實際的元素長。
  // 間距表模式**兩端各自取最靠近那一端的間距**,延長出去的元素才接得順。
  const nomOf = which => {
    if (sp.mode === "spacing") return num(sp.spacing) > 0 ? num(sp.spacing) : L/nEl;
    if (sp.mode === "tol")     return num(sp.maxSpacing) > 0 ? num(sp.maxSpacing) : L/nEl;
    if (sp.mode === "axis")    return axisNominal(cv, sp, L/nEl);      // d / 方向餘弦 = 元素長
    if (sp.mode === "list"){
      const p = parseSpacingList(sp.list);
      if (!p.ok || !p.dists.length) return L/nEl;
      const d = which === "S" ? p.dists[0] : p.dists[p.dists.length-1];
      const al = listAlongOf(sp);
      if (al === "s") return d;
      const c = Math.abs(cv.pt(1)[al] - cv.pt(0)[al]) / (cv.len || 1);
      return c > 1e-9 ? d/c : L/nEl;
    }
    return L/nEl;
  };
  const spExtE = { ...sp, mode:"spacing", spacing:nomOf("E") };
  const spExtS = { ...sp, mode:"spacing", spacing:nomOf("S") };
  const S = baseU.map(u => eS + u*L);
  if (eE > 1e-12)
    splitCurve(sub(eS + L, eE, 1), spExtE, tag + "終點端延長:", warns)
      .forEach(t => { if (t > 1e-12) S.push(eS + L + t*eE); });
  // 起點端由基準段起點「往外」切,整距元素才會貼著基準段、零頭落在最外側
  if (eS > 1e-12)
    splitCurve(sub(eS, eS, -1), spExtS, tag + "起點端延長:", warns)
      .forEach(t => { if (t > 1e-12) S.push(eS - t*eS); });
  S.sort((a, b) => a - b);
  const out = [];
  S.forEach(v => { if (!out.length || v - out[out.length-1] > 1e-9) out.push(v); });
  return out.map(gu);
}

function parseXYZTable(txt, skip){
  const sk = Math.max(0, Math.round(num(skip)) || 0);

  String(txt == null ? "" : txt).split(/[\r\n]+/).forEach(line => {
    const nums = line.replace(/[,;、,;]/g, " ").trim().split(/\s+/)
      .map(t => Number(t)).filter(v => Number.isFinite(v));
    const v = nums.slice(sk);
    if (v.length >= 3) out.push({ x:v[0], y:v[1], z:v[2] });
  });
  return out;
}

  cross:`<svg width="34" height="18" viewBox="0 0 30 16" fill="none" stroke-linecap="round"><path d="M3 4h24M3 12h24" stroke="${ICON_CTX}" stroke-width="1"/><path d="M6 4L14 12M14 4L6 12M16 4L24 12M24 4L16 12" stroke="currentColor" stroke-width="1.8"/></svg>`,
