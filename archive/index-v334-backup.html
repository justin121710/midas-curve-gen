};
const PAIR_MODES = [
  ["same",  "一對一(同序)",   ""],
  ["skew",  "錯開 n 格",       ""],
  ["cross", "X 形交叉斜撐",    ""],
  ["ratio", "依比例對應",      "分割數不同也能連"],
  ["near",  "連到最近的節點",  "不平行的兩條線"],
  ["free",  "自訂連接方式",    "自己畫樣式或在視圖點選"]
];
const pairOf = g => PAIR_MODES.some(m => m[0] === (g && g.pair)) ? g.pair : "same";
const PAIR_HINT = {
  same: "兩個群組<b>同序</b>一對一。目標群組比較短時<b>連到用完為止</b>,不再是錯誤。",
  skew: "起始群組第 j 個接目標群組第 <b>j + 錯開格數</b> 個;填負值往回錯。",
  cross:"相鄰兩格拉一對<b>來回斜撐</b> —— 一個組就是完整的 X,不必建兩組。",
  ratio:"依<b>弧長比例</b>對應:起始群組走到 30% 的節點,接目標群組 30% 位置最近的那個節點。<b>兩個群組分割數不同也連得起來</b>。",
  near: "每個節點接<b>空間中距離最近</b>的那個節點。兩條線不平行、扭曲時最實用;疏密差太多會有幾根接到同一點,會出警告。",
  free: "自己畫一個<b>樣式單元</b>(兩點直連、斜撐、X 形交叉、四點交叉都可以),再沿兩個群組的節點一路重複。點「編輯連接方式」開啟樣式視窗,裡面也可以改成<b>直接在 3D 視圖點兩個節點</b>。"
};
// 沿節點串的累積 3D 長度,正規化成 0..1。「依比例對應」用弧長比例而不是索引比例,
// 兩排疏密不同(例如一排等分、一排照間距表切)時才對得準。
function arcParam(ns){
  const t = [0];
  for (let i = 1; i < ns.length; i++) t.push(t[i-1] + dist3(ns[i-1], ns[i]));
  const L = t[t.length-1];
  return L > 1e-12 ? t.map(v => v/L) : t.map(() => 0);
}
const nearestAt = (ts, v) => {
  let bd = Infinity, bi = 0;
  ts.forEach((u, i) => { const d = Math.abs(u - v); if (d < bd){ bd = d; bi = i; } });
  return bi;
};

let SEQ = 1;
const newId = () => "g" + (SEQ++);

// 元素的三個欄位都填了才算設定完成;沒填完就把那一區攤開,讓人知道還沒填
const elemDone = g => !!(g && g.etype) && (num(g.mat) > 0) && (num(g.sect) > 0);
const elemSummary = g => {
  const t = (ELEM_TYPES.find(o => o[0] === g.etype) || [null, g.etype])[1];
  return `${t} · 材料 ${Math.round(num(g.mat))} · 斷面 ${Math.round(num(g.sect))}`;
};

function defaultPiece(type){
  const sp = { ...SPLIT_DEF, spacing:dL(SPLIT_DEF.spacing), maxSpacing:dL(SPLIT_DEF.maxSpacing),
               tol:dL(SPLIT_DEF.tol), axisSpacing:dL(SPLIT_DEF.axisSpacing),
               list:scaleSpacingList(SPLIT_DEF.list, lenFactor()) };
  const b = { type, sRef:"prev", eRef:"", xf:XF_DEF(),
              split:{ ...sp }, ovr:false, etype:"BEAM", mat:1, sect:1,
              x1:0, y1:0, z1:0 };
  if (type === "LINE")  return { ...b, endMode:"point", x2:dL(100), y2:0, z2:0, len:dL(50), az:90, el:0,
    extS:0, extE:0 };            // 兩端各自可以再往外延長
  if (type === "ARC")   return { ...b, arcMode:"endpoints", plane:"H", dir:1, major:false,
    x2:dL(100), y2:0, z2:0, R:dL(80), cx:dL(50), cy:dL(-50), delta:90,
    mx:dL(50), my:dL(20), mz:0 };                // 三點模式的通過點
  if (type === "SAG")   return { ...b, x2:dL(200), y2:0, z2:0, curve:"parabola",
    fMode:"ratio", f:0.1, fBase:"chord", fz:0 };
  if (type === "HELIX") return { ...b, R:dL(50), R2:"", az0:0, turns:2, pitch:dL(12), dir:1,
    split:{ ...sp, count:72 } };
  if (type === "CHAIN") return { ...b, az:90, sta:0, segments:[{ type:"LINE", L:dL(50) }],
    profile:[], forced:"", absorbTol:dL(0.1), split:{ ...sp, mode:"spacing" } };
  if (type === "POINT") return { ...b, x2:0, y2:0, z2:0 };
  if (type === "POLY")  return { ...b, sRef:"", table:"", skip:0 };
  return b;
}
// 第一段沒有「前一段」可以接 —— 新增 / 刪除 / 拖曳排序之後都要補一次。
// 注意只清掉 "prev":第一段指到「別的段」是合法的(例如反過來接第 3 段的起點)。
function fixFirstPiece(g){
  const pc = g && g.pieces && g.pieces[0];
  if (pc && pc.sRef === "prev") pc.sRef = "";
  return g;
}

function defaultGroup(type, n){
  // 元素的類型 / 材料 / 斷面一律留空:填了才算「設定過」,面板才會把它收起來。
  // 沒填也不會擋住匯出 —— attrOf() 仍然會退回 BEAM / 1 / 1。
  const base = { id:newId(), type, name:TYPES[type].name + (n || ""), on:true, xf:XF_DEF(),
    etype:"", mat:"", sect:"",
    addN:[], addE:[],              // 手動節點(自己輸座標)/ 手動元素(點兩個節點)
    cable:CABLE_DEF() };           // 只受拉元素的子類型與初始值(元素類型是 CABLE 時才用得到)
  if (type === "CURVE") return { ...base,
    pieces:[{ ...defaultPiece("LINE"), sRef:"" }] };
  if (type === "OFFSET")return { ...base, ref:"", d:dL(5), h:0 };
  if (type === "LINK2") return { ...base, a:"", b:"", aSide:"own", bSide:"own", pair:"same", skew:1,
    from:1, to:0, every:1,                       // same / skew / cross / ratio / near 用起始群組的節點範圍
    // free(自訂)= 一個「樣式單元」+ 兩個群組各自的起點與步進;pattern 是單元內的連線
    aFrom:1, aEvery:1, bFrom:1, bEvery:1, count:0, rev:false, pattern:[[0,0]] };
  if (type === "LINKZ") return { ...base, ref:"", refSide:"own", zRefSide:"own", zMode:"abs", targetZ:0,
    px:0, py:0, pz:0, sx:0, sy:0,                // zMode = "plane":過 (px,py,pz)、坡度 sx / sy 的斜面
    zRef:"",                                     // zMode = "ref":取另一群組對應節點的高程
    from:1, to:0, every:1, bottom:"new", snapTol:dL(0.5) };
  // 匯入組:節點與元素都是死的清單,沒有母體參數(SPEC §16.4)
  // renum:整組編號偏移。位移複製一份匯入組時原編號會撞在一起,給個偏移就能各自成立。
  if (type === "IMPORT")return { ...base, imp:{ src:"", nodes:[], elems:[] }, renum:0 };
  if (type === "FAN")   return { ...base, srcMode:"coord", sx:0, sy:0, sz:dL(80), ref:"", refSide:"own", srcGSide:"own",
    srcG:"", srcI:1,                             // srcMode = "gnode":某群組的第 k 個節點
    from:1, to:10, every:1, div:1, fMode:"abs", f:0 };
  return base;
}

// 由節點串補上方位角與平面曲率
function annotate(nodes){
  const n = nodes.length;
  const kk = new Array(n).fill(0);
  for (let i = 0; i < n; i++){
    const a = nodes[Math.max(0, i-1)], b = nodes[Math.min(n-1, i+1)];
    if (nodes[i].az === undefined) nodes[i].az = azOf(b.x - a.x, b.y - a.y);
    if (i > 0 && i < n-1){
      const p = nodes[i-1], q = nodes[i], r = nodes[i+1];
      const cr = (q.x-p.x)*(r.y-p.y) - (q.y-p.y)*(r.x-p.x);
      const A = distXY(p,q), B = distXY(q,r), C = distXY(p,r);
      const den = A*B*C;
      kk[i] = den > 1e-9 ? (2*cr)/den * -1 : 0;        // 正 = 圓心在右(右轉)
    }
  }
  if (n > 2){ kk[0] = kk[1]; kk[n-1] = kk[n-2]; }
  // 線形鏈段的節點已帶精確的 az / k,不覆蓋
  for (let i = 0; i < n; i++) if (nodes[i].k === undefined) nodes[i].k = kk[i];
  return nodes;
}

/* ---------- 平移與旋轉(剛體變換)----------
   組 / 段 存成參數(可隨時改、可復原);節點 / 元素則是一次性套用成座標覆寫。   */
const XF_DEF = () => ({ dx:0, dy:0, dz:0, rot:0, axis:"Z", cmode:"auto", cx:0, cy:0, cz:0,
                        mir:"", mirAt:0 });
const MIR_AX = { X:1, Y:1, Z:1 };
const mirOf = xf => (xf && MIR_AX[xf.mir]) ? xf.mir : "";
const xfActive = xf => !!xf && ([xf.dx, xf.dy, xf.dz, xf.rot].some(v => Math.abs(num(v) || 0) > 1e-12)
                                || !!mirOf(xf));

function xfCenter(xf, pts){
  const m = xf.cmode || "auto";
  if (m === "custom") return { x:num(xf.cx) || 0, y:num(xf.cy) || 0, z:num(xf.cz) || 0 };
  const P = (pts || []).filter(p => p && Number.isFinite(p.x));
  if (!P.length) return { x:0, y:0, z:0 };
  if (m === "start" || (m === "auto" && xf._start)) return { x:P[0].x, y:P[0].y, z:P[0].z };
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,z0=Infinity,z1=-Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
                   if(p.z<z0)z0=p.z; if(p.z>z1)z1=p.z; });
  return { x:(x0+x1)/2, y:(y0+y1)/2, z:(z0+z1)/2 };
}
// 回傳 p → p' 的函式(沒動就回 null);f.dAz = 方位角修正量,非 Z 軸旋轉時為 null
function xfMake(xf, pts, startPivot){
  if (!xfActive(xf)) return null;
  const c = xfCenter({ ...xf, _start:!!startPivot }, pts);
  const rot = num(xf.rot) || 0, th = rot*D2R, ax = xf.axis || "Z";
  const co = Math.cos(th), si = Math.sin(th);
  const dx = num(xf.dx) || 0, dy = num(xf.dy) || 0, dz = num(xf.dz) || 0;
  // 鏡射先做,而且是對「絕對座標的那個平面」—— 鏡射平面本來就該用絕對位置講,
  // 不是相對旋轉中心。之後才旋轉、平移。
  const mir = mirOf(xf), mAt = num(xf.mirAt) || 0;
  const pre = !mir ? null : (q => mir === "X" ? { ...q, x:2*mAt - q.x }
                                : mir === "Y" ? { ...q, y:2*mAt - q.y }
                                :               { ...q, z:2*mAt - q.z });
  const f = p0 => {
    const p = pre ? pre(p0) : p0;
    const X = p.x - c.x, Y = p.y - c.y, Z = p.z - c.z;
    let q;
    if (ax === "X")      q = { x:X,           y:Y*co - Z*si, z:Y*si + Z*co };
    else if (ax === "Y") q = { x:X*co + Z*si, y:Y,           z:-X*si + Z*co };
    else                 q = { x:X*co - Y*si, y:X*si + Y*co, z:Z };
    return { x:q.x + c.x + dx, y:q.y + c.y + dy, z:q.z + c.z + dz };
  };
  // 鏡射會把方位角翻面,沒有單一角度增量可用 —— 標成 null 讓 annotate() 重新算
  f.dAz = (!mir && ax === "Z") ? -rot : null;        // 方位角自 +Y 順時針,逆時針轉 θ 即 az−θ
  return f;
}
// 保留 az / k / s 等附加欄位的點變換
const xfPt = (f, p) => {
  if (!p) return p;
  const q = f(p);
  const o = { ...p, x:q.x, y:q.y, z:q.z };
  if (p.az !== undefined) o.az = (f.dAz === null) ? undefined : norm360(p.az + f.dAz);
  return o;
};
const xfCurve = (cv, f) => {
  const out = { ...cv, pt:u => xfPt(f, cv.pt(u)) };
  if (cv.meta && cv.meta.center)
    out.meta = { ...cv.meta, center:f({ x:cv.meta.center.x, y:cv.meta.center.y, z:cv.meta.center.z || 0 }) };
  return out;
};
// 就地套用到節點串(剛體 → 元素長度、弦線偏差都不變)
function xfApplyNodes(f, nodes){
  nodes.forEach(n => {
    const q = f(n); n.x = q.x; n.y = q.y; n.z = q.z;
    if (n.az !== undefined) n.az = (f.dAz === null) ? undefined : norm360(n.az + f.dAz);
  });
  if (f.dAz === null) annotate(nodes);                 // 非 Z 軸旋轉:方位角重算
  return nodes;
}
/* ---------- 段與段的參照 ----------
   v3.8:起點與終點都可以指到「同組任何一段的 起點 / 中點 / 終點」。
   存法:sRef / eRef = "" (自訂座標) | "prev" (前一段的終點) | "<段索引>:<s|m|e>"。
   解析靠相依排序(見 orderPieces),踩到循環會報錯而不是當掉。                        */
const REF_AT = { s:"起點", m:"中點", e:"終點" };
const parseRef = v => {
  const m = /^(\d+):([sme])$/.exec(String(v || ""));
  return m ? { pi:+m[1], at:m[2] } : null;
};
/* 跨群組參照:"@<群組 id>:<第幾個節點>"(1 起算)。
   存序號而不是節點編號 —— 上游重新分割時編號會跑掉,序號不會。 */
const parseGRef = v => {
  const m = /^@([A-Za-z0-9_]+):(\d+)$/.exec(String(v || ""));
  return m ? { gid:m[1], idx:+m[2] } : null;
};
const anyRef = v => parseRef(v) || parseGRef(v);
const sRefOf = pc => String((pc && pc.sRef) || "");
const eRefOf = pc => String((pc && pc.eRef) || "");
// 起點沿用前一段終點(舊的 cont);"<pi-1>:e" 效果相同,一併視為接續
const contOn = (pc, pi) => {
  const v = sRefOf(pc);
  if (v === "prev") return true;
  const r = parseRef(v);
  return !!(r && pi != null && r.at === "e" && r.pi === pi - 1);
};
// 終點可以被指到別的地方的段型別(其餘型別的終點由自己的參數決定)
const END_CONT_T = { LINE:1, ARC:1, SAG:1 };
function pieceStart(pc){
  if (!pc) return null;
  const p = pc.type === "POINT"
    ? { x:num(pc.x2), y:num(pc.y2), z:num(pc.z2) }
    : { x:num(pc.x1), y:num(pc.y1), z:num(pc.z1) };
  if (![p.x, p.y, p.z].every(Number.isFinite)) return null;
  const f = xfMake(pc.xf, [p], true);
  return f ? f(p) : p;
}
// 這一段的終點有沒有指向別的段
const endRefOn = pc => !!pc && !!anyRef(eRefOf(pc)) && !!END_CONT_T[pc.type]
  && !(pc.type === "ARC" && pc.arcMode === "center");

/* 依相依關係決定各段的計算順序。
   一段要算得出來,得先知道它的起點與終點指到的那些段。指到 "起點" 只需要對方的起點,
   但為了簡單與安全,一律要求「被指到的那一段先算完」—— 反正循環本來就不合法。      */
function orderPieces(pcs, errs, tag){
  const need = pcs.map((pc, pi) => {
    const d = new Set();
    const a = parseRef(sRefOf(pc)), b = parseRef(eRefOf(pc));
    if (sRefOf(pc) === "prev" && pi > 0) d.add(pi - 1);
    if (a && a.pi !== pi && pcs[a.pi]) d.add(a.pi);
    if (b && b.pi !== pi && pcs[b.pi] && endRefOn(pc)) d.add(b.pi);
    // 前一段把終點接到本段起點時,本段仍舊先算(它提供起點),不構成相依
    return d;
  });
  const done = new Set(), order = [];
  for (let pass = 0; pass < pcs.length + 2 && order.length < pcs.length; pass++){
    pcs.forEach((pc, pi) => {
      if (done.has(pi)) return;
      let ok = true;
      need[pi].forEach(d => { if (!done.has(d)) ok = false; });
      if (ok){ done.add(pi); order.push(pi); }
    });
  }
  const stuck = pcs.map((_, i) => i).filter(i => !done.has(i));
  if (stuck.length){
    errs.push(tag + `段 ${stuck.map(i => i+1).join("、")} 的起點/終點互相參照形成循環,已改用自訂座標`);
    stuck.forEach(i => order.push(i));
  }
  return { order, cyclic:new Set(stuck) };
}

/* ---------- MCT 識別字一律 ASCII ----------
   .mct 匯入時常以系統 ANSI 編碼讀取,中文群組名會變亂碼(而 *GROUP 的 NAME 是功能性欄位,
   不是註解),所以匯出用的群組名必須轉成純 ASCII。轉換規則刻意保守:
   只留 A-Za-z0-9_,其餘一律變底線;整串都不是 ASCII(純中文名)時退回 G01/G02 這種序號。 */
function mctName(raw, fallback){
  const t = String(raw == null ? "" : raw).replace(/[^A-Za-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
  return t || fallback;
}
// 不同的原始名稱清洗後可能撞在一起(例如「主纜」「吊索」都變空);同名的組本來就會合併成
// 同一個 MCT 群組,所以只有「原名不同卻撞名」時才加序號。
function assignGNames(groups, prefix){
  const taken = new Map();                             // 清洗後的名字 → 原始名字
  groups.forEach((r, i) => {
    const src = String(r.g.name || r.g.id);
    let base = prefix + mctName(src, "G" + p2(i+1));
    if (taken.has(base) && taken.get(base) !== src){
      let k = 2; while (taken.has(base + "_" + k)) k++;
      base = base + "_" + k;
    }
    taken.set(base, src);
    r.gname = base;
    r.elems.forEach(e => e.group = base);
  });
}

// 手動元素:使用者在圖面上點兩個節點決定 i–j,存的是「節點編號」。
// 端點可以落在任何一組(這正是它的用處:把兩組接起來),所以要等所有組都建完才能解析,
// 也因此元素編號排在該組自動產生的元素之後。
/* 手動元素的兩端存的是「哪一個群組的第幾個節點」(`@<群組 id>:<序號>`),
   不是節點編號 —— 上游一改分割,編號整串就跑掉了,序號不會。
   舊檔存的是編號,兩種都認得。 */
function addManualElems(groups, errs){
  const byNum = new Map();
  groups.forEach(r => r.nodes.forEach(n => { if (!byNum.has(n.num)) byNum.set(n.num, n); }));
  const byGid = new Map(groups.map(r => [r.g.id, r]));
  const resolve = (ref, numv) => {
    const gr = parseGRef(ref);
    if (gr){
      const rr = byGid.get(gr.gid);
      if (!rr) return null;
      const ch = chainOf(rr);
      if (!ch.length) return null;
      return ch[clamp(Math.round(gr.idx), 1, ch.length) - 1] || null;
    }
    const k = Math.round(num(numv));
    return Number.isFinite(k) ? (byNum.get(k) || null) : null;
  };
  groups.forEach(r => {
    const g = r.g, list = Array.isArray(g.addE) ? g.addE : [];
    if (!list.length) return;
    const attr = { type:g.etype || "BEAM", mat:Math.round(num(g.mat)) || 1,
                   sect:Math.round(num(g.sect)) || 1 };
    list.forEach((pair, ei) => {
      if (!pair) return;
      const a = resolve(pair.ai, pair.i), b = resolve(pair.bi, pair.j);
      const lab = `${pair.ai || pair.i}–${pair.bi || pair.j}`;
      if (!a || !b){ errs.push(`「${g.name}」手動元素 ${lab}:找不到節點`); return; }
      if (a.num === b.num){ errs.push(`「${g.name}」手動元素的兩端是同一個節點 ${a.num}`); return; }
      r.elems.push({ num:r.elemBase + r.elems.length, i:a.num, j:b.num, a, b,
        chord:distXY(a, b), len3d:dist3(a, b), gid:g.id, group:r.gname,
        ...attr, cable:{ ...CABLE_DEF(), ...(g.cable || {}) }, dev:0, pi:-1, manual:true, mi:ei });
    });
    finishStat(r);
  });
}

/* ---------- 合併座標重合的節點 ----------
   兩個節點座標一樣時,在 midas 裡是兩個各自獨立的節點 —— 看起來相連,其實沒有連。
   這裡照 midas 自己的 Merge Nodes 做法:同一個位置**只留編號最小的那一個**,
   其餘刪掉,所有元素的端點改指到留下來的那個。

   為什麼要放在 buildModel 的最後:節點編號是全域的,而且手動元素也要一起改,
   所以必須等所有組(含手動元素)都建完。                                            */
function weldNodes(groups, warns, opt){
  const on = !opt || opt.on !== false;
  if (!on) return 0;
  const tol = Math.max(0, num(opt && opt.tol) || 0);
  const cell = tol > 0 ? tol : 1e-6;
  const key = (x, y, z) => [Math.floor(x/cell), Math.floor(y/cell), Math.floor(z/cell)].join(",");
  // 先照編號由小到大掃,先看到的自然就是那一群裡編號最小的
  const all = [];
  groups.forEach(r => r.nodes.forEach(n => all.push(n)));
  all.sort((a, b) => a.num - b.num);

  const buckets = new Map();                           // 格子 → 已留下的節點
  const winner = new Map();                            // 被併掉的編號 → 留下來的節點
  all.forEach(n => {
    let hit = null;
    // 檢查自己與相鄰的 26 個格子(只用格子當索引會漏掉剛好跨在格線兩側的點)
    for (let dx = -1; dx <= 1 && !hit; dx++)
      for (let dy = -1; dy <= 1 && !hit; dy++)
        for (let dz = -1; dz <= 1 && !hit; dz++){
          const arr = buckets.get(key(n.x + dx*cell, n.y + dy*cell, n.z + dz*cell));
          if (!arr) continue;
          for (let i = 0; i < arr.length; i++){
            const m = arr[i];
            // 兩個都是匯入來的節點就不併 —— 既有模型裡本來就重合的節點是它自己的事,
            // 併掉等於偷改使用者的模型。新建的東西碰到匯入節點仍然會併(那正是想要的)。
            if (m.imp && n.imp) continue;
            const d = Math.max(Math.abs(m.x-n.x), Math.abs(m.y-n.y), Math.abs(m.z-n.z));
            if (d <= (tol > 0 ? tol : 1e-9)){ hit = m; break; }
          }
        }
    if (hit){ winner.set(n.num, hit); return; }
    const k = key(n.x, n.y, n.z);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(n);
  });
  if (!winner.size) return 0;

  // 元素端點改指到留下來的節點;兩端併成同一點的元素退化了,直接刪掉
  let degen = 0;
  groups.forEach(r => {
    r.elems = r.elems.filter(e => {
      const wa = winner.get(e.i), wb = winner.get(e.j);
      if (wa){ e.a = wa; e.i = wa.num; }
      if (wb){ e.b = wb; e.j = wb.num; }
      if (e.i === e.j){ degen++; return false; }
      e.chord = distXY(e.a, e.b); e.len3d = dist3(e.a, e.b);
      return true;
    });
    // 記下「這一組有哪些節點被併到別人身上」——畫布上標記、面板上講清楚,
    // 不然節點看起來就是憑空不見了,使用者不知道到底有沒有接到
    r.weldAway = r.nodes.filter(n => winner.has(n.num))
      .map(n => { const w = winner.get(n.num);
        return { x:w.x, y:w.y, z:w.z, from:n.num, into:w.num, other:w.gid !== r.g.id }; });
    r.nodes = r.nodes.filter(n => !winner.has(n.num));
    finishStat(r);
  });
  warns.push(`已合併 ${winner.size} 個座標重合的節點(每個位置只留編號最小的那一個)` +
    (degen ? `,並刪掉 ${degen} 根因此退化成零長度的元素` : "") +
    `。節點編號會出現跳號,這是正常的。不想合併請到「編號總表」關掉。`);
  return winner.size;
}

/* 匯入組的節點必須在所有群組開始建之前先造好(SPEC §16.4)——
   一個 *GROUP 的元素端點很可能落在另一個 *GROUP 的節點清單裡,逐組建的話就接不起來。
   節點物件只造一次:由「擁有它的那一組」放進 R.nodes,別組的元素直接指到同一個物件
   (和連接族的做法一樣),所以整組平移旋轉時跨組的元素也會跟著走。 */
let IMPREG = null;
function buildImportNodes(list){
  const byNum = new Map(), byGid = new Map();
  list.forEach(g => {
    if (g.type !== "IMPORT") return;
    const arr = [], off = Math.round(num(g.renum)) || 0;
    ((g.imp && g.imp.nodes) || []).forEach(p => {
      const nu = Math.round(num(p.num)) + off;
      if (!Number.isFinite(nu) || nu <= 0 || byNum.has(nu)) return;
      const nd = { x:num(p.x) || 0, y:num(p.y) || 0, z:num(p.z) || 0, num:nu, gid:g.id, imp:true };
      byNum.set(nu, nd); arr.push(nd);
    });
    byGid.set(g.id, arr);
  });
  return { byNum, byGid };
}

function buildModel(st, errs, warns){
  const inc = Math.max(1, Math.round(num(st.numbering.inc)) || 1000);
  const prefix = st.groupPrefix || "G_";
  const built = new Map();                             // id → {nodes, elems, ...}
  const list = (st.groups || []).filter(g => g.on !== false);
  IMPREG = buildImportNodes(list);      // 匯入組的節點要先全部造好,見下方註解
  const pending = list.slice();
  const order = [];

  // 依相依關係反覆解析(不限定使用者的排列順序)
  for (let pass = 0; pass < list.length + 2 && pending.length; pass++){
    for (let i = 0; i < pending.length; ){
      const g = pending[i];
      const deps = depIds(g);
      if (deps.every(d => built.has(d))){
        const idx = list.indexOf(g);        // 用清單順序配號,與相依解析順序無關
        const r = buildOne(g, idx, built, st, inc, prefix, errs, warns);
        built.set(g.id, r); order.push(r);
        pending.splice(i, 1);
      } else i++;
    }
  }
  pending.forEach(g => errs.push(`「${g.name}」引用的群組不存在或形成循環,已略過`));

  const groups = order;
  addManualElems(groups, errs);      // 端點可能跨組,一定要等全部組都建完才解析得到
  const welded = weldNodes(groups, warns, st.weld);
  const tot = {
    n:groups.reduce((a,r) => a + r.nodes.length, 0),
    e:groups.reduce((a,r) => a + r.elems.length, 0),
    len3d:groups.reduce((a,r) => a + r.elems.reduce((s,e) => s + e.len3d, 0), 0)
  };
  // 編號衝突
  const seenN = new Map(), seenE = new Map();
  groups.forEach(r => {
    r.nodes.forEach(nd => { if (seenN.has(nd.num)) r.numClash = true; else seenN.set(nd.num, r); });
    r.elems.forEach(e  => { if (seenE.has(e.num))  r.numClash = true; else seenE.set(e.num, r); });
  });
  const clash = groups.filter(r => r.numClash);
  clash.forEach(r => errs.push(`「${r.g.name}」的節點或元素編號與其他群組重複`));

  /* 與「目標模型」的編號衝突(SPEC §16.3)。
     midas 匯入 MCT 時遇到已經存在的編號是**直接覆蓋、不會問**,而且不會報錯 ——
     被覆蓋的節點座標一改,掛在它上面的支承、荷載、施工階段就整批錯位。
     所以這一條是錯誤不是警告:寧可紅字擋在眼前,也不要在 midas 裡無聲改壞既有模型。 */
  let tclash = 0;
  if (st.target && (st.target.nodes || st.target.elems)){
    const tn = new Set(expandList(st.target.nodes)), te = new Set(expandList(st.target.elems));
    const hitN = [], hitE = [];
    groups.forEach(r => {
      // 匯入組本來就是那個目標模型,編號一樣是應該的 —— 不算衝突,
      // 否則真正該被看見的警告會被自己的幾百個節點淹掉。
      if (r.g.type === "IMPORT") return;
      r.nodes.forEach(nd => { if (tn.has(nd.num)) hitN.push(nd.num); });
      r.elems.forEach(e  => { if (te.has(e.num))  hitE.push(e.num); });
    });
    tclash = hitN.length + hitE.length;
    const brief = a => a.length > 6 ? compressList(a.slice(0, 6)) + " …" : compressList(a);
    if (hitN.length) errs.push(`節點 ${brief(hitN)} 共 ${hitN.length} 個與目標模型「${st.target.src}」重複` +
      ` —— 匯入 midas 會直接覆蓋原有節點的座標。到「編號總表」按「跳到安全號段」。`);
    if (hitE.length) errs.push(`元素 ${brief(hitE)} 共 ${hitE.length} 根與目標模型「${st.target.src}」重複` +
      ` —— 匯入 midas 會直接覆蓋原有元素。到「編號總表」按「跳到安全號段」。`);
    const tg = new Set(st.target.names || []);
    const hitG = [...new Set(groups.filter(r => r.g.type !== "IMPORT").map(r => r.gname))]
      .filter(n => tg.has(n));
    if (hitG.length) warns.push(`匯出群組名 ${hitG.join("、")} 與目標模型重複。` +
      `同名群組在 midas 裡是合併還是覆蓋尚未確認,建議改「匯出群組名前綴」避開。`);
  }

  // 沒開合併時,重合的節點還是要點名 —— 那在 midas 裡看起來相連、其實沒連。
  if (st.weld && st.weld.on === false){
    const seenP = new Map(), dupN = [];
    groups.forEach(r => r.nodes.forEach(n => {
      const key = [n.x, n.y, n.z].map(v => Math.round(v*1e6)).join(",");
      if (seenP.has(key)) dupN.push([seenP.get(key), n.num]);
      else seenP.set(key, n.num);
    }));
    if (dupN.length){
      const shown = dupN.slice(0, 6).map(a => a[0] + "≡" + a[1]).join("、");
      warns.push(`有 ${dupN.length} 對節點座標完全重合(${shown}${dupN.length > 6 ? "…" : ""})。` +
        `midas 裡它們是各自獨立的節點,看起來相連其實沒有連 —— ` +
        `到「編號總表」打開「合併重合節點」即可自動併掉。`);
    }
  }

  assignGNames(groups, prefix);
  const names = [...new Set(groups.map(r => r.gname))];
  names.push(prefix + "ALL");
  return { groups, byId:built, tot, names, prefix, inc, clash:clash.length, tclash };
}

// 依段的型別建立曲線;start 為繼承的起點(cont 時使用)
function pieceCurve(pc, start, warns, tag, endAt, noExtStart){
  const p = { ...pc, name:tag };
  if (start){ p.x1 = start.x; p.y1 = start.y; p.z1 = start.z; }
  if (endAt && END_CONT_T[pc.type] && !(pc.type === "ARC" && pc.arcMode === "center")){
    p.x2 = endAt.x; p.y2 = endAt.y; p.z2 = endAt.z;   // 終點黏到下一段的起點
    if (pc.type === "LINE") p.endMode = "point";
  }
  if (pc.type === "LINE"){
    if (p.endMode === "polar"){
      const L = num(pc.len), az = num(pc.az) || 0, el = num(pc.el) || 0;
      if (!(L > 0)) return curveErr("長度必須 > 0");
      const h = L * Math.cos(el*D2R);
      p.x2 = p.x1 + h*Math.sin(az*D2R);
      p.y2 = p.y1 + h*Math.cos(az*D2R);
      p.z2 = p.z1 + L*Math.sin(el*D2R);
    }
    /* 沿自己的方向往外延長。延長是「往外多接一段」,**原本那段的節點與元素完全不動**
       —— 幾何上先把線畫長,分割時再把基準段與延長段分開切(見 splitLineExt)。
       被別的段定義的那一端不延長:那一端的意思是「就在那個點上」,再往外推會把接縫扯開。 */
    const eS = (noExtStart || start) ? 0 : Math.max(0, num(pc.extS) || 0);
    const eE = endAt ? 0 : Math.max(0, num(pc.extE) || 0);
    if (eS || eE){
      const dx = p.x2-p.x1, dy = p.y2-p.y1, dz = p.z2-p.z1, L0 = Math.hypot(dx, dy, dz);
      if (L0 < 1e-12) return curveErr("兩端點重合,無法決定延長方向");
      const ux = dx/L0, uy = dy/L0, uz = dz/L0;
      const q = { ...p };
      if (eS){ q.x1 = p.x1 - ux*eS; q.y1 = p.y1 - uy*eS; q.z1 = p.z1 - uz*eS; }
      if (eE){ q.x2 = p.x2 + ux*eE; q.y2 = p.y2 + uy*eE; q.z2 = p.z2 + uz*eE; }
      const cvx = curveLINE(q);
      if (cvx.ok) cvx.meta.ext = { eS, eE, L:L0, total:L0 + eS + eE };
      return cvx;
    }
    return curveLINE(p);
  }
  if (pc.type === "ARC")   return curveARC(p);
  if (pc.type === "SAG")   return curveSAG(p, warns);
  if (pc.type === "HELIX"){
    // 接續前段時,由起點與起始方位角反推圓心
    if (start){
      const R = num(pc.R), az0 = num(pc.az0) || 0;
      p.cx = start.x - R*Math.sin(az0*D2R);
      p.cy = start.y - R*Math.cos(az0*D2R);
      p.z1 = start.z;
    } else { p.cx = num(pc.cx); p.cy = num(pc.cy); }
    return curveHELIX(p);
  }
  return curveErr("此段型別不使用曲線介面");
}

// 建完之後再對「整組」套用平移/旋轉 —— 剛體,長度與弦線偏差都不受影響,
// 依附本組的偏置/連接組會跟著移動(它們是在本組之後才建的)。
// 元素的弦長 / 3D 長度是在 mkElem 當下算的;整個群組平移旋轉之後,凡是有一端不屬於本組的元素
// (連接族的元素)長度會變,必須重算,否則面板與 CSV 會顯示變換前的舊值。
function refreshElemGeom(R){
  R.elems.forEach(e => { e.chord = distXY(e.a, e.b); e.len3d = dist3(e.a, e.b); });
  finishStat(R);
}

// 手動節點:使用者自己打座標,編號接在本組既有節點之後(mkNode 是 nodeBase + 序號,
// 所以 nodeBase + R.nodes.length 一定是下一個號)。
// 下游組(偏置 / 連接族)看到的是「推導出來的那一串節點」,不含手動補的點。
// 手動節點沒有方位角與曲率,混進去會讓偏置的法線投影算出 NaN;而且使用者補一個輔助點
// 就讓既有的偏置 / 連接組節點數改變,也不是「獨立新增」該有的行為。
const chainOf = r => r.nodes.some(n => n.manual) ? r.nodes.filter(n => !n.manual) : r.nodes;

/* ---- 參照一個群組時要取它的哪些節點 ----
   一個群組手上其實有兩種節點:**自己產生的**(R.nodes),以及**自己的元素碰到的**
   —— 後者對連接族來說有一大半在別的群組上。舉例:一個垂落群組自己只擁有「元素終點端」
   那一票節點,起點端全部落在來源線上。以前一律只給 chainOf(),所以這種群組永遠只有一側
   連得到,另一側根本指不到。
   這裡不預設使用者在做什麼結構,只把兩側都攤開來讓他自己選;
   自有節點與元素端點一致的群組(線、偏置)沒有這個問題,UI 就不顯示這個選項。 */
const SIDE_OPTS = [["own","本群組的節點"], ["i","元素的起點端"], ["j","元素的終點端"], ["all","元素的全部端點"]];
const sideOf = v => SIDE_OPTS.some(o => o[0] === v) ? v : "own";
// 元素端點會重複(例如扇出的起點),依元素順序去重,順序就是使用者在圖上看到的順序
const endsOf = (r, keys) => {
  const out = [], seen = new Set();
  (r.elems || []).forEach(e => keys.forEach(k => {
    const n = e[k]; if (n && !seen.has(n.num)){ seen.add(n.num); out.push(n); }
  }));
  return out;
};
function nodeSetOf(r, side){
  if (!r) return [];
  const sd = sideOf(side);
  if (sd === "own") return chainOf(r);
  const out = endsOf(r, sd === "i" ? ["a"] : sd === "j" ? ["b"] : ["a","b"]);
  return out.length ? out : chainOf(r);        // 沒有元素時退回自有節點,不要變成空的
}
// 這個群組的自有節點和元素端點不是同一票人 —— 只有這種群組才需要問「取哪一側」
const sideful = r => !!(r && r.elems && r.elems.length &&
  r.elems.some(e => (e.a && e.a.gid !== r.g.id) || (e.b && e.b.gid !== r.g.id)));

function addManualNodes(g, R){
  const list = Array.isArray(g.addN) ? g.addN : [];
  list.forEach((q, mi) => {
    const x = num(q && q.x), y = num(q && q.y), z = num(q && q.z);
    if (![x,y,z].every(Number.isFinite)) return;       // 打到一半的空欄位:先不產生
    R.nodes.push({ x, y, z, num:R.nodeBase + R.nodes.length, gid:g.id, manual:true, mi });
  });
}

function buildOne(g, idx, built, st, inc, prefix, errs, warns){
  const R = buildOneRaw(g, idx, built, st, inc, prefix, errs, warns);
  addManualNodes(g, R);
  // 平移旋轉開放給所有組別(不再限定曲線組 / 偏置),只動「本組自己的」節點
  if (R.nodes.length && xfActive(g.xf)){
    const own = R.nodes.filter(n => n.gid === g.id);
    const f = xfMake(g.xf, own);
    if (f){ xfApplyNodes(f, own); R.xfOn = true; refreshElemGeom(R); }
  }
  if (R.nodes.length) finishStat(R);
  return R;
}

function buildOneRaw(g, idx, built, st, inc, prefix, errs, warns){
  const tag = `「${g.name}」`;
  const T = TYPES[g.type];
  // v3.9:編號一律自動 —— 全域起始 + 本組在清單中的順序 × 號段增量
  const nodeBase = num(st.numbering.nodeBase) + idx*inc;
  const elemBase = num(st.numbering.elemBase) + idx*inc;
  const gname = prefix + mctName(g.name, "G" + p2(idx+1));   // 暫定值,buildModel 會統一去重
  const R = { g, idx, gname, nodeBase, elemBase, nodes:[], elems:[],
              color:groupColor(g, idx), stat:{}, pieces:[] };
  let nc = 0, ec = 0;
  const mkNode = p => { const nd = { ...p, num:nodeBase + nc++, gid:g.id }; R.nodes.push(nd); return nd; };
  const attrOf = pc => pc && pc.ovr
    ? { type:pc.etype || "BEAM", mat:Math.round(num(pc.mat)) || 1, sect:Math.round(num(pc.sect)) || 1 }
    : { type:g.etype || "BEAM", mat:Math.round(num(g.mat)) || 1, sect:Math.round(num(g.sect)) || 1 };
  const gcable = { ...CABLE_DEF(), ...(g.cable || {}) };
  const mkElem = (a, b, pc, extra) => {
    const chord = distXY(a, b), len3d = dist3(a, b);
    const e = { num:elemBase + ec++, i:a.num, j:b.num, a, b, chord, len3d, gid:g.id,
      group:gname, ...attrOf(pc), dev:0, pi:pc ? pc._i : -1, cable:gcable, ...(extra || {}) };
    R.elems.push(e); return e;
  };

  /* ---------- 匯入組:從 midas .mct 讀回來的節點與元素(SPEC §16.4)----------
     **編號原樣保留** —— 它的價值就在「對得回原模型」,所以不吃全域編號規則。
     元素也保留原始的資料列,匯出時原樣寫回去(端點沒被合併改掉的話),
     這樣纜索類的 iSUB / EXVAL 那些欄位不必重新猜。 */
  if (g.type === "IMPORT"){
    const reg = IMPREG || { byNum:new Map(), byGid:new Map() };
    const off = Math.round(num(g.renum)) || 0;
    (reg.byGid.get(g.id) || []).forEach(nd => R.nodes.push(nd));
    ((g.imp && g.imp.elems) || []).forEach(p => {
      const ii = Math.round(num(p.i)) + off, jj = Math.round(num(p.j)) + off;
      const a = reg.byNum.get(ii), b = reg.byNum.get(jj);
      if (!a || !b) return;                        // 端點不在任何匯入組裡:那根元素接不起來
      R.elems.push({ num:Math.round(num(p.num)) + off, i:a.num, j:b.num, a, b,
        chord:distXY(a, b), len3d:dist3(a, b), gid:g.id, group:gname,
        type:p.type || "BEAM", mat:Math.round(num(p.mat)) || 1, sect:Math.round(num(p.sect)) || 1,
        dev:0, pi:-1, cable:gcable, imp:true,
        // 編號偏移過就不能再用原始資料列了(裡面的編號是舊的),退回一般路徑重建
        raw:off ? "" : (p.raw || ""), i0:ii, j0:jj });
    });
    finishStat(R);
    return R;
  }

  /* ---------- 曲線組:一串段 ---------- */
  if (g.type === "CURVE"){
    const pcs = (g.pieces || []);
    if (!pcs.length){ R.stat.err = "沒有任何段"; finishStat(R); return R; }

    // 第一階段:依段的幾何算出「原始節點」(不受手動刪除影響,後續段的起點才不會跑掉)
    // v3.8:段的起點/終點可以指到任何一段的 起點/中點/終點,所以要先做相依排序,
    //       算完再依「段的索引順序」串回去 —— 元素仍然是沿著段的順序連接。
    const infos = [];
    const pnodes = pcs.map(() => []);                  // 每段自己的原始節點
    const anchors = [];                                // pi → { s, m, e }
    const { order, cyclic } = orderPieces(pcs, errs, tag);
    // 跨群組:直接去對方算好的節點串取第 k 個
    const gRefPt = ref => {
      const r = parseGRef(ref);
      if (!r) return null;
      const rr = built.get(r.gid);
      if (!rr) return null;
      const ch = chainOf(rr);
      if (!ch.length) return null;
      const q = ch[clamp(Math.round(r.idx), 1, ch.length) - 1];
      return q ? { x:q.x, y:q.y, z:q.z } : null;
    };
    const refPt = (ref, pi) => {
      const gp = gRefPt(ref);
      if (gp) return gp;
      const r = parseRef(ref);
      if (!r || cyclic.has(pi)) return null;
      const a = anchors[r.pi];
      return a ? a[r.at] || null : null;
    };
    const startPtOf = (pc, pi) => {
      if (cyclic.has(pi)) return null;
      if (sRefOf(pc) === "prev") return pi > 0 ? (anchors[pi-1] && anchors[pi-1].e) || null : null;
      return refPt(sRefOf(pc), pi);
    };

    order.forEach(pi => {
      const pc = pcs[pi];
      pc._i = pi;
      const ptag = `${tag}段 ${pi+1}(${PIECES[pc.type].name}):`;
      const startAt = startPtOf(pc, pi);
      const inherit = !!startAt;                                    // 起點由別的段給
      const endAt = endRefOn(pc) && !cyclic.has(pi) ? refPt(eRefOf(pc), pi) : null;
      // 前一段把終點接到本段起點 → 接縫節點共用、元素照樣串起來
      const prevEndsHere = pi > 0 && !inherit && eRefOf(pcs[pi-1]) === pi + ":s"
                           && endRefOn(pcs[pi-1]) && !cyclic.has(pi-1);
      // 起點接的是「前一段的終點」時才共用接縫;指到不相鄰的段只是座標重合,不併節點
      const cont = (contOn(pc, pi) && !!startAt) || prevEndsHere;
      const info = { pi, type:pc.type };
      const push = q => pnodes[pi].push(q);
      const setAnchor = () => {
        const a = pnodes[pi];
        if (a.length) anchors[pi] = { s:a[0], m:a[Math.floor((a.length-1)/2)], e:a[a.length-1] };
      };

      if (pc.type === "POINT"){
        const q0 = { x:num(pc.x2), y:num(pc.y2), z:num(pc.z2) };
        if (![q0.x,q0.y,q0.z].every(Number.isFinite)){ errs.push(ptag + "座標無效"); infos.push(info); return; }
        const fp = xfMake(pc.xf, [q0], true);
        const q = fp ? fp(q0) : q0;
        if (!prevEndsHere) push({ ...q, pi, brk:!cont });
        // 被前段終點兼任時,本段不另外產生重合節點;錨點就用那個共用的點
        anchors[pi] = { s:q, m:q, e:q };
        infos.push(info); return;
      }

      if (pc.type === "POLY"){
        // 貼上的座標表:每一行就是一個節點,不再分割 —— 貼幾點就是幾點
        const pts = parseXYZTable(pc.table, pc.skip);
        if (!pts.length){ errs.push(ptag + "座標表裡沒有可用的資料列(每行至少要有三個數字)"); infos.push(info); return; }
        const fp = xfMake(pc.xf, pts, true);
        (fp ? pts.map(q => fp(q)) : pts).forEach((q, j) => push({ ...q, pi, brk:j === 0 && !cont }));
        setAnchor();
        infos.push(info); return;
      }

      if (pc.type === "CHAIN"){
        const cg = { ...pc, name:g.name + " 段" + (pi+1),
          x:inherit ? startAt.x : num(pc.x1), y:inherit ? startAt.y : num(pc.y1),
          z:inherit ? startAt.z : num(pc.z1) };
        const ch = buildChain(cg, { push:t => errs.push(t.startsWith("「") ? t : ptag + t) }, warns);
        if (!ch || !ch.segs.length){ errs.push(ptag + "無有效段落"); infos.push(info); return; }
        info.chain = ch;
        const tolAbs = Math.max(0, num(pc.absorbTol) || 0);
        let stations = [];
        ch.segs.forEach(b => {
          const cvSeg = { len:b.length, uAtS:s => clamp(s/b.length, 0, 1),
            pt:u => { const q = b.evalLocal(u*b.length); return { x:q.x, y:q.y, z:ch.zAtS(b.s0 + u*b.length) }; } };
          splitCurve(cvSeg, pc.split, `${ptag}子段 ${b.i+1}:`, warns)
            .forEach(u => stations.push(b.s0 + u*b.length));
        });
        stations.sort((a,b) => a-b);
        let uniq = [];
        stations.forEach(s2 => { if (!uniq.length || s2 - uniq[uniq.length-1] > 1e-7) uniq.push(s2); });
        const prot = []; ch.segs.forEach(b => { prot.push(b.s0); prot.push(b.s1); });
        const forced = String(pc.forced || "").replace(/\s*-\s*/g, "-").split(/[\s,;]+/).filter(Boolean)
          .map(parseSta).filter(Number.isFinite).sort((a,b) => a-b);
        const s0 = ch.segs[0].s0, s1 = ch.segs[ch.segs.length-1].s1;
        let absorbed = 0;
        forced.forEach(f => {
          if (f < s0 - 1e-9 || f > s1 + 1e-9){ warns.push(ptag + `強制節點 ${fmtSta(f)} 不在範圍內,已忽略`); return; }
          const near = prot.find(q => Math.abs(q - f) <= tolAbs);
          if (near !== undefined){
            if (Math.abs(near - f) > 1e-6) warns.push(ptag + `強制節點 ${fmtSta(f)} 距段落交界僅 ${Math.abs(near-f).toFixed(3)} ${UL()},由交界取代`);
            return;
          }
          const kept2 = [];
          uniq.forEach(s2 => {
            if (prot.some(q => Math.abs(q-s2) < 1e-6) || Math.abs(s2 - f) > tolAbs) kept2.push(s2);
            else if (Math.abs(s2 - f) > 1e-6) absorbed++;
          });
          uniq = kept2; uniq.push(f); uniq.sort((a,b) => a-b);
        });
        const fset = s2 => forced.some(f => Math.abs(f - s2) < 1e-6);
        const evalAt = s2 => {
          for (let i2 = ch.segs.length-1; i2 >= 0; i2--){
            const b = ch.segs[i2];
            if (s2 >= b.s0 - 1e-7 && s2 <= b.s1 + 1e-7){
              const q = b.evalLocal(clamp(s2 - b.s0, 0, b.length));
              return { x:q.x, y:q.y, z:ch.zAtS(s2), az:q.az, k:q.k, s:s2, seg:b.i, grade:ch.gradeAtS(s2) };
            }
          }
          return null;
        };
        const fx = xfMake(pc.xf, uniq.map(s2 => evalAt(s2)).filter(Boolean), true);
        const evalX = fx ? (s2 => xfPt(fx, evalAt(s2))) : evalAt;
        info.evalAt = evalX; info.absorbed = absorbed; info.total = ch.total;
        uniq.forEach((s2, j) => {
          if (cont && j === 0) return;
          const q = evalX(s2); if (q) push({ ...q, pi, forced:fset(s2), brk:(!cont && j === 0) });
        });
        setAnchor();
        if (cont && anchors[pi]){                       // 共用的接縫點才是真正的起點
          const sp = startAt || (prevEndsHere && anchors[pi-1] ? anchors[pi-1].e : null);
          if (sp) anchors[pi].s = sp;
        }
        infos.push(info); return;
      }

      const cv0 = pieceCurve(pc, inherit ? startAt : null, warns, ptag, endAt, cont);
      if (!cv0.ok){ errs.push(ptag + cv0.err); infos.push(info); return; }
      const us = cv0.meta && cv0.meta.ext
        ? splitLineExt(cv0, pc.split, cv0.meta.ext, ptag, warns)
        : splitCurve(cv0, pc.split, ptag, warns);
      const fx = xfMake(pc.xf, us.map(u => cv0.pt(u)), true);
      const cv = fx ? xfCurve(cv0, fx) : cv0;           // 參考曲線一起轉,畫面才不會兩條分家
      info.curve = cv; info.meta = cv.meta; info.len = cv.len;
      us.forEach((u, j) => {
        if (cont && j === 0) return;
        push({ ...cv.pt(u), u, pi, brk:(!cont && j === 0) });
      });
      // 錨點一律用「這段真正的幾何」,不受第一個節點有沒有被共用影響
      anchors[pi] = { s:cv.pt(0), m:cv.pt(0.5), e:cv.pt(1) };
      infos.push(info);
    });

    infos.sort((a, b) => a.pi - b.pi);
    const raw = [];
    pcs.forEach((pc, pi) => {
      const info = infos.find(x => x.pi === pi);
      if (info) info.r0 = raw.length;
      pnodes[pi].forEach(q => raw.push(q));
      if (info) info.r1 = raw.length;
    });
    // 第二階段:套用手動編輯與刪除
    const edits = g.edits || {}, dels = new Set((g.dels || []).map(Number));
    let nDel = 0, nEdit = 0, pendBrk = false;
    const kept = [];
    // 哪些段的節點被人動過 —— 這些段的「原始參數曲線」已經不代表現況,不要再畫出來
    const touched = new Set();
    raw.forEach((p, ri) => {
      if (dels.has(ri)){ if (p.brk) pendBrk = true; nDel++; touched.add(p.pi); return; }
      const e = edits[ri];
      const q = { ...p, ri };
      if (e){                                          // 逐軸套用:某軸無效就沿用原始值
        let any = false;
        const ax = num(e.x), ay = num(e.y), az2 = num(e.z);
        if (Number.isFinite(ax)){ q.x = ax; any = true; }
        if (Number.isFinite(ay)){ q.y = ay; any = true; }
        if (Number.isFinite(az2)){ q.z = az2; any = true; }
        if (any){ q.edited = true; nEdit++; touched.add(p.pi); }
      }
      if (pendBrk){ q.brk = true; pendBrk = false; }
      kept.push(q);
    });
    if (dels.size > nDel) warns.push(tag + `有 ${dels.size - nDel} 個刪除標記已失效(節點數改變),可在節點區按「清除全部覆寫」`);
    const staleEdit = Object.keys(edits).filter(k => +k >= raw.length).length;
    if (staleEdit) warns.push(tag + `有 ${staleEdit} 個座標覆寫已失效(節點數改變)`);

    kept.forEach(p => mkNode(p));
    annotate(R.nodes);

    // 第三階段:連接元素;跨過被刪除的節點時自動連接前後兩點
    for (let j = 0; j < R.nodes.length - 1; j++){
      const a = R.nodes[j], b = R.nodes[j+1];
      if (b.brk) continue;
      const pc = pcs[b.pi];
      const e = mkElem(a, b, pc,
        (a.s !== undefined && b.s !== undefined) ? { arc:b.s - a.s, seg:a.seg } : null);
      if (a.pi === b.pi && !a.edited && !b.edited && b.ri === a.ri + 1){
        const info = infos.find(x => x.pi === a.pi);
        if (info && info.curve) e.dev = maxDevOn(info.curve, a.u, b.u);
        else if (info && info.evalAt) e.dev = maxDevOn({ pt:u => info.evalAt(a.s + (b.s - a.s)*u) }, 0, 1);
      }
    }
    // 各段的實際節點/元素範圍(供面板顯示)
    infos.forEach(info => {
      info.n0 = R.nodes.findIndex(n => n.pi === info.pi);
      const arr = R.nodes.filter(n => n.pi === info.pi);
      info.n1 = info.n0 < 0 ? 0 : info.n0 + arr.length;
      if (info.n0 < 0) info.n0 = 0;
      const el = R.elems.filter(e => e.pi === info.pi);
      info.e0 = R.elems.indexOf(el[0]); info.e1 = info.e0 + el.length;
      if (info.e0 < 0){ info.e0 = 0; info.e1 = 0; }
    });
    infos.forEach(info => { if (touched.has(info.pi)) info.touched = true; });
    R.pieces = infos;
    R.raw = raw;
    R.stat.nDel = nDel; R.stat.nEdit = nEdit;
    finishStat(R); return R;
  }

  /* ---------- 偏置 ---------- */
  if (g.type === "OFFSET"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到基準群組,或基準群組沒有節點"); R.stat.err = "無基準"; return R; }
    const d = num(g.d) || 0, h = num(g.h) || 0;
    let degenerate = false;
    chainOf(ref).forEach(n0 => {
      const a = (n0.az + 90) * D2R;
      if (Math.abs(n0.k) > 1e-9){
        const r = 1/n0.k, rl = r - d;
        if (rl * r <= 0 || Math.abs(rl) < 1e-6) degenerate = true;
      }
      mkNode({ x:n0.x + d*Math.sin(a), y:n0.y + d*Math.cos(a), z:n0.z + h,
        az:n0.az, k:n0.k, s:n0.s, forced:n0.forced, brk:n0.brk });
    });
    if (degenerate) errs.push(tag + "偏置量已達到或超過內側曲率中心,幾何退化");
    for (let j = 0; j < R.nodes.length-1; j++)
      if (!R.nodes[j+1].brk) mkElem(R.nodes[j], R.nodes[j+1], null);
    R.stat = { ...R.stat, ref:ref.g.name, d, h };
    finishStat(R); return R;
  }

  /* ---------- 對接 ---------- */
  if (g.type === "LINK2"){
    const A0 = built.get(g.a), B0 = built.get(g.b);
    if (!A0 || !B0){ errs.push(tag + "找不到要連接的群組"); R.stat.err = "缺少來源"; return R; }
    const A = nodeSetOf(A0, g.aSide), Braw = nodeSetOf(B0, g.bSide);
    const B = g.rev ? [...Braw].reverse() : Braw;      // 「目標群組反序」:兩條線走向相反時用
    const NA = A.length, NB = B.length;
    if (!NA || !NB){ errs.push(tag + "來源群組沒有節點"); R.stat.err = "無節點"; return R; }
    const mode = pairOf(g);
    const iv = (v, d) => { const n = Math.round(num(v)); return Number.isFinite(n) ? n : d; };
    const pairs = [];                                   // [起始群組索引, 目標群組索引],都是 0 起算
    let outside = 0;
    if (mode === "free"){
      /* 自訂:一個「樣式單元」(pattern,單元內可以有任意多條連線 —— 兩點直連、
         四點交叉都只是不同的單元),沿兩個群組各自以 aEvery / bEvery 的步進重複。
         沒有 pattern 的舊檔案 = 單元只有一條 [0,0],結果和以前逐根對逐根完全相同。 */
      const pat = patOf(g);
      const a0 = clamp(iv(g.aFrom, 1) || 1, 1, NA) - 1;
      const b0 = clamp(iv(g.bFrom, 1) || 1, 1, NB) - 1;
      const ae = Math.max(1, iv(g.aEvery, 1) || 1), be = Math.max(1, iv(g.bEvery, 1) || 1);
      const wA = Math.max(...pat.map(q => q[0])), wB = Math.max(...pat.map(q => q[1]));
      const room = Math.max(0,
        Math.min(Math.floor((NA-1-a0-wA)/ae), Math.floor((NB-1-b0-wB)/be)) + 1);
      const want = Math.max(0, iv(g.count, 0) || 0);
      const cnt = want > 0 ? Math.min(want, room) : room;
      if (want > room) warns.push(tag + `想重複 ${want} 次,節點只夠 ${room} 次,已重複到用完為止`);
      for (let k = 0; k < cnt; k++) pat.forEach(([qa, qb]) => {
        const ja = a0 + k*ae + qa, jb = b0 + k*be + qb;
        if (ja >= 0 && ja < NA && jb >= 0 && jb < NB) pairs.push([ja, jb]); else outside++;
      });
    } else {
      const lo0 = clamp(iv(g.from, 1) || 1, 1, NA);
      const hi0 = clamp(iv(g.to, 0) || NA, 1, NA);
      const lo = Math.min(lo0, hi0) - 1, hi = Math.max(lo0, hi0) - 1;
      const ev = Math.max(1, iv(g.every, 1) || 1);
      const idx = [];
      for (let j = lo; j <= hi; j += ev) idx.push(j);
      const put = (j, q) => { if (q >= 0 && q < NB) pairs.push([j, q]); else outside++; };
      if (mode === "same" || mode === "skew"){
        const sh = mode === "skew" ? iv(g.skew, 1) || 0 : 0;
        idx.forEach(j => put(j, j + sh));
      } else if (mode === "cross"){
        // 相鄰兩格拉一對來回:A[j]–B[q] 與 A[q]–B[j]
        for (let t = 0; t + 1 < idx.length; t++){ put(idx[t], idx[t+1]); put(idx[t+1], idx[t]); }
      } else if (mode === "ratio"){
        const tA = arcParam(A), tB = arcParam(B);
        idx.forEach(j => put(j, nearestAt(tB, tA[j])));
      } else if (mode === "near"){
        idx.forEach(j => {
          let bd = Infinity, bi = -1;
          for (let q = 0; q < NB; q++){ const d = dist3(A[j], B[q]); if (d < bd){ bd = d; bi = q; } }
          put(j, bi);
        });
      }
    }
    if (outside) warns.push(tag + `有 ${outside} 根對不到目標群組的節點(超出範圍),已略過`);
    if (!pairs.length){ errs.push(tag + "沒有可以連接的節點對"); R.stat.err = "無配對"; return R; }
    if (mode === "ratio" || mode === "near"){
      const seen = new Set(); let dup = 0;
      pairs.forEach(([, q]) => { if (seen.has(q)) dup++; else seen.add(q); });
      if (dup) warns.push(tag + `有 ${dup} 根連到重複的節點(兩個群組疏密差太多)`);
    }
    pairs.forEach(([j, q]) => mkElem(A[j], B[q], null));
    R.stat = { ...R.stat, a:A0.g.name, b:B0.g.name, count:pairs.length, pair:mode };
    finishStat(R); return R;
  }

  /* ---------- 垂落 ---------- */
  if (g.type === "LINKZ"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到來源群組"); R.stat.err = "無來源"; return R; }
    /* 目標高程三種寫法:
       abs   固定高程(原本就有的)
       plane 過某點、給 X / Y 兩個坡度的斜面 —— 坡地上的墩柱、傾斜的橋面
       ref   取另一群組「對應那個節點」的 Z —— 掛在另一條線下面的吊索        */
    const zMode = (g.zMode === "plane" || g.zMode === "ref") ? g.zMode : "abs";
    const tz = num(g.targetZ);
    if (zMode === "abs" && !Number.isFinite(tz)){ errs.push(tag + "目標高程無效"); R.stat.err = "高程無效"; return R; }
    const pl = { px:num(g.px) || 0, py:num(g.py) || 0, pz:num(g.pz) || 0,
                 sx:num(g.sx) || 0, sy:num(g.sy) || 0 };
    const zr = zMode === "ref" ? built.get(g.zRef) : null;
    const zrn = zr ? nodeSetOf(zr, g.zRefSide) : null;
    if (zMode === "ref" && (!zrn || !zrn.length)){
      errs.push(tag + "找不到取高程的那個群組"); R.stat.err = "無高程來源"; return R;
    }
    const every = Math.max(1, Math.round(num(g.every)) || 1);
    const snap = g.bottom === "snap";
    const tolS = Math.max(0, num(g.snapTol) || 0);
    const pool = snap ? [...built.values()].flatMap(r => r.nodes) : [];
    const src0 = nodeSetOf(ref, g.refSide);
    const N0 = src0.length;
    const lo0 = clamp(Math.round(num(g.from)) || 1, 1, N0);
    const hi0 = clamp(Math.round(num(g.to)) || N0, 1, N0);
    const lo = Math.min(lo0, hi0) - 1, hi = Math.max(lo0, hi0) - 1;
    let skipped = 0, noZ = 0;
    for (let j = lo; j <= hi; j += every){
      const top = src0[j];
      let zt;
      if (zMode === "plane") zt = pl.pz + pl.sx*(top.x - pl.px) + pl.sy*(top.y - pl.py);
      else if (zMode === "ref"){ const q = zrn[j]; if (!q){ noZ++; continue; } zt = q.z; }
      else zt = tz;
      if (!Number.isFinite(zt)){ noZ++; continue; }
      if (top.z <= zt + 1e-9){ skipped++; continue; }
      const target = { x:top.x, y:top.y, z:zt };
      let bot = null;
      if (snap){
        let bd = Infinity;
        pool.forEach(n0 => { const dd = dist3(n0, target); if (dd < bd){ bd = dd; bot = n0; } });
        if (!bot || bd > tolS) bot = null;
      }
      if (!bot) bot = mkNode({ ...target, deck:true });
      mkElem(top, bot, null);
    }
    if (skipped) warns.push(tag + `有 ${skipped} 個來源節點已低於目標高程,該連接略過`);
    if (noZ) warns.push(tag + `有 ${noZ} 個節點在取高程的群組裡沒有對應節點,已略過`);
    R.stat = { ...R.stat, ref:ref.g.name, targetZ:tz, skipped, zMode };
    finishStat(R); return R;
  }

  /* ---------- 扇出(扇形) ---------- */
  if (g.type === "FAN"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到目標群組"); R.stat.err = "無目標"; return R; }
    let src;
    if (g.srcMode === "gnode"){
      // 用「某群組的第 k 個節點」而不是節點編號:上游重新分割時編號會跑掉,序號不會
      const sg = built.get(g.srcG);
      const sn = sg ? nodeSetOf(sg, g.srcGSide) : null;
      if (!sn || !sn.length){ errs.push(tag + "找不到起點所在的群組"); R.stat.err = "起點無效"; return R; }
      const ki = clamp(Math.round(num(g.srcI)) || 1, 1, sn.length);
      src = sn[ki-1];
    } else if (g.srcMode === "node"){
      const all = [...built.values()].flatMap(r => r.nodes);
      src = all.find(n0 => n0.num === Math.round(num(g.srcNode)));
      if (!src){ errs.push(tag + `起點節點 ${g.srcNode} 不存在`); R.stat.err = "起點無效"; return R; }
    } else {
      const p = { x:num(g.sx), y:num(g.sy), z:num(g.sz) };
      if (![p.x,p.y,p.z].every(Number.isFinite)){ errs.push(tag + "起點座標無效"); R.stat.err = "起點無效"; return R; }
      src = mkNode({ ...p, fanSrc:true });
    }
    R.src = src;
    const N = Math.max(1, Math.round(num(g.div)) || 1);
    const every = Math.max(1, Math.round(num(g.every)) || 1);
    const tgt = nodeSetOf(ref, g.refSide);
    const from = clamp(Math.round(num(g.from)) || 1, 1, tgt.length);
    const to   = clamp(Math.round(num(g.to)) || tgt.length, 1, tgt.length);
    const lo = Math.min(from, to), hi = Math.max(from, to);
    let flat = false, cnt = 0;
    for (let j = lo; j <= hi; j += every){
      const T2 = tgt[j-1];
      const chord = dist3(src, T2);
      if (chord < 1e-9) continue;
      const f = g.fMode === "ratio" ? (num(g.f) || 0)*chord : (num(g.f) || 0);
      if (N > 1 && Math.abs(f) < 1e-9 && !flat){
        warns.push(tag + `分割數 ${N} > 1 但垂度 = 0:節點共線,幾何非線性分析橫向勁度為零,極可能不收斂`);
        flat = true;
      }
      let prev = src;
      for (let k = 1; k <= N; k++){
        const u = k/N;
        const p = { x:src.x + (T2.x-src.x)*u, y:src.y + (T2.y-src.y)*u,
                    z:src.z + (T2.z-src.z)*u - 4*f*u*(1-u) };
        const nd = (k === N) ? T2 : mkNode({ ...p, fanMid:true });
        mkElem(prev, nd, null, { target:T2.num });
        prev = nd;
      }
      cnt++;
    }
    R.stat = { ...R.stat, ref:ref.g.name, count:cnt, div:N };
    finishStat(R); return R;
  }

  errs.push(tag + "未知型別 " + g.type);
  return R;
}

function finishStat(R){
  const L = R.elems.map(e => e.len3d), C = R.elems.map(e => e.chord);
  R.stat.n = R.nodes.length; R.stat.e = R.elems.length;
  R.stat.minL = L.length ? Math.min(...L) : 0;
  R.stat.maxL = L.length ? Math.max(...L) : 0;
  R.stat.len3d = L.reduce((a,b) => a+b, 0);
  R.stat.planLen = C.reduce((a,b) => a+b, 0);
  R.stat.maxDev = R.elems.length ? Math.max(...R.elems.map(e => e.dev)) : 0;
}


/* ==========================================================================
   7. 輸出:MCT / CSV / JSON
   ⚠️ 欄位結構已依實機 Export 樣本對齊(見 SPEC.md §9.1.2),iSUB/EXVAL 枚舉值仍待逐一驗證。要改只需動 MCT_FMT 與 elemLine()。
   ========================================================================== */
const MCT_COMMENT = ";";
const MCT_FMT = {
  hint:{ UNIT:"FORCE, LENGTH, HEAT, TEMPER", NODE:"iNO, X, Y, Z",
         ELEMENT:[
           "iEL, TYPE, iMAT, iPRO, iN1, iN2, ANGLE, iSUB,                     ; Frame  Element",
           "iEL, TYPE, iMAT, iPRO, iN1, iN2, ANGLE, iSUB, EXVAL, EXVAL2, bLMT ; Comp/Tens Truss",
           "iEL, TYPE, iMAT, iPRO, iN1, iN2, iN3, iN4, iSUB, iWID , LCAXIS    ; Planar Element",
           "iEL, TYPE, iMAT, iPRO, iN1, iN2, iN3, iN4, iN5, iN6, iN7, iN8     ; Solid  Element",
         ],
         GROUP:"NAME, NODE_LIST, ELEM_LIST, PLANE_TYPE" },
  indent:"   "
};
// 值(key)是 .mct *UNIT 要的大寫代碼,不能改;顯示一律用正規的公制寫法(m / kN / kgf)。
const UNIT_LENGTH = [["M","m"],["CM","cm"],["MM","mm"],["IN","in"],["FT","ft"]];
const UNIT_FORCE  = [["KGF","kgf"],["KN","kN"],["N","N"],["TONF","tonf"],["LBF","lbf"],["KIPS","kips"]];
const LEN_FACTOR  = { M:1, CM:100, MM:1000, IN:1/0.0254, FT:1/0.3048 };
const lenFactor = () => LEN_FACTOR[state.units.length] || 1;
// 畫面上顯示用的單位符號 —— 輸入什麼單位,算什麼單位,匯出就是什麼單位,全程不換算
const LEN_SYM = { M:"m", CM:"cm", MM:"mm", IN:"in", FT:"ft" };
const FORCE_SYM = { N:"N", KN:"kN", KGF:"kgf", TONF:"tonf", LBF:"lbf", KIPS:"kips" };
const UL = () => LEN_SYM[(state && state.units && state.units.length) || "M"] || "m";
const UF = () => FORCE_SYM[(state && state.units && state.units.force) || "KGF"] || "kgf";
// 以公尺定義的物理門檻(例如 50 mm 弦線偏差)換算到目前單位,警示才不會失準
const inU = mVal => mVal * lenFactor();
// 弦線偏差之類的小量:依大小自動決定小數位,單位一律跟著標
const devTxt = v => { const a = Math.abs(+v);
  return (a < 1e-12 ? "0" : (+v).toFixed(a >= 100 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : 6)) + " " + UL(); };
// 新增段/組時的預設尺寸也跟著單位走(在 MM 底下不會生出 100 mm 的橋)
const dL = v => { const k = lenFactor(); return k === 1 ? v : +(v*k).toPrecision(12); };
const mnum = v => String(+(+v).toFixed(6));
const mlen = mnum;                                    // 座標直接輸出,不再乘換算係數

function compressList(nums){
  const a = [...new Set(nums)].sort((x,y) => x-y), out = [];
  let i = 0;
  while (i < a.length){
    let j = i;
    while (j+1 < a.length && a[j+1] === a[j]+1) j++;
    if (j-i >= 2) out.push(`${a[i]}to${a[j]}`);
    else for (let k = i; k <= j; k++) out.push(String(a[k]));
    i = j+1;
  }
  return out.join(" ");
}

// 纜索設定改成「每一組自己的」(e.cable 由 mkElem 帶上),各組可以有不同的初始張力。
function elemLine(e){
  // 匯入的元素原樣寫回去(SPEC §16.4)。端點被「合併重合節點」改掉時就不能用原始列了,
  // 那種情況退回一般路徑重建 —— 寧可欄位保守,也不要輸出指向錯節點的舊資料列。
  if (e.raw && e.i === e.i0 && e.j === e.j0) return e.raw;
  const isCable = e.type === "CABLE";
  const base = `${e.num}, ${isCable ? "TENSTR" : e.type}, ${e.mat}, ${e.sect}, ${e.i}, ${e.j}, 0`;
  if (isCable){
    const c = { ...CABLE_DEF(), ...(e.cable || {}) };
    const sub = Math.round(num(c.sub)) || 3, ev = mnum(num(c.val) || 0);
    // 依實機樣本:iSUB=2(Hook)只到 EXVAL 為止(9 欄,無 EXVAL2/bLMT);
    // iSUB=3(Cable)到 EXVAL2 為止(10 欄);iSUB=1(Truss 允許有限壓力)多帶 bLMT(11 欄)。
    if (sub === 2) return `${base}, ${sub}, ${ev}`;
    if (sub === 1) return `${base}, ${sub}, ${ev}, 0, ${c.blmt || "NO"}`;
    return `${base}, ${sub}, ${ev}, ${Math.round(num(c.kind)) || 3}`;
  }
  return `${base}, 0`;
}

function groupMembers(){
  const m = new Map();
  const add = (g, ns, es) => {
    if (!m.has(g)) m.set(g, { n:new Set(), e:new Set() });
    const t = m.get(g); ns.forEach(x => t.n.add(x)); es.forEach(x => t.e.add(x));
  };
  MODEL.groups.forEach(r => {
    const own = new Set(r.nodes.map(n => n.num));
    add(r.gname, r.nodes.map(n => n.num), r.elems.map(e => e.num));
    r.elems.forEach(e => add(r.gname, [e.i, e.j].filter(x => own.has(x)), []));
  });
  const allN = [], allE = [];
  MODEL.groups.forEach(r => { r.nodes.forEach(n => allN.push(n.num)); r.elems.forEach(e => allE.push(e.num)); });
  add(MODEL.prefix + "ALL", allN, allE);
  return m;
}

function mctText(){
  const C = MCT_COMMENT, I = MCT_FMT.indent, u = state.units, L = [];
  const rule = C + "-".repeat(75);
  const rng = arr => { if (!arr || !arr.length) return "-";
    let lo = Infinity, hi = -Infinity;
    arr.forEach(o => { if (o.num < lo) lo = o.num; if (o.num > hi) hi = o.num; });
    return lo === hi ? String(lo) : lo + "-" + hi; };
  L.push(rule);
  L.push(`${C} Alignment Modeler  (alignment-modeler)`);
  L.push(`${C} Generated : ${localStampText()} ${tzOffset()}`);
  L.push(`${C} Units     : ${u.force}, ${u.length}   (coordinates exported as entered, no conversion)`);
  L.push(`${C} Groups    : ${MODEL.groups.length}`);
  L.push(`${C} Nodes     : ${MODEL.tot.n}    Elements : ${MODEL.tot.e}    Structure groups : ${MODEL.names.length}`);
  L.push(`${C} Total elem length : ${mnum(MODEL.tot.len3d)}`);
  L.push(`${C}`);
  MODEL.groups.forEach(r => L.push(`${C}   ${r.gname} (${TYPES[r.g.type].en})` +
    `  nodes ${rng(r.nodes)}  elements ${rng(r.elems)}`));
  L.push(`${C}`);
  L.push(`${C} NOTE: importing an MCT containing *UNIT changes the model's active unit system.`);
  L.push(`${C} NOTE: element beta angle is always 0.`);
  L.push(`${C} The parameter block below restores every input if this file is dropped back`);
  L.push(`${C} onto the generator page.`);
  L.push(rule);
  embedParams(paramsJSON()).split("\n").forEach(l => L.push(l));
  L.push("");

  L.push("*UNIT");
  L.push(`${C} ${MCT_FMT.hint.UNIT}`);
  L.push(`${I}${u.force}, ${u.length}, ${u.heat}, ${u.temper}`);
  L.push("");

  L.push("*NODE");
  L.push(`${C} ${MCT_FMT.hint.NODE}`);
  MODEL.groups.forEach(r => {
    if (!r.nodes.length) return;
    L.push(`${C} --- ${r.gname} (${TYPES[r.g.type].en}) ---`);
    r.nodes.forEach(n => L.push(`${I}${n.num}, ${mlen(n.x)}, ${mlen(n.y)}, ${mlen(n.z)}`));
  });
  L.push("");

  L.push("*ELEMENT");
  MCT_FMT.hint.ELEMENT.forEach(l => L.push(`${C} ${l}`));
  MODEL.groups.forEach(r => {
    if (!r.elems.length) return;
    L.push(`${C} --- ${r.gname} (${TYPES[r.g.type].en}) ---`);
    r.elems.forEach(e => L.push(I + elemLine(e)));
  });
  L.push("");

  L.push("*GROUP");
  L.push(`${C} ${MCT_FMT.hint.GROUP}`);
  const gm = groupMembers();
  MODEL.names.forEach(nm => {
    const t = gm.get(nm) || { n:new Set(), e:new Set() };
    L.push(`${I}${nm}, ${compressList([...t.n])}, ${compressList([...t.e])}, 0`);
  });
  L.push("");
  return L.join("\r\n");
}

const csvEsc = v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvEsc).join(",")).join("\r\n");

function nodeCSV(){
  const U = UL();
  const rows = [["節點編號","群組","型別",`X (${U})`,`Y (${U})`,`Z (${U})`,`樁號 (${U})`,"方位角 (°)",
    `當地半徑 (${U})`,`前一元素長度 3D (${U})`,`前一元素弦線偏差 (${U})`,"備註"]];
  MODEL.groups.forEach(r => {
    const prev = new Map(); r.elems.forEach(e => prev.set(e.j, e));
    r.nodes.forEach(n => {
      const pe = prev.get(n.num), kk = Math.abs(n.k || 0);
      rows.push([n.num, r.g.name, TYPES[r.g.type].name,
        n.x.toFixed(4), n.y.toFixed(4), n.z.toFixed(4),
        Number.isFinite(n.s) ? fmtSta(n.s) : "",
        Number.isFinite(n.az) ? n.az.toFixed(4) : "",
        kk < 1e-9 ? "∞" : (1/kk).toFixed(3),
        pe ? pe.len3d.toFixed(4) : "", pe ? pe.dev.toFixed(6) : "",
        [n.forced && "強制節點", n.deck && "連接下端", n.fanSrc && "扇形起點", n.fanMid && "扇形中間"]
          .filter(Boolean).join("/")]);
    });
  });
  return toCSV(rows);
}
function elemCSV(){
  const U = UL();
  const rows = [["元素編號","群組","類型","材料","斷面","i節點","j節點",`平面弦長 (${U})`,`3D長度 (${U})`,
    `弧長 (${U})`,`弦線偏差 (${U})`,"群組"]];
  MODEL.groups.forEach(r => r.elems.forEach(e => rows.push([
    e.num, r.g.name, e.type, e.mat, e.sect, e.i, e.j,
    e.chord.toFixed(4), e.len3d.toFixed(4),
    Number.isFinite(e.arc) ? e.arc.toFixed(4) : "", e.dev.toFixed(6), e.group])));
  return toCSV(rows);
}

const FORMAT_VERSION = 3;
const paramsJSON = () => JSON.stringify({ formatVersion:FORMAT_VERSION, tool:"alignment-modeler",
  generated:localStampISO(), state }, null, 1);
const PARAM_BEGIN = "==== CURVE-GEN-PARAMS-BEGIN ====", PARAM_END = "==== CURVE-GEN-PARAMS-END ====";
// 參數區塊裡有使用者輸入的中文(組名、段名),整份 .mct 要保持純 ASCII 才不會在 midas 裡變亂碼,
// 所以把非 ASCII 逐字轉成 \uXXXX —— 仍是合法 JSON,parse 回來與原字串完全相同,還原功能不受影響。
// 範圍只取 U+007F 以上:JSON.stringify 的縮排換行是真的換行字元,連它一起轉會把結構本身變成
// 逸出序列,整份 JSON 就 parse 不回來了(檔頭參數還原功能會靜默失效)。
const asciiJSON = j => j.replace(/[\u007F-\uFFFF]/g,
  c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
const embedParams = j => [MCT_COMMENT + " " + PARAM_BEGIN]
  .concat(asciiJSON(j).split("\n").map(l => MCT_COMMENT + " " + l))
  .concat([MCT_COMMENT + " " + PARAM_END]).join("\n");
function extractParams(text){
  const lines = String(text).split(/\r?\n/);
  const i0 = lines.findIndex(l => l.indexOf(PARAM_BEGIN) >= 0);
  const i1 = lines.findIndex(l => l.indexOf(PARAM_END) >= 0);
  if (i0 < 0 || i1 <= i0) return null;
  try { return JSON.parse(lines.slice(i0+1, i1).map(l => l.replace(/^\s*;\s?/, "")).join("\n")); }
  catch (e){ return null; }
}
function download(name, text, mime){
  const b = new Blob([text], { type:mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* ==========================================================================
   狀態
   ========================================================================== */
const DEF_STATE = () => ({
  groups:[],
  numbering:{ nodeBase:1001, elemBase:1001, inc:1000 },
  groupPrefix:"G_",
  units:{ length:"M", force:"KGF", heat:"KJ", temper:"C" },
  lib:{ mat:{}, sect:{} },        // 從 midas .mct 匯入的材料 / 斷面名稱
  // 目標模型佔用表(SPEC §16.3):匯入 midas 的 .mct 時記下它已經用掉哪些編號。
  // 只存壓縮過的號碼範圍字串(整份 state 會嵌進 .mct 檔頭,不能塞幾千個號碼)。
  target:null,                    // { src, at, nodes:"1to2400", elems:"1to2650", names:[…] }
  weld:{ on:true, tol:0 },       // 合併座標重合的節點(只留編號最小的那個)
  view:{ az:90, el:90, zEx:1 }                          // 預設 = 俯視(北上、東右)
});
let state = DEF_STATE();
let MODEL = { groups:[], byId:new Map(), tot:{ n:0, e:0, len3d:0 }, names:[], prefix:"G_", inc:1000 };
let ERRS = [], WARNS = [], SEL = null, SELNODE = null, SELELEM = null;
/* 多選:和檔案總管一樣 —— 直接點 = 只選這個,Ctrl / Cmd 點 = 加選或取消,
   Shift 點 = 從上一個選到這個。SEL 仍然是「主要選取」(面板跟著它走)。 */
let SELSET = new Set();
const selOnly = id => { SEL = id; SELSET = id ? new Set([id]) : new Set(); };
const selGroups = () => state.groups.filter(g => SELSET.has(g.id));
// 節點 / 元素的一次性平移旋轉輸入(不進 state,不進復原堆疊)
let XFT = XF_DEF();

function normState(s){
  const d = DEF_STATE();
  s.numbering = { ...d.numbering, ...(s.numbering || {}) };
  s.units     = { ...d.units, ...(s.units || {}) };
  s.lib       = { mat:{ ...(s.lib && s.lib.mat) }, sect:{ ...(s.lib && s.lib.sect) } };
  s.weld      = { ...d.weld, ...(s.weld || {}) };
  // 目標模型佔用表:舊檔沒有這個欄位;壞掉的內容一律當成沒有,不要讓它擋住開檔
  {
    const t = s.target;
    s.target = (t && typeof t === "object" && (t.nodes || t.elems || (t.names || []).length))
      ? { src:String(t.src || ""), at:String(t.at || ""),
          nodes:String(t.nodes || ""), elems:String(t.elems || ""),
          names:(Array.isArray(t.names) ? t.names : []).map(String) }
      : null;
  }
  delete s.mct;                                        // v3.8:纜索設定下放到各組
  const v0 = s.view || {};
  s.view      = { ...d.view, ...v0 };
  // v3.5 以前的立面設定:Z 縮放改名成 Z 誇大,其餘(投影模式)已無對應
  if (v0.zEx === undefined && Number.isFinite(+v0.zScale)) s.view.zEx = +v0.zScale;
  ["profMode","zScale","zAuto"].forEach(k => delete s.view[k]);
  if (!(+s.view.zEx > 0)) s.view.zEx = 1;
  if (!Number.isFinite(+s.view.el)) s.view.el = 90;
  s.view.el = norm180(+s.view.el);
  s.groupPrefix = s.groupPrefix || "G_";
  if (!Array.isArray(s.groups)) s.groups = [];
  s.groups.forEach(g => {
    if (!g.id) g.id = newId();
    const n = +String(g.id).replace(/\D/g, "");
    if (Number.isFinite(n) && n >= SEQ) SEQ = n + 1;
    const base = defaultGroup(g.type);
    const keepId = g.id;
    Object.keys(base).forEach(k => { if (g[k] === undefined) g[k] = base[k]; });
    g.id = keepId;
    g.xf = { ...XF_DEF(), ...(g.xf || {}) };
    // 手動節點 / 元素:舊檔沒有這兩個欄位
    g.addN = (Array.isArray(g.addN) ? g.addN : [])
      .map(q => ({ x:num(q && q.x) || 0, y:num(q && q.y) || 0, z:num(q && q.z) || 0 }));
    g.cable = { ...CABLE_DEF(), ...(g.cable || {}) };
    // 匯入組(SPEC §16.4):只有座標與清單,沒有參數。壞掉的列直接丟掉,不要讓它擋住開檔。
    if (g.type === "IMPORT"){
      const im = g.imp || {};
      g.imp = { src:String(im.src || ""),
        nodes:(Array.isArray(im.nodes) ? im.nodes : []).map(p => ({
            num:Math.round(num(p && p.num)) || 0,
            x:num(p && p.x) || 0, y:num(p && p.y) || 0, z:num(p && p.z) || 0 }))
          .filter(p => p.num > 0),
        elems:(Array.isArray(im.elems) ? im.elems : []).map(p => ({
            num:Math.round(num(p && p.num)) || 0, type:String((p && p.type) || "BEAM"),
            mat:Math.round(num(p && p.mat)) || 1, sect:Math.round(num(p && p.sect)) || 1,
            i:Math.round(num(p && p.i)) || 0, j:Math.round(num(p && p.j)) || 0,
            raw:String((p && p.raw) || "") }))
          .filter(p => p.num > 0 && p.i > 0 && p.j > 0 && p.i !== p.j) };
    }
    delete g.autoNum; delete g.nodeBase; delete g.elemBase;   // v3.9:編號一律自動
    // 手動元素:「群組 + 第幾個節點」的參照要留著,不能只留節點編號 —— 編號會隨上游分割改變
    g.addE = (Array.isArray(g.addE) ? g.addE : [])
      .map(q => {
        const o = { i:Math.round(num(q && q.i)) || 0, j:Math.round(num(q && q.j)) || 0 };
        if (parseGRef(q && q.ai)) o.ai = q.ai;
        if (parseGRef(q && q.bi)) o.bi = q.bi;
        return o;
      })
      .filter(q => (q.ai || q.i) && (q.bi || q.j) && !(q.i && q.j && q.i === q.j));
    if (g.type === "CURVE"){
      if (!g.edits || typeof g.edits !== "object") g.edits = {};
      if (!Array.isArray(g.dels)) g.dels = [];
      if (!Array.isArray(g.pieces) || !g.pieces.length) g.pieces = [{ ...defaultPiece("LINE"), sRef:"" }];
      g.pieces = g.pieces.map((pc, i) => {
        const d = defaultPiece(pc.type || "LINE");
        const out = { ...d, ...pc };
        const sp0 = pc.split || {};
        out.split = { ...SPLIT_DEF, ...sp0 };
        // v3.4 以前:容差固定以 mm 輸入、其餘一律公尺
        if (sp0.tol === undefined && Number.isFinite(+sp0.tolMm)) out.split.tol = (+sp0.tolMm)/1000;
        delete out.split.tolMm;
        out.xf = { ...XF_DEF(), ...(pc.xf || {}) };
        delete out._c;                                  // v3.11:段不再各自分色
        // v3.8:cont / endCont 兩個布林改成可以指到任一段的 sRef / eRef。
        // 判斷要看「原始的 pc」有沒有帶舊欄位 —— out 已經合併過 defaultPiece,永遠有 sRef/eRef。
        if (pc.sRef === undefined)
          out.sRef = (pc.cont !== undefined)
            ? ((i > 0 && pc.cont !== false && pc.cont !== "0" && pc.cont !== 0) ? "prev" : "")
            : (i > 0 ? "prev" : "");
        if (pc.eRef === undefined)
          out.eRef = (pc.endCont === true || pc.endCont === "1") ? (i+1) + ":s" : "";
        delete out.cont; delete out.endCont;
        if (i === 0 && out.sRef === "prev") out.sRef = "";
        const bad = ref => { const r = parseRef(ref);
          return !!r && (r.pi === i || r.pi < 0 || r.pi >= (g.pieces || []).length); };
        if (bad(out.sRef)) out.sRef = "";               // 指到自己或已被刪掉的段 → 退回自訂
        if (bad(out.eRef)) out.eRef = "";
        return out;
      });
    }
  });
  return s;
}

/* ---------- 換單位:數值要不要跟著換算 ---------- */
const rnd12 = v => +(+v).toPrecision(12);
const SC_G  = { OFFSET:["d","h"], LINKZ:["targetZ","snapTol"], FAN:["sx","sy","sz"] };
const SC_PC = ["x1","y1","z1","x2","y2","z2","cx","cy","len","R","R2","pitch","sta","absorbTol"];
const SC_SEG = ["L","R","R0","R1","Ls","A"];
const SC_XF = ["dx","dy","dz","cx","cy","cz"];
// 幾何大小不變、只換單位:所有長度性質的欄位一起乘 k
function scaleModel(st, k){
  const S = (o, keys) => { if (o) keys.forEach(key => {
    const raw = o[key];
    if (raw === "" || raw === null || raw === undefined) return;   // 留白代表「沒有這個值」,不能變成 0
    const v = num(raw); if (Number.isFinite(v)) o[key] = rnd12(v*k); }); };
  (st.groups || []).forEach(g => {
    S(g, SC_G[g.type] || []);
    if (g.type === "FAN" && g.fMode === "abs") S(g, ["f"]);
    S(g.xf, SC_XF);
    (g.pieces || []).forEach(pc => {
      S(pc, SC_PC);
      if (pc.fMode === "abs") S(pc, ["f"]);
      S(pc.xf, SC_XF);
      S(pc.split, ["spacing","maxSpacing","tol","axisSpacing","axisAt"]);
      if (pc.split && pc.split.list) pc.split.list = scaleSpacingList(pc.split.list, k);
      (pc.segments || []).forEach(sg => S(sg, SC_SEG));
      (pc.profile || []).forEach(v => S(v, ["sta","z","L"]));
      if (pc.forced) pc.forced = String(pc.forced).split(/[\s,;]+/).filter(Boolean)
        .map(t => { const v = parseSta(t); return Number.isFinite(v) ? fmtSta(rnd12(v*k)) : t; }).join(", ");
    });
    if (g.edits) Object.keys(g.edits).forEach(ri => S(g.edits[ri], ["x","y","z"]));
  });
  return st;
}

/* ---------- 範例 ---------- */
/* ==========================================================================
   範例模型(三個,各自完整)
   一個是「把整套流程走一遍」的樣品,所以每個都做到可以直接匯出:
   線 → 偏置 → 對接 → 垂落 / 扇出,元素類型、材料、斷面全部填好。
   ========================================================================== */
const DEMO_G = (name, pieces, o) => ({ ...defaultGroup("CURVE"), name,
  pieces:pieces.map((p, i) => ({ ...defaultPiece(p.type), ...p,
    sRef:i === 0 ? "" : (p.cont === false ? "" : "prev") })), ...o });
const DEMO_D = (t, o) => ({ type:t, ...o });
const SPL = o => ({ ...SPLIT_DEF, ...o });
// 範例一律從西南角的斜視角開檔:三個模型都是「細長 + 有高度」,
// 俯視看不出高程、立面看不出平面線形,斜視角才一眼看得懂。
const DEMO_VIEW = () => ({ az:135, el:CORNER_EL, zEx:1 });

/* ---- 一、人行吊橋 ----
   跨徑 80 m、垂跨比 0.12 的懸索人行橋。主索走「錨碇 → 塔頂 → 懸鏈線 → 塔頂 → 錨碇」
   三段一組;吊索由主索垂落到橋面邊樑,下端直接貼附既有節點,不另生節點。
   橋面下掛一組**箱型桁架**(邊樑當上弦 + 下弦 + 豎桿 / 斜桿 + 下弦橫梁 / 斜撐);
   兩側再各一條**抗風索**(兩端錨在岩壁、向內傾斜 45°、頂點朝橋面板),
   由**抗風支索**把桁架下弦拉到抗風索上。                                        */
function demoSuspension(){
  const s = DEF_STATE();
  s.view = DEMO_VIEW();
  const G = DEMO_G, D = DEMO_D;
  const Y = 1.2, ZD = 10, ZT = 22, ZA = 6, L = 80, SP = 2.5;

  // 橋面中心線 → 兩側邊樑 → 橫梁
  const deck = G("橋面中心線", [D("LINE", { x1:0, y1:0, z1:ZD, endMode:"point",
    x2:L, y2:0, z2:ZD, split:SPL({ mode:"spacing", spacing:SP, rem:"keep" }) })],
    { etype:"BEAM", mat:1, sect:1 });
  // 橋沿 +X(東)走,兩側其實是南北 —— 所以用沿線方向的「左 / 右」命名,不用東西
  const edL = { ...defaultGroup("OFFSET"), name:"邊樑左", ref:deck.id, d:-Y, h:0,
                etype:"BEAM", mat:1, sect:2 };
  const edR = { ...defaultGroup("OFFSET"), name:"邊樑右", ref:deck.id, d:Y,  h:0,
                etype:"BEAM", mat:1, sect:2 };
  /* 橫梁每個節點一根(2.5 m)—— 吊索也是每 2.5 m 一根,一根吊索正對一根橫梁,
     載重才有地方交:吊索吊住邊樑節點,橫梁就在同一個節點把力橫過去。 */
  const xb  = { ...defaultGroup("LINK2"), name:"橫梁", a:edL.id, b:edR.id,
                pair:"same", from:1, to:0, every:1, etype:"BEAM", mat:1, sect:3 };

  /* ---- 橋面下的桁架 ----
     兩側邊樑就是上弦,各自往下偏置 TD 得下弦,每個節點(2.5 m)一根豎桿 ——
     每一根橫梁 / 吊索底下都正好有一組豎桿接著,節點就是桁架的格點。
     三個面的斜撐一律是 **X 型**,用「對接」的**交叉**配對做:
     相鄰兩個格點拉一對來回(A[j]–B[j+1] 與 A[j+1]–B[j]),一格兩根、正好交叉。
       兩側面:上弦 ↔ 同側下弦     底面:下弦左 ↔ 下弦右
       橫隔面:上弦 ↔ **對側**下弦(同一個 x,兩根在斷面內交叉)
     橫隔斜撐每 2 個節點(5 m)一組就夠 —— 它是把斷面撐成矩形用的,
     不像側面 / 底面要一路跟著格點走。三個面都封起來才是真正的箱型桁架,
     也才有東西承抗風支索拉進來的橫向力。                                       */
  const TD = 1.6;                                      // 桁架深度(下弦在橋面下 1.6 m)
  const bot = (nm, ref) => ({ ...defaultGroup("OFFSET"), name:nm, ref, d:0, h:-TD,
                              etype:"BEAM", mat:1, sect:13 });
  const blL = bot("下弦左", edL.id), blR = bot("下弦右", edR.id);
  const web = (nm, a, b) => ({ ...defaultGroup("LINK2"), name:nm, a, b,
    pair:"same", from:1, to:0, every:1, etype:"BEAM", mat:3, sect:14 });
  const wbL = web("桁架豎桿左", edL.id, blL.id), wbR = web("桁架豎桿右", edR.id, blR.id);
  /* 交叉配對:相鄰兩格拉一對來回 —— 一格兩根、方向相反,就是 X。
     每一根的兩端仍分屬上下弦,所以不會有「對不到節點」的漏根問題。 */
  const dia = (nm, a, b, ev) => ({ ...defaultGroup("LINK2"), name:nm, a, b,
    pair:"cross", from:1, to:0, every:ev || 1, etype:"TRUSS", mat:3, sect:15 });
  const dgL = dia("桁架斜撐左", edL.id, blL.id), dgR = dia("桁架斜撐右", edR.id, blR.id);
  const xbB = { ...defaultGroup("LINK2"), name:"下弦橫梁", a:blL.id, b:blR.id,
                pair:"same", from:1, to:0, every:1, etype:"BEAM", mat:3, sect:16 };
  const brB = { ...defaultGroup("LINK2"), name:"下弦斜撐", a:blL.id, b:blR.id,
                pair:"cross", from:1, to:0, every:1, etype:"TRUSS", mat:3, sect:17 };
  // 橫隔面的 X:同一個 x 上「上弦 ↔ 對側下弦」兩根,在斷面內交叉
  const crs = (nm, a, b) => ({ ...defaultGroup("LINK2"), name:nm, a, b,
    pair:"same", from:1, to:0, every:2, etype:"TRUSS", mat:3, sect:20 });
  const crA = crs("橫隔斜撐左上", edL.id, blR.id), crB = crs("橫隔斜撐右上", edR.id, blL.id);

  // 主索(每側三段:引索 → 懸鏈線 → 引索),接縫節點共用
  const cable = (nm, y, sect) => G(nm, [
    D("LINE", { x1:-15, y1:y, z1:ZA, endMode:"point", x2:0, y2:y, z2:ZT, split:SPL({ count:3 }) }),
    D("SAG",  { x2:L, y2:y, z2:ZT, curve:"catenary", fMode:"ratio", f:0.12,
                split:SPL({ count:32 }) }),
    D("LINE", { endMode:"point", x2:L+15, y2:y, z2:ZA, split:SPL({ count:3 }) })
  ], { etype:"CABLE", mat:2, sect });
  const cL = cable("主索左", Y, 11), cR = cable("主索右", -Y, 11);

  // 吊索:主索第 5..35 個節點垂落到橋面高程,下端貼附邊樑既有節點
  const hang = (nm, ref) => ({ ...defaultGroup("LINKZ"), name:nm, ref, targetZ:ZD,
    from:5, to:35, every:1, bottom:"snap", snapTol:0.01, etype:"CABLE", mat:2, sect:12 });
  const hL = hang("吊索左", cL.id), hR = hang("吊索右", cR.id);

  /* ---- 抗風索 ----
     兩端錨在橋兩側的岩壁上(x = 10 / 70、y = ±WY、z = WZ),跨 60 m,比主索短一截。
     索身是一條**拋物線,但垂度給負值** → 往弦線的另一邊鼓起來(頂點在上,不是下垂);
     整組再繞**橋軸(X)**轉 ±45°,鼓起的方向就從正上方轉成「朝內上方 45°」。
     旋轉中心取在兩端錨碇的連線上(cy/cz = 錨碇),所以**錨碇不動**,只有頂點轉向。
     結果:錨碇在外下方、頂點在內上方(朝橋面板),
     縱視圖看左側是左下右上、右側是右下左上,兩側鏡像。                          */
  const WX1 = 10, WX2 = 70, WY = 8, WZ = 2, WF = 0.10, WN = 24;
  const wind = (nm, sgn) => G(nm, [
    D("SAG", { x1:WX1, y1:sgn*WY, z1:WZ, x2:WX2, y2:sgn*WY, z2:WZ,
               curve:"parabola", fMode:"ratio", f:-WF, split:SPL({ count:WN }) })
  ], { etype:"CABLE", mat:2, sect:18,
       xf:{ ...XF_DEF(), rot:sgn*45, axis:"X", cmode:"custom", cx:0, cy:sgn*WY, cz:WZ } });
  const wcL = wind("抗風索左", 1), wcR = wind("抗風索右", -1);

  /* 抗風支索:桁架下弦 → 抗風索,每 5 m 一根,而且兩端要落在**同一個 x** 上
     (純橫向的支索才擋得住側向風)。下弦節點間距 2.5 m、抗風索也切成 2.5 m,
     但兩者起點差 10 m —— 所以用「自訂連接方式」各自指定起算節點與步進:
     下弦第 7 個(x = 15)配抗風索第 3 個(x = 15),兩邊都每 2 個節點前進。
     重複 11 次停在 x = 65,兩端的錨碇節點留空不接。                             */
  const wstay = (nm, a, b) => ({ ...defaultGroup("LINK2"), name:nm, a, b, pair:"free",
    aFrom:7, aEvery:2, bFrom:3, bEvery:2, count:11, etype:"CABLE", mat:2, sect:19 });
  const wsL = wstay("抗風支索左", blL.id, wcL.id), wsR = wstay("抗風支索右", blR.id, wcR.id);

  // 塔架:兩根立柱 + 頂橫梁,一組三段
  const tower = (nm, x) => G(nm, [
    D("LINE", { x1:x, y1:-Y, z1:ZT, endMode:"point", x2:x, y2:-Y, z2:0, split:SPL({ count:6 }) }),
    D("LINE", { cont:false, x1:x, y1:Y, z1:ZT, endMode:"point", x2:x, y2:Y, z2:0, split:SPL({ count:6 }) }),
    D("LINE", { cont:false, x1:x, y1:-Y, z1:ZT, endMode:"point", x2:x, y2:Y, z2:ZT, split:SPL({ count:2 }) })
  ], { etype:"BEAM", mat:3, sect:4 });

  s.groups = [deck, edL, edR, xb, blL, blR, wbL, wbR, dgL, dgR, xbB, brB, crA, crB,
              cL, cR, hL, hR, wcL, wcR, wsL, wsR, tower("塔架西", 0), tower("塔架東", L)];
  return s;
}

/* ---- 二、公路橋梁 ----
   平面「直線 → 緩和曲線 → 圓弧 → 緩和曲線 → 直線」、縱斷面用 VPI + 對稱豎曲線,
   全長 458 m。橋面 10.5 m 寬,每 20 m 一組橫隔梁;兩側各一道護欄(扶手 + 立柱);
   橋墩做成雙柱構架:墩頂橫梁 + 兩根柱 + 柱底的承台繫梁。                       */
function demoHighway(){
  const s = DEF_STATE();
  s.view = DEMO_VIEW();
  const G = DEMO_G, D = DEMO_D;
  const HW = 5.25;                                     // 橋面半寬
  const PIER = { from:9, to:85, every:8 };             // 墩位:每 8 個節點 = 每 40 m

  const main = G("主線", [D("CHAIN", { x1:0, y1:0, z1:40, az:90, sta:0,
    segments:[
      { type:"LINE",   L:60 },
      { type:"SPIRAL", R0inf:true, R1:250, dir:1, defBy:"Ls", Ls:60 },
      { type:"ARC",    R:250, dir:1, defBy:"delta", delta:50 },
      { type:"SPIRAL", R0:250, R1inf:true, dir:1, defBy:"Ls", Ls:60 },
      { type:"LINE",   L:60 }
    ],
    profile:[{ sta:0, z:40, L:0 }, { sta:170, z:46.8, L:160 }, { sta:458.2, z:40, L:0 }],
    split:SPL({ mode:"spacing", spacing:5, rem:"keep" }) })],
    { etype:"BEAM", mat:1, sect:1 });
  const edL = { ...defaultGroup("OFFSET"), name:"左緣", ref:main.id, d:-HW, h:0,
                etype:"BEAM", mat:1, sect:2 };
  const edR = { ...defaultGroup("OFFSET"), name:"右緣", ref:main.id, d:HW,  h:0,
                etype:"BEAM", mat:1, sect:2 };
  const dia = { ...defaultGroup("LINK2"), name:"橫隔梁", a:edL.id, b:edR.id,
                pair:"same", from:1, to:0, every:4, etype:"BEAM", mat:1, sect:3 };

  // 護欄:邊緣往上偏置 1.05 m 當扶手,每 2 個節點一根立柱
  const rail = (nm, ref) => ({ ...defaultGroup("OFFSET"), name:nm, ref, d:0, h:1.05,
                               etype:"BEAM", mat:3, sect:6 });
  const rlL = rail("左護欄扶手", edL.id), rlR = rail("右護欄扶手", edR.id);
  const post = (nm, a, b) => ({ ...defaultGroup("LINK2"), name:nm, a, b,
    pair:"same", from:1, to:0, every:2, etype:"BEAM", mat:3, sect:7 });
  const psL = post("左護欄立柱", edL.id, rlL.id), psR = post("右護欄立柱", edR.id, rlR.id);

  /* 橋墩:雙柱構架。兩根柱從橋面兩側邊緣落到傾斜的地面上,
     柱頂由「墩頂橫梁」拉起來(比一般橫隔梁重,所以另外一組、另一個斷面),
     柱底再用「承台繫梁」接起來 —— 底端節點就是兩根柱的「元素終點端」。 */
  const cap = { ...defaultGroup("LINK2"), name:"墩頂橫梁", a:edL.id, b:edR.id,
                pair:"same", ...PIER, etype:"BEAM", mat:1, sect:8 };
  const col = (nm, ref) => ({ ...defaultGroup("LINKZ"), name:nm, ref, zMode:"plane",
    px:0, py:0, pz:22, sx:-0.02, sy:0, ...PIER, etype:"BEAM", mat:3, sect:5 });
  const clL = col("墩柱左", edL.id), clR = col("墩柱右", edR.id);
  const tie = { ...defaultGroup("LINK2"), name:"承台繫梁", a:clL.id, b:clR.id,
                aSide:"j", bSide:"j",                  // 取兩根柱的下端
                pair:"same", from:1, to:0, every:1, etype:"BEAM", mat:3, sect:9 };

  s.groups = [main, edL, edR, dia, rlL, rlR, psL, psR, cap, clL, clR, tie];
  return s;
}

/* ---- 三、螺旋人行上升步道 ----
   模擬繞塔身上升的步道:半徑 5.5 m、坡度 8%、繞 6⅙ 圈(層間淨高 2.77 m),
   **進出口在平面上夾 120°**。
   踏面兩側偏置成內外緣,內外各一道護欄。支撐分兩路:
   **內緣**由柱頂拉吊索吊住(拉在內側才不會穿過人行空間),
   **外緣**用外柱撐 —— 外柱是**從地面一路連到最高一圈的連續柱**,坡道每繞到那個角度就接一次。 */
function demoSpiral(){
  const s = DEF_STATE();
  s.view = DEMO_VIEW();
  const G = DEMO_G, D = DEMO_D;
  /* 半徑由**層間淨高**反推,不是隨便給的:螺距 = 坡度 × 2πR,坡度一定(8%)時
     半徑就是唯一的旋鈕。要層間至少 2.5 m 淨高(1.5 m 走起來很壓迫),
     R = 3 只有 1.51 m —— 至少要 R ≈ 4.97;取 **5.5 m** 讓螺距到 2.77 m,
     扣掉踏面結構(中心線模型沒畫厚度)還有 2.5 m 以上的實際淨高。          */
  const R = 5.5, W = 1.1, SLOPE = 0.08;
  /* 進出口的夾角:俯視時兩條直線段要**像斗笠一樣把圓夾在中間**(不是交叉成 X)。
     兩段都與圓相切,切線交於一點 P,四邊形 OAPB 在 A、B 是直角
     → ∠APB = 180° − ∠AOB。要 ∠APB = 120°,兩個切點的圓心角就是 60°。

     光有 60° 還不夠 —— 走的方向決定 P 落在哪一邊:
       轉 60°(mod 360):引道與出口從切點往**外**發散,P 在圓的另一側 → 斗笠。
       轉 300°(mod 360):兩段都**穿過 P** 再往外跑 → 平面上交叉成 X。
     所以圈數的小數部分必須是 **⅙**(轉 60°),不是 ⅚。取 6⅙ 圈滿足「至少 6 圈」。 */
  const TURNS = 37/6;                  // 6⅙ 圈(要求至少 6 圈)
  const PITCH = SLOPE*2*Math.PI*R;     // 螺距 = 坡度 × 一圈的周長 ≈ 2.765 m = 層間淨高
  const ZTOP = PITCH*TURNS;            // 總爬升 ≈ 17.05 m
  const SWEEP = 360*TURNS, EXIT_AZ = norm360(180 + SWEEP);   // = 240°
  const MAST_Z = ZTOP + 2;             // 中央柱要高過最高一圈,吊索才拉得住
  const NT = 36;                       // 每圈的節點數(10° 一個)
  const NH = NT*TURNS;                 // 螺旋的分割數 = 222
  const H0 = 7;                        // 螺旋第一個節點在整串裡的序號(1 起算)
  const HE = H0 + NH;                  // 螺旋最後一個節點 = 229
  /* 外柱的角度位置:第一圈的第 C0、C0+CS、… 個節點,每 CS 個節點(= 90°)一根。
     **三種柱段都用同一組角度**,疊起來才是一根從地面連到頂的柱子 ——
     柱子不可能架在兩圈中間的空中。

     外緣半徑(R + W)一定**大於** R,引道那條切線(x = R)因此會切進外緣圓:
     外緣上 φ ∈ (311.8°, 360°) 這一段的平面位置,正落在引道路面的 2.2 m 寬帶裡。
     R = 5.5 時禁區是 48.2° 寬(R = 3 時是 62.4°),看起來 60° 柱距塞得下,
     其實不行 —— 60° 一根時柱子的角度**固定**落在 {10, 70, …, 310},
     310° 那根離引道路面只有 0.16 m,擦邊。所以柱距維持 90°(CS = 9 個節點)。
     相位取 C0 = H0+2 → 柱子在 φ = 20°/110°/200°/290°:離引道路面最近 2.4 m、
     出口那一圈的高程根本碰不到出口路面,都閃得開。
     C0 = H0+2 仍在接縫節點之後,方位角不受直線段影響,柱子照樣鉛直。            */
  const CS = 9, C0 = H0 + 2, C1 = C0 + NT - CS;        // 第一圈的最後一個柱位

  const ramp = G("坡道中心線", [
    // 引道:切線進入 —— 螺旋起點 (R, 0) 的切線朝南,所以引道從北邊直直開下來
    D("LINE",  { x1:R, y1:10, z1:0, endMode:"point", x2:R, y2:0, z2:0,
                 split:SPL({ count:6 }) }),
    D("HELIX", { R, R2:"", az0:90, turns:TURNS, pitch:PITCH, dir:1,
                 split:SPL({ count:NH }) }),
    // 出口:切線離開,方位 = 180° + 轉過的總角度
    D("LINE",  { endMode:"polar", len:10, az:EXIT_AZ, el:0, split:SPL({ count:6 }) })
  ], { etype:"BEAM", mat:1, sect:1 });

  // 螺旋是順時針(dir 1),所以「右正」的偏置指向圓心 —— 內緣是 +W、外緣是 −W
  const inn = { ...defaultGroup("OFFSET"), name:"內緣", ref:ramp.id, d:W,  h:0,
                etype:"BEAM", mat:1, sect:2 };
  const out = { ...defaultGroup("OFFSET"), name:"外緣", ref:ramp.id, d:-W, h:0,
                etype:"BEAM", mat:1, sect:2 };
  const tread = { ...defaultGroup("LINK2"), name:"踏面橫梁", a:inn.id, b:out.id,
                  pair:"same", from:1, to:0, every:2, etype:"BEAM", mat:1, sect:3 };
  // 內外兩側各一道護欄:邊緣往上偏置 1.1 m 當扶手,每 4 個節點一根立柱
  const rail = (nm, ref) => ({ ...defaultGroup("OFFSET"), name:nm, ref, d:0, h:1.1,
                               etype:"BEAM", mat:3, sect:6 });
  const rlI = rail("內側扶手", inn.id), rlO = rail("外側扶手", out.id);
  const post = (nm, a, b) => ({ ...defaultGroup("LINK2"), name:nm, a, b,
    pair:"same", from:1, to:0, every:4, etype:"BEAM", mat:3, sect:7 });
  const psI = post("內側欄杆立柱", inn.id, rlI.id), psO = post("外側欄杆立柱", out.id, rlO.id);

  /* 外柱下段:第一圈的外緣落到地面 Z = 0。
     第一根(φ = 20°)略過 —— 那裡坡道才離地 15 cm,等於直接坐在地上,
     硬生一根 15 cm 的柱子只會在模型裡留下一個超短元素。
     (螺距回到 2.77 m 之後,第二根 φ = 110° 已經離地 0.85 m,不必再跳過。)      */
  const colGnd = { ...defaultGroup("LINKZ"), name:"外柱(落地段)", ref:out.id, targetZ:0,
                   from:C0 + CS, to:C1, every:CS, etype:"BEAM", mat:3, sect:5 };
  /* 外柱上段:外緣的第 j 個節點接第 j + 一圈 個 —— 同角度、剛好差一個螺距,鉛直。
     範圍一路吃到「還接得到下一圈」為止,所以同一個角度會一段接一段疊上去,
     和落地段接起來就是一根從地面連到最高一圈的連續柱。                        */
  const colUp = { ...defaultGroup("LINK2"), name:"外柱(層間段)", a:out.id, b:out.id,
                  pair:"skew", skew:NT, from:C0, to:HE - NT, every:CS,
                  etype:"BEAM", mat:3, sect:5 };

  const mast = G("中央柱", [D("LINE", { x1:0, y1:0, z1:0, endMode:"point",
    x2:0, y2:0, z2:MAST_Z, split:SPL({ count:8 }) })], { etype:"BEAM", mat:3, sect:4 });
  /* 吊索拉在**內緣**:內側整個是空的,索從柱頂拉到內緣只會在端點碰到坡道,
     不會像拉外緣那樣橫穿人行空間。每 9 個節點(= 90°)一條。 */
  const stay = { ...defaultGroup("FAN"), name:"吊索", srcMode:"gnode", srcG:mast.id, srcI:9,
                 ref:inn.id, from:H0 + 6, to:HE - 6, every:9, div:1,
                 etype:"CABLE", mat:2, sect:12 };

  s.groups = [ramp, inn, out, tread, rlI, rlO, psI, psO, colGnd, colUp, mast, stay];
  return s;
}

function groupSummary(g){
  const r = MODEL.byId ? MODEL.byId.get(g.id) : null;
  if (g.on === false) return "停用";
  if (!r) return "—";
  if (r.stat.err) return r.stat.err;
  // 數字與單位之間不留空白,清單才擠得下(「2段 · 29節點」而不是「2 段 · 29 節點」)
  if (TYPES[g.type].fam === "con") return r.elems.length + "元素";
  if (g.type === "CURVE") return `${(g.pieces||[]).length}段 · ${r.nodes.length}節點`;
  return r.nodes.length + "節點";
}

`;
