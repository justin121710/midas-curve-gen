function renderChecks(){
  $("#msgs").innerHTML =
    ERRS.map(t => `<div class="msg err">✕ <span>${esc(t)}</span></div>`).join("") +
    WARNS.map(t => `<div class="msg warn">⚠ <span>${esc(t)}</span></div>`).join("");
  const devs = MODEL.groups.flatMap(r => r.elems.map(e => e.dev));
  const lens = MODEL.groups.flatMap(r => r.elems.map(e => e.len3d));
  const maxDev = devs.length ? Math.max(...devs)*1000 : 0;
  const hot = v => v ? ' class="hot"' : "";
  $("#kpi").innerHTML = `
    <div><span class="k">組</span><b>${MODEL.groups.length}</b></div>
    <div><span class="k">節點</span><b>${MODEL.tot.n}</b></div>
    <div><span class="k">元素</span><b>${MODEL.tot.e}</b></div>
    <div><span class="k">最大弦線偏差</span><b${hot(maxDev > 50)}>${maxDev.toFixed(2)} mm</b></div>
    <div><span class="k">最短元素</span><b${hot(lens.length && Math.min(...lens) < 0.3)}>${lens.length ? Math.min(...lens).toFixed(3) : "0.000"} m</b></div>
    <div><span class="k">元素總長</span><b>${MODEL.tot.len3d.toFixed(3)} m</b></div>
    <div><span class="k">編號衝突</span><b${hot(MODEL.clash)}>${MODEL.clash ? MODEL.clash + " 組" : "無"}</b></div>
    <div><span class="k">群組</span><b>${MODEL.names.length}</b></div>`;
  $("#legend").innerHTML = MODEL.groups.map(r =>
    `<span><i style="background:${r.color}"></i>${esc(r.g.name)}</span>`).join("");
}

/* ---- 平面 ---- */
const cv = $("#cv"), ctx = cv.getContext("2d");
const view = { cx:0, cy:0, scale:1, locked:false };
let showNodes = true, hover = null;

const allPts = () => MODEL.groups.flatMap(r => r.nodes);
function curvePts(r){
  if (r.curve){ const out = []; for (let i = 0; i <= 200; i++) out.push(r.curve.pt(i/200)); return out; }
  if (r.chain && r.evalAt){
    const out = [], s0 = r.chain.segs[0].s0, s1 = r.chain.segs[r.chain.segs.length-1].s1;
    for (let i = 0; i <= 400; i++){ const p = r.evalAt(s0 + (s1-s0)*i/400); if (p) out.push(p); }
    return out;
  }
  return r.nodes;
}
function fitView(){
  const P = allPts();
  if (!P.length){ view.cx = 0; view.cy = 0; view.scale = 1; return; }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; });
  const W = cv.clientWidth || 600, H = cv.clientHeight || 300;
  view.scale = Math.min(W/Math.max(x1-x0,1e-6), H/Math.max(y1-y0,1e-6)) * 0.84;
  view.cx = (x0+x1)/2; view.cy = (y0+y1)/2;
}
const toS = p => ({ x:(p.x - view.cx)*view.scale + cv.clientWidth/2,
                    y:cv.clientHeight/2 - (p.y - view.cy)*view.scale });
const toW = (sx, sy) => ({ x:(sx - cv.clientWidth/2)/view.scale + view.cx,
                           y:(cv.clientHeight/2 - sy)/view.scale + view.cy });
function niceStep(px, scale){
  const raw = px/scale, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
const fmtN = v => Math.abs(v) < 1e-9 ? "0" : (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(Math.abs(v)%1 ? 1 : 0));

function draw(){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if (!allPts().length) return;

  // 格線
  const step = niceStep(80, view.scale);
  const tl = toW(0,0), br = toW(W,H);
  ctx.lineWidth = 1; ctx.font = "9.5px " + getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.fillStyle = "#b8c0cb";
  for (let x = Math.ceil(tl.x/step)*step; x <= br.x; x += step){
    const s = toS({x,y:0}).x;
    ctx.strokeStyle = Math.abs(x) < 1e-9 ? "#dfe4ea" : "#f0f2f4";
    ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(s,H); ctx.stroke();
    ctx.fillText(fmtN(x), s+3, H-4);
  }
  for (let y = Math.ceil(br.y/step)*step; y <= tl.y; y += step){
    const s = toS({x:0,y}).y;
    ctx.strokeStyle = Math.abs(y) < 1e-9 ? "#dfe4ea" : "#f0f2f4";
    ctx.beginPath(); ctx.moveTo(0,s); ctx.lineTo(W,s); ctx.stroke();
    ctx.fillText(fmtN(y), 3, s-3);
  }

  MODEL.groups.forEach(r => {
    const on = SEL === r.g.id;
    ctx.strokeStyle = r.color; ctx.lineJoin = "round"; ctx.lineCap = "round";
    if (TYPES[r.g.type].fam === "con"){
      ctx.lineWidth = on ? 1.8 : 1; ctx.globalAlpha = on ? 1 : .6;
      ctx.beginPath();
      r.elems.forEach(e => { const a = toS(e.a), b = toS(e.b); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); });
      ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      const pts = curvePts(r);
      ctx.lineWidth = on ? 3 : 1.9;
      ctx.beginPath();
      pts.forEach((p,i) => { const s = toS(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); });
      ctx.stroke();
    }
    if (showNodes && r.nodes.length){
      const rad = r.nodes.length > 400 ? 1.2 : (r.nodes.length > 150 ? 1.7 : 2.4);
      ctx.fillStyle = r.color;
      r.nodes.forEach(n => { const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,rad,0,7); ctx.fill(); });
      // 端點
      ctx.fillStyle = "#fff"; ctx.strokeStyle = r.color; ctx.lineWidth = 1.6;
      [r.nodes[0], r.nodes[r.nodes.length-1]].forEach(n => {
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,3.4,0,7); ctx.fill(); ctx.stroke(); });
    }
  });

  // 比例尺 + 北
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(8, H-30, step*view.scale+58, 22);
  ctx.strokeStyle = "#5a6472"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(14,H-18); ctx.lineTo(14+step*view.scale,H-18); ctx.stroke();
  ctx.fillStyle = "#5a6472"; ctx.font = "10px sans-serif";
  ctx.fillText(fmtN(step)+" m", 18+step*view.scale, H-15);
  ctx.beginPath(); ctx.moveTo(W-22,34); ctx.lineTo(W-22,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-22,10); ctx.lineTo(W-26,17); ctx.lineTo(W-18,17); ctx.closePath(); ctx.fill();
  ctx.fillText("N", W-26, 46);

  if (hover){ const s = toS(hover);
    ctx.strokeStyle = "#1c5d99"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,5.5,0,7); ctx.stroke(); }
}

let drag = null;
cv.addEventListener("mousedown", e => { drag = { x:e.offsetX, y:e.offsetY, cx:view.cx, cy:view.cy }; });
window.addEventListener("mouseup", () => { drag = null; });
cv.addEventListener("mousemove", e => {
  if (drag){ view.cx = drag.cx - (e.offsetX-drag.x)/view.scale;
             view.cy = drag.cy + (e.offsetY-drag.y)/view.scale;
             view.locked = true; draw(); return; }
  const w = toW(e.offsetX, e.offsetY);
  let best = null, bd = Infinity, bg = null;
  MODEL.groups.forEach(r => r.nodes.forEach(n => {
    const d = (n.x-w.x)**2 + (n.y-w.y)**2; if (d < bd){ bd = d; best = n; bg = r; } }));
  hover = (best && Math.sqrt(bd)*view.scale < 24) ? best : null;
  $("#ro").textContent = hover
    ? `${bg.g.name} #${hover.num}  X ${hover.x.toFixed(3)}  Y ${hover.y.toFixed(3)}  Z ${hover.z.toFixed(3)}` +
      (Number.isFinite(hover.s) ? `  ${fmtSta(hover.s)}` : "")
    : `X ${w.x.toFixed(3)}   Y ${w.y.toFixed(3)}`;
  draw(); drawProf();
});
cv.addEventListener("mouseleave", () => { hover = null; $("#ro").textContent = ""; draw(); drawProf(); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const w = toW(e.offsetX, e.offsetY), f = Math.exp(-e.deltaY*0.0015);
  view.scale *= f;
  view.cx = w.x - (e.offsetX - cv.clientWidth/2)/view.scale;
  view.cy = w.y + (e.offsetY - cv.clientHeight/2)/view.scale;
  view.locked = true; draw();
}, { passive:false });
$("#btn-fit").onclick = () => { view.locked = false; fitView(); draw(); };
$("#btn-nodes").onclick = e => { showNodes = !showNodes;
  e.target.textContent = "節點:" + (showNodes ? "開" : "關"); draw(); drawProf(); };
window.addEventListener("resize", () => { if (!view.locked) fitView(); draw(); drawProf(); });

/* ---- 立面 ---- */
const pv = $("#pv"), pctx = pv.getContext("2d");
const PM = { l:46, r:10, t:10, b:20 };
const pview = { s0:0, s1:1, z0:0, z1:1, dir:{ x:1, y:0 }, o:{ x:0, y:0 }, exag:1 };
const projS = p => (p.x - pview.o.x)*pview.dir.x + (p.y - pview.o.y)*pview.dir.y;
const pW = () => Math.max(1, pv.clientWidth - PM.l - PM.r);
const pH = () => Math.max(1, pv.clientHeight - PM.t - PM.b);
const pX = s => PM.l + (s - pview.s0)/Math.max(1e-9, pview.s1-pview.s0)*pW();
const pY = z => PM.t + pH() - (z - pview.z0)/Math.max(1e-9, pview.z1-pview.z0)*pH();

function fitProf(){
  const P = allPts();
  if (!P.length) return;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; });
  let az;
  const m = state.view.profMode;
  if (m === "x") az = 90; else if (m === "y") az = 0;
  else if (m === "az") az = num(state.view.az) || 0;
  else az = (x1-x0) >= (y1-y0) ? 90 : 0;
  pview.dir = { x:Math.sin(az*D2R), y:Math.cos(az*D2R) };
  pview.o = { x:x0, y:y0 };
  $("#paxis-tag").textContent = `橫軸 方位角 ${norm360(az).toFixed(0)}°`;
  let s0=Infinity,s1=-Infinity,z0=Infinity,z1=-Infinity;
  P.forEach(p => { const s = projS(p);
    if(s<s0)s0=s; if(s>s1)s1=s; if(p.z<z0)z0=p.z; if(p.z>z1)z1=p.z; });
  if (!(s1 > s0)) s1 = s0 + 1;
  const pad = Math.max((z1-z0)*0.18, 0.5);
  pview.s0 = s0; pview.s1 = s1; pview.z0 = z0-pad; pview.z1 = z1+pad;
}

function drawProf(){
  const dpr = window.devicePixelRatio || 1, W = pv.clientWidth, H = pv.clientHeight;
  if (!W || !H) return;
  pv.width = Math.round(W*dpr); pv.height = Math.round(H*dpr);
  pctx.setTransform(dpr,0,0,dpr,0,0); pctx.clearRect(0,0,W,H);
  if (!allPts().length) return;
  const mono = getComputedStyle(document.body).getPropertyValue("--mono");
  const spanS = pview.s1-pview.s0, spanZ = pview.z1-pview.z0;
  pview.exag = (pH()/spanZ)/(pW()/spanS);

  pctx.font = "9px " + mono; pctx.lineWidth = 1;
  const nice = (span, px, tgt) => { const raw = span/Math.max(1, px/tgt);
    const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
    return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; };
  const dz = nice(spanZ, pH(), 34), ds = nice(spanS, pW(), 110);
  pctx.strokeStyle = "#f0f2f4"; pctx.fillStyle = "#b8c0cb";
  for (let z = Math.ceil(pview.z0/dz)*dz; z <= pview.z1; z += dz){
    const y = pY(z); pctx.beginPath(); pctx.moveTo(PM.l,y); pctx.lineTo(W-PM.r,y); pctx.stroke();
    pctx.fillText(z.toFixed(dz<1?2:(dz<10?1:0)), 3, y+3);
  }
  for (let s = Math.ceil(pview.s0/ds)*ds; s <= pview.s1; s += ds){
    const x = pX(s); pctx.beginPath(); pctx.moveTo(x,PM.t); pctx.lineTo(x,PM.t+pH()); pctx.stroke();
    pctx.fillText(fmtN(s), x-10, H-6);
  }
  pctx.strokeStyle = "#dfe4ea";
  pctx.beginPath(); pctx.moveTo(PM.l,PM.t); pctx.lineTo(PM.l,PM.t+pH()); pctx.lineTo(W-PM.r,PM.t+pH()); pctx.stroke();

  MODEL.groups.forEach(r => {
    const on = SEL === r.g.id;
    pctx.strokeStyle = r.color;
    if (TYPES[r.g.type].fam === "con"){
      pctx.lineWidth = on ? 1.5 : .9; pctx.globalAlpha = on ? 1 : .55;
      pctx.beginPath();
      r.elems.forEach(e => { pctx.moveTo(pX(projS(e.a)), pY(e.a.z)); pctx.lineTo(pX(projS(e.b)), pY(e.b.z)); });
      pctx.stroke(); pctx.globalAlpha = 1;
    } else {
      const pts = curvePts(r);
      pctx.lineWidth = on ? 2.4 : 1.6;
      pctx.beginPath();
      pts.forEach((p,i) => { const x = pX(projS(p)), y = pY(p.z); i ? pctx.lineTo(x,y) : pctx.moveTo(x,y); });
      pctx.stroke();
      if (showNodes){
        pctx.fillStyle = r.color;
        const rad = r.nodes.length > 400 ? 1 : 1.7;
        r.nodes.forEach(n => { pctx.beginPath(); pctx.arc(pX(projS(n)), pY(n.z), rad, 0, 7); pctx.fill(); });
      }
    }
  });
  $("#pro").textContent = `垂直誇大 ×${pview.exag.toFixed(1)}`;
  if (hover){ pctx.strokeStyle = "#1c5d99"; pctx.lineWidth = 1.5;
    pctx.beginPath(); pctx.arc(pX(projS(hover)), pY(hover.z), 4.5, 0, 7); pctx.stroke(); }
}

function recompute(reTree){
  ERRS = []; WARNS = [];

}

/* ==========================================================================
   9. 驗收測試(不依賴畫面狀態,全部自建 fixture)
   ========================================================================== */
function runTests(){
  const rows = [];
  const chk = (id, desc, actual, expect, tol, unit) =>
    rows.push({ id, desc, actual, expect, tol, unit:unit||"", ok:Math.abs(actual-expect) <= tol });
  const yes = (id, desc, cond, actual, expect) =>
    rows.push({ id, desc, actual:String(actual), expect:String(expect), ok:!!cond, str:true });

  const build = groups => {
    const s = normState({ ...DEF_STATE(), groups:groups.map(g => ({ ...defaultGroup(g.type), ...g })) });
    const E = [], W = [];
    return { md:buildModel(s, E, W), errs:E, warns:W, st:s };
  };

  /* ---- 樁號格式 ---- */
  chk("F1","parseSta('0k+125.500')", parseSta("0k+125.500"), 125.5, 1e-12, "m");
  chk("F1","parseSta('1K+025')", parseSta("1K+025"), 1025, 1e-12, "m");
  chk("F1","parseSta('125.5')", parseSta("125.5"), 125.5, 1e-12, "m");
  yes("F1","fmtSta(125.5)", fmtSta(125.5) === "0k+125.500", fmtSta(125.5), "0k+125.500");
  yes("F1","fmtSta(1025)", fmtSta(1025) === "1k+025.000", fmtSta(1025), "1k+025.000");

  /* ---- 直線 ---- */
  const L1 = build([{ type:"LINE", name:"L", x1:0,y1:0,z1:0, x2:30,y2:40,z2:0,
    split:{ ...SPLIT_DEF, mode:"count", count:5 } }]).md.groups[0];
  chk("A1","直線長度", L1.stat.curveLen, 50, 1e-9, "m");
  chk("A1","節點數 = N+1", L1.nodes.length, 6, 0, "");
  chk("A1","中點座標 X", L1.nodes[3].x, 18, 1e-9, "m");
  chk("A1","弦線偏差 = 0", L1.stat.maxDev, 0, 1e-12, "m");

  /* ---- 圓弧:端點 + 半徑 ---- */
  // (0,0) → (100,0),R = 100,右轉劣弧 → 圓心在右(南)
  const arcCase = (dir, major) => build([{ type:"ARC", name:"A", arcMode:"endpoints", plane:"H",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:100, dir, major,
    split:{ ...SPLIT_DEF, mode:"count", count:60 } }]).md.groups[0];
  const Ar = arcCase(1,false), Al = arcCase(-1,false), Am = arcCase(1,true);
  chk("B1","右轉劣弧:圓心 Y(在南側)", Ar.stat.meta.center.y, -Math.sqrt(100*100-2500), 1e-9, "m");
  chk("B1","左轉劣弧:圓心 Y(在北側)", Al.stat.meta.center.y, +Math.sqrt(100*100-2500), 1e-9, "m");
  chk("B1","右轉優弧:圓心 Y(換到北側)", Am.stat.meta.center.y, +Math.sqrt(100*100-2500), 1e-9, "m");
  // 弧長:劣弧 2R·asin(d/2R)= 2*100*asin(0.5)=104.7198;優弧 = 2πR − 劣弧
  chk("B2","劣弧長", Ar.stat.meta.arcLen, 2*100*Math.asin(0.5), 1e-9, "m");
  chk("B2","優弧長 = 2πR − 劣弧", Am.stat.meta.arcLen, 2*Math.PI*100 - 2*100*Math.asin(0.5), 1e-9, "m");
  chk("B2","端點精確落位 X", Ar.nodes[Ar.nodes.length-1].x, 100, 1e-9, "m");
  chk("B2","端點精確落位 Y", Ar.nodes[Ar.nodes.length-1].y, 0, 1e-9, "m");
  yes("B3","右轉劣弧向北凸(中點 Y > 0)", Ar.nodes[30].y > 0, Ar.nodes[30].y.toFixed(4), "> 0");
  yes("B3","左轉劣弧向南凸(中點 Y < 0)", Al.nodes[30].y < 0, Al.nodes[30].y.toFixed(4), "< 0");
  // 半徑不足
  const bad = build([{ type:"ARC", name:"A", arcMode:"endpoints", plane:"H",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:30, dir:1, major:false }]);
  yes("B4","半徑 < 弦長一半 → 錯誤", bad.errs.length > 0, bad.errs.length, "> 0");
  // 鉛直平面(拱肋)
  const Av = build([{ type:"ARC", name:"拱", arcMode:"endpoints", plane:"V",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:100, dir:1, major:false,
    split:{ ...SPLIT_DEF, mode:"count", count:60 } }]).md.groups[0];
  yes("B5","鉛直平面上凸(中點 Z > 0)", Av.nodes[30].z > 0, Av.nodes[30].z.toFixed(4), "> 0");
  chk("B5","鉛直平面 Y 不變", Av.nodes[30].y, 0, 1e-9, "m");
  chk("B5","矢高 = R − √(R²−(d/2)²)", Av.nodes[30].z, 100 - Math.sqrt(100*100-2500), 1e-6, "m");
  // 圓心模式
  const Ac = build([{ type:"ARC", name:"C", arcMode:"center",
    x1:100,y1:0,z1:0, cx:0, cy:0, delta:90, dir:1, z2:10,
    split:{ ...SPLIT_DEF, mode:"count", count:36 } }]).md.groups[0];
  chk("B6","圓心模式:半徑", Ac.stat.meta.R, 100, 1e-9, "m");
  chk("B6","圓心模式:轉 90° 後 X", Ac.nodes[36].x, 0, 1e-9, "m");
  chk("B6","圓心模式:轉 90° 後 Y(右轉 = 順時針)", Ac.nodes[36].y, -100, 1e-9, "m");
  chk("B6","圓心模式:終點高程", Ac.nodes[36].z, 10, 1e-9, "m");

  /* ---- 懸垂曲線 ---- */
  const sag = (curve) => build([{ type:"SAG", name:"S", curve, x1:0,y1:0,z1:0, x2:400,y2:0,z2:0,
    fMode:"abs", f:40, split:{ ...SPLIT_DEF, mode:"count", count:40 } }]).md.groups[0];
  const SP = sag("parabola"), SC = sag("catenary");
  chk("C1","拋物線:跨中垂度 = f", SP.nodes[20].z, -40, 1e-9, "m");
  chk("C1","拋物線:兩端 z = 0", SP.nodes[0].z, 0, 1e-12, "m");
  chk("C1","拋物線:1/4 點 = −0.75f", SP.nodes[10].z, -30, 1e-9, "m");
  chk("C2","懸鏈線:跨中垂度 = f", SC.nodes[20].z, -40, 1e-6, "m");
  const aC = solveCatenaryA(400, 40), bC = 400/(2*aC);
  chk("C2","懸鏈線:1/4 點 = 解析解",
    SC.nodes[10].z, -40*(Math.cosh(bC)-Math.cosh(bC/2))/(Math.cosh(bC)-1), 1e-9, "m");
  yes("C2","懸鏈線 1/4 點低於拋物線(自重按弧長分布)",
    SC.nodes[10].z < SP.nodes[10].z, SC.nodes[10].z.toFixed(4), "< " + SP.nodes[10].z.toFixed(4));
  yes("C2","懸鏈線曲線長 > 拋物線",
    SC.stat.curveLen > SP.stat.curveLen, SC.stat.curveLen.toFixed(4), "> " + SP.stat.curveLen.toFixed(4));
  // 不等高端點:垂度相對弦線
  const SU = build([{ type:"SAG", name:"U", curve:"parabola", x1:0,y1:0,z1:0, x2:400,y2:0,z2:20,
    fMode:"abs", f:40, split:{ ...SPLIT_DEF, mode:"count", count:40 } }]).md.groups[0];
  chk("C3","不等高:終點 z = z2", SU.nodes[40].z, 20, 1e-9, "m");
  chk("C3","不等高:跨中 = 弦線中點 − f", SU.nodes[20].z, 10-40, 1e-9, "m");
  // 垂跨比

  chk("P5","節點 CSV 列數", nodeCSV().split("\r\n").length - 1, OUTF.md.tot.n, 0, "");
  chk("P5","元素 CSV 列數", elemCSV().split("\r\n").length - 1, OUTF.md.tot.e, 0, "");
  yes("P5","CSV 逗號與引號跳脫", toCSV([["a,b",'c"d',1]]).replace("﻿","") === '"a,b","c""d",1',
    toCSV([["a,b",'c"d',1]]).replace("﻿",""), '"a,b","c""d",1');
  yes("P6","群組清單連號壓縮", compressList([3,1,2,5,9,7,8,5]) === "1to3 5 7to9",
    compressList([3,1,2,5,9,7,8,5]), "1to3 5 7to9");
  MODEL = sv.MODEL; state = sv.state;

  renderTests(rows);
  return rows;
}
function renderTests(rows){
  const nOk = rows.filter(r => r.ok).length, all = nOk === rows.length;
  const fmtV = v => typeof v === "number" ? (Math.abs(v) >= 1e6 ? v.toExponential(6) : v.toFixed(6)) : String(v);
  $("#tests").innerHTML =
    `<div style="font-size:12px;margin:6px 0"><span class="${all?"pass":"fail"}">${all?"✓ 全部通過":"✕ 有失敗項目"}</span>
       <span style="color:var(--ink-3)"> — ${nOk}/${rows.length}</span></div>
     <table class="tt"><thead><tr><th style="width:26px"></th><th style="width:32px">組</th><th>項目</th>
       <th style="width:96px">實際</th><th style="width:96px">預期</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✕"}</td>
      <td style="color:var(--ink-3)">${r.id}</td><td style="font-family:'Noto Sans TC',sans-serif">${esc(r.desc)}</td>
      <td>${esc(r.str ? r.actual : fmtV(r.actual))}</td><td>${esc(r.str ? r.expect : fmtV(r.expect))}</td></tr>`).join("") +
    `</tbody></table>`;
}

/* ==========================================================================
   啟動
   ========================================================================== */
normState(state);
recompute(true);
runTests();

</script>
</body>
