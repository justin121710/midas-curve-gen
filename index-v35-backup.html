    const bs = info && info.chain ? info.chain.segs.find(x => x.i === i) : null;
    return `<tr><td class="n">${i+1}</td>
      <td class="n" style="width:100px">${fld("", kk + "type", s.type,
        { select:[["LINE","直線"],["ARC","圓弧"],["SPIRAL","緩和曲線"]] })}</td>
      <td><div class="fields" style="grid-template-columns:repeat(${s.type==="LINE"?1:s.type==="ARC"?3:4},1fr)">${p}</div></td>
      <td class="n" style="white-space:nowrap" data-ro>${bs ? fmtSta(bs.s0) + " → " + fmtSta(bs.s1) : "—"}</td>
      <td style="width:22px"><button class="iconbtn danger" data-op="delseg" data-p="${pc._i}" data-i="${i}">✕</button></td></tr>`;
  }).join("");
  const P = pc.profile || [];
  const vpiRows = P.map((v, i) => {
    const isEnd = (i === 0 || i === P.length - 1);
    return `<tr><td class="n">${i === 0 ? "起" : (isEnd ? "終" : i)}</td>
      <td style="width:118px">${fld("", `${k}profile.${i}.sta`, fmtSta(num(v.sta) || 0), { text:true })}</td>
      <td style="width:92px">${fld("", `${k}profile.${i}.z`, v.z)}</td>
      <td style="width:92px">${fld("", `${k}profile.${i}.L`, isEnd ? 0 : v.L, { disabled:isEnd })}</td>
      <td style="width:22px"><button class="iconbtn danger" data-op="delvpi" data-p="${pc._i}" data-i="${i}">✕</button></td></tr>`;
  }).join("");
  return `<div class="lbl" style="margin:4px 0 5px">子段(切線連續)</div>
    <table class="t"><thead><tr><th>#</th><th>型別</th>
      <th>參數<span style="font-weight:400;color:var(--ink-3)">(直線 L / 圓弧 R·偏向·Δ / 緩和 R0·R1·偏向·Ls)</span></th>
      <th>起訖樁號</th><th></th></tr></thead><tbody>${segRows}</tbody></table>
    <div class="btns" style="margin-top:7px">
      <button class="btn p" data-op="addseg" data-p="${pc._i}" data-t="LINE">+ 直線</button>
      <button class="btn" data-op="addseg" data-p="${pc._i}" data-t="ARC">+ 圓弧</button>
      <button class="btn" data-op="addseg" data-p="${pc._i}" data-t="SPIRAL">+ 緩和曲線</button></div>
    <div class="lbl" style="margin:12px 0 5px">縱斷面(選用)${P.length ? "" : " — 無,整段維持起點高程"}</div>
    ${P.length ? `<table class="t"><thead><tr><th></th><th>樁號</th><th>高程 Z</th><th>豎曲線長 L</th><th></th></tr></thead><tbody>${vpiRows}</tbody></table>` : ""}
    <div class="btns" style="margin-top:7px">
      <button class="btn" data-op="addvpi" data-p="${pc._i}">+ VPI</button>
      ${P.length ? `<button class="btn d" data-op="clearvpi" data-p="${pc._i}">清除縱斷面</button>` : ""}</div>
    <div class="fields g4" style="margin-top:10px">${
      fld("起始樁號", k + "sta", fmtSta(num(pc.sta) || 0), { text:true }) +
      fld("起始方位角 (°)", k + "az", pc.az) +
      fld("強制節點樁號", k + "forced", pc.forced, { text:true, ph:"0k+120.000, 180.5" }) +
      fld(`吸收容差 (${UL()})`, k + "absorbTol", pc.absorbTol)}</div>`;
}

/* ---- 單一段的卡片 ---- */
function pieceCard(g, pc, pi, info){
  const k = `pieces.${pi}.`;
  const first = pi === 0;
  const cont = !first && contOn(pc);
  // 終點接續「下一段的起點」:下一段必須是自訂座標起點,否則會循環定義
  const nx = (g.pieces || [])[pi+1];
  const ecOK = !!nx && !contOn(nx) && !!pieceStart(nx) && !(pc.type === "ARC" && pc.arcMode === "center");
  const ec = ecOK && (pc.endCont === true || pc.endCont === "1");
  const endSel = END_CONT_T[pc.type]
    ? fld("終點", k + "endCont", ec ? "1" : "0",
        { disabled:!ecOK,
          select:ecOK ? [["0","自訂"],["1","接續下段起點"]]
                      : [["0", nx ? "自訂(下段沒有自訂起點)" : "自訂(後面沒有段)"]] })
    : "";
  const endHint = ec
    ? `<div class="hint">終點 = <b>下一段的起點</b>,接縫節點<b>共用不重複</b>;下一段起點一改,這一段就跟著拉過去。</div>`
    : "";
  const P1 = () => fld("起點 X", k + "x1", pc.x1) + fld("起點 Y", k + "y1", pc.y1) + fld("起點 Z", k + "z1", pc.z1);
  const P2 = (l) => fld((l||"終點") + " X", k + "x2", pc.x2) + fld((l||"終點") + " Y", k + "y2", pc.y2) + fld((l||"終點") + " Z", k + "z2", pc.z2);
  let body = "";

  const startRow = `<div class="fields g4">${
      fld("起點", k + "cont", cont ? "1" : "0",
        { select:first ? [["0","自訂座標"]] : [["1","接續前段終點"],["0","自訂座標"]], disabled:first }) +
      (cont ? `<div class="hint" style="grid-column:span 3;margin:14px 0 0">起點 = 前段終點,<b>接縫節點共用不重複</b>。</div>` : P1())}</div>`;

  if (pc.type === "LINE"){
    body = startRow + `<div class="fields g4" style="margin-top:8px">${
      endSel + (ec ? "" :
        fld("終點定義", k + "endMode", pc.endMode, { select:[["point","終點座標"],["polar","長度 + 方位角 + 仰角"]] }) +
        (pc.endMode === "polar"
          ? fld(`長度 L (${UL()})`, k + "len", pc.len) + fld("方位角 (°)", k + "az", pc.az) + fld("仰角 (°)", k + "el", pc.el)
          : P2()))}</div>` + endHint;
  }
  else if (pc.type === "ARC"){
    const modeF = fld("定義方式", k + "arcMode", pc.arcMode,
      { select:[["endpoints","端點 + 半徑"],["center","圓心 + 轉角"]] });
    if (pc.arcMode === "center"){
      body = startRow + `<div class="fields g4" style="margin-top:8px">${modeF +
        fld("圓心 X", k + "cx", pc.cx) + fld("圓心 Y", k + "cy", pc.cy) + fld("轉角 Δ (°)", k + "delta", pc.delta)}</div>
        <div class="fields g4" style="margin-top:8px">${
        fld("偏向", k + "dir", pc.dir, { select:[["1","右轉"],["-1","左轉"]] }) +
        fld("終點高程 Z", k + "z2", pc.z2)}</div>
        <div class="hint">半徑由起點到圓心的距離決定;<b>僅水平面</b>,高程沿弧線線性內插。</div>`;
    } else {
      body = startRow + `<div class="fields g4" style="margin-top:8px">${modeF + endSel + (ec ? "" : P2())}</div>
        ${endHint}
        <div class="fields g4" style="margin-top:8px">${
        fld("半徑 R", k + "R", pc.R) +
        fld("平面", k + "plane", pc.plane, { select:[["H","水平"],["V","鉛直(拱肋)"]] }) +
        fld(pc.plane === "V" ? "凸向" : "偏向", k + "dir", pc.dir,
          { select:pc.plane === "V" ? [["1","上凸(拱)"],["-1","下凹"]] : [["1","右轉"],["-1","左轉"]] }) +
        fld("弧段", k + "major", pc.major ? "1" : "0", { select:[["0","劣弧(短)"],["1","優弧(長)"]] })}</div>
        <div class="hint">兩點加半徑有<b>兩組解</b>:偏向決定圓心在哪一側,弧段決定走短的還是長的。半徑須 ≥ 弦長一半。</div>`;
    }
  }
  else if (pc.type === "SAG"){
    body = startRow + `<div class="fields g4" style="margin-top:8px">${endSel + (ec ? "" : P2())}</div>
      ${endHint}
      <div class="fields g3" style="margin-top:8px">${
        fld("曲線", k + "curve", pc.curve, { select:[["parabola","拋物線"],["catenary","懸鏈線"]] }) +
        fld("垂度定義", k + "fMode", pc.fMode, { select:[["ratio","垂跨比 f/L"],["abs",`絕對值 (${UL()})`]] }) +
        fld(pc.fMode === "ratio" ? "垂跨比" : `垂度 f (${UL()})`, k + "f", pc.f)}</div>
      <div class="hint">垂度自<b>弦線</b>量測、沿 −Z 下垂;跨距取兩端點的<b>平面</b>距離。</div>`;
  }
  else if (pc.type === "HELIX"){
    body = startRow + (cont ? "" : `<div class="fields g4" style="margin-top:8px">${
        fld("圓心 X", k + "cx", pc.cx) + fld("圓心 Y", k + "cy", pc.cy)}</div>`) +
      `<div class="fields g4" style="margin-top:8px">${
        fld("半徑 R", k + "R", pc.R) + fld("終止半徑(留白 = 等半徑)", k + "R2", pc.R2, { text:true }) +
        fld("起始方位角 (°)", k + "az0", pc.az0) + fld("圈數", k + "turns", pc.turns)}</div>
      <div class="fields g4" style="margin-top:8px">${
        fld(`螺距(每圈升高 ${UL()})`, k + "pitch", pc.pitch) +
        fld("旋向(俯視)", k + "dir", pc.dir, { select:[["1","順時針"],["-1","逆時針"]] })}</div>
      <div class="hint">${cont ? "接續前段時,<b>圓心由起點與起始方位角反推</b>。" : ""}
        midas 的 Rotate Copy 只能做<b>平面</b>圓弧;給終止半徑可做錐形螺旋。</div>`;
  }
  else if (pc.type === "CHAIN"){
    body = startRow + `<div style="margin-top:10px">${chainTables(pc, k, info)}</div>`;
  }
  else if (pc.type === "POINT"){
    body = `<div class="fields g4">${
      fld("連接", k + "cont", cont ? "1" : "0",
        { select:first ? [["0","獨立節點"]] : [["1","從前段拉一根直線元素"],["0","獨立節點(不連接)"]], disabled:first }) +
      P2("座標")}</div>
      <div class="hint">${cont ? "會從前段終點拉一根直線元素到這個座標。" : "只加一個節點,不產生元素——適合錨碇點、支承點。"}</div>`;
  }

  const stat = info ? `${(info.n1 - info.n0)} 節點 · ${(info.e1 - info.e0)} 元素` +
    (info.len ? ` · ${info.len.toFixed(3)} ${UL()}` : (info.total ? ` · ${info.total.toFixed(3)} ${UL()}` : "")) : "—";
  const adv = `<details class="adv"><summary>分割與元素覆寫</summary><div>
      ${splitSec(pc, k, pc.type === "SAG" ? "「指定元素數」= 沿弦線等分;「指定間距」= 沿 3D 曲線等弧長。"
        : pc.type === "HELIX" ? "「指定元素數」= 等圓心角。" : "")}
      <div class="fields g4" style="margin-top:9px">${
        fld("覆寫元素屬性", k + "ovr", !!pc.ovr, { check:true }) +
        fld("類型", k + "etype", pc.etype, { select:ELEM_TYPES, disabled:!pc.ovr }) +
        fld("材料 ID", k + "mat", pc.mat, { disabled:!pc.ovr }) +
        fld("斷面 ID", k + "sect", pc.sect, { disabled:!pc.ovr })}</div></div></details>`;
  const xfp = `<details class="adv"${xfActive(pc.xf) ? " open" : ""}><summary>平移與旋轉${
      xfActive(pc.xf) ? "(已套用)" : ""}</summary><div>
      ${xfFields(k + "xf.", pc.xf, "piece")}
      <div class="btns" style="margin-top:9px"><button class="btn d" data-op="pxfrst" data-p="${pi}">本段歸零</button></div>
      <div class="hint">只動<b>這一段</b>的節點;<b>接續本段的後面幾段會跟著走</b>,起點設成自訂座標的段不受影響。
        旋轉中心預設是<b>本段起點</b>,所以單純轉方向不會把接縫扯開。</div></div></details>`;

  return `<details class="pc"${pc._open ? " open" : ""} data-pi="${pi}">
    <summary><span class="idx" style="background:${pieceColor(pi)}">${pi+1}</span>
      <select data-k="${k}type" onclick="event.stopPropagation()">${
        Object.entries(PIECES).map(([v,t]) => `<option value="${v}"${v===pc.type?" selected":""}>${t.name}</option>`).join("")}</select>
      <span class="st" data-ro>${stat}</span>
      <span class="grip" title="拖曳排序">⠿</span>
      <button class="iconbtn danger" data-op="pdel" data-p="${pi}" title="刪除">✕</button>
    </summary><div class="pcb">${body}${pc.type === "POINT" ? "" : adv}${xfp}</div></details>`;
}

function nodeSec(g, r){
  if (!r || TYPES[g.type].fam === "con" || g.type !== "CURVE") return "";
  const nEdit = (r.stat && r.stat.nEdit) || 0, nDel = (r.stat && r.stat.nDel) || 0;
  const sel = (SELNODE && SELNODE.gid === g.id) ? r.nodes.find(n => n.ri === SELNODE.ri) : null;
  const tail = sel ? `<span style="color:var(--accent)">已選取 #${sel.num}</span>`
    : (nEdit || nDel) ? `<span style="color:var(--warn)">覆寫 ${nEdit} · 刪除 ${nDel}</span>`
    : "點畫面上的節點即可編輯";
  let body = "";
  if (sel){
    body = `<div class="fields g4">${
      fld("節點編號", "@num", sel.num, { text:true, disabled:true }) +
      fld("X", "@x", sel.x) + fld("Y", "@y", sel.y) + fld("Z", "@z", sel.z)}</div>
      <div class="btns" style="margin-top:9px">
        <button class="btn d" data-op="ndel">刪除此節點</button>
        ${sel.edited ? `<button class="btn" data-op="nrst">還原座標</button>` : ""}
        <button class="btn" data-op="nclr">取消選取</button></div>
      <details class="adv" open><summary>平移與旋轉(此節點)</summary><div>
        ${xfFields("$", XFT, "node")}
        <div class="btns" style="margin-top:9px"><button class="btn p" data-op="xfnode">套用到此節點</button></div>
        <div class="hint">套用後寫成<b>座標覆寫</b>,按「還原座標」即可取消;單一節點只有平移有效,
          要旋轉請把旋轉中心設成<b>自訂座標</b>。</div></div></details>
      <div class="hint" data-ro>第 ${sel.ri + 1} 個原始節點${sel.edited ? " · <b style=\"color:var(--warn)\">座標已覆寫</b>" : ""}。
        <b>刪除後前後兩個節點會直接相連</b>;覆寫的節點不再計算弦線偏差。</div>`;
  } else {
    body = `<div class="hint" style="margin:0">在<b>俯視圖或立面圖</b>上點任一節點即可編輯座標、刪除或平移旋轉;
      點<b>兩節點之間的線</b>則是選取整根元素。</div>`;
  }
  if (nEdit || nDel)
    body += `<div class="btns" style="margin-top:9px"><button class="btn d" data-op="nclrall">清除本組全部覆寫</button></div>`;
  return SEC("節點", tail, body, sel ? "hot" : "");
}

/* ---- 被選取的元素 ---- */
function elemPickSec(g, r){
  if (!r || g.type !== "CURVE" || !SELELEM || SELELEM.gid !== g.id) return "";
  const e = r.elems.find(x => x.num === SELELEM.num);
  if (!e) return "";
  const ok = Number.isFinite(e.a.ri) && Number.isFinite(e.b.ri);
  return SEC("元素", `<span style="color:var(--accent)">已選取 #${e.num}</span>`,
    `<div class="out" data-ro>
      <div><span class="k">元素編號</span> <b>${e.num}</b></div>
      <div><span class="k">節點 i–j</span> <b>${e.i} – ${e.j}</b></div>
      <div><span class="k">長度</span> <b>${e.len3d.toFixed(4)} ${UL()}</b></div>
      <div><span class="k">類型 / 材料 / 斷面</span> <b>${esc(e.type)} / ${e.mat} / ${e.sect}</b></div></div>
     ${xfFields("$", XFT, "elem")}
     <div class="btns" style="margin-top:9px">
       <button class="btn p" data-op="xfelem"${ok ? "" : " disabled"}>套用到此元素(兩端節點)</button>
       <button class="btn" data-op="eclr">取消選取</button></div>
     <div class="hint">移動元素 = 同時移動<b>兩端節點</b>,寫成座標覆寫;與它們相連的其他元素會跟著變形。
       ${ok ? "" : "<b>此元素的端點不屬於本組,無法移動。</b>"}</div>`, "hot");
}

function paneFor(g){
  const T = TYPES[g.type], r = MODEL.byId.get(g.id);
  const st = r ? r.stat : {};
  const head = `<div class="ptitle">
      <span class="nm">${esc(g.name)}</span><span class="fam ${T.fam}">${T.name}</span><span class="sp"></span>
      <label class="chk"><input type="checkbox" data-k="on"${g.on !== false ? " checked" : ""}> 啟用</label>
      <button class="btn" data-op="dup">複製</button><button class="btn d" data-op="del">刪除</button></div>`;
  const nameSec = SEC("基本", `群組名 ${r ? esc(r.gname) : ""}`,
    `<div class="fields g3">${fld("名稱", "name", g.name, { text:true })}</div>`);

  let body = "";
  if (g.type === "CURVE"){
    const pcs = g.pieces || [];
    pcs.forEach((pc, i) => pc._i = i);
    const cards = pcs.map((pc, i) => pieceCard(g, pc, i, r ? r.pieces.find(p => p.pi === i) : null)).join("");
    body = SEC("段", `${pcs.length} 段`, (cards || `<div class="hint" style="margin:0">尚無任何段。</div>`) +
      `<div class="btns" style="margin-top:9px">` +
      Object.entries(PIECES).map(([v,t]) => `<button class="btn${v==="LINE"?" p":""}" data-op="addpc" data-t="${v}">+ ${t.name}</button>`).join("") +
      `</div><div class="hint">段與段預設<b>接續前段終點</b>並共用接縫節點;把「起點」改成自訂座標即可斷開。</div>`);
  }
  else if (g.type === "OFFSET"){
    body = SEC("放置", "依附另一組", `<div class="fields g3">${
        fld("基準組", "ref", g.ref, { select:[["","(未選)"], ...refOptions(g.id, "geo")] }) +
        fld(`橫向 d(右正,${UL()})`, "d", g.d) + fld(`垂直 h(上正,${UL()})`, "h", g.h)}</div>
      <div class="hint">節點沿基準組的<b>法線投影</b>,一一對應。曲線上當地半徑 = <b>R − 偏向·d</b>;
        右轉曲線的圓心在右,所以<b>右側偏置是內側</b>。</div>`);
  }
  else if (g.type === "LINK2"){
    body = SEC("連接", "逐節點", `<div class="fields g3">${
        fld("組 A", "a", g.a, { select:[["","(未選)"], ...refOptions(g.id, "geo")] }) +
        fld("組 B", "b", g.b, { select:[["","(未選)"], ...refOptions(g.id, "geo")] }) +
        fld("每 n 個節點", "every", g.every)}</div>
      <div class="hint">兩組<b>節點數必須相同</b>。不產生新節點,只產生元素。</div>`);
  }
  else if (g.type === "LINKZ"){
    body = SEC("連接", "垂直投影", `<div class="fields g4">${
        fld("來源組", "ref", g.ref, { select:[["","(未選)"], ...refOptions(g.id)] }) +
        fld("目標高程 Z", "targetZ", g.targetZ) +
        fld("第幾個節點(起)", "from", g.from) +
        fld("第幾個節點(訖,0 = 到底)", "to", g.to)}</div>
      <div class="fields g4" style="margin-top:8px">${
        fld("每 n 個節點", "every", g.every) +
        fld("下端節點", "bottom", g.bottom, { select:[["new","新增節點"],["snap","貼附既有節點"]] }) +
        (g.bottom === "snap" ? fld(`貼附容差 (${UL()})`, "snapTol", g.snapTol) : "")}</div>
      <div class="hint">每個來源節點垂直往下連到指定高程。已低於目標高程者<b>自動略過</b>。
        來源組有多段時(例如主索的直線引段),用<b>節點範圍</b>只掛在需要的那一段上。</div>`);
  }
  else if (g.type === "FAN"){
    body = SEC("起點", "", `<div class="fields g4">${
        fld("來源", "srcMode", g.srcMode, { select:[["coord","自訂座標"],["node","既有節點編號"]] }) +
        (g.srcMode === "node" ? fld("節點編號", "srcNode", g.srcNode)
          : fld("X", "sx", g.sx) + fld("Y", "sy", g.sy) + fld("Z", "sz", g.sz))}</div>`) +
      SEC("目標", st.count ? `${st.count} 根` : "", `<div class="fields g4">${
        fld("目標組", "ref", g.ref, { select:[["","(未選)"], ...refOptions(g.id, "geo")] }) +
        fld("第幾個節點(起)", "from", g.from) + fld("第幾個節點(訖)", "to", g.to) +
        fld("每 n 個", "every", g.every)}</div>
      <div class="fields g4" style="margin-top:8px">${
        fld("每根分割 N", "div", g.div) +
        fld("垂度定義", "fMode", g.fMode, { select:[["abs",`絕對值 (${UL()})`],["ratio","垂跨比"]], disabled:(num(g.div)||1) <= 1 }) +
        fld("垂度 f", "f", g.f, { disabled:(num(g.div)||1) <= 1 })}</div>
      <div class="hint">目標用<b>「第幾個節點」</b>而不是節點編號。<b>N = 1</b> 適合斜張索;
        <b>N &gt; 1</b> 必須給垂度,否則共線節點在幾何非線性分析中橫向勁度為零。</div>`);
  }

  const rows = [];
  if (r && !r.stat.err){
    rows.push(["節點", st.n], ["元素", st.e]);
    if (st.e){
      rows.push(["元素長", `${st.minL.toFixed(3)} – ${st.maxL.toFixed(3)} ${UL()}`]);
      rows.push(["3D 總長", st.len3d.toFixed(4) + " " + UL()]);
      if (TYPES[g.type].fam === "geo") rows.push(["最大弦線偏差", devTxt(st.maxDev)]);
    }
    if (g.type === "OFFSET") rows.push(["基準組", esc(st.ref || "")]);
  } else if (r && r.stat.err) rows.push(["狀態", `<span style="color:var(--err)">${esc(r.stat.err)}</span>`]);

  return head + nameSec + body + xfSecGroup(g) + nodeSec(g, r) + elemPickSec(g, r) +
    elemSec(g) + numSec(g, r) + SEC("結果", "", OUT(rows));
}

function setPath(root, key, v){
  const ps = key.split(".");
  let o = root;
  for (let i = 0; i < ps.length - 1; i++){
    const k = /^\d+$/.test(ps[i]) ? +ps[i] : ps[i];
    if (o[k] == null) o[k] = /^\d+$/.test(ps[i+1]) ? [] : {};
    o = o[k];
  }
  const last = /^\d+$/.test(ps[ps.length-1]) ? +ps[ps.length-1] : ps[ps.length-1];
  o[last] = v;
}
function assignFromEl(root, key, el){
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (el.tagName === "SELECT"){
    v = el.value;
    if (key === "major") v = v === "1";
    else if (/(^|\.)(cont|endCont)$/.test(key)) v = (v === "1");
    else if (/(^|\.)dir$/.test(key)) v = Number(v);
  }
  else if (el.type === "number") v = el.value === "" ? NaN : Number(el.value);
  else if (/(^|\.)sta$/.test(key)) v = parseSta(el.value);
  else v = el.value;
  setPath(root, key, v);
}

/* ---------- 復原 / 重做 ---------- */
const HIST = { past:[], future:[], key:"", t:0 };
function snapshot(key){
  const now = Date.now();
  // 同一個欄位連續輸入視為一次操作(700 ms 內)
  if (key && key === HIST.key && now - HIST.t < 700){ HIST.t = now; return; }
  HIST.past.push(JSON.stringify(state));
  if (HIST.past.length > 80) HIST.past.shift();
  HIST.future.length = 0;
  HIST.key = key || ""; HIST.t = now;
  syncHistBtns();
}
function applySnap(json){
  state = normState(JSON.parse(json));
  if (SEL && SEL[0] !== "_" && !state.groups.some(g => g.id === SEL))
    SEL = state.groups.length ? state.groups[0].id : null;
  if (SELNODE && !state.groups.some(g => g.id === SELNODE.gid)) SELNODE = null;
  if (SELELEM && !state.groups.some(g => g.id === SELELEM.gid)) SELELEM = null;
  HIST.key = ""; HIST.t = 0;
  recompute(true); syncHistBtns();
}
function undo(){ if (!HIST.past.length) return;
  HIST.future.push(JSON.stringify(state)); applySnap(HIST.past.pop()); }
function redo(){ if (!HIST.future.length) return;
  HIST.past.push(JSON.stringify(state)); applySnap(HIST.future.pop()); }
function syncHistBtns(){
  const u = $("#btn-undo"), r = $("#btn-redo");
  if (u){ u.disabled = !HIST.past.length; u.title = `復原(Ctrl+Z)  ${HIST.past.length} 步`; }
  if (r){ r.disabled = !HIST.future.length; r.title = `重做(Ctrl+Y)  ${HIST.future.length} 步`; }
}
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); }
});

/* ---------- 欄位寫入 ---------- */
function applyField(root, k, el){
  if (k[0] === "@"){                                   // 選取節點的座標覆寫
    if (!SELNODE || SELNODE.gid !== root.id) return;
    const r0 = MODEL.byId.get(root.id);
    const nd = r0 && r0.nodes.find(n => n.ri === SELNODE.ri);
    if (!nd) return;
    root.edits = root.edits || {};
    const cur = root.edits[SELNODE.ri] || { x:nd.x, y:nd.y, z:nd.z };
    cur[k.slice(1)] = el.value === "" ? NaN : Number(el.value);
    root.edits[SELNODE.ri] = cur;
    return;
  }
  assignFromEl(root, k, el);
  if (k.indexOf("view.") === 0) pview.locked = false;   // 換立面方向 → 重新框選
  // 切換段型別 → 補上新型別缺少的預設參數(保留起點、分割、元素覆寫)
  const mt = k.match(/^pieces\.(\d+)\.type$/);
  if (mt && root.pieces){
    const i = +mt[1], old = root.pieces[i];
    const keep = { cont:old.cont, split:old.split, ovr:old.ovr, etype:old.etype, mat:old.mat, sect:old.sect,
                   x1:old.x1, y1:old.y1, z1:old.z1, _open:old._open, _i:old._i };
    root.pieces[i] = { ...defaultPiece(old.type), ...keep, type:old.type };
  }
}
const rootOf = () => (SEL === "_num" || SEL === "_out") ? state : state.groups.find(g => g.id === SEL);

/* 節點 / 元素的平移旋轉:一次算完寫成座標覆寫(edits),這樣拓樸與編號完全不受影響 */
function applyXfToNodes(g, ris){
  const r = MODEL.byId.get(g.id);
  if (!r || !ris.length) return;
  const nds = ris.map(ri => r.nodes.find(n => n.ri === ri)).filter(Boolean);
  if (!nds.length) return;
  const f = xfMake(XFT, nds);
  if (!f){ alert("平移量與旋轉角都是 0,沒有東西可以套用。"); return; }
  g.edits = g.edits || {};
  nds.forEach(n => {
    const q = f(n);
    g.edits[n.ri] = { x:+q.x.toFixed(9), y:+q.y.toFixed(9), z:+q.z.toFixed(9) };
  });
  recompute(true);
}

/* 打字時「只更新唯讀顯示」,絕不重建輸入框 —— 重建會讓 <input type=number> 的游標跳到最前面 */
function syncRO(){
  const g = state.groups.find(x => x.id === SEL);
  const html = (SEL === "_num") ? paneNumbering() : (SEL === "_out") ? paneOutput() : (g ? paneFor(g) : null);
  if (html == null) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const a = [...$("#pane").querySelectorAll("[data-ro]")];
  const b = [...tmp.querySelectorAll("[data-ro]")];
  if (a.length !== b.length){ renderPane(); return; }   // 結構變了才整塊重畫
  a.forEach((x, i) => { if (x.innerHTML !== b[i].innerHTML) x.innerHTML = b[i].innerHTML; });
  const mp = $("#mctprev"); if (mp) renderMctPrev();
}

$("#pane").addEventListener("input", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  if (el.tagName === "SELECT" || el.type === "checkbox") return;   // 交給 change 處理
  if (k[0] === "$"){ assignFromEl(XFT, k.slice(1), el); return; }  // 一次性變換輸入,不動 state
  const root = rootOf(); if (!root) return;
  snapshot("f:" + SEL + ":" + k);
  applyField(root, k, el);
  ERRS = []; WARNS = [];
  MODEL = buildModel(state, ERRS, WARNS);
  renderTree(); renderChecks();
  if (!view.locked) fitView();
  fitProf(); draw(); drawProf();
  syncRO();
});
$("#pane").addEventListener("change", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  if (k[0] === "$"){ assignFromEl(XFT, k.slice(1), el);
    if (el.tagName === "SELECT") renderPane(); return; }
  const root = rootOf(); if (!root) return;
  const isSel = el.tagName === "SELECT" || el.type === "checkbox";
  if (isSel) snapshot("c:" + SEL + ":" + k + ":" + Date.now());
  applyField(root, k, el);
  recompute(true);                                      // 離開欄位或改下拉時才整塊重畫
});

$("#pane").addEventListener("click", e => {
  const b = e.target.closest("[data-op]"); if (!b) return;
  const op = b.dataset.op;
  if (!["mct","mctcopy","csvn","csve","json","load","nclr","eclr"].includes(op)) snapshot("op:" + op + ":" + Date.now());
  const gi = state.groups.findIndex(g => g.id === SEL);
  const g = state.groups[gi];
  if (op === "demo"){ loadState(demoState()); return; }
  if (op === "mct")     { download(`model_${stamp()}.mct`, mctText(), "text/plain;charset=utf-8"); return; }
  if (op === "mctcopy") { copyText(mctText(), b); return; }
  if (op === "csvn")    { download(`nodes_${stamp()}.csv`, nodeCSV(), "text/csv;charset=utf-8"); return; }
  if (op === "csve")    { download(`elements_${stamp()}.csv`, elemCSV(), "text/csv;charset=utf-8"); return; }
  if (op === "json")    { download(`model_${stamp()}.json`, paramsJSON(), "application/json;charset=utf-8"); return; }
  if (op === "load")    { $("#file-in").click(); return; }
  if (!g) return;
  if (op === "del"){ state.groups.splice(gi, 1); SEL = state.groups.length ? state.groups[Math.max(0, gi-1)].id : null; }
  if (op === "dup"){ const c = clone(g); c.id = newId(); c.name = g.name + " 複本";
    state.groups.splice(gi+1, 0, c); SEL = c.id; }
  if (op === "ndel" && g && SELNODE && SELNODE.gid === g.id){
    g.dels = g.dels || []; if (!g.dels.includes(SELNODE.ri)) g.dels.push(SELNODE.ri);
    if (g.edits) delete g.edits[SELNODE.ri];
    SELNODE = null; recompute(true); return; }
  if (op === "nrst" && g && SELNODE && g.edits){ delete g.edits[SELNODE.ri]; recompute(true); return; }
  if (op === "nclr"){ SELNODE = null; recompute(true); return; }
  if (op === "nclrall" && g){ g.edits = {}; g.dels = []; SELNODE = null; recompute(true); return; }
  if (op === "autonum"){ g.autoNum = (g.autoNum === false); recompute(true); return; }
  if (op === "xfrst"){ g.xf = XF_DEF(); recompute(true); return; }
  if (op === "pxfrst"){ const p0 = (g.pieces || [])[+b.dataset.p]; if (p0) p0.xf = XF_DEF(); recompute(true); return; }
  if (op === "eclr"){ SELELEM = null; recompute(true); return; }
  if (op === "xfnode"){
    if (SELNODE && SELNODE.gid === g.id) applyXfToNodes(g, [SELNODE.ri]);
    return;
  }
  if (op === "xfelem"){
    const r0 = MODEL.byId.get(g.id);
    const e0 = (r0 && SELELEM && SELELEM.gid === g.id) ? r0.elems.find(x => x.num === SELELEM.num) : null;
    if (e0 && Number.isFinite(e0.a.ri) && Number.isFinite(e0.b.ri)) applyXfToNodes(g, [e0.a.ri, e0.b.ri]);
    return;
  }
  const openSet = new Set([...document.querySelectorAll("details.pc[open]")].map(d => +d.dataset.pi));
  const pcOf = () => (g.pieces || [])[+b.dataset.p];
  if (op === "addpc"){
    g.pieces = g.pieces || [];
    const pc = defaultPiece(b.dataset.t);
    if (!g.pieces.length) pc.cont = false;
    g.pieces.push(pc); openSet.clear(); openSet.add(g.pieces.length - 1);
  }
  if (op === "pdel"){ g.pieces.splice(+b.dataset.p, 1); openSet.clear(); }
  const pc = pcOf();
  if (op === "addseg" && pc){ pc.segments = pc.segments || [];
    const t = b.dataset.t;
    pc.segments.push(t === "LINE" ? { type:"LINE", L:50 }
      : t === "ARC" ? { type:"ARC", R:100, dir:1, defBy:"delta", delta:45 }
      : { type:"SPIRAL", R0inf:true, R1inf:false, R1:100, dir:1, defBy:"Ls", Ls:50 }); }
  if (op === "delseg" && pc) pc.segments.splice(+b.dataset.i, 1);
  if (op === "addvpi" && pc){
    pc.profile = pc.profile || [];
    if (pc.profile.length < 2){
      const r = MODEL.byId.get(g.id);
      const info = r && r.pieces.find(x => x.pi === pc._i);
      const s0 = num(pc.sta) || 0, s1 = s0 + (info && info.chain ? info.chain.total : 100);
      const z0 = (info && info.chain) ? info.chain.z0 : (num(pc.z1) || 0);
      pc.profile = [{ sta:s0, z:z0, L:0 }, { sta:s1, z:z0, L:0 }];
    } else {
      const P = pc.profile, a = P[P.length-2], b2 = P[P.length-1];
      P.splice(P.length-1, 0, { sta:(a.sta + b2.sta)/2, z:(a.z + b2.z)/2, L:0 });
    }
  }
  if (op === "delvpi" && pc){ pc.profile.splice(+b.dataset.i, 1); if (pc.profile.length < 2) pc.profile = []; }
  if (op === "clearvpi" && pc) pc.profile = [];
  if (g.pieces) g.pieces.forEach((x, i) => x._open = openSet.has(i));
  recompute(true);
});

/* ---------- 拖曳排序 ---------- */
let DRAG = null;
$("#pane").addEventListener("mousedown", e => {
  const gp = e.target.closest(".grip"); if (!gp) return;
  const d = gp.closest("details.pc"); if (d) d.draggable = true;
});
$("#pane").addEventListener("dragstart", e => {
  const d = e.target.closest("details.pc"); if (!d) return;
  DRAG = { kind:"piece", from:+d.dataset.pi };
  d.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", String(DRAG.from)); } catch (err){}
});
$("#pane").addEventListener("dragover", e => {
  if (!DRAG || DRAG.kind !== "piece") return;
  const d = e.target.closest("details.pc"); if (!d) return;
  e.preventDefault();
  $("#pane").querySelectorAll("details.pc.over").forEach(x => x.classList.remove("over"));

});
$("#pane").addEventListener("drop", e => {
  if (!DRAG || DRAG.kind !== "piece") return;
  const d = e.target.closest("details.pc"); if (!d) return;
  e.preventDefault();
  const to = +d.dataset.pi, from = DRAG.from;
  const g = state.groups.find(x => x.id === SEL);
  if (g && g.pieces && from !== to){

/* ---- 平面 ---- */
const cv = $("#cv"), ctx = cv.getContext("2d");
const view = { cx:0, cy:0, scale:1, locked:false };
let showNodes = true, hover = null;

const allPts = () => MODEL.groups.flatMap(r => r.nodes);
// 由「實際元素」串出折線 —— 這才是會匯出到 midas 的東西
function elemPolys(r){
  const out = [];
  let cur = null, prevJ = null;
  r.elems.forEach(e => {
    if (cur && e.i === prevJ) cur.push(e.b);
    else { cur = [e.a, e.b]; out.push(cur); }
    prevJ = e.j;
  });
  return out;
}

// 依段切開的元素折線(要分色畫的時候用):{ pi, pts }
function elemPolysBy(r){
  const out = [];
  let cur = null, prevJ = null, prevPi = null;
  r.elems.forEach(e => {
    if (cur && e.i === prevJ && e.pi === prevPi) cur.pts.push(e.b);
    else { cur = { pi:e.pi, pts:[e.a, e.b] }; out.push(cur); }
    prevJ = e.j; prevPi = e.pi;
  });
  return out;
}
// 參數曲線的取樣(只作為淡色參考底線;節點被手動移動後兩者會不一致)
function curvePolys(r){
  if (!r.pieces || !r.pieces.length) return r.nodes.length ? [{ pi:-1, pts:r.nodes }] : [];
  const out = [];
  r.pieces.forEach(info => {
    let pts = [];
    if (info.curve){ for (let i = 0; i <= 160; i++) pts.push(info.curve.pt(i/160)); }
    else if (info.chain && info.evalAt){
      const s0 = info.chain.segs[0].s0, s1 = info.chain.segs[info.chain.segs.length-1].s1;
      for (let i = 0; i <= 240; i++){ const q = info.evalAt(s0 + (s1-s0)*i/240); if (q) pts.push(q); }
    } else pts = r.nodes.slice(info.n0, info.n1);
    if (pts.length > 1) out.push({ pi:info.pi, pts });
  });
  return out;
}
// 只有「正在編輯、而且不只一段」的曲線組才分色
const pcOn = r => SEL === r.g.id && r.g.type === "CURVE" && (r.g.pieces || []).length > 1;
const colOf = (r, pi) => (pcOn(r) && pi != null && pi >= 0) ? pieceColor(pi) : r.color;
function fitView(){
  const P = allPts();
  if (!P.length){ view.cx = 0; view.cy = 0; view.scale = 1; return; }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; });
  const W = cv.clientWidth || 600, H = cv.clientHeight || 300;
  view.scale = Math.min(W/Math.max(x1-x0,1e-6), H/Math.max(y1-y0,1e-6)) * 0.84;
  view.cx = (x0+x1)/2; view.cy = (y0+y1)/2;
}
const toS = p => ({ x:(p.x - view.cx)*view.scale + cv.clientWidth/2,
                    y:cv.clientHeight/2 - (p.y - view.cy)*view.scale });
const toW = (sx, sy) => ({ x:(sx - cv.clientWidth/2)/view.scale + view.cx,
                           y:(cv.clientHeight/2 - sy)/view.scale + view.cy });
function niceStep(px, scale){
  const raw = px/scale, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
const fmtN = v => Math.abs(v) < 1e-9 ? "0" : (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(Math.abs(v)%1 ? 1 : 0));

function draw(){
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if (!allPts().length) return;

  // 格線
  const step = niceStep(80, view.scale);
  const tl = toW(0,0), br = toW(W,H);
  ctx.lineWidth = 1; ctx.font = "9.5px " + getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.fillStyle = "#b8c0cb";
  for (let x = Math.ceil(tl.x/step)*step; x <= br.x; x += step){
    const s = toS({x,y:0}).x;
    ctx.strokeStyle = Math.abs(x) < 1e-9 ? "#dfe4ea" : "#f0f2f4";
    ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(s,H); ctx.stroke();
    ctx.fillText(fmtN(x), s+3, H-4);
  }
  for (let y = Math.ceil(br.y/step)*step; y <= tl.y; y += step){
    const s = toS({x:0,y}).y;
    ctx.strokeStyle = Math.abs(y) < 1e-9 ? "#dfe4ea" : "#f0f2f4";
    ctx.beginPath(); ctx.moveTo(0,s); ctx.lineTo(W,s); ctx.stroke();
    ctx.fillText(fmtN(y), 3, s-3);
  }

  MODEL.groups.forEach(r => {
    const on = SEL === r.g.id;
    ctx.strokeStyle = r.color; ctx.lineJoin = "round"; ctx.lineCap = "round";
    if (TYPES[r.g.type].fam === "con"){
      ctx.lineWidth = on ? 1.8 : 1; ctx.globalAlpha = on ? 1 : .6;
      ctx.beginPath();
      r.elems.forEach(e => { const a = toS(e.a), b = toS(e.b); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); });
      ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      // 參考:原始參數曲線(淡)
      ctx.globalAlpha = .28; ctx.lineWidth = 1.2;
      curvePolys(r).forEach(pl => {
        ctx.strokeStyle = colOf(r, pl.pi);
        ctx.beginPath();
        pl.pts.forEach((p,i) => { const s = toS(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); });
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      // 實際元素(節點被移動或刪除後,線會跟著走);編輯中的組各段分色
      ctx.lineWidth = on ? 3 : 1.9;
      elemPolysBy(r).forEach(pl => {
        ctx.strokeStyle = colOf(r, pl.pi);
        ctx.beginPath();
        pl.pts.forEach((p,i) => { const s = toS(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); });
        ctx.stroke();
      });
      ctx.strokeStyle = r.color;
    }
    if (showNodes && r.nodes.length){
      const rad = r.nodes.length > 400 ? 1.2 : (r.nodes.length > 150 ? 1.7 : 2.4);
      ctx.fillStyle = r.color;
      r.nodes.forEach(n => { ctx.fillStyle = colOf(r, n.pi);
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,rad,0,7); ctx.fill(); });
      // 端點
      ctx.fillStyle = "#fff"; ctx.strokeStyle = r.color; ctx.lineWidth = 1.6;
      [r.nodes[0], r.nodes[r.nodes.length-1]].forEach(n => {
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,3.4,0,7); ctx.fill(); ctx.stroke(); });
      // 座標被覆寫的節點
      ctx.fillStyle = "#a8710d";
      r.nodes.filter(n => n.edited).forEach(n => {
        const s = toS(n); ctx.beginPath(); ctx.arc(s.x,s.y,3.6,0,7); ctx.fill(); });
    }
  });

  // 比例尺 + 北
  ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(8, H-30, step*view.scale+58, 22);
  ctx.strokeStyle = "#5a6472"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(14,H-18); ctx.lineTo(14+step*view.scale,H-18); ctx.stroke();
  ctx.fillStyle = "#5a6472"; ctx.font = "10px sans-serif";
  ctx.fillText(fmtN(step) + " " + UL(), 18+step*view.scale, H-15);
  ctx.beginPath(); ctx.moveTo(W-22,34); ctx.lineTo(W-22,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-22,10); ctx.lineTo(W-26,17); ctx.lineTo(W-18,17); ctx.closePath(); ctx.fill();
  ctx.fillText("N", W-26, 46);

  if (SELELEM){
    const rr = MODEL.byId.get(SELELEM.gid);
    const ee = rr && rr.elems.find(e => e.num === SELELEM.num);
    if (ee){ const a = toS(ee.a), b = toS(ee.b);
      ctx.strokeStyle = "#b3261e"; ctx.lineWidth = 5; ctx.globalAlpha = .45;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  if (hover){ const s = toS(hover);
    ctx.strokeStyle = "#1c5d99"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x,s.y,5.5,0,7); ctx.stroke(); }
  if (SELNODE){
    const rr = MODEL.byId.get(SELNODE.gid);
    const nd = rr && rr.nodes.find(n => n.ri === SELNODE.ri);
    if (nd){ const s = toS(nd);
      ctx.strokeStyle = "#b3261e"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x,s.y,7,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x-11,s.y); ctx.lineTo(s.x-7,s.y);
      ctx.moveTo(s.x+7,s.y); ctx.lineTo(s.x+11,s.y);
      ctx.moveTo(s.x,s.y-11); ctx.lineTo(s.x,s.y-7);
      ctx.moveTo(s.x,s.y+7); ctx.lineTo(s.x,s.y+11); ctx.stroke(); }
  }
}

// 點到線段的距離(像素);拿來點選元素
function segDistPx(px, py, ax, ay, bx, by){
  const dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
  let t = L2 > 1e-12 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx*t), py - (ay + dy*t));
}
// 在畫面座標下找最近的元素(只有曲線組的元素能編輯)
function pickElemBy(toPx, tolPx){
  let best = null, bd = tolPx;
  MODEL.groups.forEach(r => {
    if (r.g.type !== "CURVE") return;
    r.elems.forEach(e => {
      const a = toPx(e.a), b2 = toPx(e.b);
      const d = segDistPx(toPx.px, toPx.py, a.x, a.y, b2.x, b2.y);
      if (d < bd){ bd = d; best = { r, e }; }
    });
  });
  return best;
}
// 選取後把高亮的區塊捲進視窗,免得使用者不知道要去哪裡編輯
function focusHot(){
  const el = document.querySelector("#pane .sec.hot");
  if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}
let drag = null, dragMoved = false;
cv.addEventListener("mousedown", e => { drag = { x:e.offsetX, y:e.offsetY, cx:view.cx, cy:view.cy }; dragMoved = false; });
window.addEventListener("mouseup", () => { drag = null; });
cv.addEventListener("click", e => {
  if (dragMoved) return;
  const w = toW(e.offsetX, e.offsetY);
  let best = null, bd = Infinity, bg = null;
  MODEL.groups.forEach(r => { if (r.g.type !== "CURVE") return;
    r.nodes.forEach(n => { const d = (n.x-w.x)**2 + (n.y-w.y)**2;
      if (d < bd){ bd = d; best = n; bg = r; } }); });
  if (best && Math.sqrt(bd)*view.scale < 14){
    SEL = bg.g.id; SELNODE = { gid:bg.g.id, ri:best.ri }; SELELEM = null;
  } else {
    const toPx = p => toS(p); toPx.px = e.offsetX; toPx.py = e.offsetY;
    const pe = pickElemBy(toPx, 9);
    if (pe){ SEL = pe.r.g.id; SELELEM = { gid:pe.r.g.id, num:pe.e.num }; SELNODE = null; }
    else { SELNODE = null; SELELEM = null; }
  }
  recompute(true); focusHot();
});
cv.addEventListener("mousemove", e => {
  if (drag){ if (Math.hypot(e.offsetX-drag.x, e.offsetY-drag.y) > 3) dragMoved = true;
             view.cx = drag.cx - (e.offsetX-drag.x)/view.scale;
             view.cy = drag.cy + (e.offsetY-drag.y)/view.scale;
             view.locked = true; draw(); return; }
  const w = toW(e.offsetX, e.offsetY);
  let best = null, bd = Infinity, bg = null;
  MODEL.groups.forEach(r => r.nodes.forEach(n => {
    const d = (n.x-w.x)**2 + (n.y-w.y)**2; if (d < bd){ bd = d; best = n; bg = r; } }));
  hover = (best && Math.sqrt(bd)*view.scale < 24) ? best : null;
  $("#ro").textContent = hover
    ? `${bg.g.name} #${hover.num}  X ${hover.x.toFixed(3)}  Y ${hover.y.toFixed(3)}  Z ${hover.z.toFixed(3)}` +
      (Number.isFinite(hover.s) ? `  ${fmtSta(hover.s)}` : "")
    : `X ${w.x.toFixed(3)}   Y ${w.y.toFixed(3)}   (${UL()})`;
  draw(); drawProf();
});
cv.addEventListener("mouseleave", () => { hover = null; $("#ro").textContent = ""; draw(); drawProf(); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const w = toW(e.offsetX, e.offsetY), f = Math.exp(-e.deltaY*0.0015);
  view.scale *= f;
  view.cx = w.x - (e.offsetX - cv.clientWidth/2)/view.scale;
  view.cy = w.y + (e.offsetY - cv.clientHeight/2)/view.scale;
  view.locked = true; draw();
}, { passive:false });
$("#btn-fit").onclick = () => { view.locked = false; fitView(); draw(); };
$("#zsc").addEventListener("input", e => {
  state.view.zAuto = false;
  state.view.zScale = num(e.target.value) || 1;
  pview.locked = false; fitProf(); drawProf();
});
$("#zauto").onclick = () => { state.view.zAuto = true; pview.locked = false; fitProf(); drawProf(); };
$("#btn-nodes").onclick = e => { showNodes = !showNodes;
  e.target.textContent = "節點:" + (showNodes ? "開" : "關"); draw(); drawProf(); };
window.addEventListener("resize", () => { if (!view.locked) fitView(); draw(); drawProf(); });

/* ---- 立面 ---- */
const pv = $("#pv"), pctx = pv.getContext("2d");
const PM = { l:46, r:10, t:10, b:20 };
const pview = { s0:0, s1:1, z0:0, z1:1, dir:{ x:1, y:0 }, o:{ x:0, y:0 }, exag:1, az:90, locked:false };
let PHOVER = "";
const projS = p => (p.x - pview.o.x)*pview.dir.x + (p.y - pview.o.y)*pview.dir.y;
const pW = () => Math.max(1, pv.clientWidth - PM.l - PM.r);
const pH = () => Math.max(1, pv.clientHeight - PM.t - PM.b);
const pX = s => PM.l + (s - pview.s0)/Math.max(1e-9, pview.s1-pview.s0)*pW();
const pY = z => PM.t + pH() - (z - pview.z0)/Math.max(1e-9, pview.z1-pview.z0)*pH();

// 立面工具列與目前視角同步
function syncProfTools(){
  const md = $("#pmode"); if (md && document.activeElement !== md) md.value = state.view.profMode || "auto";
  const ai = $("#paz");
  if (ai && document.activeElement !== ai) ai.value = +norm360(pview.az).toFixed(1);
}
function setProfAz(az){
  state.view.profMode = "az";
  state.view.az = +norm360(az).toFixed(2);
  pview.locked = false;                                // 換方向 → 重新框選
  fitProf();
}
function fitProf(){
  const P = allPts();
  if (!P.length) return;
  if (pview.locked){ syncProfTools(); return; }        // 使用者自己平移縮放過,沿用目前視窗
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; });
  let az;
  const m = state.view.profMode;
  if (m === "x") az = 90; else if (m === "y") az = 0;
  else if (m === "az") az = num(state.view.az) || 0;
  else az = (x1-x0) >= (y1-y0) ? 90 : 0;
  pview.az = norm360(az);
  pview.dir = { x:Math.sin(az*D2R), y:Math.cos(az*D2R) };
  pview.o = { x:x0, y:y0 };
  syncProfTools();
  let s0=Infinity,s1=-Infinity,z0=Infinity,z1=-Infinity;
  P.forEach(p => { const s = projS(p);
    if(s<s0)s0=s; if(s>s1)s1=s; if(p.z<z0)z0=p.z; if(p.z>z1)z1=p.z; });
  if (!(s1 > s0)) s1 = s0 + 1;
  pview.s0 = s0; pview.s1 = s1;
  const ppmX = pW()/(s1 - s0);
  const zc = (z0 + z1)/2;
  if (state.view.zAuto !== false){
    const pad = Math.max((z1-z0)*0.18, 0.5);
    const span = (z1 - z0) + 2*pad;
    pview.z0 = zc - span/2; pview.z1 = zc + span/2;
    state.view.zScale = +((pH()/span)/ppmX).toFixed(3);
  } else {
    const zs = Math.max(1e-4, num(state.view.zScale) || 1);
    const span = pH()/(ppmX*zs);
    pview.z0 = zc - span/2; pview.z1 = zc + span/2;
  }
  const zi = $("#zsc"); if (zi && document.activeElement !== zi) zi.value = state.view.zScale;
}
const pToPx = p => ({ x:pX(projS(p)), y:pY(p.z) });

function drawProf(){
  const dpr = window.devicePixelRatio || 1, W = pv.clientWidth, H = pv.clientHeight;
  if (!W || !H) return;
  pv.width = Math.round(W*dpr); pv.height = Math.round(H*dpr);
  pctx.setTransform(dpr,0,0,dpr,0,0); pctx.clearRect(0,0,W,H);
  if (!allPts().length) return;
  const mono = getComputedStyle(document.body).getPropertyValue("--mono");
  const spanS = pview.s1-pview.s0, spanZ = pview.z1-pview.z0;
  pview.exag = (pH()/spanZ)/(pW()/spanS);

  pctx.font = "9px " + mono; pctx.lineWidth = 1;
  const nice = (span, px, tgt) => { const raw = span/Math.max(1, px/tgt);
    const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
    return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; };
  const dz = nice(spanZ, pH(), 34), ds = nice(spanS, pW(), 110);
  pctx.strokeStyle = "#f0f2f4"; pctx.fillStyle = "#b8c0cb";
  for (let z = Math.ceil(pview.z0/dz)*dz; z <= pview.z1; z += dz){
    const y = pY(z); pctx.beginPath(); pctx.moveTo(PM.l,y); pctx.lineTo(W-PM.r,y); pctx.stroke();
    pctx.fillText(z.toFixed(dz<1?2:(dz<10?1:0)), 3, y+3);
  }
  for (let s = Math.ceil(pview.s0/ds)*ds; s <= pview.s1; s += ds){
    const x = pX(s); pctx.beginPath(); pctx.moveTo(x,PM.t); pctx.lineTo(x,PM.t+pH()); pctx.stroke();
    pctx.fillText(fmtN(s), x-10, H-6);
  }
  pctx.strokeStyle = "#dfe4ea";
  pctx.beginPath(); pctx.moveTo(PM.l,PM.t); pctx.lineTo(PM.l,PM.t+pH()); pctx.lineTo(W-PM.r,PM.t+pH()); pctx.stroke();

  MODEL.groups.forEach(r => {
    const on = SEL === r.g.id;
    pctx.strokeStyle = r.color;
    if (TYPES[r.g.type].fam === "con"){
      pctx.lineWidth = on ? 1.5 : .9; pctx.globalAlpha = on ? 1 : .55;
      pctx.beginPath();
      r.elems.forEach(e => { pctx.moveTo(pX(projS(e.a)), pY(e.a.z)); pctx.lineTo(pX(projS(e.b)), pY(e.b.z)); });
      pctx.stroke(); pctx.globalAlpha = 1;
    } else {
      pctx.globalAlpha = .28; pctx.lineWidth = 1;
      curvePolys(r).forEach(pl => {
        pctx.strokeStyle = colOf(r, pl.pi);
        pctx.beginPath();
        pl.pts.forEach((p,i) => { const x = pX(projS(p)), y = pY(p.z); i ? pctx.lineTo(x,y) : pctx.moveTo(x,y); });
        pctx.stroke();
      });
      pctx.globalAlpha = 1;
      pctx.lineWidth = on ? 2.4 : 1.6;
      elemPolysBy(r).forEach(pl => {
        pctx.strokeStyle = colOf(r, pl.pi);
        pctx.beginPath();
        pl.pts.forEach((p,i) => { const x = pX(projS(p)), y = pY(p.z); i ? pctx.lineTo(x,y) : pctx.moveTo(x,y); });
        pctx.stroke();
      });
      pctx.strokeStyle = r.color;
      if (showNodes){
        const rad = r.nodes.length > 400 ? 1 : 1.7;
        r.nodes.forEach(n => { pctx.fillStyle = colOf(r, n.pi);
          pctx.beginPath(); pctx.arc(pX(projS(n)), pY(n.z), rad, 0, 7); pctx.fill(); });
      }
    }
  });
  if (SELELEM){
    const rr = MODEL.byId.get(SELELEM.gid);
    const ee = rr && rr.elems.find(e => e.num === SELELEM.num);
    if (ee){ const a = pToPx(ee.a), b = pToPx(ee.b);
      pctx.strokeStyle = "#b3261e"; pctx.lineWidth = 4; pctx.globalAlpha = .45;
      pctx.beginPath(); pctx.moveTo(a.x,a.y); pctx.lineTo(b.x,b.y); pctx.stroke(); pctx.globalAlpha = 1; }
  }
  if (SELNODE){
    const rr = MODEL.byId.get(SELNODE.gid);
    const nd = rr && rr.nodes.find(n => n.ri === SELNODE.ri);
    if (nd){ const q = pToPx(nd);
      pctx.strokeStyle = "#b3261e"; pctx.lineWidth = 1.8;
      pctx.beginPath(); pctx.arc(q.x, q.y, 5.5, 0, 7); pctx.stroke(); }
  }
  if (pview.locked){
    state.view.zScale = +pview.exag.toFixed(4);
    const zi = $("#zsc"); if (zi && document.activeElement !== zi) zi.value = state.view.zScale;
  }
  $("#pro").textContent = (PHOVER ? PHOVER + "\n" : "") +
    `方位角 ${norm360(pview.az).toFixed(0)}°   Z 縮放 ×${pview.exag.toFixed(2)}` +
    (pview.locked ? "  (視角已鎖定)" : (state.view.zAuto !== false ? "(自動)" : ""));
  if (hover){ pctx.strokeStyle = "#1c5d99"; pctx.lineWidth = 1.5;
    pctx.beginPath(); pctx.arc(pX(projS(hover)), pY(hover.z), 4.5, 0, 7); pctx.stroke(); }
}

/* ---- 立面的視角操作:拖曳平移、滾輪縮放、Shift+拖曳轉視角、點選節點/元素 ---- */
let pdrag = null, pdragMoved = false;
pv.addEventListener("mousedown", e => {
  pdrag = { x:e.offsetX, y:e.offsetY, s0:pview.s0, s1:pview.s1, z0:pview.z0, z1:pview.z1,
            az:pview.az, rot:e.shiftKey };
  pdragMoved = false;
});
window.addEventListener("mouseup", () => { pdrag = null; });
pv.addEventListener("mousemove", e => {
  if (pdrag){
    if (Math.hypot(e.offsetX-pdrag.x, e.offsetY-pdrag.y) > 3) pdragMoved = true;
    if (pdrag.rot){                                   // Shift+拖曳 = 轉視角
      setProfAz(pdrag.az + (e.offsetX - pdrag.x)*0.4);
      draw(); drawProf(); return;
    }
    const ks = (pview.s1-pview.s0)/pW(), kz = (pview.z1-pview.z0)/pH();
    const ds = -(e.offsetX-pdrag.x)*ks, dz = (e.offsetY-pdrag.y)*kz;
    pview.s0 = pdrag.s0+ds; pview.s1 = pdrag.s1+ds;
    pview.z0 = pdrag.z0+dz; pview.z1 = pdrag.z1+dz;
    pview.locked = true; drawProf(); return;
  }
  let best = null, bd = Infinity, bg = null;
  MODEL.groups.forEach(r => r.nodes.forEach(n => {
    const q = pToPx(n), d = Math.hypot(q.x-e.offsetX, q.y-e.offsetY);
    if (d < bd){ bd = d; best = n; bg = r; } }));
  hover = (best && bd < 14) ? best : null;
  PHOVER = hover
    ? `${bg.g.name} #${hover.num}  X ${hover.x.toFixed(3)}  Y ${hover.y.toFixed(3)}  Z ${hover.z.toFixed(3)}`
    : "";
  draw(); drawProf();
});
pv.addEventListener("mouseleave", () => { hover = null; PHOVER = ""; draw(); drawProf(); });
pv.addEventListener("click", e => {
  if (pdragMoved) return;
  let best = null, bd = Infinity, bg = null;
  MODEL.groups.forEach(r => { if (r.g.type !== "CURVE") return;
    r.nodes.forEach(n => { const q = pToPx(n), d = Math.hypot(q.x-e.offsetX, q.y-e.offsetY);
      if (d < bd){ bd = d; best = n; bg = r; } }); });
  if (best && bd < 14){
    SEL = bg.g.id; SELNODE = { gid:bg.g.id, ri:best.ri }; SELELEM = null;
  } else {
    const toPx = p => pToPx(p); toPx.px = e.offsetX; toPx.py = e.offsetY;
    const pe = pickElemBy(toPx, 9);
    if (pe){ SEL = pe.r.g.id; SELELEM = { gid:pe.r.g.id, num:pe.e.num }; SELNODE = null; }
    else { SELNODE = null; SELELEM = null; }
  }
  recompute(true); focusHot();
});
pv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY*0.0015);
  const sAt = pview.s0 + (e.offsetX - PM.l)/pW()*(pview.s1 - pview.s0);
  const zAt = pview.z0 + (PM.t + pH() - e.offsetY)/pH()*(pview.z1 - pview.z0);
  if (!e.shiftKey){                                    // 兩軸同步縮放 → Z 誇大倍率不變
    pview.s0 = sAt - (sAt - pview.s0)/f; pview.s1 = sAt + (pview.s1 - sAt)/f;
  } else state.view.zAuto = false;                     // Shift = 只縮 Z
  pview.z0 = zAt - (zAt - pview.z0)/f; pview.z1 = zAt + (pview.z1 - zAt)/f;
  pview.locked = true; drawProf();
}, { passive:false });
$("#pv-fit").onclick = () => { pview.locked = false; fitProf(); drawProf(); };
$("#pmode").addEventListener("change", e => {
  state.view.profMode = e.target.value;
  pview.locked = false; fitProf(); drawProf();
});
$("#paz").addEventListener("input", e => {
  const a = num(e.target.value); if (!Number.isFinite(a)) return;
  state.view.profMode = "az"; state.view.az = a;
  pview.locked = false; fitProf(); drawProf();
  const md = $("#pmode"); if (md) md.value = "az";
});
$("#paz-l").onclick = () => { setProfAz(pview.az - 15); drawProf(); };
$("#paz-r").onclick = () => { setProfAz(pview.az + 15); drawProf(); };

   主流程
   ========================================================================== */
function recompute(reTree){
  ERRS = []; WARNS = [];
  MODEL = buildModel(state, ERRS, WARNS);
  if (SELELEM){                                        // 選取的元素可能已經不在了
    const rr = MODEL.byId.get(SELELEM.gid);
    if (!rr || !rr.elems.some(e => e.num === SELELEM.num)) SELELEM = null;
  }
  if (reTree !== false) renderTree();
  syncUnitUI();
  renderPane();
  renderChecks();
  if (!view.locked) fitView();
  fitProf(); draw(); drawProf();
  syncHistBtns();
}
function render(){ renderTree(); renderPane(); if (!view.locked) fitView(); draw(); drawProf(); }


/* ==========================================================================
   9. 驗收測試(不依賴畫面狀態,全部自建 fixture)
   ========================================================================== */
function runTests(){
  const rows = [];
  const chk = (id, desc, actual, expect, tol, unit) =>
    rows.push({ id, desc, actual, expect, tol, unit:unit||"", ok:Math.abs(actual-expect) <= tol });
  const yes = (id, desc, cond, actual, expect) =>
    rows.push({ id, desc, actual:String(actual), expect:String(expect), ok:!!cond, str:true });

  const PIECE_T = { LINE:1, ARC:1, SAG:1, HELIX:1, CHAIN:1, POINT:1 };
  // g.type 是段型別時,自動包成「一段的曲線組」;是組型別時照舊
  const build = groups => {
    const gs = groups.map(g => {
      if (PIECE_T[g.type]){
        const { id, name, etype, mat, sect, autoNum, nodeBase, elemBase, on, ...rest } = g;
        const pc = { ...defaultPiece(g.type), ...rest, cont:false };
        return { ...defaultGroup("CURVE"), ...(id ? { id } : {}), name:name || "組",
          pieces:[pc], etype:etype || "BEAM", mat:mat || 1, sect:sect || 1,
          ...(autoNum !== undefined ? { autoNum } : {}), ...(nodeBase ? { nodeBase } : {}),
          ...(elemBase ? { elemBase } : {}), ...(on !== undefined ? { on } : {}) };
      }
      return { ...defaultGroup(g.type), ...g };
    });
    const s = normState({ ...DEF_STATE(), groups:gs });
    const E = [], W = [];
    return { md:buildModel(s, E, W), errs:E, warns:W, st:s };
  };
  // 多段的曲線組
  const buildPieces = (pieces, extra) => {
    const s = normState({ ...DEF_STATE(), groups:[{ ...defaultGroup("CURVE"), name:"組",
      pieces:pieces.map((pc, i) => ({ ...defaultPiece(pc.type), ...pc, cont:i === 0 ? false : (pc.cont !== false) })),
      ...(extra || {}) }] });
    const E = [], W = [];
    const md = buildModel(s, E, W);
    return { md, g:md.groups[0], errs:E, warns:W };
  };

  /* ---- 樁號格式 ---- */
  chk("F1","parseSta('0k+125.500')", parseSta("0k+125.500"), 125.5, 1e-12, "m");
  chk("F1","parseSta('1K+025')", parseSta("1K+025"), 1025, 1e-12, "m");
  chk("F1","parseSta('125.5')", parseSta("125.5"), 125.5, 1e-12, "m");
  yes("F1","fmtSta(125.5)", fmtSta(125.5) === "0k+125.500", fmtSta(125.5), "0k+125.500");
  yes("F1","fmtSta(1025)", fmtSta(1025) === "1k+025.000", fmtSta(1025), "1k+025.000");

  /* ---- 直線 ---- */
  const L1 = build([{ type:"LINE", name:"L", x1:0,y1:0,z1:0, x2:30,y2:40,z2:0,
    split:{ ...SPLIT_DEF, mode:"count", count:5 } }]).md.groups[0];
  chk("A1","直線長度", L1.pieces[0].len, 50, 1e-9, "m");
  chk("A1","節點數 = N+1", L1.nodes.length, 6, 0, "");
  chk("A1","中點座標 X", L1.nodes[3].x, 18, 1e-9, "m");
  chk("A1","弦線偏差 = 0", L1.stat.maxDev, 0, 1e-12, "m");

  /* ---- 圓弧:端點 + 半徑 ---- */
  // (0,0) → (100,0),R = 100,右轉劣弧 → 圓心在右(南)
  const arcCase = (dir, major) => build([{ type:"ARC", name:"A", arcMode:"endpoints", plane:"H",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:100, dir, major,
    split:{ ...SPLIT_DEF, mode:"count", count:60 } }]).md.groups[0];
  const Ar = arcCase(1,false), Al = arcCase(-1,false), Am = arcCase(1,true);
  chk("B1","右轉劣弧:圓心 Y(在南側)", Ar.pieces[0].meta.center.y, -Math.sqrt(100*100-2500), 1e-9, "m");
  chk("B1","左轉劣弧:圓心 Y(在北側)", Al.pieces[0].meta.center.y, +Math.sqrt(100*100-2500), 1e-9, "m");
  chk("B1","右轉優弧:圓心 Y(換到北側)", Am.pieces[0].meta.center.y, +Math.sqrt(100*100-2500), 1e-9, "m");
  // 弧長:劣弧 2R·asin(d/2R)= 2*100*asin(0.5)=104.7198;優弧 = 2πR − 劣弧
  chk("B2","劣弧長", Ar.pieces[0].meta.arcLen, 2*100*Math.asin(0.5), 1e-9, "m");
  chk("B2","優弧長 = 2πR − 劣弧", Am.pieces[0].meta.arcLen, 2*Math.PI*100 - 2*100*Math.asin(0.5), 1e-9, "m");
  chk("B2","端點精確落位 X", Ar.nodes[Ar.nodes.length-1].x, 100, 1e-9, "m");
  chk("B2","端點精確落位 Y", Ar.nodes[Ar.nodes.length-1].y, 0, 1e-9, "m");
  yes("B3","右轉劣弧向北凸(中點 Y > 0)", Ar.nodes[30].y > 0, Ar.nodes[30].y.toFixed(4), "> 0");
  yes("B3","左轉劣弧向南凸(中點 Y < 0)", Al.nodes[30].y < 0, Al.nodes[30].y.toFixed(4), "< 0");
  // 半徑不足
  const bad = build([{ type:"ARC", name:"A", arcMode:"endpoints", plane:"H",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:30, dir:1, major:false }]);
  yes("B4","半徑 < 弦長一半 → 錯誤", bad.errs.length > 0, bad.errs.length, "> 0");
  // 鉛直平面(拱肋)
  const Av = build([{ type:"ARC", name:"拱", arcMode:"endpoints", plane:"V",
    x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, R:100, dir:1, major:false,
    split:{ ...SPLIT_DEF, mode:"count", count:60 } }]).md.groups[0];
  yes("B5","鉛直平面上凸(中點 Z > 0)", Av.nodes[30].z > 0, Av.nodes[30].z.toFixed(4), "> 0");
  chk("B5","鉛直平面 Y 不變", Av.nodes[30].y, 0, 1e-9, "m");
  chk("B5","矢高 = R − √(R²−(d/2)²)", Av.nodes[30].z, 100 - Math.sqrt(100*100-2500), 1e-6, "m");
  // 圓心模式
  const Ac = build([{ type:"ARC", name:"C", arcMode:"center",
    x1:100,y1:0,z1:0, cx:0, cy:0, delta:90, dir:1, z2:10,
    split:{ ...SPLIT_DEF, mode:"count", count:36 } }]).md.groups[0];
  chk("B6","圓心模式:半徑", Ac.pieces[0].meta.R, 100, 1e-9, "m");

    NS0.groups[0].pieces[1].cont === false, String(NS0.groups[0].pieces[1].cont), "false");

  /* ---- 座標覆寫不得改變連接關係 ---- */
  const topo = r0 => r0.elems.map(e => e.i + "-" + e.j).join(",");
  const CT = (edits) => {
    const st0 = normState({ ...DEF_STATE(), groups:[
      { ...defaultGroup("CURVE"), id:"ct", name:"主",
        pieces:[
          { ...defaultPiece("LINE"), cont:false, x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, split:{ ...SPLIT_DEF, count:5 } },
          { ...defaultPiece("SAG"),  cont:true, x2:300,y2:0,z2:0, curve:"parabola",
            fMode:"abs", f:20, split:{ ...SPLIT_DEF, count:10 } }],
        edits:edits || {}, dels:[] },
      { ...defaultGroup("OFFSET"), id:"ct2", name:"偏", ref:"ct", d:4, h:0 },
      { ...defaultGroup("LINK2"), id:"ct3", name:"橫", a:"ct", b:"ct2", every:1 }
    ] });
    const E = [], W = [];
    const md = buildModel(st0, E, W);
    return { md, main:md.groups.find(r => r.g.id === "ct"), off:md.groups.find(r => r.g.id === "ct2"),
             lk:md.groups.find(r => r.g.id === "ct3"), errs:E };
  };
  const T0 = CT(), T1 = CT({ 3:{ x:55, y:22, z:9 } });
  yes("S1","覆寫座標後元素的 i–j 連接完全相同", topo(T1.main) === topo(T0.main),
    topo(T1.main).slice(0,28) + "…", "與未覆寫相同");
  chk("S1","節點數不變", T1.main.nodes.length, T0.main.nodes.length, 0, "");
  chk("S1","元素數不變", T1.main.elems.length, T0.main.elems.length, 0, "");
  chk("S1","節點編號不變", T1.main.nodes[3].num, T0.main.nodes[3].num, 0, "");
  chk("S1","座標確實有改", T1.main.nodes[3].y, 22, 1e-12, "m");
  yes("S2","相依的偏置組連接關係也不變", topo(T1.off) === topo(T0.off), "相同", "相同");
  yes("S2","組對組連接關係也不變", topo(T1.lk) === topo(T0.lk), "相同", "相同");
  chk("S2","偏置組節點數不變", T1.off.nodes.length, T0.off.nodes.length, 0, "");
  yes("S2","覆寫後仍無錯誤", T1.errs.length === 0, T1.errs.length, 0);
  // 逐軸容錯:只給 Y,X/Z 沿用原值
  const T2 = CT({ 3:{ x:NaN, y:22, z:NaN } });
  chk("S3","只覆寫 Y 時 X 沿用原值", T2.main.nodes[3].x, T0.main.nodes[3].x, 1e-12, "m");
  chk("S3","只覆寫 Y 時 Z 沿用原值", T2.main.nodes[3].z, T0.main.nodes[3].z, 1e-12, "m");
  chk("S3","Y 有生效", T2.main.nodes[3].y, 22, 1e-12, "m");
  yes("S3","仍標記為已覆寫", T2.main.nodes[3].edited === true, "是", "是");

  // 畫面畫的必須是「實際元素」,節點被移動後線要跟著走
  const T3 = CT({ 3:{ x:55, y:22, z:9 } });
  const polys = elemPolys(T3.main);
  yes("S4","元素折線只有一條(全段連續)", polys.length === 1, polys.length, 1);
  chk("S4","折線點數 = 節點數", polys[0].length, T3.main.nodes.length, 0, "");
  const moved = polys[0][3];
  chk("S4","折線第 4 點就是被移動後的座標 X", moved.x, 55, 1e-12, "m");
  chk("S4","折線第 4 點 Y", moved.y, 22, 1e-12, "m");
  yes("S4","前一點仍是原座標(只有被改的那點動)",
    Math.abs(polys[0][2].x - T0.main.nodes[2].x) < 1e-12, "未動", "未動");
  // 參數曲線(淡色底線)確實與元素折線不同 —— 這正是之前看起來「斷掉」的原因
  const cp = curvePolys(T3.main).flatMap(pl => pl.pts);
  const near = cp.some(q => Math.abs(q.x-55) < 1e-6 && Math.abs(q.y-22) < 1e-6);
  yes("S4","參數曲線不含被移動的點(所以只能當參考底線)", !near, "不含", "不含");
  // 刪除後折線要跨過去
  const T4 = (() => {
    const st0 = normState({ ...DEF_STATE(), groups:[{ ...defaultGroup("CURVE"), id:"t4", name:"主",
      pieces:[{ ...defaultPiece("LINE"), cont:false, x1:0,y1:0,z1:0, x2:100,y2:0,z2:0,
                split:{ ...SPLIT_DEF, count:5 } }], dels:[2] }] });
    return buildModel(st0, [], []).groups[0];
  })();
  const p4 = elemPolys(T4);
  yes("S5","刪除中間節點後仍是一條連續折線", p4.length === 1, p4.length, 1);
  chk("S5","折線點數 = 5", p4[0].length, 5, 0, "");
  chk("S5","跨過被刪節點的一段長度 = 40", Math.hypot(p4[0][2].x-p4[0][1].x, 0, 0), 40, 1e-9, "m");
  // 分段折線:每一段各自一條,顏色才對得起來
  const SEGP = (() => {
    const st0 = normState({ ...DEF_STATE(), groups:[{ ...defaultGroup("CURVE"), name:"組", pieces:[
      { ...defaultPiece("LINE"), cont:false, x1:0,y1:0,z1:0, x2:50,y2:0,z2:0, split:{ ...SPLIT_DEF, count:2 } },
      { ...defaultPiece("LINE"), cont:true, endMode:"polar", len:50, az:90, el:0, split:{ ...SPLIT_DEF, count:2 } }] }] });
    return buildModel(st0, [], []).groups[0];
  })();
  const sp = elemPolysBy(SEGP);
  yes("S6","兩段 → 兩條分段折線", sp.length === 2, sp.length, 2);
  yes("S6","分段折線帶著段序號", sp.map(x => x.pi).join(",") === "0,1", sp.map(x => x.pi).join(","), "0,1");
  chk("S6","接縫兩邊共用同一個點", Math.hypot(sp[0].pts[sp[0].pts.length-1].x - sp[1].pts[0].x, 0, 0), 0, 1e-12, "m");
  yes("S6","段色互不相同", pieceColor(0) !== pieceColor(1), pieceColor(0) + "/" + pieceColor(1), "不同");

  /* ---- 復原 / 重做 ---- */
  const savedHist = { past:HIST.past.slice(), future:HIST.future.slice(), key:HIST.key, t:HIST.t };
  const savedState = JSON.stringify(state);
  HIST.past.length = 0; HIST.future.length = 0; HIST.key = ""; HIST.t = 0;
  state = normState({ ...DEF_STATE(), groups:[{ ...defaultGroup("CURVE"), id:"u1", name:"A",
    pieces:[{ ...defaultPiece("LINE"), cont:false, x1:0,y1:0,z1:0, x2:100,y2:0,z2:0,
              split:{ ...SPLIT_DEF, count:5 } }] }] });
  const g0 = state.groups[0];
  snapshot("t1"); g0.name = "B";
  snapshot("t2"); g0.pieces[0].x2 = 200;
  chk("U1","歷史堆疊 2 步", HIST.past.length, 2, 0, "");
  undo();
  yes("U1","復原一步:x2 回到 100", state.groups[0].pieces[0].x2 === 100 && state.groups[0].name === "B",
    state.groups[0].pieces[0].x2 + "/" + state.groups[0].name, "100/B");
  undo();
  yes("U1","再復原一步:名稱回到 A", state.groups[0].name === "A", state.groups[0].name, "A");
  chk("U1","可重做 2 步", HIST.future.length, 2, 0, "");
  redo(); redo();
  yes("U2","重做兩步回到最新", state.groups[0].pieces[0].x2 === 200 && state.groups[0].name === "B",
    state.groups[0].pieces[0].x2 + "/" + state.groups[0].name, "200/B");
  // 同欄位連續輸入只記一次
  HIST.past.length = 0; HIST.key = ""; HIST.t = 0;
  snapshot("f:g:x"); snapshot("f:g:x"); snapshot("f:g:x");
  chk("U3","同欄位連打只記 1 步", HIST.past.length, 1, 0, "");
  snapshot("f:g:y");
  chk("U3","換欄位就記新的一步", HIST.past.length, 2, 0, "");
  // 新操作要清掉 redo
  HIST.future.length = 0; HIST.past.length = 0; HIST.key = ""; HIST.t = 0;
  snapshot("a"); undo(); chk("U4","復原後可重做", HIST.future.length, 1, 0, "");
  snapshot("b:" + Date.now());
  chk("U4","做了新動作後 redo 被清空", HIST.future.length, 0, 0, "");
  state = normState(JSON.parse(savedState));
  HIST.past = savedHist.past; HIST.future = savedHist.future; HIST.key = savedHist.key; HIST.t = savedHist.t;

  /* ---- 輸出 ---- */
  const OUTF = build([
    { id:"q1", type:"LINE", name:"甲", x1:0,y1:0,z1:0, x2:100,y2:0,z2:0, split:{ ...SPLIT_DEF, count:10 } },
    { id:"q2", type:"SAG", name:"乙", x1:0,y1:20,z1:30, x2:100,y2:20,z2:30, curve:"parabola",
      fMode:"abs", f:5, split:{ ...SPLIT_DEF, count:5 }, etype:"CABLE", mat:2, sect:3 },
    { id:"q3", type:"LINKZ", name:"吊", ref:"q2", targetZ:0, every:2, etype:"CABLE" }
  ]);
  const sv = { MODEL, state };
  MODEL = OUTF.md; state = OUTF.st;
  const mct = mctText().split("\r\n");
  const idx = n => mct.findIndex(l => l.trim() === "*" + n);
  const iU = idx("UNIT"), iN = idx("NODE"), iE = idx("ELEMENT"), iG = idx("GROUP");
  yes("P1","區塊順序 UNIT → NODE → ELEMENT → GROUP",
    iU > 0 && iU < iN && iN < iE && iE < iG, `${iU},${iN},${iE},${iG}`, "遞增");
  const body = (a,b) => mct.slice(a+1, b < 0 ? mct.length : b).filter(l => l.trim() && !l.trim().startsWith(";"));
  chk("P1","*NODE 列數 = 節點總數", body(iN,iE).length, OUTF.md.tot.n, 0, "");
  chk("P1","*ELEMENT 列數 = 元素總數", body(iE,iG).length, OUTF.md.tot.e, 0, "");
  chk("P1","*GROUP 列數 = 群組數", body(iG,-1).length, OUTF.md.names.length, 0, "");
  yes("P2","BEAM 元素列", elemLine({num:7,type:"BEAM",mat:1,sect:2,i:10,j:11}) === "7, BEAM, 1, 2, 10, 11, 0, 0",
    elemLine({num:7,type:"BEAM",mat:1,sect:2,i:10,j:11}), "7, BEAM, 1, 2, 10, 11, 0, 0");
  yes("P2","CABLE 元素列(可調類型/iSUB/EXVAL)",
    elemLine({num:8,type:"CABLE",mat:3,sect:4,i:20,j:21}) === "8, TENSTR, 3, 4, 20, 21, 0, 2, 0",
    elemLine({num:8,type:"CABLE",mat:3,sect:4,i:20,j:21}), "8, TENSTR, 3, 4, 20, 21, 0, 2, 0");
  const uL = state.units.length;
  state.units.length = "M";  const rM  = body(iN,iE)[0];
  state.units.length = "MM";
  const mct2 = mctText().split("\r\n");
  const rMM = mct2.slice(mct2.findIndex(l => l.trim()==="*NODE")+1).find(l => l.trim() && !l.trim().startsWith(";"));
  const uLine = mct2.slice(mct2.findIndex(l => l.trim()==="*UNIT")+1).find(l => l.trim() && !l.trim().startsWith(";"));
  state.units.length = uL;
  yes("P3","換單位不動座標(輸入即輸出)", rMM.trim() === rM.trim(), rMM.trim(), rM.trim());
  yes("P3","*UNIT 寫的是選定的單位", /(^|,)\s*MM\s*(,|$)/.test(uLine), uLine.trim(), "含 MM");
  const back = extractParams(mctText());
  yes("P4",".mct 檔頭參數可完整取回", !!back && back.state.groups.length === 3,
    back ? back.state.groups.length : "null", 3);
  yes("P4","無參數區塊 → null", extractParams("*NODE\n1,0,0,0") === null, "null", "null");
  chk("P5","節點 CSV 列數", nodeCSV().split("\r\n").length - 1, OUTF.md.tot.n, 0, "");
  chk("P5","元素 CSV 列數", elemCSV().split("\r\n").length - 1, OUTF.md.tot.e, 0, "");
  yes("P5","CSV 逗號與引號跳脫", toCSV([["a,b",'c"d',1]]).replace("﻿","") === '"a,b","c""d",1',
    toCSV([["a,b",'c"d',1]]).replace("﻿",""), '"a,b","c""d",1');
  yes("P6","群組清單連號壓縮", compressList([3,1,2,5,9,7,8,5]) === "1to3 5 7to9",
    compressList([3,1,2,5,9,7,8,5]), "1to3 5 7to9");
  MODEL = sv.MODEL; state = sv.state;

  renderTests(rows);
  return rows;
}
function renderTests(rows){
  const nOk = rows.filter(r => r.ok).length, all = nOk === rows.length;
  const fmtV = v => typeof v === "number" ? (Math.abs(v) >= 1e6 ? v.toExponential(6) : v.toFixed(6)) : String(v);
  $("#tests").innerHTML =
    `<div style="font-size:12px;margin:6px 0"><span class="${all?"pass":"fail"}">${all?"✓ 全部通過":"✕ 有失敗項目"}</span>
       <span style="color:var(--ink-3)"> — ${nOk}/${rows.length}</span></div>
     <table class="tt"><thead><tr><th style="width:26px"></th><th style="width:32px">組</th><th>項目</th>
       <th style="width:96px">實際</th><th style="width:96px">預期</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✕"}</td>
      <td style="color:var(--ink-3)">${r.id}</td><td style="font-family:'Noto Sans TC',sans-serif">${esc(r.desc)}</td>
      <td>${esc(r.str ? r.actual : fmtV(r.actual))}</td><td>${esc(r.str ? r.expect : fmtV(r.expect))}</td></tr>`).join("") +
    `</tbody></table>`;
}

/* ==========================================================================
   啟動
   ========================================================================== */
normState(state);
recompute(true);
runTests();

</script>
</body>
</html>
