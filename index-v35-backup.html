<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空間線型產生器 — midas Civil</title>
<style>
  :root{
    --paper:#f7f6f2; --ink:#1e2430; --ink-2:#5a6472; --ink-3:#8b95a3;
    --line:#d6d2c8; --line-2:#e6e3db; --panel:#fff;
    --accent:#1c5d99; --accent-soft:#e8f0f8;
    --ok:#1a7f4b; --warn:#a8710d; --err:#b3261e;
    --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; font-size:13px; line-height:1.55}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}

  header{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap;
    padding:9px 16px; border-bottom:1px solid var(--line); background:var(--panel)}
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.02em}
  header .stage{font-size:11px; padding:2px 8px; border-radius:10px;
    background:var(--accent-soft); color:var(--accent); font-weight:600}
  header .note{font-size:11px; color:var(--ink-3)}
  header .sp{flex:1}
  header button{font:inherit; font-size:11.5px; padding:4px 10px; border-radius:4px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer}
  header button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  header button:disabled{opacity:.4; cursor:default}
  header .units{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-3);
    padding:2px 8px 2px 9px; border:1px solid var(--line); border-radius:5px; background:#fbfaf7}
  header .units select{font:inherit; font-size:11.5px; font-weight:650; width:auto; padding:1px 4px;
    border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--accent); cursor:pointer}

  #app{display:grid; grid-template-columns:238px minmax(0,1fr) 7px var(--rw,330px); height:calc(100% - 41px)}
  #tree, #pane, #resizer, #right{grid-row:1}     /* 釘在同一列,否則對調後會被擠到下一列 */
  #tree{grid-column:1} #pane{grid-column:2} #resizer{grid-column:3} #right{grid-column:4}
  #app.swap #right{grid-column:2; border-left:0} #app.swap #pane{grid-column:4}
  #resizer{position:relative; background:#f2f0ea; border-left:1px solid var(--line);
    border-right:1px solid var(--line); cursor:col-resize; user-select:none}
  #resizer:hover, #resizer.on{background:var(--accent-soft)}
  #resizer::after{content:"EE"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:var(--ink-3); font-size:12px; line-height:1}
  @media(max-width:1180px){ #app{grid-template-columns:210px minmax(0,1fr)}
    #resizer{display:none}
    #tree{grid-column:1; grid-row:1}
    #pane, #app.swap #pane{grid-column:2; grid-row:1}
    #right, #app.swap #right{grid-column:1/-1; grid-row:2; border-left:0; border-top:1px solid var(--line)} }
  @media(max-width:740px){ #app{grid-template-columns:minmax(0,1fr); height:auto}
    #tree{grid-column:1; grid-row:1}
    #pane, #app.swap #pane{grid-column:1; grid-row:2}
    #right, #app.swap #right{grid-column:1; grid-row:3}
    #tree{border-right:0; border-bottom:1px solid var(--line); max-height:230px} }

  /* ---- 樹 ---- */
  #tree{background:#fafaf7; border-right:1px solid var(--line); padding:6px 0; overflow:auto; font-size:12px}
  #tree .grp{font-size:10px; letter-spacing:.08em; color:var(--ink-3); font-weight:700;
    padding:10px 12px 4px; text-transform:uppercase}
  #tree .it{display:flex; align-items:center; gap:7px; padding:5px 10px 5px 14px; cursor:pointer; color:var(--ink-2)}
  #tree .it:hover{background:#f0eee8}
  #tree .it.on{background:var(--accent-soft); color:var(--accent); font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
  #tree .it.err{color:var(--err)}
  #tree .it .sw{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
  #tree .it .sw.off{background:#dcd8cf !important}
  #tree .it .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #tree .it .ty{font-size:9.5px; color:var(--ink-3); font-family:var(--mono); flex:0 0 auto}
  #tree .it.on .ty{color:var(--accent)}
  #tree .it .meta{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex:0 0 auto}
  #tree .it.on .meta{color:var(--accent)}
  #tree .addwrap{padding:7px 10px 7px 14px; position:relative}
  #tree .addbtn{font:inherit; font-size:11.5px; color:var(--accent); background:none; border:0;
    cursor:pointer; padding:0; font-weight:600}
  #tree .menu{position:absolute; left:12px; top:28px; z-index:30; background:#fff; border:1px solid var(--line);
    border-radius:6px; box-shadow:0 6px 22px rgba(30,36,48,.18); padding:5px; min-width:172px}
  #tree .menu[hidden]{display:none}
  #tree .menu .mh{font-size:9.5px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; padding:5px 8px 3px}
  #tree .menu button{display:flex; width:100%; align-items:center; gap:7px; font:inherit; font-size:12px;
    padding:5px 8px; border:0; background:none; border-radius:4px; cursor:pointer; color:var(--ink-2); text-align:left}
  #tree .menu button:hover{background:var(--accent-soft); color:var(--accent)}
  #tree .menu button .sw{width:8px; height:8px; border-radius:2px}

  /* ---- 面板 ---- */
  #pane{padding:13px 15px 40px; overflow:auto; min-width:0}
  .ptitle{display:flex; align-items:center; gap:8px; margin-bottom:11px; flex-wrap:wrap}
  .ptitle .nm{font-size:15px; font-weight:650}
  .fam{font-size:9.5px; padding:1px 7px; border-radius:9px; font-weight:600}
  .fam.geo{background:var(--accent-soft); color:var(--accent)}
  .fam.con{background:#f0eaf6; color:#6f4a9b}
  .ptitle .sp{flex:1}
  .sec{border:1px solid var(--line); border-radius:6px; margin-bottom:9px; background:var(--panel)}
  .sec > .h{padding:6px 12px; background:#fafaf7; border-bottom:1px solid var(--line-2);
    font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:700;
    display:flex; align-items:center; gap:8px}
  .sec > .h .tail{margin-left:auto; font-family:var(--mono); font-size:10.5px; letter-spacing:0; text-transform:none}
  .sec > .b{padding:10px 12px}
  .fields{display:grid; gap:8px 10px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  label.f{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--ink-2); min-width:0}
  label.f > span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  input[type=text], input[type=number], select, textarea{
    font:inherit; font-family:var(--mono); font-size:12.5px; padding:4px 6px;
    border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); width:100%; min-width:0}
  select{font-family:inherit}
  textarea{resize:vertical}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  input.bad{border-color:var(--err); background:#fdf3f2}
  .chk{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); cursor:pointer}
  .out{font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
    display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:3px 14px}
  .out b{color:var(--ink); font-weight:650}
  .out .k{color:var(--ink-3); font-family:"Noto Sans TC",sans-serif}
  .hint{font-size:11px; color:var(--ink-3); margin-top:7px}
  .hint b{color:var(--ink-2)}

  .btn{font:inherit; font-size:12px; padding:5px 11px; border-radius:4px; border:1px solid var(--line);
    background:#fff; color:var(--ink); cursor:pointer}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.p{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.p:hover{background:#17517f; color:#fff}
  .btn.d:hover{border-color:var(--err); color:var(--err)}
  .btns{display:flex; gap:6px; flex-wrap:wrap}
  /* 切換鈕:按下顯示主題色,未按下維持系統色 */
  .tgl{font:inherit; font-size:13px; font-weight:650; padding:8px 16px; border-radius:6px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; line-height:1.2}
  .tgl:hover{border-color:var(--accent); color:var(--accent)}
  .tgl .dot{width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; flex:0 0 auto}
  .tgl.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .tgl.on:hover{background:#17517f; color:#fff}
  .tgl.on .dot{background:#fff; border-color:#fff}
  /* 目前選取的節點/元素:整個區塊高亮,才看得出要在哪裡編輯 */
  .sec.hot{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .sec.hot > .h{background:var(--accent-soft); color:var(--accent)}

  table.t{width:100%; border-collapse:collapse; font-size:11.5px}
  table.t th{text-align:left; font-size:10px; color:var(--ink-3); font-weight:600;
    padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
  table.t td{padding:3px 6px; border-bottom:1px solid var(--line-2); font-family:var(--mono); vertical-align:middle}
  table.t td.n{font-family:inherit}
  table.t tr:last-child td{border-bottom:none}
  table.t td.hot{color:var(--warn); font-weight:600}
  table.t select, table.t input{padding:2px 4px; font-size:11.5px}
  .iconbtn{border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer;
    width:21px; height:21px; padding:0; color:var(--ink-2); font-size:11px; line-height:1}
  .iconbtn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
  .iconbtn.danger:hover{background:#fdf0ef; color:var(--err); border-color:var(--err)}

  /* ---- 右欄 ---- */
  #right{background:#fbfaf7; border-left:1px solid var(--line); display:flex; flex-direction:column;
    overflow:auto; padding:11px 12px 20px; gap:9px}
  .lbl{font-size:10.5px; letter-spacing:.09em; color:var(--ink-3); font-weight:700}
  .cvwrap{position:relative}
  canvas{width:100%; display:block; background:#fff; border:1px solid var(--line); border-radius:6px; cursor:crosshair}
  #cv{height:clamp(220px,34vh,560px)} #pv{height:clamp(160px,26vh,460px)}
  .cvtools{position:absolute; top:6px; right:6px; display:flex; gap:4px; flex-wrap:wrap;
    justify-content:flex-end; max-width:calc(100% - 12px)}
  .cvtools button, .cvtools .tag, .cvtools select, .cvtools input{font:inherit; font-size:10.5px;
    padding:2px 6px; border-radius:4px; width:auto;
    border:1px solid var(--line); background:rgba(255,255,255,.93); color:var(--ink-2); cursor:pointer}
  .cvtools button:hover{border-color:var(--accent); color:var(--accent)}
  .cvtools input{width:58px; font-family:var(--mono); text-align:right; cursor:text}
  .cvtools .tag{font-family:var(--mono); cursor:default; color:var(--ink-3)}
  .readout{position:absolute; left:6px; bottom:6px; background:rgba(255,255,255,.94);
    border:1px solid var(--line); border-radius:4px; padding:3px 7px; font-family:var(--mono);
    font-size:10.5px; color:var(--ink-2); pointer-events:none; white-space:pre}
  .kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:4px 12px;
    font-family:var(--mono); font-size:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px}
  .kpi .k{font-family:"Noto Sans TC",sans-serif; font-size:9.5px; color:var(--ink-3); display:block}
  .kpi b{font-size:12.5px; font-weight:650}
  .kpi b.hot{color:var(--warn)}
  .msg{display:flex; gap:6px; padding:5px 9px; border-radius:4px; margin-bottom:4px; font-size:11.5px; align-items:flex-start}
  .msg.err{background:#fdf0ef; color:var(--err); border:1px solid #f2d3d0}
  .msg.warn{background:#fdf7e8; color:var(--warn); border:1px solid #f0e2bd}
  #msgs:empty{display:none}
  .legend{display:flex; gap:9px; flex-wrap:wrap; font-size:10.5px; color:var(--ink-2)}
  .legend i{display:inline-block; width:11px; height:3px; border-radius:2px; margin-right:4px; vertical-align:middle}

  details.adv{border-top:1px dashed var(--line-2); margin-top:9px; padding-top:7px}
  details.adv > summary{cursor:pointer; font-size:11px; color:var(--ink-3); font-weight:600; list-style:none}
  details.adv > summary::-webkit-details-marker{display:none}
  details.adv > summary::before{content:"▸ "; font-size:9px}
  details.adv[open] > summary::before{content:"▾ "}
  details.adv > div{margin-top:8px}

  details.pc{border:1px solid var(--line); border-radius:6px; margin-bottom:7px; background:#fdfdfb; overflow:hidden}
  details.pc > summary{list-style:none; cursor:pointer; padding:6px 9px; display:flex; align-items:center; gap:7px;
    background:#fafaf7; font-size:12px}
  details.pc > summary::-webkit-details-marker{display:none}
  details.pc > summary::before{content:"▸"; color:var(--ink-3); font-size:9px}
  details.pc[open] > summary::before{content:"▾"}
  details.pc[open] > summary{border-bottom:1px solid var(--line-2); background:#fff}
  details.pc .idx{width:18px; height:18px; border-radius:3px; background:var(--accent); color:#fff;
    font-family:var(--mono); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  details.pc > summary select{width:auto; padding:2px 5px; font-size:11.5px}
  details.pc .st{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
  details.pc .pcb{padding:10px 11px}
  details.pc .grip{cursor:grab; color:var(--ink-3); font-size:13px; line-height:1; padding:0 3px; user-select:none}
  details.pc .grip:hover{color:var(--accent)}
  details.pc.drag{opacity:.4}
  details.pc.over{box-shadow:0 -2px 0 var(--accent)}
  #tree .it.drag{opacity:.4}
  #tree .it.over{box-shadow:inset 0 2px 0 var(--accent)}
  .zbox{display:flex; align-items:center; gap:4px}
  .zbox input{width:52px; font-family:var(--mono); font-size:10.5px; padding:1px 4px;
    border:1px solid var(--line); border-radius:3px; text-align:right}
  .nodepick{position:absolute; pointer-events:none}

  #tests table.tt{width:100%; border-collapse:collapse; font-size:11px; font-family:var(--mono)}
  #tests th{text-align:left; font-family:"Noto Sans TC",sans-serif; font-size:10px; color:var(--ink-3);
    font-weight:600; padding:3px 6px; border-bottom:1px solid var(--line)}
  #tests td{padding:2px 6px; border-bottom:1px solid var(--line-2)}
  .pass{color:var(--ok); font-weight:700} .fail{color:var(--err); font-weight:700}
</style>
</head>
<body>

<header>
  <h1>空間線型產生器</h1>
  <span class="stage">組式架構 v3.5</span>
  <span class="note">X=東 · Y=北 · Z=高程</span>
  <span class="units">單位
    <select id="u-len" title="長度單位:輸入什麼單位就算什麼單位,匯出的 .mct 也是同一個單位"></select>
    <select id="u-force" title="力的單位(寫進 .mct 的 *UNIT)"></select>
  </span>
  <span class="sp"></span>
  <button id="btn-undo" disabled>↶ 復原</button>
  <button id="btn-redo" disabled>↷ 重做</button>
  <button id="btn-swap" title="輸入區與預覽區左右對調">⇄ 版面</button>
  <button id="btn-demo">載入範例</button>
  <button id="btn-clear">全部清空</button>
</header>

<div id="app">
  <div id="tree"></div>
  <div id="pane"></div>
  <div id="resizer" title="拖曳調整預覽區寬度(雙擊還原)"></div>
  <div id="right">
    <div id="msgs"></div>
    <div class="kpi" id="kpi"></div>
    <div class="lbl">俯視 <span style="font-weight:400;color:var(--ink-3);letter-spacing:0">— 拖曳平移 · 滾輪縮放 · 點節點或元素可編輯</span></div>
    <div class="cvwrap">
      <canvas id="cv"></canvas>
      <div class="cvtools">
        <button id="btn-fit">重新框選</button>
        <button id="btn-nodes">節點:開</button>
      </div>
      <div class="readout" id="ro"></div>
    </div>
    <div class="lbl">立面 <span style="font-weight:400;color:var(--ink-3);letter-spacing:0">— 拖曳平移 · 滾輪縮放 · Shift+拖曳轉視角 · Shift+滾輪只縮 Z</span></div>
    <div class="cvwrap">
      <canvas id="pv"></canvas>
      <div class="cvtools">
        <select id="pmode" title="立面圖橫軸方向">
          <option value="auto">自動</option><option value="x">沿 +X</option>
          <option value="y">沿 +Y</option><option value="az">自訂</option></select>
        <button id="paz-l" title="視角左轉 15°">↺</button>
        <input type="number" step="any" id="paz" title="橫軸方位角(°)">
        <button id="paz-r" title="視角右轉 15°">↻</button>
        <span class="tag zbox">Z ×<input type="number" step="any" id="zsc"><button id="zauto" style="border:0;background:none;color:var(--accent);cursor:pointer;padding:0 2px">自動</button></span>
        <button id="pv-fit">重新框選</button>
      </div>
      <div class="readout" id="pro"></div>
    </div>
    <div class="legend" id="legend"></div>
    <details id="tests-wrap"><summary class="lbl" style="cursor:pointer">驗收測試</summary><div id="tests"></div></details>
  </div>
</div>

<script>
"use strict";
/* ==========================================================================
   空間線型產生器 v3 — 組式架構
   一組 = 一串節點 + 連接它們的元素。組與組預設互不相干,起終點在全域座標直接給。
   ========================================================================== */

/* ==========================================================================
   1. 基礎工具
   ========================================================================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const norm360 = a => { a %= 360; return a < 0 ? a + 360 : a; };
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const num = v => Number.isFinite(+v) ? +v : NaN;
const clone = o => JSON.parse(JSON.stringify(o));

function fmtSta(s){
  // k+ 是「公里 + 公尺」的路線慣例,單位不是公尺時退回純數字才不會誤導
  if (typeof state !== "undefined" && state && state.units && state.units.length !== "M")
    return (+s).toFixed(3);
  const neg = s < 0, v = Math.abs(s);
  const km = Math.floor(v / 1000), m = v - km * 1000;
  return (neg ? "-" : "") + km + "k+" + m.toFixed(3).padStart(7, "0");
}
function parseSta(txt){
  if (txt == null) return NaN;
  const t = String(txt).trim().toLowerCase().replace(/\s+/g, "");
  if (t === "") return NaN;
  const m = t.match(/^(-?)(\d+)k\+(\d+(?:\.\d+)?)$/);
  if (m) return (m[1] ? -1 : 1) * (parseInt(m[2], 10) * 1000 + parseFloat(m[3]));
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}

const V = {
  sub:(a,b) => ({ x:a.x-b.x, y:a.y-b.y, z:a.z-b.z }),
  add:(a,b) => ({ x:a.x+b.x, y:a.y+b.y, z:a.z+b.z }),
  mul:(a,k) => ({ x:a.x*k, y:a.y*k, z:a.z*k }),
  dot:(a,b) => a.x*b.x + a.y*b.y + a.z*b.z,
  cross:(a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x }),
  len:a => Math.hypot(a.x, a.y, a.z),
  unit:a => { const L = V.len(a) || 1; return { x:a.x/L, y:a.y/L, z:a.z/L }; }
};
const dist3 = (a,b) => Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z);
const distXY = (a,b) => Math.hypot(b.x-a.x, b.y-a.y);
// 方位角:自 +Y(北)順時針
const azOf = (dx,dy) => norm360(Math.atan2(dx, dy) * R2D);

/* ==========================================================================
   2. 縱斷面(VPI + 對稱拋物線豎曲線)— 線形鏈專用
   ========================================================================== */
function buildProfile(rows, warns, errs, tag){
  const P = (rows || []).map(r => ({ sta:num(r.sta), z:num(r.z), L:Math.max(0, num(r.L) || 0) }))
    .filter(r => Number.isFinite(r.sta) && Number.isFinite(r.z))
    .sort((a,b) => a.sta - b.sta);
  if (P.length < 2) return null;                       // 無縱斷面 → 用起點高程
  P[0].L = 0; P[P.length-1].L = 0;

  const g = [];
  for (let i = 0; i < P.length - 1; i++){
    const dS = P[i+1].sta - P[i].sta;
    if (dS <= 1e-9){ errs.push(`${tag}縱斷面:VPI ${i+1} 與 ${i+2} 樁號重複`); return null; }
    g.push((P[i+1].z - P[i].z) / dS);
  }
  const curves = [];
  for (let i = 1; i < P.length - 1; i++){
    const gin = g[i-1], gout = g[i], L = P[i].L, dg = gout - gin;
    if (L <= 1e-9){
      if (Math.abs(dg) > 1e-9)
        warns.push(`${tag}VPI ${i+1}(${fmtSta(P[i].sta)})豎曲線長 = 0,坡度直接折角`);
      continue;
    }
    curves.push({ i, sta:P[i].sta, z:P[i].z, L, gin, gout,
      BVC:P[i].sta - L/2, EVC:P[i].sta + L/2, E:dg*L/8,
      K:Math.abs(dg) > 1e-12 ? L / Math.abs(dg*100) : Infinity });
  }
  for (let j = 0; j < curves.length; j++){
    const c = curves[j];
    if (c.BVC < P[0].sta - 1e-9 || c.EVC > P[P.length-1].sta + 1e-9)
      errs.push(`${tag}VPI ${c.i+1} 的豎曲線 ${fmtSta(c.BVC)}–${fmtSta(c.EVC)} 超出縱斷面範圍`);
    if (j > 0 && curves[j-1].EVC > c.BVC + 1e-9)
      errs.push(`${tag}VPI ${curves[j-1].i+1} 與 ${c.i+1} 的豎曲線重疊`);
  }
  return { P, g, curves };
}
function zAt(pr, s){
  if (!pr) return 0;
  const { P, g, curves } = pr, n = P.length;
  if (s <= P[0].sta)   return P[0].z + g[0] * (s - P[0].sta);
  if (s >= P[n-1].sta) return P[n-1].z + g[n-2] * (s - P[n-1].sta);
  for (const c of curves)
    if (s >= c.BVC - 1e-9 && s <= c.EVC + 1e-9){
      const x = s - c.BVC;
      return c.z - c.gin*(c.L/2) + c.gin*x + (c.gout - c.gin)*x*x/(2*c.L);
    }
  for (let i = 0; i < n - 1; i++)
    if (s >= P[i].sta - 1e-9 && s <= P[i+1].sta + 1e-9) return P[i].z + g[i]*(s - P[i].sta);
  return P[n-1].z;
}
function gradeAt(pr, s){
  if (!pr) return 0;
  const { P, g, curves } = pr, n = P.length;
  if (s <= P[0].sta)   return g[0];
  if (s >= P[n-1].sta) return g[n-2];
  for (const c of curves)
    if (s >= c.BVC - 1e-9 && s <= c.EVC + 1e-9)
      return c.gin + (c.gout - c.gin)*(s - c.BVC)/c.L;
  for (let i = 0; i < n - 1; i++)
    if (s >= P[i].sta - 1e-9 && s <= P[i+1].sta + 1e-9) return g[i];
  return 0;
}

/* ==========================================================================
   3. 線形鏈:直線 / 圓弧 / 緩和曲線 段落(平面里程 = 樁號)
   ========================================================================== */
function buildSegment(seg, st, i, errs){
  const bad = t => { errs.push(`段 ${i+1}:${t}`); return null; };
  const az0R = st.az * D2R;
  const fin = (length, evalLocal, extra) => {
    const e = evalLocal(length);
    return { i, type:seg.type, src:seg, s0:st.s, s1:st.s + length, length,
      start:{ x:st.x, y:st.y, az:st.az }, end:{ x:e.x, y:e.y, az:e.az }, evalLocal, extra };
  };

  if (seg.type === "LINE"){
    const L = num(seg.L);
    if (!(L > 0)) return bad("直線長度必須 > 0");
    return fin(L, t => ({ x:st.x + t*Math.sin(az0R), y:st.y + t*Math.cos(az0R), az:st.az, k:0 }), { R:Infinity });
  }

  if (seg.type === "ARC"){
    const R = num(seg.R), dir = num(seg.dir);
    if (!(R > 0)) return bad("圓弧半徑必須 > 0");
    let L;
    if (seg.defBy === "delta"){
      const d = num(seg.delta);
      if (!(d > 0)) return bad("圓弧偏角必須 > 0");
      if (d >= 360) return bad("圓弧偏角必須 < 360°");
      L = R * d * D2R;
    } else {
      L = num(seg.L);
      if (!(L > 0)) return bad("圓弧弧長必須 > 0");
      if (L / R >= 2*Math.PI) return bad("圓弧弧長超過一整圈");
    }
    const Cx = st.x + R*Math.sin((st.az + dir*90)*D2R);
    const Cy = st.y + R*Math.cos((st.az + dir*90)*D2R);
    const b0 = (st.az - dir*90)*D2R;
    return fin(L, t => {
      const b = b0 + dir*(t/R);
      return { x:Cx + R*Math.sin(b), y:Cy + R*Math.cos(b),
               az:norm360(st.az + dir*(t/R)*R2D), k:dir/R };
    }, { R, dir, center:{ x:Cx, y:Cy }, delta:L/R*R2D });
  }

  if (seg.type === "SPIRAL"){
    const dir = num(seg.dir);
    const R0 = seg.R0inf ? null : num(seg.R0);
    const R1 = seg.R1inf ? null : num(seg.R1);
    if (R0 === null && R1 === null) return bad("緩和曲線 R0、R1 不可同時為 ∞");
    if (R0 !== null && !(R0 > 0)) return bad("緩和曲線起始半徑必須 > 0");
    if (R1 !== null && !(R1 > 0)) return bad("緩和曲線終止半徑必須 > 0");
    let Ls;
    if (seg.defBy === "A"){
      const A = num(seg.A);
      if (!(A > 0)) return bad("緩和曲線 A 值必須 > 0");
      if (R0 !== null && R1 !== null) return bad("R0、R1 皆有限時 A 值無定義,請改用 Ls");
      Ls = A*A / (R0 === null ? R1 : R0);
    } else {
      Ls = num(seg.Ls);
      if (!(Ls > 0)) return bad("緩和曲線長度必須 > 0");
    }
    const k0 = R0 === null ? 0 : 1/R0, k1 = R1 === null ? 0 : 1/R1;
    const azAt = t => az0R + dir*(k0*t + (k1-k0)*t*t/(2*Ls));
    const n = 4000, hh = Ls/n;                      // 固定分割數 → 與長度單位無關
    const cx = new Float64Array(n+1), cy = new Float64Array(n+1);
    cx[0] = st.x; cy[0] = st.y;
    for (let j = 0; j < n; j++){
      const a = j*hh, m = a + hh/2, b = a + hh;
      cx[j+1] = cx[j] + (hh/6)*(Math.sin(azAt(a)) + 4*Math.sin(azAt(m)) + Math.sin(azAt(b)));
      cy[j+1] = cy[j] + (hh/6)*(Math.cos(azAt(a)) + 4*Math.cos(azAt(m)) + Math.cos(azAt(b)));
    }
    return fin(Ls, t => {
      if (t <= 0)  return { x:cx[0], y:cy[0], az:st.az, k:dir*k0 };
      if (t >= Ls) return { x:cx[n], y:cy[n], az:norm360(azAt(Ls)*R2D), k:dir*k1 };
      const j = Math.min(n-1, Math.floor(t/hh)), a = j*hh, r = t - a;
      return {
        x: cx[j] + (r/6)*(Math.sin(azAt(a)) + 4*Math.sin(azAt(a+r/2)) + Math.sin(azAt(a+r))),
        y: cy[j] + (r/6)*(Math.cos(azAt(a)) + 4*Math.cos(azAt(a+r/2)) + Math.cos(azAt(a+r))),
        az: norm360(azAt(t)*R2D), k: dir*(k0 + (k1-k0)*t/Ls)
      };
    }, { R0, R1, dir, Ls, A:(R0 === null || R1 === null) ? Math.sqrt(Ls*(R0 === null ? R1 : R0)) : null });
  }
  return bad("未知段落型別 " + seg.type);
}

// 建立整條線形鏈:回傳 { segs, total, prof, errs, warns }
function buildChain(g, errs, warns){
  const tag = `「${g.name}」`;
  let cur = { x:num(g.x), y:num(g.y), az:norm360(num(g.az)), s:num(g.sta) };
  if (![cur.x, cur.y, cur.az, cur.s].every(Number.isFinite)){
    errs.push(tag + "起始設定含無效數值"); return null;
  }
  const segs = [];
  (g.segments || []).forEach((seg, i) => {
    const b = buildSegment(seg, cur, i, errs.map ? { push:t => errs.push(tag + t) } : errs);
    if (!b) return;
    segs.push(b);
    cur = { x:b.end.x, y:b.end.y, az:b.end.az, s:b.s1 };
  });
  const total = segs.reduce((a,b) => a + b.length, 0);
  const prof = buildProfile(g.profile, warns, errs, tag);
  const z0 = num(g.z) || 0;
  if (prof && segs.length){
    const s0 = segs[0].s0, s1 = segs[segs.length-1].s1;
    if (s0 < prof.P[0].sta - 1e-3 || s1 > prof.P[prof.P.length-1].sta + 1e-3)
      warns.push(tag + `縱斷面範圍未涵蓋線形,超出部分以端點坡度外插`);
  }
  return { segs, total, prof, z0,
    zAtS: s => prof ? zAt(prof, s) : z0,
    gradeAtS: s => prof ? gradeAt(prof, s) : 0 };
}

/* ==========================================================================
   4. 簡單曲線:直線 / 圓弧 / 懸垂 / 螺旋
   共同介面 { ok, pt(u) → {x,y,z}, meta, err }
   u ∈ [0,1] 為型別自然參數;弧長由取樣表求得
   ========================================================================== */
const SAMPLES_N = 400;

function makeCurve(pt, meta){
  // 取樣建立累積 3D 弧長表
  const us = new Float64Array(SAMPLES_N + 1), cum = new Float64Array(SAMPLES_N + 1);
  let prev = pt(0);
  us[0] = 0; cum[0] = 0;
  for (let i = 1; i <= SAMPLES_N; i++){
    const u = i / SAMPLES_N, p = pt(u);
    cum[i] = cum[i-1] + dist3(prev, p);
    us[i] = u; prev = p;
  }
  const len = cum[SAMPLES_N];
  // 由弧長反求 u
  const uAtS = s => {
    if (s <= 0) return 0;
    if (s >= len) return 1;
    let lo = 0, hi = SAMPLES_N;
    while (hi - lo > 1){ const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const d = cum[hi] - cum[lo];
    return us[lo] + (d > 1e-12 ? (s - cum[lo]) / d : 0) / SAMPLES_N;
  };
  return { ok:true, pt, len, uAtS, meta:meta || {} };
}
const curveErr = m => ({ ok:false, err:m });

/* ---- 直線 ---- */
function curveLINE(g){
  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z].every(Number.isFinite)) return curveErr("端點座標無效");
  const L = dist3(p1, p2);
  if (L < 1e-9) return curveErr("起點與終點重合");
  return makeCurve(u => ({ x:p1.x + (p2.x-p1.x)*u, y:p1.y + (p2.y-p1.y)*u, z:p1.z + (p2.z-p1.z)*u }),
    { p1, p2, chord:L });
}

/* ---- 圓弧 ----
   端點模式:起點→終點 + 半徑 + 偏向(左/右) + 優弧/劣弧 + 平面(水平/鉛直)
     圓心側 = 偏向 XOR 優弧   (右轉劣弧 → 圓心在右;右轉優弧 → 圓心在左)
   圓心模式:起點 + 圓心(水平) + 轉角 + 偏向 + 終點高程                       */
function curveARC(g){
  const dir = num(g.dir) >= 0 ? 1 : -1;              // +1 右轉,-1 左轉
  if (g.arcMode === "center"){
    const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
    const cx = num(g.cx), cy = num(g.cy), delta = num(g.delta), z2 = num(g.z2);
    if (![p1.x,p1.y,p1.z,cx,cy,delta,z2].every(Number.isFinite)) return curveErr("參數無效");
    const R = Math.hypot(p1.x-cx, p1.y-cy);
    if (R < 1e-9) return curveErr("起點與圓心重合");
    if (!(delta > 0)) return curveErr("轉角必須 > 0");
    const a1 = Math.atan2(p1.y-cy, p1.x-cx);
    const sweep = -dir * delta * D2R;                 // 右轉 = 順時針 = 數學角減少
    return makeCurve(u => {
      const a = a1 + sweep*u;
      return { x:cx + R*Math.cos(a), y:cy + R*Math.sin(a), z:p1.z + (z2-p1.z)*u };
    }, { R, dir, center:{ x:cx, y:cy }, delta, arcLen:R*Math.abs(sweep), plane:"H" });
  }

  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  const R  = num(g.R), major = !!g.major;
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z,R].every(Number.isFinite)) return curveErr("參數無效");
  if (!(R > 0)) return curveErr("半徑必須 > 0");

  if (g.plane === "V"){
    // 鉛直平面:以 (沿平面弦方向 t, z) 為 2D 座標
    const dxy = distXY(p1, p2);
    if (dxy < 1e-9) return curveErr("鉛直平面圓弧的兩端點平面位置重合");
    const ux = (p2.x-p1.x)/dxy, uy = (p2.y-p1.y)/dxy;
    const q1 = { x:0, y:p1.z }, q2 = { x:dxy, y:p2.z };
    const a = arc2D(q1, q2, R, dir, major);
    if (!a.ok) return curveErr(a.err);
    return makeCurve(u => { const q = a.at(u);
      return { x:p1.x + ux*q.x, y:p1.y + uy*q.x, z:q.y }; },
      { R, dir, major, plane:"V", arcLen:a.arcLen, center:{ x:p1.x + ux*a.c.x, y:p1.y + uy*a.c.x, z:a.c.y } });
  }

  // 水平平面:平面投影為圓弧,高程沿弧線線性內插
  const a = arc2D({ x:p1.x, y:p1.y }, { x:p2.x, y:p2.y }, R, dir, major);
  if (!a.ok) return curveErr(a.err);
  return makeCurve(u => { const q = a.at(u);
    return { x:q.x, y:q.y, z:p1.z + (p2.z-p1.z)*u }; },
    { R, dir, major, plane:"H", arcLen:a.arcLen, center:{ x:a.c.x, y:a.c.y } });
}

// 2D 圓弧:q1 → q2,半徑 R,dir(+1 順時針 / −1 逆時針),major 取另一段
function arc2D(q1, q2, R, dir, major){
  const dx = q2.x-q1.x, dy = q2.y-q1.y, d = Math.hypot(dx, dy);
  if (d < 1e-9) return { ok:false, err:"起點與終點重合" };
  if (R < d/2 - 1e-9) return { ok:false, err:`半徑 ${R} 小於弦長一半 ${(d/2).toFixed(4)},無解` };
  const h = Math.sqrt(Math.max(0, R*R - (d/2)*(d/2)));
  const mx = (q1.x+q2.x)/2, my = (q1.y+q2.y)/2;
  const ux = dx/d, uy = dy/d;
  const nx = uy, ny = -ux;                            // 行進方向的右側
  const useRight = (dir > 0) !== major;
  const cx = mx + (useRight ? h : -h)*nx, cy = my + (useRight ? h : -h)*ny;
  const a1 = Math.atan2(q1.y-cy, q1.x-cx), a2 = Math.atan2(q2.y-cy, q2.x-cx);
  let sw = a2 - a1;
  if (dir > 0){ while (sw >= 0) sw -= 2*Math.PI; while (sw < -2*Math.PI) sw += 2*Math.PI; }
  else        { while (sw <= 0) sw += 2*Math.PI; while (sw >  2*Math.PI) sw -= 2*Math.PI; }
  return { ok:true, c:{ x:cx, y:cy }, sweep:sw, arcLen:R*Math.abs(sw),
    at:u => { const a = a1 + sw*u; return { x:cx + R*Math.cos(a), y:cy + R*Math.sin(a) }; } };
}

/* ---- 懸垂曲線:起點 → 終點 + 垂度(拋物線 / 懸鏈線)---- */
function solveCatenaryA(Lx, f){
  if (!(Lx > 0) || !(f > 0)) return null;
  const target = f/Lx, gfn = b => (Math.cosh(b) - 1)/(2*b) - target;
  let lo = 1e-8, hi = 40;
  if (gfn(hi) < 0) return null;
  for (let k = 0; k < 200; k++){ const m = (lo+hi)/2; if (gfn(m) < 0) lo = m; else hi = m; }
  return Lx / (2*((lo+hi)/2));
}
function curveSAG(g, warns){
  const p1 = { x:num(g.x1), y:num(g.y1), z:num(g.z1) };
  const p2 = { x:num(g.x2), y:num(g.y2), z:num(g.z2) };
  if (![p1.x,p1.y,p1.z,p2.x,p2.y,p2.z].every(Number.isFinite)) return curveErr("端點座標無效");
  const Lx = distXY(p1, p2);                          // 垂度以平面跨距為基準
  const chord = dist3(p1, p2);
  if (chord < 1e-9) return curveErr("起點與終點重合");
  const f = g.fMode === "ratio" ? (num(g.f) || 0) * Lx : (num(g.f) || 0);
  if (Lx < 1e-9 && Math.abs(f) > 1e-9)
    return curveErr("兩端點平面位置重合(鉛直索),無法定義垂度");
  let dip;
  if (g.curve === "catenary"){
    const a = solveCatenaryA(Lx, f);
    if (a) dip = u => { const x = u*Lx;
      return a*Math.cosh((x - Lx/2)/a) - a*Math.cosh(Lx/(2*a)); };
    else { if (warns && f > 0) warns.push(`「${g.name}」垂度超出懸鏈線可解範圍,已改用拋物線`);
           dip = u => -4*f*u*(1-u); }
  } else dip = u => -4*f*u*(1-u);
  return makeCurve(u => ({
    x: p1.x + (p2.x-p1.x)*u,
    y: p1.y + (p2.y-p1.y)*u,
    z: p1.z + (p2.z-p1.z)*u + dip(u)
  }), { p1, p2, f, Lx, chord, curve:g.curve });
}

/* ---- 螺旋線:圓心 + 半徑 + 起始方位角 + 圈數 + 螺距 ---- */
function curveHELIX(g){
  const cx = num(g.cx), cy = num(g.cy), z0 = num(g.z1);
  const R0 = num(g.R), turns = num(g.turns), pitch = num(g.pitch), az0 = num(g.az0);
  const dir = num(g.dir) >= 0 ? 1 : -1;               // +1 順時針(俯視)
  const R1 = (g.R2 === "" || g.R2 == null || !Number.isFinite(num(g.R2))) ? R0 : num(g.R2);
  if (![cx,cy,z0,R0,turns,pitch,az0].every(Number.isFinite)) return curveErr("參數無效");
  if (!(R0 > 0) || !(R1 > 0)) return curveErr("半徑必須 > 0");
  if (!(turns > 0)) return curveErr("圈數必須 > 0");
  return makeCurve(u => {
    const az = az0 + dir*u*turns*360, R = R0 + (R1-R0)*u;
    return { x:cx + R*Math.sin(az*D2R), y:cy + R*Math.cos(az*D2R), z:z0 + pitch*turns*u };
  }, { R0, R1, turns, pitch, dir, rise:pitch*turns, center:{ x:cx, y:cy } });
}


/* ==========================================================================
   5. 分割
   ========================================================================== */
const SPLIT_DEF = { mode:"count", count:20, spacing:5, tol:0.02, maxSpacing:20, rem:"even" };

// 弦線偏差:曲線在 [u0,u1] 之間離弦線最遠的垂距
function maxDevOn(cv, u0, u1){
  const A = cv.pt(u0), B = cv.pt(u1);
  const dx = B.x-A.x, dy = B.y-A.y, dz = B.z-A.z, L = Math.hypot(dx,dy,dz);
  if (L < 1e-12) return 0;
  const u = { x:dx/L, y:dy/L, z:dz/L };
  let mx = 0;
  for (let j = 1; j < 20; j++){
    const P = cv.pt(u0 + (u1-u0)*j/20);
    const w = { x:P.x-A.x, y:P.y-A.y, z:P.z-A.z };
    const t = V.dot(w, u);
    const d = Math.hypot(w.x - u.x*t, w.y - u.y*t, w.z - u.z*t);
    if (d > mx) mx = d;
  }
  return mx;
}

// 回傳 u 陣列(含 0 與 1)
function splitCurve(cv, sp, tag, warns){
  sp = sp || SPLIT_DEF;
  if (sp.mode === "count"){
    const N = Math.max(1, Math.round(num(sp.count)) || 1);
    const us = [];
    for (let i = 0; i <= N; i++) us.push(i/N);
    return us;
  }
  if (sp.mode === "spacing"){
    const d = num(sp.spacing);
    if (!(d > 0)){ warns.push(tag + "間距必須 > 0,已改為整段一個元素"); return [0,1]; }
    const n = Math.floor(cv.len/d + 1e-9);
    if (n < 1){ warns.push(tag + `長度 ${cv.len.toFixed(3)} ${UL()} 小於間距 ${d} ${UL()},僅產生 1 個元素`); return [0,1]; }
    const rem = cv.len - n*d;
    const us = [];
    for (let i = 0; i <= n; i++) us.push(cv.uAtS(d*i));
    return finishRem(us, cv, rem, d, sp.rem, tag, warns);
  }
  // 弦線偏差容差:逐步推進,二分找最大可用步長
  const tol = Math.max(cv.len*1e-9, num(sp.tol) || 0);   // 容差與座標同單位
  const dmax = (num(sp.maxSpacing) > 0) ? num(sp.maxSpacing) : cv.len;
  const us = [0];
  let s = 0, guard = 0, last = dmax;
  while (s < cv.len - 1e-9 && guard++ < 20000){
    let lo = 0, hi = Math.min(dmax, cv.len - s);
    if (maxDevOn(cv, cv.uAtS(s), cv.uAtS(s + hi)) <= tol){ lo = hi; }
    else {
      for (let k = 0; k < 24; k++){
        const m = (lo + hi)/2;
        if (maxDevOn(cv, cv.uAtS(s), cv.uAtS(s + m)) <= tol) lo = m; else hi = m;
      }
    }
    const step = Math.max(lo, cv.len/20000);
    last = step; s += step;
    if (s >= cv.len - 1e-9) break;
    us.push(cv.uAtS(s));
  }
  const rem = cv.len - cv_sOf(cv, us[us.length-1]);
  return finishRem(us, cv, rem, last, sp.rem, tag, warns);
}
const cv_sOf = (cv, u) => {                            // u → 弧長(以取樣表反查)
  let lo = 0, hi = 1;
  for (let k = 0; k < 40; k++){ const m = (lo+hi)/2; if (cv.uAtS(m*cv.len) < u) lo = m; else hi = m; }
  return ((lo+hi)/2)*cv.len;
};

function finishRem(us, cv, rem, nominal, policy, tag, warns){
  if (rem <= 1e-9){ us[us.length-1] = 1; return us; }
  const ratio = nominal > 1e-9 ? rem/nominal : 1;
  if (ratio < 0.30)
    warns.push(tag + `餘數 ${rem.toFixed(3)} ${UL()} 僅為間距的 ${(ratio*100).toFixed(1)}%,將產生極短元素`);
  if (policy === "keep"){ us.push(1); return us; }
  if (policy === "merge"){ if (us.length >= 2) us.pop(); us.push(1); return us; }
  if (policy === "trim"){ return us; }                 // 尾端丟棄
  const n = us.length - 1;                             // even:維持區間數,間距略放大
  const out = [];
  for (let i = 0; i <= n; i++) out.push(cv.uAtS(cv.len*i/n));
  out[n] = 1;
  return out;
}

/* ==========================================================================
   6. 組模型
   ========================================================================== */
const TYPES = {
  CURVE: { fam:"geo", name:"曲線組",   color:"#1c5d99" },
  OFFSET:{ fam:"geo", name:"偏置",     color:"#0f7c8f" },
  LINK2: { fam:"con", name:"組對組",   color:"#7b8592" },
  LINKZ: { fam:"con", name:"組對高程", color:"#b3406b" },
  FAN:   { fam:"con", name:"點對組",   color:"#c1673d" }
};
// 段:一個曲線組由一串段組成,段與段共用接縫節點、編號連續
const PIECES = {
  LINE: { name:"直線",   hint:"起點 → 終點(或 長度 + 方位角 + 仰角)" },
  ARC:  { name:"圓弧",   hint:"端點 + 半徑,或 圓心 + 轉角" },
  SAG:  { name:"懸垂",   hint:"起點 → 終點 + 垂度(拋物線 / 懸鏈線)" },
  HELIX:{ name:"螺旋",   hint:"半徑 + 起始方位角 + 圈數 + 螺距" },
  CHAIN:{ name:"線形鏈", hint:"直線/圓弧/緩和串接 + 樁號 + 選用縱斷面" },
  POINT:{ name:"節點",   hint:"單一節點;接續前段時同時產生一根直線元素" }
};
const GCOLORS = ["#1c5d99","#c1673d","#8a5fb5","#3f8f5f","#8a7a20","#0f7c8f","#b3406b","#6f4a9b","#a8710d","#1a7f4b"];
// 編輯中的曲線組:各段分色(其他組維持自己的主題色)
const PCOLORS = ["#1c5d99","#c1673d","#3f8f5f","#8a5fb5","#0f7c8f","#b3406b","#a8710d","#1a7f4b","#8a7a20","#6f4a9b"];
const pieceColor = i => PCOLORS[((i % PCOLORS.length) + PCOLORS.length) % PCOLORS.length];
const ELEM_TYPES = [["BEAM","BEAM 梁"], ["TRUSS","TRUSS 桁架"], ["CABLE","CABLE 纜索"]];
const DEPS = { OFFSET:["ref"], LINK2:["a","b"], LINKZ:["ref"], FAN:["ref"] };

let SEQ = 1;
const newId = () => "g" + (SEQ++);

function defaultPiece(type){
  const sp = { ...SPLIT_DEF, spacing:dL(SPLIT_DEF.spacing), maxSpacing:dL(SPLIT_DEF.maxSpacing),
               tol:dL(SPLIT_DEF.tol) };
  const b = { type, cont:true, endCont:false, xf:XF_DEF(),
              split:{ ...sp }, ovr:false, etype:"BEAM", mat:1, sect:1,
              x1:0, y1:0, z1:0 };
  if (type === "LINE")  return { ...b, endMode:"point", x2:dL(100), y2:0, z2:0, len:dL(50), az:90, el:0 };
  if (type === "ARC")   return { ...b, arcMode:"endpoints", plane:"H", dir:1, major:false,
    x2:dL(100), y2:0, z2:0, R:dL(80), cx:dL(50), cy:dL(-50), delta:90 };
  if (type === "SAG")   return { ...b, x2:dL(200), y2:0, z2:0, curve:"parabola", fMode:"ratio", f:0.1 };
  if (type === "HELIX") return { ...b, R:dL(50), R2:"", az0:0, turns:2, pitch:dL(12), dir:1,
    split:{ ...sp, count:72 } };
  if (type === "CHAIN") return { ...b, az:90, sta:0, segments:[{ type:"LINE", L:dL(50) }],
    profile:[], forced:"", absorbTol:dL(0.1), split:{ ...sp, mode:"spacing" } };
  if (type === "POINT") return { ...b, x2:0, y2:0, z2:0 };
  return b;
}
function defaultGroup(type, n){
  const base = { id:newId(), type, name:TYPES[type].name + (n || ""), on:true, xf:XF_DEF(),
    etype:"BEAM", mat:1, sect:1, autoNum:true, nodeBase:1001, elemBase:1001 };
  if (type === "CURVE") return { ...base, name:"曲線組" + (n || ""),
    pieces:[{ ...defaultPiece("LINE"), cont:false }] };
  if (type === "OFFSET")return { ...base, ref:"", d:dL(5), h:0 };
  if (type === "LINK2") return { ...base, a:"", b:"", every:1 };
  if (type === "LINKZ") return { ...base, ref:"", targetZ:0, from:1, to:0, every:1, bottom:"new", snapTol:dL(0.5), etype:"CABLE" };
  if (type === "FAN")   return { ...base, srcMode:"coord", sx:0, sy:0, sz:dL(80), ref:"",
    from:1, to:10, every:1, div:1, fMode:"abs", f:0, etype:"CABLE" };
  return base;
}

// 由節點串補上方位角與平面曲率
function annotate(nodes){
  const n = nodes.length;
  const kk = new Array(n).fill(0);
  for (let i = 0; i < n; i++){
    const a = nodes[Math.max(0, i-1)], b = nodes[Math.min(n-1, i+1)];
    if (nodes[i].az === undefined) nodes[i].az = azOf(b.x - a.x, b.y - a.y);
    if (i > 0 && i < n-1){
      const p = nodes[i-1], q = nodes[i], r = nodes[i+1];
      const cr = (q.x-p.x)*(r.y-p.y) - (q.y-p.y)*(r.x-p.x);
      const A = distXY(p,q), B = distXY(q,r), C = distXY(p,r);
      const den = A*B*C;
      kk[i] = den > 1e-9 ? (2*cr)/den * -1 : 0;        // 正 = 圓心在右(右轉)
    }
  }
  if (n > 2){ kk[0] = kk[1]; kk[n-1] = kk[n-2]; }
  // 線形鏈段的節點已帶精確的 az / k,不覆蓋
  for (let i = 0; i < n; i++) if (nodes[i].k === undefined) nodes[i].k = kk[i];
  return nodes;
}

/* ---------- 平移與旋轉(剛體變換)----------
   組 / 段 存成參數(可隨時改、可復原);節點 / 元素則是一次性套用成座標覆寫。   */
const XF_DEF = () => ({ dx:0, dy:0, dz:0, rot:0, axis:"Z", cmode:"auto", cx:0, cy:0, cz:0 });
const xfActive = xf => !!xf && [xf.dx, xf.dy, xf.dz, xf.rot].some(v => Math.abs(num(v) || 0) > 1e-12);

function xfCenter(xf, pts){
  const m = xf.cmode || "auto";
  if (m === "custom") return { x:num(xf.cx) || 0, y:num(xf.cy) || 0, z:num(xf.cz) || 0 };
  const P = (pts || []).filter(p => p && Number.isFinite(p.x));
  if (!P.length) return { x:0, y:0, z:0 };
  if (m === "start" || (m === "auto" && xf._start)) return { x:P[0].x, y:P[0].y, z:P[0].z };
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity,z0=Infinity,z1=-Infinity;
  P.forEach(p => { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
                   if(p.z<z0)z0=p.z; if(p.z>z1)z1=p.z; });
  return { x:(x0+x1)/2, y:(y0+y1)/2, z:(z0+z1)/2 };
}
// 回傳 p → p' 的函式(沒動就回 null);f.dAz = 方位角修正量,非 Z 軸旋轉時為 null
function xfMake(xf, pts, startPivot){
  if (!xfActive(xf)) return null;
  const c = xfCenter({ ...xf, _start:!!startPivot }, pts);
  const rot = num(xf.rot) || 0, th = rot*D2R, ax = xf.axis || "Z";
  const co = Math.cos(th), si = Math.sin(th);
  const dx = num(xf.dx) || 0, dy = num(xf.dy) || 0, dz = num(xf.dz) || 0;
  const f = p => {
    const X = p.x - c.x, Y = p.y - c.y, Z = p.z - c.z;
    let q;
    if (ax === "X")      q = { x:X,           y:Y*co - Z*si, z:Y*si + Z*co };
    else if (ax === "Y") q = { x:X*co + Z*si, y:Y,           z:-X*si + Z*co };
    else                 q = { x:X*co - Y*si, y:X*si + Y*co, z:Z };
    return { x:q.x + c.x + dx, y:q.y + c.y + dy, z:q.z + c.z + dz };
  };
  f.dAz = (ax === "Z") ? -rot : null;                 // 方位角自 +Y 順時針,逆時針轉 θ 即 az−θ
  return f;
}
// 保留 az / k / s 等附加欄位的點變換
const xfPt = (f, p) => {
  if (!p) return p;
  const q = f(p);
  const o = { ...p, x:q.x, y:q.y, z:q.z };
  if (p.az !== undefined) o.az = (f.dAz === null) ? undefined : norm360(p.az + f.dAz);
  return o;
};
const xfCurve = (cv, f) => {
  const out = { ...cv, pt:u => xfPt(f, cv.pt(u)) };
  if (cv.meta && cv.meta.center)
    out.meta = { ...cv.meta, center:f({ x:cv.meta.center.x, y:cv.meta.center.y, z:cv.meta.center.z || 0 }) };
  return out;
};
// 就地套用到節點串(剛體 → 元素長度、弦線偏差都不變)
function xfApplyNodes(f, nodes){
  nodes.forEach(n => {
    const q = f(n); n.x = q.x; n.y = q.y; n.z = q.z;
    if (n.az !== undefined) n.az = (f.dAz === null) ? undefined : norm360(n.az + f.dAz);
  });
  if (f.dAz === null) annotate(nodes);                 // 非 Z 軸旋轉:方位角重算
  return nodes;
}
// 段的起點(POINT 用它自己的座標);「終點接續下段起點」要拿它當終點
const contOn = pc => !!pc && pc.cont !== false && pc.cont !== "0" && pc.cont !== 0;
const END_CONT_T = { LINE:1, ARC:1, SAG:1 };
function pieceStart(pc){
  if (!pc) return null;
  const p = pc.type === "POINT"
    ? { x:num(pc.x2), y:num(pc.y2), z:num(pc.z2) }
    : { x:num(pc.x1), y:num(pc.y1), z:num(pc.z1) };
  if (![p.x, p.y, p.z].every(Number.isFinite)) return null;
  const f = xfMake(pc.xf, [p], true);
  return f ? f(p) : p;
}
// 這一段的終點要不要黏到下一段的起點
function endContOn(pc, nx){
  if (!pc || !nx) return false;
  if (!(pc.endCont === true || pc.endCont === "1")) return false;
  if (!END_CONT_T[pc.type]) return false;
  if (pc.type === "ARC" && pc.arcMode === "center") return false;
  if (contOn(nx)) return false;                        // 下一段本來就接前段 → 會循環定義
  return !!pieceStart(nx);
}

function buildModel(st, errs, warns){
  const inc = Math.max(1, Math.round(num(st.numbering.inc)) || 1000);
  const prefix = st.groupPrefix || "G_";
  const built = new Map();                             // id → {nodes, elems, ...}
  const list = (st.groups || []).filter(g => g.on !== false);
  const pending = list.slice();
  const order = [];

  // 依相依關係反覆解析(不限定使用者的排列順序)
  for (let pass = 0; pass < list.length + 2 && pending.length; pass++){
    for (let i = 0; i < pending.length; ){
      const g = pending[i];
      const deps = (DEPS[g.type] || []).map(k => g[k]).filter(Boolean);
      if (deps.every(d => built.has(d))){
        const idx = list.indexOf(g);        // 用清單順序配號,與相依解析順序無關
        const r = buildOne(g, idx, built, st, inc, prefix, errs, warns);
        built.set(g.id, r); order.push(r);
        pending.splice(i, 1);
      } else i++;
    }
  }
  pending.forEach(g => errs.push(`「${g.name}」引用的組不存在或形成循環,已略過`));

  const groups = order;
  const tot = {
    n:groups.reduce((a,r) => a + r.nodes.length, 0),
    e:groups.reduce((a,r) => a + r.elems.length, 0),
    len3d:groups.reduce((a,r) => a + r.elems.reduce((s,e) => s + e.len3d, 0), 0)
  };
  // 編號衝突
  const seenN = new Map(), seenE = new Map();
  groups.forEach(r => {
    r.nodes.forEach(nd => { if (seenN.has(nd.num)) r.numClash = true; else seenN.set(nd.num, r); });
    r.elems.forEach(e  => { if (seenE.has(e.num))  r.numClash = true; else seenE.set(e.num, r); });
  });
  const clash = groups.filter(r => r.numClash);
  clash.forEach(r => errs.push(`「${r.g.name}」的節點或元素編號與其他組重複`));

  const names = [...new Set(groups.map(r => r.gname))];
  names.push(prefix + "ALL");
  return { groups, byId:built, tot, names, prefix, inc, clash:clash.length };
}

// 依段的型別建立曲線;start 為繼承的起點(cont 時使用)
function pieceCurve(pc, start, warns, tag, endAt){
  const p = { ...pc, name:tag };
  if (start){ p.x1 = start.x; p.y1 = start.y; p.z1 = start.z; }
  if (endAt && END_CONT_T[pc.type] && !(pc.type === "ARC" && pc.arcMode === "center")){
    p.x2 = endAt.x; p.y2 = endAt.y; p.z2 = endAt.z;   // 終點黏到下一段的起點
    if (pc.type === "LINE") p.endMode = "point";
  }
  if (pc.type === "LINE"){
    if (p.endMode === "polar"){
      const L = num(pc.len), az = num(pc.az) || 0, el = num(pc.el) || 0;
      if (!(L > 0)) return curveErr("長度必須 > 0");
      const h = L * Math.cos(el*D2R);
      p.x2 = p.x1 + h*Math.sin(az*D2R);
      p.y2 = p.y1 + h*Math.cos(az*D2R);
      p.z2 = p.z1 + L*Math.sin(el*D2R);
    }
    return curveLINE(p);
  }
  if (pc.type === "ARC")   return curveARC(p);
  if (pc.type === "SAG")   return curveSAG(p, warns);
  if (pc.type === "HELIX"){
    // 接續前段時,由起點與起始方位角反推圓心
    if (start){
      const R = num(pc.R), az0 = num(pc.az0) || 0;
      p.cx = start.x - R*Math.sin(az0*D2R);
      p.cy = start.y - R*Math.cos(az0*D2R);
      p.z1 = start.z;
    } else { p.cx = num(pc.cx); p.cy = num(pc.cy); }
    return curveHELIX(p);
  }
  return curveErr("此段型別不使用曲線介面");
}

// 建完之後再對「整組」套用平移/旋轉 —— 剛體,長度與弦線偏差都不受影響,
// 依附本組的偏置/連接組會跟著移動(它們是在本組之後才建的)。
function buildOne(g, idx, built, st, inc, prefix, errs, warns){
  const R = buildOneRaw(g, idx, built, st, inc, prefix, errs, warns);
  if ((g.type === "CURVE" || g.type === "OFFSET") && R.nodes.length && xfActive(g.xf)){
    const own = R.nodes.filter(n => n.gid === g.id);
    const f = xfMake(g.xf, own);
    if (f){ xfApplyNodes(f, own); R.xfOn = true; }
  }
  return R;
}

function buildOneRaw(g, idx, built, st, inc, prefix, errs, warns){
  const tag = `「${g.name}」`;
  const T = TYPES[g.type];
  const nodeBase = g.autoNum ? num(st.numbering.nodeBase) + idx*inc : (Math.round(num(g.nodeBase)) || 1);
  const elemBase = g.autoNum ? num(st.numbering.elemBase) + idx*inc : (Math.round(num(g.elemBase)) || 1);
  const gname = prefix + (g.name || g.id);
  const R = { g, idx, gname, nodeBase, elemBase, nodes:[], elems:[],
              color:GCOLORS[idx % GCOLORS.length], stat:{}, pieces:[] };
  let nc = 0, ec = 0;
  const mkNode = p => { const nd = { ...p, num:nodeBase + nc++, gid:g.id }; R.nodes.push(nd); return nd; };
  const attrOf = pc => pc && pc.ovr
    ? { type:pc.etype || "BEAM", mat:Math.round(num(pc.mat)) || 1, sect:Math.round(num(pc.sect)) || 1 }
    : { type:g.etype || "BEAM", mat:Math.round(num(g.mat)) || 1, sect:Math.round(num(g.sect)) || 1 };
  const mkElem = (a, b, pc, extra) => {
    const chord = distXY(a, b), len3d = dist3(a, b);
    const e = { num:elemBase + ec++, i:a.num, j:b.num, a, b, chord, len3d, gid:g.id,
      group:gname, ...attrOf(pc), dev:0, pi:pc ? pc._i : -1, ...(extra || {}) };
    R.elems.push(e); return e;
  };

  /* ---------- 曲線組:一串段 ---------- */
  if (g.type === "CURVE"){
    const pcs = (g.pieces || []);
    if (!pcs.length){ R.stat.err = "沒有任何段"; finishStat(R); return R; }

    // 第一階段:依段的幾何算出「原始節點」(不受手動刪除影響,後續段的起點才不會跑掉)
    const raw = [];
    const infos = [];
    let last = null, lastPi = -1;
    pcs.forEach((pc, pi) => {
      pc._i = pi;
      const ptag = `${tag}段 ${pi+1}(${PIECES[pc.type].name}):`;
      const inherit = pi > 0 && contOn(pc) && !!last;              // 起點沿用前段終點
      const nx = pcs[pi+1];
      const endAt = endContOn(pc, nx) ? pieceStart(nx) : null;     // 終點黏到下一段起點
      // 前一段把終點接到本段起點 → 接縫節點一樣共用、元素照樣串起來
      const linked = !inherit && pi > 0 && !!last && lastPi === pi-1 && endContOn(pcs[pi-1], pc);
      const cont = inherit || linked;
      const info = { pi, type:pc.type, r0:raw.length };
      if (endAt && xfActive(nx.xf) && (nx.xf.cmode || "auto") === "center" && Math.abs(num(nx.xf.rot) || 0) > 1e-12)
        warns.push(ptag + "下一段以「範圍中心」旋轉,接續終點可能有誤差,建議把旋轉中心改成「起點」或「自訂座標」");

      if (pc.type === "POINT"){
        const q0 = { x:num(pc.x2), y:num(pc.y2), z:num(pc.z2) };
        if (![q0.x,q0.y,q0.z].every(Number.isFinite)){ errs.push(ptag + "座標無效"); return; }
        const fp = xfMake(pc.xf, [q0], true);
        const q = fp ? fp(q0) : q0;
        if (linked){                                   // 前段終點已經落在這個座標,節點共用
          info.r1 = raw.length; infos.push(info); return;
        }
        raw.push({ ...q, pi, brk:!cont });
        last = raw[raw.length-1]; lastPi = pi;
        info.r1 = raw.length; infos.push(info); return;
      }

      if (pc.type === "CHAIN"){
        const cg = { ...pc, name:g.name + " 段" + (pi+1),
          x:inherit ? last.x : num(pc.x1), y:inherit ? last.y : num(pc.y1), z:inherit ? last.z : num(pc.z1) };
        const ch = buildChain(cg, { push:t => errs.push(t.startsWith("「") ? t : ptag + t) }, warns);
        if (!ch || !ch.segs.length){ errs.push(ptag + "無有效段落"); return; }
        info.chain = ch;
        const tolAbs = Math.max(0, num(pc.absorbTol) || 0);
        let stations = [];
        ch.segs.forEach(b => {
          const cvSeg = { len:b.length, uAtS:s => clamp(s/b.length, 0, 1),
            pt:u => { const q = b.evalLocal(u*b.length); return { x:q.x, y:q.y, z:ch.zAtS(b.s0 + u*b.length) }; } };
          splitCurve(cvSeg, pc.split, `${ptag}子段 ${b.i+1}:`, warns)
            .forEach(u => stations.push(b.s0 + u*b.length));
        });
        stations.sort((a,b) => a-b);
        let uniq = [];
        stations.forEach(s => { if (!uniq.length || s - uniq[uniq.length-1] > 1e-7) uniq.push(s); });
        const prot = []; ch.segs.forEach(b => { prot.push(b.s0); prot.push(b.s1); });
        const forced = String(pc.forced || "").replace(/\s*-\s*/g, "-").split(/[\s,;]+/).filter(Boolean)
          .map(parseSta).filter(Number.isFinite).sort((a,b) => a-b);
        const s0 = ch.segs[0].s0, s1 = ch.segs[ch.segs.length-1].s1;
        let absorbed = 0;
        forced.forEach(f => {
          if (f < s0 - 1e-9 || f > s1 + 1e-9){ warns.push(ptag + `強制節點 ${fmtSta(f)} 不在範圍內,已忽略`); return; }
          const near = prot.find(q => Math.abs(q - f) <= tolAbs);
          if (near !== undefined){
            if (Math.abs(near - f) > 1e-6) warns.push(ptag + `強制節點 ${fmtSta(f)} 距段落交界僅 ${Math.abs(near-f).toFixed(3)} ${UL()},由交界取代`);
            return;
          }
          const kept = [];
          uniq.forEach(s => {
            if (prot.some(q => Math.abs(q-s) < 1e-6) || Math.abs(s - f) > tolAbs) kept.push(s);
            else if (Math.abs(s - f) > 1e-6) absorbed++;
          });
          uniq = kept; uniq.push(f); uniq.sort((a,b) => a-b);
        });
        const fset = s => forced.some(f => Math.abs(f - s) < 1e-6);
        const evalAt = s => {
          for (let i = ch.segs.length-1; i >= 0; i--){
            const b = ch.segs[i];
            if (s >= b.s0 - 1e-7 && s <= b.s1 + 1e-7){
              const q = b.evalLocal(clamp(s - b.s0, 0, b.length));
              return { x:q.x, y:q.y, z:ch.zAtS(s), az:q.az, k:q.k, s, seg:b.i, grade:ch.gradeAtS(s) };
            }
          }
          return null;
        };
        const fx = xfMake(pc.xf, uniq.map(s => evalAt(s)).filter(Boolean), true);
        const evalX = fx ? (s => xfPt(fx, evalAt(s))) : evalAt;
        info.evalAt = evalX; info.absorbed = absorbed; info.total = ch.total;
        uniq.forEach((s, j) => {
          if (cont && j === 0) return;
          const q = evalX(s); if (q) raw.push({ ...q, pi, forced:fset(s), brk:(!cont && j === 0) });
        });
        last = raw[raw.length-1]; lastPi = pi;
        info.r1 = raw.length; infos.push(info); return;
      }

      const cv0 = pieceCurve(pc, inherit ? last : null, warns, ptag, endAt);
      if (!cv0.ok){ errs.push(ptag + cv0.err); return; }
      const us = splitCurve(cv0, pc.split, ptag, warns);
      const fx = xfMake(pc.xf, us.map(u => cv0.pt(u)), true);
      const cv = fx ? xfCurve(cv0, fx) : cv0;           // 參考曲線一起轉,畫面才不會兩條分家
      info.curve = cv; info.meta = cv.meta; info.len = cv.len;
      us.forEach((u, j) => {
        if (cont && j === 0) return;
        raw.push({ ...cv.pt(u), u, pi, brk:(!cont && j === 0) });
      });
      last = raw[raw.length-1]; lastPi = pi;
      info.r1 = raw.length; infos.push(info);
    });

    // 第二階段:套用手動編輯與刪除
    const edits = g.edits || {}, dels = new Set((g.dels || []).map(Number));
    let nDel = 0, nEdit = 0, pendBrk = false;
    const kept = [];
    raw.forEach((p, ri) => {
      if (dels.has(ri)){ if (p.brk) pendBrk = true; nDel++; return; }
      const e = edits[ri];
      const q = { ...p, ri };
      if (e){                                          // 逐軸套用:某軸無效就沿用原始值
        let any = false;
        const ax = num(e.x), ay = num(e.y), az2 = num(e.z);
        if (Number.isFinite(ax)){ q.x = ax; any = true; }
        if (Number.isFinite(ay)){ q.y = ay; any = true; }
        if (Number.isFinite(az2)){ q.z = az2; any = true; }
        if (any){ q.edited = true; nEdit++; }
      }
      if (pendBrk){ q.brk = true; pendBrk = false; }
      kept.push(q);
    });
    if (dels.size > nDel) warns.push(tag + `有 ${dels.size - nDel} 個刪除標記已失效(節點數改變),可在節點區按「清除全部覆寫」`);
    const staleEdit = Object.keys(edits).filter(k => +k >= raw.length).length;
    if (staleEdit) warns.push(tag + `有 ${staleEdit} 個座標覆寫已失效(節點數改變)`);

    kept.forEach(p => mkNode(p));
    annotate(R.nodes);

    // 第三階段:連接元素;跨過被刪除的節點時自動連接前後兩點
    for (let j = 0; j < R.nodes.length - 1; j++){
      const a = R.nodes[j], b = R.nodes[j+1];
      if (b.brk) continue;
      const pc = pcs[b.pi];
      const e = mkElem(a, b, pc,
        (a.s !== undefined && b.s !== undefined) ? { arc:b.s - a.s, seg:a.seg } : null);
      if (a.pi === b.pi && !a.edited && !b.edited && b.ri === a.ri + 1){
        const info = infos.find(x => x.pi === a.pi);
        if (info && info.curve) e.dev = maxDevOn(info.curve, a.u, b.u);
        else if (info && info.evalAt) e.dev = maxDevOn({ pt:u => info.evalAt(a.s + (b.s - a.s)*u) }, 0, 1);
      }
    }
    // 各段的實際節點/元素範圍(供面板顯示)
    infos.forEach(info => {
      info.n0 = R.nodes.findIndex(n => n.pi === info.pi);
      const arr = R.nodes.filter(n => n.pi === info.pi);
      info.n1 = info.n0 < 0 ? 0 : info.n0 + arr.length;
      if (info.n0 < 0) info.n0 = 0;
      const el = R.elems.filter(e => e.pi === info.pi);
      info.e0 = R.elems.indexOf(el[0]); info.e1 = info.e0 + el.length;
      if (info.e0 < 0){ info.e0 = 0; info.e1 = 0; }
    });
    R.pieces = infos;
    R.raw = raw;
    R.stat.nDel = nDel; R.stat.nEdit = nEdit;
    finishStat(R); return R;
  }

  /* ---------- 偏置 ---------- */
  if (g.type === "OFFSET"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到基準組或基準組沒有節點"); R.stat.err = "無基準"; return R; }
    const d = num(g.d) || 0, h = num(g.h) || 0;
    let degenerate = false;
    ref.nodes.forEach(n0 => {
      const a = (n0.az + 90) * D2R;
      if (Math.abs(n0.k) > 1e-9){
        const r = 1/n0.k, rl = r - d;
        if (rl * r <= 0 || Math.abs(rl) < 1e-6) degenerate = true;
      }
      mkNode({ x:n0.x + d*Math.sin(a), y:n0.y + d*Math.cos(a), z:n0.z + h,
        az:n0.az, k:n0.k, s:n0.s, forced:n0.forced, brk:n0.brk });
    });
    if (degenerate) errs.push(tag + "偏置量已達到或超過內側曲率中心,幾何退化");
    for (let j = 0; j < R.nodes.length-1; j++)
      if (!R.nodes[j+1].brk) mkElem(R.nodes[j], R.nodes[j+1], null);
    R.stat = { ...R.stat, ref:ref.g.name, d, h };
    finishStat(R); return R;
  }

  /* ---------- 組對組 ---------- */
  if (g.type === "LINK2"){
    const A = built.get(g.a), B = built.get(g.b);
    if (!A || !B){ errs.push(tag + "找不到要連接的組"); R.stat.err = "缺少來源"; return R; }
    if (A.nodes.length !== B.nodes.length){
      errs.push(tag + `兩組節點數不同(${A.nodes.length} vs ${B.nodes.length}),無法逐節點連接`);
      R.stat.err = "節點數不符"; return R;
    }
    const every = Math.max(1, Math.round(num(g.every)) || 1);
    for (let j = 0; j < A.nodes.length; j += every) mkElem(A.nodes[j], B.nodes[j], null);
    R.stat = { ...R.stat, a:A.g.name, b:B.g.name };
    finishStat(R); return R;
  }

  /* ---------- 組對高程 ---------- */
  if (g.type === "LINKZ"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到來源組"); R.stat.err = "無來源"; return R; }
    const tz = num(g.targetZ);
    if (!Number.isFinite(tz)){ errs.push(tag + "目標高程無效"); R.stat.err = "高程無效"; return R; }
    const every = Math.max(1, Math.round(num(g.every)) || 1);
    const snap = g.bottom === "snap";
    const tolS = Math.max(0, num(g.snapTol) || 0);
    const pool = snap ? [...built.values()].flatMap(r => r.nodes) : [];
    const N0 = ref.nodes.length;
    const lo0 = clamp(Math.round(num(g.from)) || 1, 1, N0);
    const hi0 = clamp(Math.round(num(g.to)) || N0, 1, N0);
    const lo = Math.min(lo0, hi0) - 1, hi = Math.max(lo0, hi0) - 1;
    let skipped = 0;
    for (let j = lo; j <= hi; j += every){
      const top = ref.nodes[j];
      if (top.z <= tz + 1e-9){ skipped++; continue; }
      const target = { x:top.x, y:top.y, z:tz };
      let bot = null;
      if (snap){
        let bd = Infinity;
        pool.forEach(n0 => { const dd = dist3(n0, target); if (dd < bd){ bd = dd; bot = n0; } });
        if (!bot || bd > tolS) bot = null;
      }
      if (!bot) bot = mkNode({ ...target, deck:true });
      mkElem(top, bot, null);
    }
    if (skipped) warns.push(tag + `有 ${skipped} 個來源節點已低於目標高程,該連接略過`);
    R.stat = { ...R.stat, ref:ref.g.name, targetZ:tz, skipped };
    finishStat(R); return R;
  }

  /* ---------- 點對組(扇形) ---------- */
  if (g.type === "FAN"){
    const ref = built.get(g.ref);
    if (!ref || !ref.nodes.length){ errs.push(tag + "找不到目標組"); R.stat.err = "無目標"; return R; }
    let src;
    if (g.srcMode === "node"){
      const all = [...built.values()].flatMap(r => r.nodes);
      src = all.find(n0 => n0.num === Math.round(num(g.srcNode)));
      if (!src){ errs.push(tag + `起點節點 ${g.srcNode} 不存在`); R.stat.err = "起點無效"; return R; }
    } else {
      const p = { x:num(g.sx), y:num(g.sy), z:num(g.sz) };
      if (![p.x,p.y,p.z].every(Number.isFinite)){ errs.push(tag + "起點座標無效"); R.stat.err = "起點無效"; return R; }
      src = mkNode({ ...p, fanSrc:true });
    }
    R.src = src;
    const N = Math.max(1, Math.round(num(g.div)) || 1);
    const every = Math.max(1, Math.round(num(g.every)) || 1);
    const from = clamp(Math.round(num(g.from)) || 1, 1, ref.nodes.length);
    const to   = clamp(Math.round(num(g.to)) || ref.nodes.length, 1, ref.nodes.length);
    const lo = Math.min(from, to), hi = Math.max(from, to);
    let flat = false, cnt = 0;
    for (let j = lo; j <= hi; j += every){
      const T2 = ref.nodes[j-1];
      const chord = dist3(src, T2);
      if (chord < 1e-9) continue;
      const f = g.fMode === "ratio" ? (num(g.f) || 0)*chord : (num(g.f) || 0);
      if (N > 1 && Math.abs(f) < 1e-9 && !flat){
        warns.push(tag + `分割數 ${N} > 1 但垂度 = 0:節點共線,幾何非線性分析橫向勁度為零,極可能不收斂`);
        flat = true;
      }
      let prev = src;
      for (let k = 1; k <= N; k++){
        const u = k/N;
        const p = { x:src.x + (T2.x-src.x)*u, y:src.y + (T2.y-src.y)*u,
                    z:src.z + (T2.z-src.z)*u - 4*f*u*(1-u) };
        const nd = (k === N) ? T2 : mkNode({ ...p, fanMid:true });
        mkElem(prev, nd, null, { target:T2.num });
        prev = nd;
      }
      cnt++;
    }
    R.stat = { ...R.stat, ref:ref.g.name, count:cnt, div:N };
    finishStat(R); return R;
  }

  errs.push(tag + "未知型別 " + g.type);
  return R;
}

function finishStat(R){
  const L = R.elems.map(e => e.len3d), C = R.elems.map(e => e.chord);
  R.stat.n = R.nodes.length; R.stat.e = R.elems.length;
  R.stat.minL = L.length ? Math.min(...L) : 0;
  R.stat.maxL = L.length ? Math.max(...L) : 0;
  R.stat.len3d = L.reduce((a,b) => a+b, 0);
  R.stat.planLen = C.reduce((a,b) => a+b, 0);
  R.stat.maxDev = R.elems.length ? Math.max(...R.elems.map(e => e.dev)) : 0;
}


/* ==========================================================================
   7. 輸出:MCT / CSV / JSON
   ⚠️ MCT 格式尚未以 midas 實機 Export 驗證。要改只需動 MCT_FMT 與 elemLine()。
   ========================================================================== */
const MCT_COMMENT = ";";
const MCT_FMT = {
  hint:{ UNIT:"FORCE, LENGTH, HEAT, TEMPER", NODE:"iNO, X, Y, Z",
         ELEMENT:"iEL, TYPE, iMAT, iPRO, iN1, iN2, ANGLE, iSUB, EXVAL",
         GROUP:"NAME, NODE_LIST, ELEM_LIST, PLANE_TYPE" },
  indent:"   "
};
const UNIT_LENGTH = [["M","M(公尺)"],["CM","CM(公分)"],["MM","MM(公釐)"],["IN","IN(英吋)"],["FT","FT(英呎)"]];
const UNIT_FORCE  = [["KN","KN"],["N","N"],["KGF","KGF"],["TONF","TONF"],["LBF","LBF"],["KIPS","KIPS"]];
const LEN_FACTOR  = { M:1, CM:100, MM:1000, IN:1/0.0254, FT:1/0.3048 };
const lenFactor = () => LEN_FACTOR[state.units.length] || 1;
// 畫面上顯示用的單位符號 —— 輸入什麼單位,算什麼單位,匯出就是什麼單位,全程不換算
const LEN_SYM = { M:"m", CM:"cm", MM:"mm", IN:"in", FT:"ft" };
const UL = () => LEN_SYM[(state && state.units && state.units.length) || "M"] || "m";
// 以公尺定義的物理門檻(例如 50 mm 弦線偏差)換算到目前單位,警示才不會失準
const inU = mVal => mVal * lenFactor();
// 弦線偏差之類的小量:依大小自動決定小數位,單位一律跟著標
const devTxt = v => { const a = Math.abs(+v);
  return (a < 1e-12 ? "0" : (+v).toFixed(a >= 100 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : 6)) + " " + UL(); };
// 新增段/組時的預設尺寸也跟著單位走(在 MM 底下不會生出 100 mm 的橋)
const dL = v => { const k = lenFactor(); return k === 1 ? v : +(v*k).toPrecision(12); };
const mnum = v => String(+(+v).toFixed(6));
const mlen = mnum;                                    // 座標直接輸出,不再乘換算係數

function compressList(nums){
  const a = [...new Set(nums)].sort((x,y) => x-y), out = [];
  let i = 0;
  while (i < a.length){
    let j = i;
    while (j+1 < a.length && a[j+1] === a[j]+1) j++;
    if (j-i >= 2) out.push(`${a[i]}to${a[j]}`);
    else for (let k = i; k <= j; k++) out.push(String(a[k]));
    i = j+1;
  }
  return out.join(" ");
}

function elemLine(e){
  const c = state.mct, isCable = e.type === "CABLE";
  const type = isCable ? (c.cableType || "TENSTR") : e.type;
  const base = `${e.num}, ${type}, ${e.mat}, ${e.sect}, ${e.i}, ${e.j}, 0`;
  if (isCable)            return `${base}, ${Math.round(num(c.cableSub)) || 0}, ${mnum(num(c.cableExval) || 0)}`;
  if (e.type === "TRUSS") return `${base}, 0, 0`;
  return `${base}, 0`;
}

function groupMembers(){
  const m = new Map();
  const add = (g, ns, es) => {
    if (!m.has(g)) m.set(g, { n:new Set(), e:new Set() });
    const t = m.get(g); ns.forEach(x => t.n.add(x)); es.forEach(x => t.e.add(x));
  };
  MODEL.groups.forEach(r => {
    const own = new Set(r.nodes.map(n => n.num));
    add(r.gname, r.nodes.map(n => n.num), r.elems.map(e => e.num));
    r.elems.forEach(e => add(r.gname, [e.i, e.j].filter(x => own.has(x)), []));
  });
  const allN = [], allE = [];
  MODEL.groups.forEach(r => { r.nodes.forEach(n => allN.push(n.num)); r.elems.forEach(e => allE.push(e.num)); });
  add(MODEL.prefix + "ALL", allN, allE);
  return m;
}

function mctText(){
  const C = MCT_COMMENT, I = MCT_FMT.indent, u = state.units, L = [];
  const rule = C + "-".repeat(75);
  L.push(rule);
  L.push(`${C} 空間線型產生器  (spatial-curve-gen)`);
  L.push(`${C} 產生時間 : ${new Date().toISOString().slice(0,16).replace("T"," ")}`);
  L.push(`${C} 單位     : ${u.force}, ${u.length}   (座標即輸入值,未做任何換算)`);
  L.push(`${C} 組       : ${MODEL.groups.length}`);
  L.push(`${C} 節點     : ${MODEL.tot.n}    元素 : ${MODEL.tot.e}    群組 : ${MODEL.names.length}`);
  L.push(`${C} 元素總長 : ${mnum(MODEL.tot.len3d)}`);
  L.push(`${C}`);
  MODEL.groups.forEach(r => L.push(`${C}   ${r.g.name}(${TYPES[r.g.type].name})` +
    ` 節點 ${r.nodes.length ? r.nodeBase + "–" + (r.nodeBase + r.nodes.length - 1) : "—"}` +
    ` 元素 ${r.elems.length ? r.elemBase + "–" + (r.elemBase + r.elems.length - 1) : "—"}`));
  L.push(`${C}`);
  L.push(`${C} ⚠ 匯入含 *UNIT 的 MCT 會改變模型當前的作用單位系統。`);
  L.push(`${C} ⚠ 元素 beta angle 一律為 0。`);
  L.push(`${C} 下方參數區塊可將本檔拖回產生器頁面,還原全部輸入重編。`);
  L.push(rule);
  embedParams(paramsJSON()).split("\n").forEach(l => L.push(l));
  L.push("");

  L.push("*UNIT");
  L.push(`${C} ${MCT_FMT.hint.UNIT}`);
  L.push(`${I}${u.force}, ${u.length}, ${u.heat}, ${u.temper}`);
  L.push("");

  L.push("*NODE");
  L.push(`${C} ${MCT_FMT.hint.NODE}`);
  MODEL.groups.forEach(r => {
    if (!r.nodes.length) return;
    L.push(`${C} --- ${r.g.name}(${TYPES[r.g.type].name}) ---`);
    r.nodes.forEach(n => L.push(`${I}${n.num}, ${mlen(n.x)}, ${mlen(n.y)}, ${mlen(n.z)}`));
  });
  L.push("");

  L.push("*ELEMENT");
  L.push(`${C} ${MCT_FMT.hint.ELEMENT}`);
  MODEL.groups.forEach(r => {
    if (!r.elems.length) return;
    L.push(`${C} --- ${r.g.name}(${TYPES[r.g.type].name}) ---`);
    r.elems.forEach(e => L.push(I + elemLine(e)));
  });
  L.push("");

  L.push("*GROUP");
  L.push(`${C} ${MCT_FMT.hint.GROUP}`);
  const gm = groupMembers();
  MODEL.names.forEach(nm => {
    const t = gm.get(nm) || { n:new Set(), e:new Set() };
    L.push(`${I}${nm}, ${compressList([...t.n])}, ${compressList([...t.e])}, 0`);
  });
  L.push("");
  return L.join("\r\n");
}

const csvEsc = v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvEsc).join(",")).join("\r\n");

function nodeCSV(){
  const U = UL();
  const rows = [["節點編號","組","型別",`X (${U})`,`Y (${U})`,`Z (${U})`,`樁號 (${U})`,"方位角 (°)",
    `當地半徑 (${U})`,`前一元素長度 3D (${U})`,`前一元素弦線偏差 (${U})`,"備註"]];
  MODEL.groups.forEach(r => {
    const prev = new Map(); r.elems.forEach(e => prev.set(e.j, e));
    r.nodes.forEach(n => {
      const pe = prev.get(n.num), kk = Math.abs(n.k || 0);

        [n.forced && "強制節點", n.deck && "連接下端", n.fanSrc && "扇形起點", n.fanMid && "扇形中間"]
          .filter(Boolean).join("/")]);

    g.id = keepId;

      if (!Array.isArray(g.pieces) || !g.pieces.length) g.pieces = [{ ...defaultPiece("LINE"), cont:false }];
      g.pieces = g.pieces.map((pc, i) => {

/* ---------- 換單位:數值要不要跟著換算 ---------- */
const rnd12 = v => +(+v).toPrecision(12);
const SC_G  = { OFFSET:["d","h"], LINKZ:["targetZ","snapTol"], FAN:["sx","sy","sz"] };
const SC_PC = ["x1","y1","z1","x2","y2","z2","cx","cy","len","R","R2","pitch","sta","absorbTol"];
const SC_SEG = ["L","R","R0","R1","Ls","A"];
const SC_XF = ["dx","dy","dz","cx","cy","cz"];
// 幾何大小不變、只換單位:所有長度性質的欄位一起乘 k
function scaleModel(st, k){
  const S = (o, keys) => { if (o) keys.forEach(key => {
    const raw = o[key];
    if (raw === "" || raw === null || raw === undefined) return;   // 留白代表「沒有這個值」,不能變成 0
    const v = num(raw); if (Number.isFinite(v)) o[key] = rnd12(v*k); }); };
  (st.groups || []).forEach(g => {
    S(g, SC_G[g.type] || []);
    if (g.type === "FAN" && g.fMode === "abs") S(g, ["f"]);
    S(g.xf, SC_XF);
    (g.pieces || []).forEach(pc => {
      S(pc, SC_PC);
      if (pc.fMode === "abs") S(pc, ["f"]);
      S(pc.xf, SC_XF);
      S(pc.split, ["spacing","maxSpacing","tol"]);
      (pc.segments || []).forEach(sg => S(sg, SC_SEG));
      (pc.profile || []).forEach(v => S(v, ["sta","z","L"]));
      if (pc.forced) pc.forced = String(pc.forced).split(/[\s,;]+/).filter(Boolean)
        .map(t => { const v = parseSta(t); return Number.isFinite(v) ? fmtSta(rnd12(v*k)) : t; }).join(", ");
    });
    if (g.edits) Object.keys(g.edits).forEach(ri => S(g.edits[ri], ["x","y","z"]));
  });
  return st;
}
